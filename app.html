<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 앱 셸. 위는 고정 머리글, 아래(모바일)·위(데스크톱)는 네 개 탭. 각 상세 화면은 사조 고유의 '벽 색' 띠로 시작하고 작품은 미술관 월 라벨 형식 */
:root{
  --bg:#f4f4f1; --surface:#ffffff; --fg:#1c1b19; --muted:#67645d; --line:#d9d6ce; --mat:#e6e4de; --wall-ink:#fbfaf7; --focus:#2f4f8f; --accent:#7a2e1f;
  --f-display:"Hahmlet","Nanum Myeongjo",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --tabh:60px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--surface:#1d1c1a;--fg:#ebe9e3;--muted:#a3a097;--line:#35332f;--mat:#272623;--focus:#8fb0f0;--accent:#e3906f;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:.1em;color:var(--muted);margin-left:8px}
.back{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-8px;border:0;background:none;border-radius:50%;cursor:pointer;font-size:20px}
.back:hover{background:var(--mat)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.tabs a[aria-current="page"]{background:var(--fg);color:var(--bg)}
.tabs a:not([aria-current="page"]):hover{background:var(--mat);color:var(--fg)}
.tabs svg{width:18px;height:18px}
@media (max-width:760px){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:30}
  .tabs a{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;border-radius:12px;flex:1;max-width:96px}
  .tabs a[aria-current="page"]{background:none;color:var(--fg)}
  .tabs a[aria-current="page"] svg{color:var(--accent)}
  .tabs svg{width:22px;height:22px}
  body{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px)}
}
main{min-height:60vh;padding-bottom:48px}

/* generic */
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1.title{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,46px);line-height:1.15;margin:.15em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:22px;margin:32px 0 12px;text-wrap:balance}
.lead{max-width:66ch;color:var(--muted);margin:0}
.intro{padding-block:28px 8px}
.stats{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:14px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.stats b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--mat);color:var(--fg);font-weight:500}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px}
.field input{flex:1;min-width:0;border:0;background:none;padding:11px 0;font:inherit;font-size:16px;color:var(--fg);outline:none}
.field svg{width:18px;height:18px;color:var(--muted);flex:none}
.field:focus-within{border-color:var(--focus)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.empty{padding:40px 0;color:var(--muted);text-align:center}

/* timeline (movements list) */
.timeline{position:relative;margin-top:10px}
.mrow{display:grid;grid-template-columns:92px 1fr;gap:14px;text-decoration:none;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.mrow:hover .mname{text-decoration:underline;text-underline-offset:4px}
.myears{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35}
.mbar{height:6px;border-radius:3px;margin-top:6px}
.mmain{min-width:0;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center}
.mname{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.3}
.men{font-size:13px;color:var(--muted)}
.mthumbs{display:flex;gap:4px;grid-row:span 2}
.mthumbs .th{width:44px;height:44px;border-radius:4px}
@media (max-width:520px){.mthumbs .th:nth-child(n+3){display:none}.mrow{grid-template-columns:74px 1fr}}

/* thumbnails & images */
.th,.frame{background:var(--mat);overflow:hidden;position:relative}
.th img,.frame img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.th img.on,.frame img.on{opacity:1}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:12px;color:var(--wall-ink);line-height:1.4}
.ph span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;opacity:.9}

/* work grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px 16px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;border:0;background:none;padding:0;cursor:pointer;min-width:0}
.card .frame{aspect-ratio:4/5;border-radius:3px;box-shadow:0 1px 0 var(--line)}
.card:hover .frame img.on{transform:scale(1.03)}
.card .frame img{transition:opacity .35s,transform .5s}
.label{min-width:0}
.label .t{font-weight:600;line-height:1.35;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.label .s{font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.label .y{font-family:var(--f-mono);font-size:11.5px}

/* wall band */
.band{color:var(--wall-ink);padding-top:28px;padding-bottom:26px}
.band .eyebrow{color:color-mix(in srgb,var(--wall-ink) 75%,transparent)}
.band .lead{color:color-mix(in srgb,var(--wall-ink) 88%,transparent)}
.band a{color:var(--wall-ink)}
.band .title{color:var(--wall-ink)}
.traits{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:18px 0 0;padding:0;list-style:none}
.traits li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.5}
.note{margin-top:14px;padding:10px 12px;border-left:3px solid var(--line);color:var(--muted);font-size:14px;max-width:80ch}
.artist-block{margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.artist-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:6px}
.artist-head a{font-family:var(--f-display);font-weight:600;font-size:21px;text-decoration:none}
.artist-head a:hover{text-decoration:underline;text-underline-offset:4px}
.artist-head .o{color:var(--muted);font-size:13px}
.artist-d{color:var(--muted);font-size:14px;max-width:72ch;margin:0 0 14px}

/* lists */
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 28px;margin-top:6px}
.arow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;min-width:0}
.arow .th{width:56px;height:56px;border-radius:50%}
.arow .nm{font-weight:600;line-height:1.3}
.arow .sub{font-size:12.5px;color:var(--muted);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .mn{min-width:0}
.arow .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.arow:hover .nm{text-decoration:underline;text-underline-offset:3px}
.letter{font-family:var(--f-display);font-weight:800;font-size:22px;margin:22px 0 2px;color:var(--accent);grid-column:1/-1}
.country{margin-top:26px}
.country h3{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 4px;display:flex;align-items:baseline;gap:10px}
.museum-row .th{border-radius:6px}
.mlinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--fg)}
.band .btn{background:transparent;border-color:color-mix(in srgb,var(--wall-ink) 45%,transparent)}
.band .btn:hover{border-color:var(--wall-ink)}

/* search */
.hits h2{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:26px 0 10px}
.pillrow{display:flex;flex-wrap:wrap;gap:8px}
.pillrow a{text-decoration:none}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:2px}

/* work sheet */
dialog.sheet{border:0;padding:0;margin:auto;max-width:min(1040px,100vw);width:100%;max-height:100dvh;background:var(--surface);color:var(--fg);border-radius:14px;overflow:hidden}
dialog.sheet::backdrop{background:rgba(10,10,8,.72)}
.sheet-in{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);max-height:min(88dvh,820px)}
.sheet .viewer{background:#111;display:flex;align-items:center;justify-content:center;min-height:300px;position:relative}
.sheet .viewer img{max-height:min(88dvh,820px);width:auto;max-width:100%;object-fit:contain}
.sheet .viewer .ph{position:static;color:#eee;font-size:14px;padding:40px 24px;flex-direction:column;gap:10px}
.sheet .info{padding:26px 24px 24px;overflow:auto;min-width:0}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.25;margin:4px 0 2px;text-wrap:balance}
.sheet .orig{color:var(--muted);font-style:italic;margin-bottom:14px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 16px;font-size:14px}
.meta dt{color:var(--muted);font-family:var(--f-mono);font-size:12px;padding-top:2px}
.meta dd{margin:0;min-width:0}
.meta a{text-underline-offset:3px}
.tip{font-size:15px;line-height:1.7;margin:0 0 16px}
.close{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;cursor:pointer}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
@media (max-width:760px){
  dialog.sheet{max-height:100dvh;height:100dvh;border-radius:0;max-width:100vw}
  .sheet-in{grid-template-columns:1fr;max-height:none;height:100%;overflow:auto}
  .sheet .viewer{min-height:42vh;padding-top:env(safe-area-inset-top,0px)}
  .sheet .viewer img{max-height:62vh}
  .sheet .info{overflow:visible;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
}
.foot{color:var(--muted);font-size:12.5px;padding-block:30px 10px;border-top:1px solid var(--line);margin-top:40px;line-height:1.6}
</style>

}

NTS":[{"id":"early-renaissance","name":"초기 르네상스","en":"Early Renaissance","years":"1300년경 – 1490년","s":1300,"e":1490,"color":"#8a6a2f","sum":"중세의 평면적인 종교화에서 벗어나 원근법과 해부학, 고대 그리스·로마의 이상을 바탕으로 인간과 자연을 현실감 있게 그리기 시작한 시기입니다. 조토가 인물에 무게와 감정을 불어넣었고, 마사초가 수학적 원근법을 회화에 적용했으며, 보티첼리가 우아한 선으로 고대 신화를 되살렸습니다. 피렌체가 중심이었고 메디치 가문 같은 후원자가 예술가를 길렀습니다.","traits":["선원근법: 소실점을 이용해 평면에 깊이를 만듦","명암으로 인물에 부피감을 줌","그리스·로마 신화 주제의 부활","프레스코(벽화)와 템페라가 주된 기법","성당과 예배당 벽을 이야기 그림으로 채운 프레스코 연작 (조토의 스크로베니 예배당, 마사초의 브란카치 예배당)"],"diff":"고딕 미술의 금박 배경과 평면적 인물 대신, 3차원 공간 안에서 감정을 지닌 인간을 그립니다.","artists":[{"n":"조토 디 본도네","o":"Giotto di Bondone","l":"1267경–1337","d":"르네상스의 문을 연 선구자. 인물에 무게와 감정을 처음 불어넣었습니다.","w":[["그리스도를 애도함","Lamentation","1305경","scrovegni","Lamentation (The Mourning of Christ)",{"tip":"죽은 그리스도를 둘러싸고 슬퍼하는 사람들을 그린 프레스코입니다. 하늘의 천사들까지 저마다 다른 몸짓으로 울부짖고, 비스듬한 바위 능선이 시선을 그리스도의 얼굴로 이끕니다."}],["유다의 입맞춤","Kiss of Judas","1305경","scrovegni","File:Giotto di Bondone - No. 31 Scenes from the Life of Christ - 15. The Arrest of Christ (Kiss of Judas) - WGA09216.jpg",{"tip":"노란 망토로 예수를 감싸며 입을 맞추는 유다와 그를 똑바로 마주 보는 예수의 눈빛이 화면의 중심입니다. 왼쪽에서는 베드로가 칼로 하인의 귀를 베고 있습니다."}],["오니산티 마돈나","Ognissanti Madonna","1310경","uffizi","Ognissanti Madonna",{"tip":"피렌체 오니산티 성당을 위해 그린 제단화로, 옷 아래 몸의 부피감이 느껴지는 성모가 인상적입니다. 같은 전시실의 치마부에, 두초의 마에스타와 비교해 보면 변화가 잘 보입니다."}],["성흔을 받는 성 프란체스코","Saint Francis Receiving the Stigmata","1295–1300경","louvre","File:Giotto - Saint Francis Receiving the Stigmata.jpg",{"tip":"아래 칸(프레델라)에 새들에게 설교하는 장면이 함께 그려져 있습니다."}],["스테파네스키 세 폭 제단화","Stefaneschi Triptych","1330경","vatican","File:Giotto. The Stefaneschi Triptych (recto) c.1330 220x245cm. Pinacoteca, Vatican..jpg",{"tip":"옛 성 베드로 대성당의 제단을 위해 그린 작품으로, 앞뒤 양면에 모두 그림이 있습니다."}],["예수의 탄생 (스크로베니 예배당)","Nativity","1305경","scrovegni","File:Giotto di Bondone - No. 17 Scenes from the Life of Christ - 1. Nativity - Birth of Jesus - WGA09193.jpg",{"tip":"마구간 지붕 아래 누운 성모가 아기 예수를 받아 드는 장면을 그린 프레스코입니다. 위로는 천사들이, 오른쪽에는 소식을 듣는 목동들이 함께 그려져 있습니다."}],["최후의 심판 (스크로베니 예배당)","Last Judgment","1306경","scrovegni","File:Giotto di Bondone - Last Judgment - WGA09228.jpg",{"tip":"예배당 입구 벽 전체를 채운 벽화로, 아래쪽에 예배당을 바치는 후원자 엔리코 스크로베니가 그려져 있습니다."}],["산타 마리아 노벨라 십자가","Crucifix of Santa Maria Novella","1290–1295경","smn","Giotto's Crucifix at Santa Maria Novella",{"tip":"축 늘어진 실제 인간의 몸으로 그리스도를 표현한 대형 십자가 그림으로, 비잔틴 양식에서 벗어난 초기 걸작입니다. 성당 중앙 신랑 위에 매달려 있습니다."}],["바디아 다폭 제단화","Badia Polyptych","1300경","uffizi","Badia Polyptych",{"tip":"성모자와 네 성인을 다섯 칸에 나누어 그린 제단화로, 원래 피렌체 바디아 수도원 성당에 있었습니다. 금박 배경 속 인물들의 묵직한 입체감을 살펴보세요."}],["동방박사의 경배","Adoration of the Magi","1305경","scrovegni","File:Giotto - Scrovegni - -18- - Adoration of the Magi.jpg",{"tip":"아기 예수에게 경배하는 동방박사들을 그린 장면으로, 하늘의 베들레헴의 별이 꼬리 달린 혜성으로 그려져 있습니다. 1301년 나타난 핼리 혜성에서 영감을 받았다고 흔히 설명됩니다."}],["황금 문에서의 만남","Meeting at the Golden Gate","1305경","scrovegni","File:Giotto - Scrovegni - -06- - Meeting at the Golden Gate.jpg",{"tip":"성모 마리아의 부모인 요아킴과 안나가 예루살렘 성문 앞에서 재회해 입맞춤하는 장면입니다. 두 얼굴이 하나로 겹쳐지는 포옹이 깊은 감정을 전합니다."}]]},{"n":"프라 안젤리코","o":"Fra Angelico","l":"1395경–1455","d":"도미니코회 수사이자 화가. 맑은 색채와 경건한 분위기로 신앙을 그렸습니다.","w":[["수태고지 (산 마르코)","Annunciation (San Marco)","1440–1445경","sanmarco","Annunciation (Fra Angelico, San Marco)",{"tip":"수도원 2층 계단을 오르면 정면에 나타나는 프레스코입니다. 소박한 회랑 안에서 천사와 마리아가 고요히 마주합니다."}],["수태고지 (프라도)","The Annunciation","1425–1426","prado","Annunciation (Fra Angelico, Madrid)",{"tip":"금빛 회랑에서 천사가 마리아에게 수태를 알리고, 왼쪽에는 낙원에서 쫓겨나는 아담과 하와가 보입니다. 아래 작은 그림들에는 마리아의 생애가 이어집니다."}],["십자가에서 내려지는 그리스도","Deposition of Christ","1432–1434경","sanmarco","Deposition of Christ (Fra Angelico)",{"tip":"십자가에서 내려지는 그리스도를 맑은 토스카나 풍경을 배경으로 그렸습니다. 원래 피렌체 산타 트리니타 성당의 제단화였습니다."}],["성모의 대관","Coronation of the Virgin","1430–1432경","louvre","Coronation of the Virgin (Fra Angelico, Louvre)",{"tip":"그리스도가 마리아에게 관을 씌우는 장면을 성인과 천사들이 계단 아래에서 지켜봅니다. 금빛 배경과 선명한 청색이 돋보입니다."}]]},{"n":"마사초","o":"Masaccio","l":"1401–1428","d":"수학적 원근법을 회화에 처음 본격 적용했습니다. 스물일곱에 요절했습니다.","w":[["성 삼위일체","Holy Trinity","1427경","smn","Holy Trinity (Masaccio)",{"tip":"선원근법을 본격적으로 적용한 초기 작품으로, 벽면에 실제 예배당이 움푹 들어가 있는 듯한 착시를 줍니다. 아래쪽 해골 그림에는 죽음을 일깨우는 글귀가 적혀 있습니다."}],["성전세","The Tribute Money","1425경","brancacci","The Tribute Money (Masaccio)",{"tip":"세리에게 낼 세금을 물고기 입에서 꺼내라는 이야기를 한 화면에 담은 프레스코입니다. 베드로가 가운데, 왼쪽, 오른쪽에 세 번 등장하니 순서대로 찾아보세요."}],["낙원에서의 추방","Expulsion from the Garden of Eden","1425경","brancacci","File:Masaccio-TheExpulsionOfAdamAndEveFromEden-Restoration.jpg",{"tip":"얼굴을 감싼 아담과 울부짖는 이브의 절망이 생생하게 표현된 프레스코입니다. 후대에 덧그린 나뭇잎은 1980년대 복원 때 제거되었습니다."}],["성모자 (피사 다폭 제단화 중앙)","Madonna and Child","1426","ngl","File:Masaccio. Madonna and Child. 1426. National Gallery, London.jpg",{"tip":"피사의 성당을 위해 만든 다폭 제단화의 중앙 패널로, 아기 예수가 성체를 상징하는 포도알을 먹고 있습니다. 제단화는 후에 해체되어 각 패널이 여러 미술관에 흩어졌습니다."}],["그림자로 병자를 고치는 성 베드로","Saint Peter Healing the Sick with His Shadow","1425경","brancacci","File:Masaccio - St Peter Healing the Sick with his Shadow - WGA14187.jpg",{"tip":"성 베드로가 거리를 지나가자 그 그림자가 닿은 병자들이 낫는 장면입니다. 피렌체의 실제 거리 풍경처럼 그려진 건물들이 원근감을 더합니다."}],["십자가 처형","Crucifixion","1426","capodimonte","File:Masaccio - Crucifixion - WGA14199.jpg",{"tip":"피사 제단화의 맨 위 칸이었던 패널로, 두 팔을 활짝 벌린 막달라 마리아의 뒷모습이 슬픔을 강렬하게 드러냅니다. 어깨에 파묻힌 듯한 그리스도의 머리는 아래에서 올려다보는 시점을 고려한 것으로 여겨집니다."}],["성 안나와 성모자","Virgin and Child with Saint Anne","1424경","uffizi","Virgin and Child with Saint Anne (Masaccio)",{"tip":"성 안나가 성모와 아기 예수를 감싸듯 뒤에 앉아 있는 제단화로, 마솔리노와 함께 그렸습니다. 묵직한 성모와 아기 예수가 마사초의 손길로 여겨집니다."}]]},{"n":"피에로 델라 프란체스카","o":"Piero della Francesca","l":"1415경–1492","d":"원근법과 기하학을 연구한 수학자이자 화가. 고요하고 엄격한 질서의 화면을 만들었습니다.","w":[["그리스도의 세례","The Baptism of Christ","1440년대","ngl","The Baptism of Christ (Piero della Francesca)",{"tip":"요르단강에서 세례를 받는 그리스도를 그렸습니다. 머리 위의 비둘기와 하얀 나무줄기가 화면의 수직 축을 이룹니다."}],["그리스도의 채찍질","The Flagellation of Christ","1455–1460경","urbino","Flagellation of Christ (Piero della Francesca)",{"tip":"뒤편에서 채찍질이 벌어지고 앞쪽에는 세 인물이 서 있습니다. 세 사람의 정체는 지금도 논쟁거리이며, 정밀한 원근법으로도 유명합니다."}],["우르비노 공작 부부의 초상","Diptych of Federico da Montefeltro and Battista Sforza","1473–1475경","uffizi","Diptych of Federico da Montefeltro and Battista Sforza",{"tip":"우르비노 공작 부부를 옆모습으로 마주 보게 그린 두 폭 초상입니다. 마상 시합에서 오른쪽 눈을 잃은 공작은 늘 왼쪽 옆모습으로 그려졌습니다."}],["그리스도의 탄생","The Nativity","1470–1475경","ngl","The Nativity (Piero della Francesca)",{"tip":"바닥에 누운 아기 예수를 향해 류트를 든 천사들이 노래합니다. 일부가 미완성으로 남아 있어 화가의 작업 과정을 엿볼 수 있습니다."}]]},{"n":"산드로 보티첼리","o":"Sandro Botticelli","l":"1445경–1510","d":"메디치가의 후원 속에서 우아한 선으로 신화를 그렸습니다.","w":[["비너스의 탄생","The Birth of Venus","1485경","uffizi","The Birth of Venus",{"tip":"바다에서 태어난 비너스가 조개껍데기를 타고 해안에 닿는 장면입니다. 왼쪽에서 바람의 신이 입김을 불고, 오른쪽에서는 여신이 옷을 들고 맞이합니다."}],["봄 (프리마베라)","Primavera","1480경","uffizi","Primavera (Botticelli)",{"tip":"오렌지 숲 한가운데 비너스가 서 있고, 왼쪽의 삼미신과 메르쿠리우스, 오른쪽의 서풍과 꽃의 여신이 등장합니다. 바닥을 채운 수많은 꽃과 식물이 정밀하게 그려져 있습니다."}],["동방박사의 경배","Adoration of the Magi","1475경","uffizi","Adoration of the Magi (Botticelli, 1475)",{"tip":"동방박사들의 얼굴에 메디치 가문 사람들의 모습을 담은 작품입니다. 오른쪽 끝에서 관람자를 바라보는 노란 옷의 남자는 보티첼리의 자화상으로 알려져 있습니다."}],["비너스와 마르스","Venus and Mars","1485경","ngl","Venus and Mars (Botticelli)",{"tip":"깊이 잠든 마르스 곁에서 비너스만 깨어 있고, 어린 사티로스들이 그의 갑옷과 창을 가지고 장난을 칩니다. 사랑이 전쟁을 이긴다는 주제로 읽힙니다."}],["석류의 성모","Madonna of the Pomegranate","1487경","uffizi","Madonna of the Pomegranate (Botticelli)",{"tip":"둥근 화면 속 성모가 수난과 부활을 상징하는 석류를 들고, 아기 예수가 그 위에 손을 얹고 있습니다. 성모를 둘러싼 천사들의 얼굴과 금빛 광선을 가까이에서 살펴보세요."}],["그리스도의 세 가지 유혹 (시스티나 벽화)","Temptations of Christ","1481–1482","vatican","File:Sandro Botticelli - Three Temptations of Christ - WGA2755.jpg",{"tip":"미켈란젤로의 천장화보다 30년 앞서 보티첼리, 페루지노, 기를란다요 등이 시스티나 예배당 벽을 장식했습니다."}],["신비한 성탄","Mystic Nativity","1500경","ngl","File:Mystic Nativity, Sandro Botticelli.jpg",{"tip":"보티첼리가 서명과 날짜를 남긴 유일한 작품으로, 사보나롤라의 영향을 받은 말년의 종교화입니다."}],["아펠레스의 중상","Calumny of Apelles","1495경","uffizi","Calumny of Apelles",{"tip":"고대 화가 아펠레스가 묘사했다는 그림을 문헌에 따라 재현한 작품으로, 무고한 남자가 '중상'에게 끌려가는 장면입니다. 오른쪽 왕의 귀에 '무지'와 '의심'이 속삭이고 있습니다."}],["팔라스와 켄타우로스","Pallas and the Centaur","1482경","uffizi","Pallas and the Centaur",{"tip":"지혜의 여신 팔라스가 반인반마 켄타우로스의 머리채를 잡은 모습으로, 이성이 본능을 다스리는 뜻으로 흔히 해석됩니다. 여신의 옷에는 메디치 가문의 고리 문양이 수놓아져 있습니다."}],["마니피캇의 성모","Madonna of the Magnificat","1483경","uffizi","Madonna of the Magnificat",{"tip":"천사들에게 둘러싸인 성모가 책에 '마니피캇' 찬가를 적고 있는 원형 그림입니다. 둥근 화면에 맞춰 인물들이 곡선을 이루도록 배치되어 있습니다."}],["코시모 메디치의 메달을 든 남자의 초상","Portrait of a Man with a Medal of Cosimo the Elder","1475경","uffizi","Portrait of a Man with a Medal of Cosimo the Elder",{"tip":"젊은 남자가 코시모 데 메디치의 얼굴이 새겨진 메달을 두 손으로 들고 있는 초상화입니다. 메달 부분은 실제 석고 부조를 붙이고 금박을 입힌 것입니다."}]]}]},{"id":"high-renaissance","name":"전성기 르네상스","en":"High Renaissance","years":"1490년 – 1530년 (베네치아파는 16세기 후반까지)","s":1490,"e":1576,"color":"#6b4f2a","sum":"르네상스가 정점에 이른 짧고 찬란한 시기입니다. 피렌체와 로마에서는 레오나르도·미켈란젤로·라파엘로가 조화와 균형의 고전적 이상을 완성했고, 베네치아에서는 조르조네와 티치아노가 색채 중심의 회화를 발전시켰습니다.","traits":["스푸마토: 윤곽을 연기처럼 부드럽게 흐림","피라미드형 안정 구도와 이상적 비례","유화가 퍼지며 깊은 색과 질감 가능","피렌체·로마는 소묘(디세뇨), 베네치아는 색채(콜로레) 중시","조각에서도 고전적 이상이 정점에 이름 (미켈란젤로의 〈다비드〉, 〈피에타〉)"],"diff":"초기 르네상스가 기법을 실험했다면, 이 시기에는 그 기법들이 하나의 완벽한 조화로 통합됩니다.","artists":[{"n":"레오나르도 다 빈치","o":"Leonardo da Vinci","l":"1452–1519","d":"화가이자 과학자, 발명가. 완성작이 20점이 채 안 됩니다.","w":[["모나리자","Mona Lisa","1503–1519경","louvre","Mona Lisa",{"tip":"방탄유리 안에 전시되며 늘 혼잡합니다. 개관 직후 방문을 추천합니다."}],["최후의 만찬","The Last Supper","1495–1498","grazie","The Last Supper (Leonardo)",{"tip":"수도원 식당 벽화. 사전 예약제이며 관람 시간이 15분 정도로 제한됩니다."}],["흰 담비를 안은 여인","Lady with an Ermine","1489–1491경","krakow","Lady with an Ermine",{"tip":"밀라노 공작 루도비코 스포르차의 연인 체칠리아 갈레라니를 그린 것으로 알려진 초상화입니다. 순결을 상징하는 흰 담비는 루도비코를 가리키는 표상으로도 해석됩니다."}],["암굴의 성모","Virgin of the Rocks","1483–1486","louvre","Virgin of the Rocks",{"tip":"두 번째 버전(1495–1508경)은 런던 내셔널 갤러리에 있습니다."}],["수태고지","Annunciation","1472–1476경","uffizi","Annunciation (Leonardo)",{"tip":"베로키오 공방 시절에 그린 초기작으로, 무릎 꿇은 천사가 성모에게 수태를 알리는 장면입니다. 대리석 독서대의 장식과 안개 낀 원경 풍경을 눈여겨볼 만합니다."}],["성 안나와 성모자","The Virgin and Child with Saint Anne","1503–1519경","louvre","The Virgin and Child with Saint Anne (Leonardo)",{"tip":"성 안나의 무릎에 앉은 성모가 어린 양을 붙잡은 아기 예수에게 손을 뻗는 구도입니다. 레오나르도가 오랫동안 손에서 놓지 않았고 끝내 완성하지 못한 작품입니다."}],["지네브라 데 벤치","Ginevra de' Benci","1474–1478경","nga","Ginevra de' Benci",{"tip":"미국에서 볼 수 있는 유일한 레오나르도의 회화입니다."}],["광야의 성 히에로니무스 (미완성)","Saint Jerome in the Wilderness","1480경","vatican","File:Saint Jerome Leonardo - image only (Q972196).jpg",{"tip":"19세기에 두 조각으로 잘린 채 발견되어, 하나는 상자 뚜껑, 다른 하나는 구둣방 의자로 쓰였다는 일화가 전합니다."}],["동방박사의 경배","Adoration of the Magi","1481–1482","uffizi","Adoration of the Magi (Leonardo)",{"tip":"레오나르도가 밀라노로 떠나며 미완성으로 남긴 제단화로, 밑그림 단계의 붓질이 그대로 드러나 있습니다. 성모자를 둘러싼 군중과 배경의 폐허가 소용돌이치듯 펼쳐집니다."}],["라 벨 페로니에르","La Belle Ferronnière","1490–1497경","louvre","La Belle Ferronnière",{"tip":"이마에 가는 장식끈을 두른 여인이 어깨 너머 다른 곳을 바라보는 초상화입니다. 레오나르도가 밀라노 궁정 시절에 그린 것으로, 모델의 정체는 확실하지 않습니다."}],["세례 요한","Saint John the Baptist","1513–1516경","louvre","Saint John the Baptist (Leonardo)",{"tip":"어둠 속에서 세례 요한이 미소를 지으며 하늘을 가리키는 모습입니다. 레오나르도 말년의 작품으로, 부드러운 명암 기법인 스푸마토가 두드러집니다."}]]},{"n":"미켈란젤로 부오나로티","o":"Michelangelo Buonarroti","l":"1475–1564","d":"조각가를 자처했지만 시스티나 예배당 천장화로 회화사에도 우뚝 섰습니다.","w":[["아담의 창조 (시스티나 천장화)","The Creation of Adam","1512경","vatican","The Creation of Adam",{"tip":"시스티나 예배당 안에서는 사진 촬영이 금지됩니다."}],["최후의 심판","The Last Judgment","1536–1541","vatican","The Last Judgment (Michelangelo)",{"tip":"시스티나 예배당 제단 벽 전체를 채운 프레스코로, 가운데 그리스도가 팔을 들어 심판을 내립니다. 성 바르톨로메오가 든 벗겨진 살가죽의 얼굴은 미켈란젤로의 자화상으로 알려져 있습니다."}],["도니 톤도 (성가족)","Doni Tondo","1507경","uffizi","Doni Tondo",{"tip":"피렌체의 상인 아뇰로 도니를 위해 그린 둥근 패널화로, 성가족 뒤편에 나체의 청년들이 앉아 있습니다. 조각 같은 인체와 강렬한 색채가 돋보이며, 화려한 원래 액자도 함께 남아 있습니다."}],["다비드 (조각)","David","1501–1504","accademiafi","David (Michelangelo)",{"tip":"다른 조각가들이 손대다 버려 둔 대리석 덩어리로 조각한 작품입니다. 원래 시뇨리아 광장에 서 있었으나 19세기에 이곳으로 옮겨졌고, 광장에는 복제본이 서 있습니다."}],["피에타 (조각)","Pietà","1498–1499","stpeter","Pietà (Michelangelo)",{"tip":"1972년 훼손 사건 이후 방탄유리 너머로 관람합니다."}],["죽어 가는 노예 (조각)","Dying Slave","1513–1516","louvre","File:Dying slave Louvre MR 1590, Louvre.jpg",{"tip":"교황 율리우스 2세의 무덤을 위해 만든 조각으로, 짝을 이루는 〈반항하는 노예〉와 함께 루브르에 있습니다."}],["맨체스터 성모 (미완성)","The Manchester Madonna","1497경","ngl","File:Michelangelo manchaster.jpg",{"tip":"미켈란젤로의 몇 안 되는 패널화로, 미완성 상태라 그림 그리는 과정을 엿볼 수 있습니다."}],["모세 (조각)","Moses","1513–1515","vincoli","File:Moses in San Pietro in Vincoli, Roim.png",{"tip":"율리우스 2세 무덤 기념물의 중심 조각입니다. 성당은 입장료 없이 들어갈 수 있습니다."}],["델포이의 무녀 (시스티나 천장화)","Delphic Sibyl","1509","vatican","File:Michelangelo - Delphic Sibyl.jpg",{"tip":"시스티나 천장화에 그려진 예언자와 무녀 가운데 하나로, 두루마리를 든 채 고개를 돌린 젊은 여인의 크게 뜬 눈이 인상적입니다."}],["대홍수 (시스티나 천장화)","The Deluge","1508–1509","vatican","File:The Deluge after restoration.jpg",{"tip":"노아 이야기를 다룬 천장화 장면으로, 물을 피해 높은 곳으로 몰려드는 사람들을 그렸습니다. 작업 초기에 그린 장면이라 인물이 작고 많으며, 이후 장면으로 갈수록 인물이 커집니다."}],["리비아의 무녀 (시스티나 천장화)","Libyan Sibyl","1511","vatican","File:LibyanSibyl SistineChapel.jpg",{"tip":"커다란 책을 내려놓으며 몸을 비트는 무녀를 그린 천장화로, 어렵고 우아한 자세가 돋보입니다. 남성 모델을 그린 준비 습작이 뉴욕 메트로폴리탄 미술관에 남아 있습니다."}],["바쿠스","Bacchus","1496–1497","bargello","Bacchus (Michelangelo)",{"tip":"술에 취해 비틀거리는 술의 신 바쿠스를 표현한 대리석 조각으로, 미켈란젤로가 로마에서 만든 첫 대형 작품입니다. 뒤편에서 포도를 몰래 먹는 어린 사티로스를 찾아보세요."}],["피티 톤도","Pitti Tondo","1503–1505경","bargello","Pitti Tondo",{"tip":"성모와 아기 예수, 어린 세례 요한을 원형 대리석에 새긴 부조입니다. 일부를 거칠게 다듬은 채 남겨 둔 미완성 표면이 인물의 입체감을 돋보이게 합니다."}],["반항하는 노예","Rebellious Slave","1513–1516","louvre","Rebellious Slave",{"tip":"교황 율리오 2세의 무덤을 위해 만든 조각으로, 묶인 몸을 비틀며 벗어나려는 남자의 모습입니다. 같은 전시실의 '죽어가는 노예'와 짝을 이룹니다."}],["원죄와 낙원 추방","The Fall and Expulsion from Garden of Eden","1509–1510경","vatican","File:Michelangelo, Fall and Expulsion from Garden of Eden 00.jpg",{"tip":"시스티나 예배당 천장화의 한 장면으로, 왼쪽에는 나무에 몸을 감은 뱀에게서 금단의 열매를 받는 하와와 직접 열매로 손을 뻗는 아담이, 오른쪽에는 천사에게 쫓겨나는 두 사람이 그려져 있습니다."}]]},{"n":"라파엘로 산치오","o":"Raffaello Sanzio","l":"1483–1520","d":"레오나르도와 미켈란젤로를 흡수해 가장 조화로운 고전 양식을 완성했습니다.","w":[["아테네 학당","The School of Athens","1509–1511","vatican","The School of Athens",{"tip":"바티칸 박물관 '라파엘로의 방'에 있는 벽화입니다."}],["시스티나의 성모","Sistine Madonna","1512–1513","dresden","Sistine Madonna",{"tip":"구름 위에 나타난 성모자를 성 식스투스와 성녀 바르바라가 맞이하는 제단화입니다. 아래쪽에 턱을 괸 두 아기 천사는 따로 떼어 복제될 만큼 유명합니다."}],["의자의 성모","Madonna della Seggiola","1513–1514","pitti","Madonna della Seggiola",{"tip":"둥근 화면 안에서 성모가 아기 예수를 꼭 끌어안고 관람자를 바라보며, 옆에서 어린 세례 요한이 두 손을 모으고 있습니다. 성모가 앉은 의자 기둥에서 제목이 나왔습니다."}],["방울새의 성모","Madonna del Cardellino","1505–1506","uffizi","Madonna del Cardellino",{"tip":"어린 세례 요한이 수난을 상징하는 방울새를 아기 예수에게 건네는 장면입니다. 1547년 소장자의 집이 무너지며 패널이 여러 조각으로 부서졌다가 복원되었습니다."}],["그리스도의 변용","Transfiguration","1516–1520","vatican","Transfiguration (Raphael)",{"tip":"라파엘로의 마지막 작품으로 바티칸 회화관(피나코테카)에 있습니다."}],["발다사레 카스틸리오네의 초상","Portrait of Baldassare Castiglione","1514–1515","louvre","Portrait of Baldassare Castiglione",{"tip":"『궁정인』의 저자인 친구를 그린 초상으로, 회색과 검은색 위주의 절제된 색조가 돋보입니다. 렘브란트와 루벤스 등 후대 화가들이 이 그림을 따라 그렸습니다."}],["성체 논의","Disputation of the Holy Sacrament","1509–1510","vatican","File:Raphael, Disputation of the Holy Sacrament, 1509-10, Vatican Museums (48759463557).jpg",{"tip":"'서명의 방'에서 〈아테네 학당〉과 마주 보는 벽화입니다. 철학과 신학이 서로 마주한 셈입니다."}],["폴리뇨의 성모","Madonna of Foligno","1511–1512","vatican","File:Madonna of Foligno - Raphael (8590568151).jpg",{"tip":"바티칸 회화관(피나코테카)에 있습니다."}],["성 베드로의 해방","The Liberation of Saint Peter","1514","vatican","File:Raphaël, La Libération de saint Pierre, 1512–1514, fresque, 660 × 500 cm, Chambre d’Héliodore, Stanze de Raphaël, Palais apostolique, Musées du Vatican.jpg",{"tip":"천사의 빛, 횃불, 달빛 세 가지 빛을 그린 '헬리오도로스의 방'의 야경 벽화입니다."}],["교황 율리우스 2세의 초상","Portrait of Pope Julius II","1511","ngl","File:Pope Julius II.jpg",{"tip":"시스티나 천장화를 미켈란젤로에게 맡긴 바로 그 교황입니다. 비슷한 버전이 우피치에도 있습니다."}],["베일을 쓴 여인 (라 벨라타)","La Velata","1516경","pitti","File:Raffaello Sanzio - La Donna Velata.jpg",{"tip":"베일을 쓴 여인의 반신상으로, 금빛과 흰빛이 어우러진 풍성한 소매 표현이 압권입니다. 모델의 정체는 확실히 밝혀지지 않았습니다."}],["그리스도의 매장","The Deposition","1507","borghese","The Deposition (Raphael)",{"tip":"그리스도의 시신을 무덤으로 옮기는 장면으로, 페루자의 귀족 부인 아탈란타 발리오니가 살해된 아들을 기리며 주문했습니다. 1608년 몰래 로마로 옮겨져 보르게세 컬렉션에 들어갔습니다."}],["아름다운 정원사","La Belle Jardinière","1507","louvre","La belle jardinière",{"tip":"꽃이 핀 풀밭에 앉은 성모가 아기 예수와 어린 세례 요한을 지켜보는 모습입니다. 피렌체 시절 라파엘로가 인물들을 피라미드 구도로 짜임새 있게 배치했습니다."}],["초원의 성모","Madonna of the Meadow","1505–1506경","khm","Madonna del Prato (Raphael)",{"tip":"푸른 들판을 배경으로 성모가 아기 예수와 어린 세례 요한을 보살피는 그림입니다. 레오나르도의 영향을 받은 삼각형 구도와 부드러운 풍경이 특징입니다."}],["교황 레오 10세와 두 추기경","Portrait of Pope Leo X with Two Cardinals","1518","uffizi","Portrait of Leo X (Raphael)",{"tip":"메디치 가문 출신 교황 레오 10세가 두 친척 추기경과 함께 있는 초상화입니다. 교황 앞의 채색 필사본과 돋보기, 의자 장식에 비친 창문까지 정교하게 그려져 있습니다."}]]},{"n":"조르조네","o":"Giorgione","l":"1477경–1510","d":"풍경과 분위기로 시를 쓰듯 그린 베네치아의 수수께끼 같은 화가입니다.","w":[["폭풍우","The Tempest","1508경","accademia","The Tempest (Giorgione)",{"tip":"번개가 치는 하늘 아래 서 있는 젊은 남자와 아기에게 젖을 먹이는 여인을 그렸지만, 주제는 지금도 수수께끼입니다. 엑스선 조사 결과 남자 자리에 원래 다른 여인이 그려져 있었습니다."}],["잠자는 비너스","Sleeping Venus","1510경","dresden","Sleeping Venus (Giorgione)",{"tip":"조르조네 사후 티치아노가 풍경을 완성한 것으로 알려져 있습니다."}],["세 철학자","The Three Philosophers","1508–1509경","khm","The Three Philosophers",{"tip":"동굴 앞에 모인 서로 다른 연령대의 세 남자를 그린 작품으로, 이들이 누구인지에 대해서는 여러 해석이 있습니다. 조르조네가 완성하지 못한 부분을 세바스티아노 델 피옴보가 마무리했다고 전해집니다."}],["라우라","Laura","1506","khm","File:Giorgione - Young Woman (“Laura”) - Google Art Project.jpg",{"tip":"월계수 가지를 배경으로 모피를 걸친 여인을 그린 초상입니다. 뒷면에 남은 기록 덕분에 제작 시기가 확인되는, 조르조네의 드문 작품입니다."}],["젊은 남자의 초상","Portrait of a Young Man (Giustiniani Portrait)","1505경","berlingg","File:Portrait of a young Man (Giorgione - Gemäldegalerie, Berlin) 9463.jpg",{"tip":"난간 너머로 고개를 살짝 돌린 젊은 남자를 그린 초상으로, 조르조네의 몇 안 되는 확실한 초상화 가운데 하나입니다. 부드러운 명암으로 인물의 섬세한 표정을 살렸습니다."}],["노파","The Old Woman","1506경","accademia","The Old Woman (Giorgione)",{"tip":"주름진 노파가 가슴에 손을 얹고 관람자를 바라보는 초상입니다. 손에 든 쪽지에 '세월과 함께(COL TEMPO)'라는 글귀가 적혀 있어 시간의 흐름을 일깨웁니다."}],["목자들의 경배","Adoration of the Shepherds","1505–1510경","nga","Adoration of the Shepherds (Giorgione)",{"tip":"동굴 앞에서 두 목자가 아기 예수에게 경배하는 장면으로, 왼쪽에 넓은 풍경이 펼쳐집니다. 옛 소장자 이름을 따 '앨런데일 성탄'이라고도 불립니다."}]]},{"n":"티치아노 베첼리오","o":"Titian","l":"1488경–1576","d":"베네치아파의 거장. 색채와 붓질로 형태를 만들어 후대 화가들에게 큰 영향을 주었습니다.","w":[["우르비노의 비너스","Venus of Urbino","1538","uffizi","Venus of Urbino",{"tip":"침대에 누워 관람자를 바라보는 비너스와 발치에 잠든 개, 뒤편에서 궤를 뒤지는 하녀들을 그렸습니다. 훗날 마네의 「올랭피아」에 영감을 준 작품입니다."}],["성모 승천","Assumption of the Virgin","1516–1518","frari","Assumption of the Virgin (Titian)",{"tip":"성당 주제단에 지금도 걸려 있는 거대한 제단화로, 사도들, 승천하는 성모, 하느님의 세 단으로 구성됩니다. 성당 입구에서 보면 성가대석 칸막이의 아치 너머로 그림이 들어옵니다."}],["바쿠스와 아리아드네","Bacchus and Ariadne","1520–1523","ngl","Bacchus and Ariadne",{"tip":"치타가 끄는 수레에서 뛰어내리는 바쿠스와 놀라 돌아보는 아리아드네를 그렸습니다. 왼쪽 위 하늘에는 아리아드네의 관이 된 별자리가 떠 있습니다."}],["신성한 사랑과 세속적 사랑","Sacred and Profane Love","1514경","borghese","Sacred and Profane Love",{"tip":"분수대 가장자리에 앉은 옷 입은 여인과 나체의 여인, 그 사이에서 물을 휘젓는 큐피드를 그렸습니다. 지금의 제목은 후대에 붙은 것이며 정확한 의미는 해석이 갈립니다."}],["카를 5세 기마상","Equestrian Portrait of Charles V","1548","prado","Equestrian Portrait of Charles V",{"tip":"뮐베르크 전투에서 개신교 연합군에 승리한 황제를 갑옷 차림의 기마상으로 그렸습니다. 이후 스페인 궁정 초상화의 본보기가 되었습니다."}],["장갑을 낀 남자","Man with a Glove","1520경","louvre","File:Titien-homme-au-gant-Louvre.jpg",{"tip":"검은 옷을 입은 젊은 남자가 한 손에 장갑을 들고 있는 초상으로, 모델은 밝혀지지 않았습니다. 어두운 배경 속에서 얼굴과 흰 셔츠, 손만 은은하게 떠오릅니다."}],["다나에","Danaë","1560–1565경","prado","File:Tizian - Danae receiving the Golden Rain - Prado.jpg",{"tip":"티치아노가 여러 번 그린 주제입니다. 펠리페 2세에게 보낸 신화화 연작 '포에지'의 첫 〈다나에〉는 런던 앱슬리 하우스에 있고, 프라도 판은 그 뒤에 다시 그린 버전입니다."}],["디아나와 악타이온","Diana and Actaeon","1556–1559","ngl","File:Titian - Diana and Actaeon - Google Art Project.jpg",{"tip":"런던 내셔널 갤러리와 스코틀랜드 국립미술관이 공동 소장해 두 곳을 오가며 전시됩니다."}],["페사로 가문의 성모","Pesaro Madonna","1519–1526","frari","Pesaro Madonna",{"tip":"야코포 페사로가 가족과 함께 성모자에게 경배하는 제단화입니다. 성모를 화면 중앙이 아닌 오른쪽 위에 둔 비대칭 구도가 당시로서는 새로웠습니다."}],["플로라","Flora","1515경","uffizi","Flora (Titian)",{"tip":"흘러내린 흰 옷을 붙잡고 꽃을 내미는 젊은 여인을 그린 반신상입니다. 금빛 머리카락과 피부의 부드러운 질감에서 베네치아 색채의 매력이 드러납니다."}],["피에타","Pietà","1575–1576","accademia","Pietà (Titian)",{"tip":"티치아노가 자신의 무덤을 위해 그리던 마지막 작품으로, 그가 세상을 떠난 뒤 팔마 일 조바네가 마무리했습니다. 손가락으로 문지른 듯 거친 붓질이 깊은 비통함을 전합니다."}]]},{"n":"파올로 베로네세","o":"Paolo Veronese","l":"1528–1588","d":"베네치아의 화려한 색채가. 거대한 연회 장면을 웅장한 건축과 함께 펼쳤습니다.","w":[["가나의 혼인잔치","The Wedding at Cana","1563","louvre","File:Les Noces de Cana - Paolo Veronese - Musée du Louvre Peintures INV 142 ; MR 384.jpg",{"tip":"루브르에서 가장 큰 그림으로, 「모나리자」의 맞은편 벽에 걸려 있습니다. 물이 포도주로 변한 기적을 130명이 넘는 인물이 등장하는 베네치아식 연회로 그렸습니다."}],["레위가의 향연","The Feast in the House of Levi","1573","accademia","The Feast in the House of Levi",{"tip":"원래 「최후의 만찬」으로 그렸으나, 난쟁이와 술 취한 병사 등이 문제가 되어 종교재판에 불려간 뒤 제목만 바꾸었습니다."}],["알렉산더 앞의 다리우스 가족","The Family of Darius before Alexander","1565–1567경","ngl","The Family of Darius Before Alexander",{"tip":"패배한 페르시아 왕 다리우스의 가족이 알렉산더 앞에 무릎 꿇은 장면입니다. 어머니가 시종을 알렉산더로 잘못 알아본 일화를 그렸습니다."}],["사랑으로 맺어진 마르스와 비너스","Mars and Venus United by Love","1570년대","met","Venus and Mars (Veronese)",{"tip":"큐피드가 전쟁의 신 마르스와 비너스를 리본으로 묶고 있습니다. 비너스의 가슴에서 젖이 흘러나오는 등 사랑의 알레고리로 가득합니다."}]]}]},{"id":"northern-renaissance","name":"북유럽 르네상스","en":"Northern Renaissance","years":"1420년 – 1570년","s":1420,"e":1570,"color":"#4a5a3a","sum":"플랑드르(지금의 벨기에·네덜란드)와 독일에서 꽃핀 르네상스입니다. 유화 기법을 정교하게 다듬어 보석, 직물, 거울 속 반사까지 극도로 세밀하게 그렸고, 종교개혁과 인쇄술의 영향으로 판화와 일상 장면도 발전했습니다.","traits":["유화 물감을 얇게 겹쳐 발라 빛나는 색과 정밀한 세부 표현","사물 하나하나에 상징적 의미를 담음","목판화·동판화의 발달 (뒤러)","농민의 생활과 풍경이 독립된 주제로 등장 (브뤼헐)","보스의 기괴하고 환상적인 도상, 홀바인의 정밀한 궁정 초상"],"diff":"이탈리아가 이상적인 아름다움과 고전을 추구했다면, 북유럽은 눈에 보이는 현실의 세부를 끝까지 파고들었습니다.","artists":[{"n":"얀 반 에이크","o":"Jan van Eyck","l":"1390경–1441","d":"유화 기법을 완성한 플랑드르 화가로 알려져 있습니다.","w":[["아르놀피니 부부의 초상","Arnolfini Portrait","1434","ngl","Arnolfini Portrait",{"tip":"뒷벽의 볼록 거울에 방 안의 인물들이 비쳐 있고, 그 위에 '얀 반 에이크가 여기 있었다'는 라틴어 서명이 적혀 있습니다. 거울을 꼭 가까이에서 확인해 보세요."}],["겐트 제단화 (어린 양에 대한 경배)","Ghent Altarpiece","1432","ghent","Ghent Altarpiece",{"tip":"여러 장의 패널로 이루어진 거대한 제단화로, 아래 중앙에 어린 양을 경배하는 장면이 펼쳐집니다. 왼쪽 아래 '정의로운 재판관' 패널은 1934년 도난당한 뒤 지금은 복제본이 걸려 있습니다."}],["재상 롤랭의 성모","Madonna of Chancellor Rolin","1435경","louvre","Madonna of Chancellor Rolin",{"tip":"무릎 꿇은 재상 롤랭이 성모자와 같은 공간에서 마주한 장면입니다. 아치 너머로 펼쳐진 강과 도시 풍경이 놀라울 만큼 세밀하니 가까이에서 살펴보세요."}],["붉은 터번을 쓴 남자","Portrait of a Man in a Red Turban","1433","ngl","Portrait of a Man in a Red Turban",{"tip":"화가 자신의 자화상으로 추정됩니다."}],["레알 수브니르","Léal Souvenir","1432","ngl","Léal Souvenir",{"tip":"돌 난간 뒤의 남자를 그린 초상으로, 난간에 '충실한 기억(LEAL SOUVENIR)'이라는 글귀가 돌에 새긴 듯 그려져 있습니다. 모델은 '티모테오스'로만 알려져 있습니다."}],["수태고지","Annunciation","1434–1436경","nga","File:Annunciation - Jan van Eyck - 1434 - NG Wash DC.jpg",{"tip":"높은 성당 안에서 대천사 가브리엘이 마리아에게 수태를 알리는 장면입니다. 두 인물 사이의 말이 금빛 글자로 적혀 있고, 마리아의 대답은 하늘을 향하도록 거꾸로 쓰여 있습니다."}],["십자가 처형과 최후의 심판 두폭화","Crucifixion and Last Judgement diptych","1430–1440경","met","Crucifixion and Last Judgement diptych",{"tip":"왼쪽 패널에는 골고다 언덕의 십자가 처형이, 오른쪽 패널에는 천국과 지옥으로 나뉜 최후의 심판이 그려져 있습니다. 작은 화면에 수많은 인물이 세밀하게 담겨 있습니다."}]]},{"n":"히에로니무스 보스","o":"Hieronymus Bosch","l":"1450경–1516","d":"기괴하고 환상적인 도상으로 초현실주의자들의 조상으로 불립니다.","w":[["쾌락의 정원","The Garden of Earthly Delights","1490–1510경","prado","The Garden of Earthly Delights",{"tip":"왼쪽의 에덴동산, 가운데 쾌락에 빠진 인간들, 오른쪽의 지옥으로 이어지는 세폭 제단화입니다. 날개를 닫으면 회색조로 그린 천지창조 장면이 나타납니다."}],["건초 수레","The Haywain Triptych","1516경","prado","The Haywain Triptych",{"tip":"건초 더미를 차지하려고 다투는 사람들로 세속적 탐욕을 풍자한 세폭 제단화입니다. 수레는 오른쪽 지옥을 향해 나아가고 있습니다."}],["성 안토니우스의 유혹","Triptych of the Temptation of St. Anthony","1501경","lisbon","Triptych of the Temptation of St. Anthony",{"tip":"기도하는 성 안토니우스 주위로 기괴한 악마와 괴물들이 몰려드는 세폭 제단화입니다. 구석구석 숨은 기묘한 생물들을 찾아보는 재미가 있습니다."}],["바보들의 배","The Ship of Fools","1500경","louvre","File:Hieronymus Bosch - The Ship of Fools - WGA2553.jpg",{"tip":"수도사와 수녀가 배 위에서 먹고 마시며 노는 모습으로 성직자의 타락을 풍자했습니다. 원래 더 큰 제단화의 일부였던 것으로 여겨집니다."}],["동방박사의 경배 세폭화","The Adoration of the Magi","1494경","prado","Adoration of the Magi (Bosch, Madrid)",{"tip":"가운데 패널에 아기 예수에게 예물을 바치는 동방박사들이 그려진 세폭 제단화입니다. 오두막 입구에 선 수수께끼의 반나체 인물이 보스다운 기묘함을 더합니다."}],["죽음과 수전노","Death and the Miser","1485–1490경","nga","File:Hieronymus Bosch, Death and the Miser, c. 1485-1490, NGA 41645.jpg",{"tip":"죽음이 문으로 들어오는 순간에도 천사와 돈주머니 사이에서 망설이는 수전노의 임종을 그린 그림입니다. 세로로 긴 패널로, 원래 제단화 날개의 일부였을 것으로 여겨집니다."}],["광기의 돌 제거","The Extraction of the Stone of Madness","1500경","prado","Cutting the Stone",{"tip":"깔때기 모자를 쓴 돌팔이 의사가 남자의 머리에서 '광기의 돌'을 꺼내는 장면으로, 어리석음을 풍자합니다. 둥근 화면 위아래에 장식 글씨가 둘러져 있습니다."}]]},{"n":"알브레히트 뒤러","o":"Albrecht Dürer","l":"1471–1528","d":"이탈리아 르네상스를 독일에 전한 화가이자 판화의 거장입니다.","w":[["모피 코트를 입은 자화상","Self-Portrait","1500","alte","Self-Portrait (Dürer, Munich)",{"tip":"정면을 응시하는 엄격한 구도가 그리스도의 모습을 연상시키는 자화상입니다. 모피 옷깃을 쓰다듬는 손과 한 올 한 올 그린 머리카락을 눈여겨보세요."}],["어린 토끼","Young Hare","1502","albertina","Young Hare",{"tip":"털 한 올까지 그린 수채화 정밀 습작입니다. 빛에 약해 원작은 몇 년에 한 번 특별전 때만 잠시 공개됩니다."}],["네 사도","The Four Apostles","1526","alte","File:Albrecht Dürer - The Four Apostles, Saints John, Peter, Mark and Paul.jpg",{"tip":"두 장의 패널에 네 명의 성인을 나누어 그린 작품으로, 화가가 뉘른베르크 시의회에 기증했습니다. 아래쪽에는 성경 구절이 적혀 있습니다."}],["아담과 이브","Adam and Eve","1507","prado","File:Albrecht Dürer - Adam and Eve (Prado).jpg",{"tip":"두 장의 패널에 아담과 이브를 각각 실물 크기로 그렸습니다. 독일 회화 최초의 실물 크기 누드로 꼽히며, 이상적인 인체 비례에 대한 화가의 관심이 담겨 있습니다."}],["멜랑콜리아 I (판화)","Melencolia I","1514","various","Melencolia I",{"tip":"동판화라 여러 장이 있으며 메트로폴리탄, 대영박물관 등 여러 곳이 소장합니다."}],["엉겅퀴를 든 자화상","Self-Portrait with a Thistle","1493","louvre","File:Albrecht Dürer - Self-portrait at 22 - WGA06910.jpg",{"tip":"스물두 살에 그린, 유럽 회화사에서 가장 이른 독립 자화상 가운데 하나입니다."}],["1498년 자화상","Self-Portrait (1498)","1498","prado","File:Selbstporträt, by Albrecht Dürer, from Prado in Google Earth.jpg",{"tip":"화려한 옷과 장갑 차림으로 자신을 신사처럼 그린 자화상입니다. 오른쪽 창밖으로 알프스 풍경이 보입니다."}],["기도하는 손 (드로잉)","Praying Hands","1508","albertina","File:Albrecht Dürer - Praying Hands, 1508 - Google Art Project.jpg",{"tip":"제단화를 위한 사도의 손 습작입니다. 종이 작품이라 평소에는 거의 전시하지 않습니다."}],["커다란 풀숲","Great Piece of Turf","1503","albertina","Great Piece of Turf",{"tip":"민들레와 질경이 등 들풀 한 무더기를 땅 높이에서 바라본 듯 정밀하게 그린 수채화입니다. 자연을 있는 그대로 관찰한 서양 미술 초기의 자연 연구로 꼽힙니다."}],["파움가르트너 제단화","Paumgartner Altarpiece","1500–1503경","alte","Paumgartner altarpiece",{"tip":"중앙에 폐허 속 그리스도의 탄생을, 양쪽 날개에 성 게오르기우스와 성 에우스타키우스를 그린 세폭 제단화입니다. 날개의 두 성인은 주문자 파움가르트너 형제의 모습이라고 전해집니다."}],["기사, 죽음과 악마","Knight, Death and the Devil","1513","various","Knight, Death and the Devil",{"tip":"갑옷 입은 기사가 모래시계를 든 죽음과 괴물 같은 악마 사이를 흔들림 없이 지나가는 동판화입니다. '서재의 성 히에로니무스', '멜랑콜리아 I'과 함께 뒤러의 3대 동판화로 꼽힙니다."}]]},{"n":"루카스 크라나흐 (아버지)","o":"Lucas Cranach the Elder","l":"1472–1553","d":"작센 궁정 화가이자 루터의 벗. 가늘고 우아한 나체 인물과 종교개혁 초상으로 유명합니다.","w":[["아담과 하와","Adam and Eve","1526","courtauld","File:Lucas Cranach d.Ä. - Adam und Eva (Courtauld Institute of Art).jpg",{"tip":"하와가 건넨 사과를 받으며 머리를 긁는 아담의 모습이 인상적입니다. 주변에는 사슴을 비롯한 낙원의 동물들이 모여 있습니다."}],["젊음의 샘","The Fountain of Youth","1546","berlingg","The Fountain of Youth (Cranach)",{"tip":"늙은 여인들이 왼쪽에서 샘에 들어가 오른쪽으로 젊어져 나옵니다. 젊어진 이들은 연회와 춤을 즐깁니다."}],["홀로페르네스의 머리를 든 유디트","Judith with the Head of Holofernes","1530경","khm","File:Lucas Cranach the Elder - Judith with the Head of Holofernes - Google Art Project.jpg",{"tip":"화려한 옷을 입은 유디트가 칼과 적장의 머리를 들고 담담하게 정면을 바라봅니다. 크라나흐가 즐겨 그린 주제입니다."}],["비너스에게 하소연하는 큐피드","Cupid Complaining to Venus","1526–1527경","ngl","Cupid Complaining to Venus",{"tip":"꿀을 훔치다 벌에 쏘인 큐피드가 비너스에게 하소연합니다. 쾌락에는 고통이 따른다는 교훈을 담았습니다."}]]},{"n":"한스 홀바인 (아들)","o":"Hans Holbein the Younger","l":"1497경–1543","d":"헨리 8세의 궁정화가. 정밀한 초상화로 유명합니다.","w":[["대사들","The Ambassadors","1533","ngl","The Ambassadors (Holbein)",{"tip":"그림 아래쪽 비스듬한 해골은 오른쪽 옆에서 비스듬히 보면 제 모양으로 보입니다."}],["토머스 모어의 초상","Portrait of Sir Thomas More","1527","frick","Portrait of Sir Thomas More (Holbein)",{"tip":"영국 체류 중 그린 초상으로, 붉은 벨벳 소매와 금 목걸이의 질감 묘사가 뛰어납니다. 같은 미술관에는 그의 정적이었던 토머스 크롬웰의 초상도 소장되어 있습니다."}],["무덤 속 그리스도의 시신","The Body of the Dead Christ in the Tomb","1520–1522","basel","File:Holbein — Dead Christ.jpg",{"tip":"관 속에 누운 그리스도의 시신을 실물 크기로 그린 길고 좁은 그림입니다. 도스토옙스키가 이 그림을 보고 큰 충격을 받아 소설 『백치』에 등장시켰습니다."}],["에라스뮈스의 초상","Portrait of Erasmus","1523","basel","File:Portrait of Erasmus by Hans Holbein d. J.-Kunstmuseum Basel.jpg",{"tip":"비슷한 구도의 초상이 루브르에도 있습니다."}],["헨리 8세의 초상","Portrait of Henry VIII","1537경","thyssen","File:Hans Holbein, the Younger, Around 1497-1543 - Portrait of Henry VIII of England - Google Art Project.jpg",{"tip":"화려한 의상과 보석으로 왕의 위엄을 드러낸 작은 패널 초상입니다. 홀바인이 직접 그린 헨리 8세 초상 가운데 현존하는 거의 유일한 작품으로 꼽힙니다."}],["토머스 크롬웰의 초상","Portrait of Thomas Cromwell","1532–1533","frick","File:Cromwell,Thomas(1EEssex)01.jpg",{"tip":"프릭 컬렉션에서는 정적이었던 토머스 모어의 초상과 서로 마주 보도록 걸려 있습니다."}],["덴마크의 크리스티나","Christina of Denmark, Duchess of Milan","1538","ngl","File:Hans the Younger Holbein - Christina of Denmark, Duchess of Milan - Google Art Project.jpg",{"tip":"헨리 8세의 신붓감 후보를 그리러 가서 그린 전신 초상입니다."}],["제인 시모어의 초상","Portrait of Jane Seymour","1536–1537","khm","File:Hans Holbein the Younger - Jane Seymour, Queen of England - Google Art Project.jpg",{"tip":"헨리 8세의 세 번째 왕비 제인 시모어를 그린 초상입니다. 진주로 장식된 두건과 금실 옷감, 보석의 질감이 정교하게 표현되어 있습니다."}],["클레베의 앤 초상","Portrait of Anne of Cleves","1539","louvre","File:Portrait Anne of Cleves by Hans Holbein the Younger (Louvre).jpg",{"tip":"헨리 8세의 네 번째 왕비가 될 앤을 정면으로 그린 초상으로, 왕의 신붓감을 보여주기 위해 그려졌습니다. 헨리 8세가 실물을 보고 실망해 결혼이 곧 무효가 된 일로 유명합니다."}],["게오르크 기제의 초상","Portrait of Georg Gisze","1532","berlingg","File:Hans Holbein der Jüngere - Der Kaufmann Georg Gisze - Google Art Project.jpg",{"tip":"런던에서 활동한 독일 상인을 그린 초상으로, 편지와 저울, 꽃병 등 사무실의 물건들이 빼곡히 그려져 있습니다. 탁자에 덮인 동방 양탄자도 섬세하게 묘사되었습니다."}],["다람쥐와 찌르레기와 함께 있는 여인","A Lady with a Squirrel and a Starling","1526–1528경","ngl","Portrait of a Lady with a Squirrel and a Starling",{"tip":"털모자를 쓴 여인이 쇠사슬에 묶인 붉은 다람쥐를 안고 있고 어깨 너머에 찌르레기가 앉아 있습니다. 홀바인의 첫 영국 체류 때 그린 작품입니다."}]]},{"n":"피터르 브뤼헐 (아버지)","o":"Pieter Bruegel the Elder","l":"1525경–1569","d":"농민의 삶과 사계절 풍경을 그린 플랑드르의 거장입니다.","w":[["눈 속의 사냥꾼","The Hunters in the Snow","1565","khm","The Hunters in the Snow",{"tip":"사냥에서 돌아오는 사냥꾼과 개들 너머로 얼어붙은 연못에서 사람들이 놀고 있습니다. 계절의 변화를 그린 연작 가운데 하나입니다."}],["바벨탑","The Tower of Babel","1563","khm","The Tower of Babel (Bruegel)",{"tip":"빈 미술사 박물관에는 브뤼헐 작품이 세계에서 가장 많이 모여 있습니다."}],["농가의 결혼식","The Peasant Wedding","1567경","khm","The Peasant Wedding",{"tip":"초록 천 앞에 종이 왕관을 쓰고 앉은 신부와, 문짝에 음식을 얹어 나르는 사람들을 찾아보세요. 시골 잔치의 소란스러운 분위기가 생생합니다."}],["추수하는 사람들","The Harvesters","1565","met","File:Pieter Bruegel the Elder- The Harvesters - Google Art Project.jpg",{"tip":"한여름 밀밭에서 일하고 쉬며 점심을 먹는 농민들을 그렸습니다. 계절 연작 가운데 하나로, 같은 연작의 다른 작품들은 주로 빈 미술사 박물관에 있습니다."}],["네덜란드 속담","Netherlandish Proverbs","1559","berlingg","Netherlandish Proverbs",{"tip":"한 마을 안에 100가지가 넘는 네덜란드 속담을 그림으로 풀어 놓았습니다. 인물 하나하나가 어떤 속담인지 맞혀 보는 재미가 있습니다."}],["이카로스의 추락이 있는 풍경","Landscape with the Fall of Icarus","1560년대","brussels","Landscape with the Fall of Icarus",{"tip":"브뤼헐 원작을 모사한 그림이라는 견해가 유력합니다."}],["사육제와 사순절의 싸움","The Fight Between Carnival and Lent","1559","khm","File:Bruegel, Pieter (I) - The Fight Between Carnival and Lent - Kunsthistorisches Museum GG 1016.jpg",{"tip":"술통에 올라탄 뚱뚱한 사육제와 마른 사순절이 마주한 장면으로, 축제와 금식 기간의 대비를 그렸습니다. 광장 곳곳의 놀이와 풍습을 살펴보세요."}],["죽음의 승리","The Triumph of Death","1562경","prado","The Triumph of Death",{"tip":"해골 군대가 황폐한 땅을 휩쓸며 신분에 관계없이 모든 사람을 죽음으로 몰아가는 장면입니다. 왕부터 농부까지 저마다 다른 최후를 맞는 모습을 하나씩 찾아보세요."}],["아이들의 놀이","Children's Games","1560","khm","Children's Games (Bruegel)",{"tip":"마을 광장에서 아이들이 굴렁쇠, 목마, 공기놀이 등 80가지가 넘는 놀이를 하는 모습입니다. 당시 아이들의 놀이를 기록한 백과사전 같은 그림으로 여겨집니다."}],["맹인을 이끄는 맹인","The Parable of the Blind","1568","capodimonte","The Parable of the Blind",{"tip":"여섯 명의 맹인이 줄지어 걷다가 맨 앞사람이 도랑에 빠지자 뒤따르던 이들도 차례로 넘어지려는 순간을 그린, 성경 비유에 바탕한 그림입니다."}],["베들레헴의 인구조사","The Census at Bethlehem","1566","brussels","The Census at Bethlehem",{"tip":"성경 속 인구조사 장면을 눈 덮인 플랑드르 마을로 옮긴 그림입니다. 나귀를 탄 마리아와 요셉이 북적이는 사람들 사이에 눈에 띄지 않게 섞여 있습니다."}]]}]},{"id":"mannerism","name":"매너리즘","en":"Mannerism","years":"1520년 – 1600년","s":1520,"e":1600,"color":"#5c4a6b","sum":"전성기 르네상스의 완벽한 조화 이후, 화가들은 그것을 넘어서기 위해 일부러 비례를 늘이고 공간을 비틀었습니다. '매너(양식)'를 과장했다는 뜻의 이름입니다. 피렌체의 폰토르모와 브론치노, 파르마의 파르미자니노가 이끌었고, 스페인 톨레도의 엘 그레코가 이를 독자적인 영적 표현으로 밀고 나갔습니다.","traits":["길게 늘인 인체와 비틀린 자세","불안정하고 모호한 공간","차갑고 인공적인 색","지적인 알레고리와 수수께끼","메디치 궁정의 차갑고 매끈한 초상 (브론치노)","형광빛 색과 떠다니는 듯한 인물 (폰토르모)"],"diff":"르네상스의 균형과 자연스러움 대신 긴장, 왜곡, 세련된 인공미를 추구합니다.","artists":[{"n":"야코포 폰토르모","o":"Jacopo Pontormo","l":"1494–1557","d":"불안정한 구도와 형광빛 색채로 피렌체 매너리즘을 연 화가입니다.","at":0,"w":[["십자가에서 내려지심","Deposition from the Cross","1525–1528","felicita","Deposition from the Cross (Pontormo)",{"tip":"카포니 예배당에 지금도 걸려 있는 제단화로, 십자가 없이 밝고 옅은 색의 인물들이 공중에 뜬 듯 얽혀 있습니다. 오른쪽 끝의 수염 난 남자는 화가의 자화상으로 알려져 있습니다."}],["방문","The Visitation","1528–1529","carmignano","File:Pontormo-visitation-after-restorationRGB.jpg",{"tip":"마리아와 엘리사벳이 서로 다가서는 장면으로, 뒤편의 두 여인이 정면을 바라봅니다. 강렬하고 밝은 색채가 매너리즘 회화의 특징을 잘 보여 줍니다."}],["미늘창을 든 병사","Portrait of a Halberdier","1528–1530경","getty","File:Jacopo Pontormo - Halberdier - WGA18130.jpg",{"tip":"미늘창을 든 젊은 병사의 반신 초상으로, 다소 긴장한 표정과 우아하게 늘인 몸이 특징입니다. 모델이 누구인지는 확실하지 않습니다."}],["이집트의 요셉","Joseph in Egypt","1515–1518경","ngl","File:Jacopo Pontormo - Joseph in Egypt - WGA18079.jpg",{"tip":"요셉 이야기의 여러 장면을 한 화면에 담은 작품으로, 피렌체 보르게리니 가문의 침실 장식을 위해 그렸습니다. 계단에 앉은 소년은 제자 브론치노로 알려져 있습니다."}],["엠마오의 저녁식사","Supper at Emmaus","1525","uffizi","Supper at Emmaus (Pontormo)",{"tip":"부활한 그리스도가 두 제자와 함께 빵을 떼는 순간을 그린 그림으로, 피렌체 근교 체르토사 수도원을 위해 그렸습니다. 그리스도 머리 위에 삼위일체를 상징하는 눈이 그려져 있습니다."}],["코시모 데 메디치(국부)의 초상","Portrait of Cosimo the Elder","1519–1520경","uffizi","Portrait of Cosimo the Elder",{"tip":"메디치 가문의 기틀을 세운 코시모를 그의 사후에 그린 기념 초상입니다. 옆의 월계수 가지에 감긴 띠의 글귀가 가문의 계속되는 번영을 뜻합니다."}],["알레산드로 데 메디치의 초상","Portrait of Alessandro de' Medici","1534–1535","philly","File:Jacopo Pontormo - Alessandro de' Medici - WGA18108.jpg",{"tip":"피렌체의 첫 공작 알레산드로가 검은 옷을 입고 여인의 옆얼굴을 스케치하는 모습입니다. 그가 1537년 사촌에게 암살되기 몇 해 전에 그려졌습니다."}]]},{"n":"파르미자니노","o":"Parmigianino","l":"1503–1540","d":"우아하게 길어진 인체로 매너리즘을 대표합니다.","w":[["목이 긴 성모","Madonna with the Long Neck","1535–1540","uffizi","Madonna with the Long Neck",{"tip":"길게 늘어난 성모의 목과 손가락, 무릎 위 아기 예수가 매너리즘의 특징을 잘 보여 줍니다. 미완성으로 남아 오른쪽 뒤 기둥은 혼자 서 있습니다."}],["볼록 거울 속의 자화상","Self-portrait in a Convex Mirror","1524경","khm","File:Francesco Mazzola, called Parmigianino - Self-Portrait in a Convex Mirror - Google Art ProjectFXD.jpg",{"tip":"볼록 거울에 비친 자신의 모습을 둥글게 깎은 볼록 나무판에 그렸습니다. 앞쪽의 손이 크게 왜곡된 모습을 눈여겨보세요."}],["안테아","Antea","1535경","capodimonte","File:Antea (Parmigianino).jpg",{"tip":"모피를 두르고 정면을 바라보는 젊은 여인의 초상으로, 모델의 정체는 밝혀지지 않았습니다. 정교한 옷과 장신구 묘사가 돋보입니다."}],["성 히에로니무스의 환영","The Vision of Saint Jerome","1526–1527","ngl","File:Parmigianino - The Madonna and Child with Saints (The Vision of St Jerome).jpg",{"tip":"로마에서 그린 제단화로, 1527년 로마 약탈 때 병사들이 들이닥쳤을 때도 화가는 이 작업에 몰두하고 있었다고 바사리가 전합니다."}],["활을 깎는 큐피드","Cupid Making His Bow","1533–1535","khm","Cupid Making His Bow",{"tip":"등을 돌린 큐피드가 책을 밟고 서서 활을 깎고, 다리 사이로 두 아기 천사가 보이는 그림입니다. 사랑이 지식을 이긴다는 뜻으로 해석됩니다."}],["장미의 성모","Madonna of the Rose","1529–1530","dresden","Madonna of the Rose (Parmigianino)",{"tip":"성모의 무릎에 기댄 아기 예수가 지구본 위에 손을 얹고 장미를 쥔 모습입니다. 길게 늘어진 몸과 매끈한 피부에서 파르미자니노 특유의 우아함이 드러납니다."}],["갈레아초 산비탈레의 초상","Portrait of Galeazzo Sanvitale","1524","capodimonte","Portrait of Galeazzo Sanvitale",{"tip":"폰타넬라토의 영주 갈레아초 산비탈레가 메달을 손에 든 채 관람자를 바라보는 초상입니다. 파르미자니노가 20대 초반에 그렸습니다."}]]},{"n":"아뇰로 브론치노","o":"Agnolo Bronzino","l":"1503–1572","d":"메디치 궁정의 화가. 차갑고 매끈한 초상과 알레고리를 그렸습니다.","w":[["비너스와 큐피드의 알레고리","Venus, Cupid, Folly and Time","1545경","ngl","Venus, Cupid, Folly and Time",{"tip":"비너스와 큐피드를 둘러싼 의인화된 인물들이 등장하는 수수께끼 같은 알레고리입니다. 메디치 가문의 코시모 1세가 프랑스 왕 프랑수아 1세에게 선물한 것으로 알려져 있습니다."}],["엘레오노라 디 톨레도와 아들","Portrait of Eleanor of Toledo","1545경","uffizi","Portrait of Eleanor of Toledo",{"tip":"코시모 1세의 부인이 어린 아들과 함께 앉은 공식 초상입니다. 석류 무늬가 새겨진 화려한 비단 드레스의 묘사가 압권입니다."}],["젊은 남자의 초상","Portrait of a Young Man","1530년대","met","File:Portrait of a Young Man MET Bronzino overall.jpg",{"tip":"책을 든 젊은 남자의 초상으로, 차갑고 귀족적인 표정이 브론치노 초상화의 특징을 보여 줍니다. 탁자와 의자에 새겨진 기괴한 얼굴 장식도 찾아보세요."}],["루크레치아 판차티키의 초상","Portrait of Lucrezia Panciatichi","1545경","uffizi","File:Portrait painting of Lucrezia Panciatichi by Bronzino 1540 c. in the Uffizi Gallery.jpg",{"tip":"책을 펼쳐 든 귀부인의 초상으로, 목걸이에는 '사랑은 끝없이 지속된다'는 뜻의 프랑스어가 새겨져 있습니다. 매끄러운 피부와 옷감의 질감이 돋보입니다."}],["비아 데 메디치의 초상","Portrait of Bia de' Medici","1542경","uffizi","Portrait of Bia de' Medici",{"tip":"코시모 1세의 어린 딸 비아를 그린 초상으로, 비아는 1542년 다섯 살 무렵 세상을 떠났습니다. 목에 건 메달에 아버지의 옆얼굴이 새겨져 있습니다."}],["바르톨로메오 판차티키의 초상","Portrait of Bartolomeo Panciatichi","1540경","uffizi","Portrait of Bartolomeo Panciatichi",{"tip":"피렌체의 인문학자이자 정치가 바르톨로메오를 그린 초상으로, 아내 루크레치아의 초상과 짝을 이룹니다. 배경 건물 모서리에 판차티키 가문의 문장이 보입니다."}],["우골리노 마르텔리의 초상","Portrait of Ugolino Martelli","1536–1537경","berlingg","Portrait of Ugolino Martelli",{"tip":"젊은 인문학자 우골리노 마르텔리가 호메로스의 책에 손을 얹은 모습입니다. 뒤편으로 저택 안뜰과 다비드 조각상이 보입니다."}]]},{"n":"틴토레토","o":"Tintoretto","l":"1518경–1594","d":"베네치아의 극적인 화가. 대담한 원근과 빛으로 장면에 속도와 긴장을 불어넣었습니다.","w":[["노예를 구하는 성 마르코","Miracle of the Slave","1548","accademia","Miracle of the Slave (Tintoretto)",{"tip":"하늘에서 거꾸로 내려온 성 마르코가 고문당하는 노예를 구합니다. 이 그림으로 틴토레토는 베네치아에서 이름을 알렸습니다."}],["수산나와 장로들","Susanna and the Elders","1555–1556경","khm","Susanna and the Elders (Tintoretto)",{"tip":"목욕하는 수산나를 두 장로가 울타리 뒤에서 엿보고 있습니다. 밝게 빛나는 몸과 거울, 정원의 정물이 대비를 이룹니다."}],["은하수의 기원","The Origin of the Milky Way","1575경","ngl","The Origin of the Milky Way",{"tip":"유피테르가 아기 헤라클레스를 잠든 유노의 가슴에 대자, 흩어진 젖이 별이 되었다는 신화를 그렸습니다."}],["세족식","The Washing of the Feet","1548–1549","prado","The Washing of the Feet",{"tip":"그리스도가 제자들의 발을 씻기는 장면을 길게 뻗은 원근 속에 펼쳤습니다. 원래 베네치아 산 마르쿠올라 성당에 걸려 있던 그림입니다."}]]},{"n":"엘 그레코","o":"El Greco","l":"1541–1614","d":"그리스 크레타 출신으로 스페인 톨레도에서 활동. 불꽃처럼 솟구치는 인체를 그렸습니다.","w":[["오르가스 백작의 매장","The Burial of the Count of Orgaz","1586–1588","santotome","The Burial of the Count of Orgaz",{"tip":"그림 아래쪽은 성인들이 백작의 시신을 묻는 지상 장면, 위쪽은 영혼이 하늘로 올라가는 천상 장면입니다. 처음 그려진 성당에 지금도 걸려 있습니다."}],["톨레도 풍경","View of Toledo","1599–1600경","met","View of Toledo",{"tip":"폭풍이 몰려오는 하늘 아래 톨레도를 그린 작품으로, 엘 그레코의 드문 풍경화입니다. 실제 건물 배치를 그대로 따르지 않고 극적으로 재구성했습니다."}],["그리스도의 옷을 벗김","El Expolio","1577–1579","toledocat","File:El Expolio, por El Greco.jpg",{"tip":"붉은 옷을 입은 그리스도가 군중에 둘러싸여 옷이 벗겨지려는 순간을 그렸습니다. 대성당 성구실에 걸려 있으며, 강렬한 붉은색이 화면을 압도합니다."}],["다섯 번째 봉인의 개봉","The Opening of the Fifth Seal","1608–1614","met","The Opening of the Fifth Seal",{"tip":"요한계시록에서 순교자들이 흰옷을 받는 장면으로, 길게 늘어난 인물이 하늘을 향해 팔을 뻗습니다. 미완성 작품으로, 피카소의 「아비뇽의 여인들」에 영향을 주었습니다."}],["가슴에 손을 얹은 기사","The Nobleman with his Hand on his Chest","1580경","prado","The Nobleman with his Hand on his Chest",{"tip":"검은 옷의 신사가 가슴에 손을 얹은 초상으로, 모델은 밝혀지지 않았습니다. 손짓은 맹세나 충성을 뜻하는 것으로 해석되며, 칼자루도 함께 보입니다."}],["추기경 니뇨 데 게바라","Cardinal Fernando Niño de Guevara","1600경","met","File:Cardinal Fernando Niño de Guevara (1541–1609) MET DT854.jpg",{"tip":"종교재판소장이던 추기경의 날카로운 눈빛을 그린 초상입니다."}],["라오콘","Laocoön","1610–1614경","nga","File:El Greco (Domenikos Theotokopoulos) - Laocoön - Google Art Project.jpg",{"tip":"엘 그레코가 그린 유일한 신화화로, 배경에 톨레도 풍경이 보입니다."}],["목자들의 경배","The Adoration of the Shepherds","1612–1614","prado","File:La adoración de los pastores (El Greco).jpg",{"tip":"엘 그레코가 자신의 무덤 예배당을 위해 그린 말년작입니다."}],["성 삼위일체","The Holy Trinity","1577–1579","prado","Holy Trinity (El Greco)",{"tip":"하느님 아버지가 천사들에 둘러싸여 죽은 그리스도를 안고 있으며, 위에 성령의 비둘기가 떠 있습니다. 엘 그레코가 스페인에서 받은 첫 대형 주문 가운데 하나입니다."}],["성 마르티노와 걸인","Saint Martin and the Beggar","1597–1599","nga","Saint Martin and the Beggar (El Greco)",{"tip":"로마 군인 마르티노가 자신의 망토를 칼로 잘라 헐벗은 걸인에게 나눠주는 장면입니다. 원래 톨레도의 한 예배당을 위해 그려졌습니다."}],["오르텐시오 펠릭스 파라비시노 수사의 초상","Fray Hortensio Félix Paravicino","1609","mfa","Portrait of Fray Hortensio Félix Paravacino",{"tip":"엘 그레코의 친구였던 시인이자 설교가 파라비시노 수사를 그린 초상입니다. 흑백 수도복과 빠른 붓질로 표현된 지적인 얼굴이 인상적입니다."}]]}],"note":"엘 그레코는 매너리즘에서 출발해 어느 유파에도 묶이지 않는 독자적 양식에 이르렀습니다. 길게 늘인 인체와 격렬한 색은 300년 뒤 표현주의 화가들에게 재발견되었습니다."},{"id":"baroque","name":"바로크","en":"Baroque","years":"1600년 – 1720년","s":1600,"e":1720,"color":"#7a2e2a","sum":"가톨릭의 반종교개혁과 절대왕정이 신앙과 권력을 극적으로 보여 줄 미술을 원하던 시대입니다. 강렬한 명암과 움직임으로 보는 이를 압도합니다. 한편 신교국 네덜란드에서는 시민들이 사는 초상화·풍속화·정물화가 크게 발달했습니다.","traits":["테네브리즘: 어둠 속에 한 줄기 빛을 비추는 극단적 명암 (카라바조)","가장 극적인 순간을 포착","대각선 구도와 역동적 움직임","네덜란드 황금시대: 일상 실내, 빛, 시민 초상","플랑드르 바로크: 풍만한 인체와 역동적 대작 (루벤스), 우아한 귀족 초상 (반 다이크)","빠르고 생생한 붓질의 초상 (프란스 할스)","고전주의 바로크: 질서와 절제를 지킨 신화·역사화 (푸생)"],"diff":"매너리즘의 인위적 긴장 대신, 현실적인 인물을 극적인 빛과 움직임으로 감정에 직접 호소합니다.","artists":[{"n":"카라바조","o":"Caravaggio","l":"1571–1610","d":"거리의 평범한 사람을 성인의 모델로 삼고, 강렬한 명암으로 바로크를 열었습니다.","w":[["성 마태오의 소명","The Calling of Saint Matthew","1599–1600","sanluigi","The Calling of Saint Matthew",{"tip":"성당 안 콘타렐리 예배당에 있으며 입장은 무료입니다."}],["엠마오의 저녁 식사","Supper at Emmaus","1601","ngl","Supper at Emmaus (Caravaggio, London)",{"tip":"부활한 예수를 알아보는 순간 제자들이 놀라는 장면입니다. 수염 없는 젊은 예수의 모습과 탁자 끝에 아슬아슬하게 걸친 과일 바구니를 눈여겨보세요."}],["성 마태오의 순교","The Martyrdom of Saint Matthew","1599–1600","sanluigi","File:The Martyrdom of Saint Matthew-Caravaggio (c. 1599-1600).jpg",{"tip":"성당 콘타렐리 예배당에 마태오의 다른 이야기를 그린 두 작품과 함께 걸려 있습니다. 배경 왼쪽에서 장면을 돌아보는 남자는 카라바조의 자화상으로 알려져 있습니다."}],["성 베드로의 십자가형","Crucifixion of Saint Peter","1601","popolo","Crucifixion of Saint Peter (Caravaggio)",{"tip":"세 명의 사형집행인이 거꾸로 매단 베드로의 십자가를 힘겹게 세우는 장면입니다. 같은 예배당 맞은편에는 「성 바울로의 회심」이 걸려 있습니다."}],["의심하는 도마","The Incredulity of Saint Thomas","1601–1602","sanssouci","The Incredulity of Saint Thomas (Caravaggio)",{"tip":"의심하는 도마가 부활한 예수의 옆구리 상처에 손가락을 직접 넣어 보는 장면입니다. 가까이 모인 네 사람의 이마에 빛이 모이는 구성이 인상적입니다."}],["바쿠스","Bacchus","1596경","uffizi","Bacchus (Caravaggio)",{"tip":"포도 잎 관을 쓰고 포도주 잔을 내미는 젊은 바쿠스를 그렸습니다. 앞쪽의 과일 바구니에는 상한 과일도 함께 그려져 있습니다."}],["메두사","Medusa","1597경","uffizi","Medusa (Caravaggio)",{"tip":"볼록한 방패 위에 그린 메두사의 머리로, 잘린 순간의 비명과 피가 생생합니다. 둥근 면 덕분에 머리가 앞으로 튀어나와 보입니다."}],["도마뱀에게 물린 소년","Boy Bitten by a Lizard","1594–1596경","ngl","File:Boy Bitten by a Lizard-Caravaggio (National Gallery London).jpg",{"tip":"꽃 속에 숨은 도마뱀에게 손가락을 물린 순간의 놀람을 포착한 초기작입니다. 거의 같은 구도의 다른 버전이 피렌체 로베르토 롱기 재단에 있습니다."}],["그리스도의 매장","The Entombment of Christ","1603–1604","vatican","File:Caravaggio - Entombment of Christ.jpg",{"tip":"바티칸 회화관의 대표작으로, 나폴레옹이 파리로 가져갔다가 돌려받았습니다."}],["점쟁이","The Fortune Teller","1595경","louvre","File:The Fortune Teller-Caravaggio (Louvre).jpg",{"tip":"손금을 봐 주는 척하며 젊은 남자의 반지를 슬쩍 빼내는 집시 여인을 그렸습니다. 비슷한 구도의 다른 버전이 로마 카피톨리니 미술관에 있습니다."}],["성모의 죽음","Death of the Virgin","1606","louvre","File:Death of the Virgin-Caravaggio (1606).jpg",{"tip":"성모를 너무 평범한 여인처럼 그렸다는 이유로 주문한 성당에서 거절당했고, 루벤스의 추천으로 만토바 공작이 사들였습니다."}],["성 바울의 회심","Conversion on the Way to Damascus","1601","popolo","Conversion on the Way to Damascus",{"tip":"말에서 떨어진 사울이 눈부신 빛 속에 두 팔을 벌리고 누워 있는 장면입니다. 같은 체라시 예배당의 '성 베드로의 십자가 처형'과 마주 보고 걸려 있습니다."}],["이집트로 피신 중의 휴식","Rest on the Flight into Egypt","1597경","doria","Rest on the Flight into Egypt (Caravaggio)",{"tip":"잠든 성모자 곁에서 천사가 바이올린을 연주하고, 요셉이 악보를 들어 주고 있습니다. 카라바조의 초기작 가운데 드물게 풍경이 담긴 작품입니다."}],["골리앗의 머리를 든 다비드","David with the Head of Goliath","1610경","borghese","File:David with the Head of Goliath-Caravaggio (1610).jpg",{"tip":"소년 다비드가 잘린 골리앗의 머리를 들고 있는 그림으로, 골리앗의 얼굴은 카라바조 자신의 자화상으로 여겨집니다. 살인죄로 사면을 구하던 말년에 그렸습니다."}],["성 마태오의 영감","The Inspiration of Saint Matthew","1602","sanluigi","The Inspiration of Saint Matthew",{"tip":"복음서를 쓰던 마태오가 위에서 내려온 천사의 말을 듣는 장면으로, 콘타렐리 예배당 제단 위에 걸려 있습니다. 첫 번째 버전이 거절되어 다시 그린 작품입니다."}]]},{"n":"아르테미시아 젠틸레스키","o":"Artemisia Gentileschi","l":"1593–1656경","d":"카라바조의 화풍을 이은 바로크 시대의 대표적 여성 화가입니다.","w":[["홀로페르네스의 목을 베는 유디트","Judith Slaying Holofernes","1620경","uffizi","Judith Slaying Holofernes (Artemisia Gentileschi, Florence)",{"tip":"유디트와 하녀가 힘을 합쳐 적장의 목을 베는 장면으로, 솟구치는 피까지 사실적으로 그렸습니다. 같은 주제의 다른 버전이 나폴리 카포디몬테 미술관에 있습니다."}],["회화의 알레고리로서의 자화상","Self-Portrait as the Allegory of Painting","1638–1639","royal","Self-Portrait as the Allegory of Painting",{"tip":"화가 자신을 회화의 의인상으로 그린 작품으로, 가면 모양 펜던트가 달린 금목걸이를 하고 붓을 든 채 몸을 기울이고 있습니다."}],["수산나와 장로들","Susanna and the Elders","1610","pommersfelden","File:Susanna and the Elders (1610), Artemisia GentileschiFXD.jpg",{"tip":"열일곱 살 무렵에 그린, 서명이 남은 가장 이른 작품입니다."}],["류트 연주자로서의 자화상","Self-Portrait as a Lute Player","1615–1618경","wadsworth","File:Artemisia Gentileschi - Self-Portrait as a Lute Player.JPG",{"tip":"류트를 연주하는 모습으로 자신을 그린 자화상입니다. 터번과 화려한 옷차림, 악기를 쥔 손의 묘사를 눈여겨보세요."}],["유디트와 하녀","Judith and Her Maidservant","1613–1614경","pitti","Judith and Her Maidservant (Artemisia Gentileschi, Florence)",{"tip":"홀로페르네스를 죽인 직후 유디트와 하녀가 소리 나는 쪽을 돌아보는 긴장된 순간입니다. 하녀가 든 바구니 속에 잘린 머리가 담겨 있습니다."}],["알렉산드리아의 성 카타리나로 분한 자화상","Self-Portrait as Saint Catherine of Alexandria","1615–1617경","ngl","Self-Portrait as Saint Catherine of Alexandria",{"tip":"아르테미시아가 부서진 바퀴에 손을 얹은 순교 성녀 카타리나의 모습으로 자신을 그렸습니다. 2018년 내셔널 갤러리가 구입했습니다."}],["아하스에로스 왕 앞의 에스더","Esther before Ahasuerus","1628–1630경","met","Esther before Ahasuerus (Artemisia Gentileschi)",{"tip":"유대 민족을 구하려 왕 앞에 나선 에스더가 기절하는 순간을 그린 그림입니다. 화려한 옷차림의 젊은 왕이 놀라 몸을 일으키고 있습니다."}]]},{"n":"페테르 파울 루벤스","o":"Peter Paul Rubens","l":"1577–1640","d":"플랑드르 바로크의 거장. 풍만한 인체와 역동적인 대작으로 유명합니다.","w":[["십자가에서 내려지심","The Descent from the Cross","1612–1614","antwerp","File:Peter Paul Rubens - The Descent from the Cross (1612–1614, Antwerp Cathedral).jpg",{"tip":"대성당을 위해 그린 세폭 제단화의 중앙 패널로, 흰 수의에 싸인 그리스도의 시신을 사람들이 조심스럽게 내립니다. 대각선 구도와 흰 천의 대비가 인상적입니다."}],["십자가에 세워지심","The Elevation of the Cross","1610–1611","antwerp","The Elevation of the Cross",{"tip":"근육질 남자들이 온 힘을 다해 십자가를 일으켜 세우는 장면을 그린 세폭 제단화입니다. 이탈리아에서 돌아온 직후의 작품으로, 역동적인 대각선 구도가 돋보입니다."}],["레우키포스 딸들의 납치","The Rape of the Daughters of Leucippus","1618경","alte","The Rape of the Daughters of Leucippus",{"tip":"쌍둥이 형제 카스토르와 폴룩스가 레우키포스의 두 딸을 말에 태워 납치하는 신화 장면입니다. 사람과 말이 뒤엉킨 소용돌이 같은 구도가 특징입니다."}],["삼미신","The Three Graces","1630–1635","prado","File:The Three Graces, by Peter Paul Rubens, from Prado in Google Earth.jpg",{"tip":"서로 어깨를 감싼 세 여신을 풍만한 몸으로 그렸습니다. 루벤스가 세상을 떠날 때까지 직접 간직했던 작품입니다."}],["마리 드 메디시스 연작","Marie de' Medici Cycle","1622–1625","louvre","Marie de' Medici cycle",{"tip":"대작 24점이 루브르 '메디시스 전시실' 한 방을 가득 채웁니다."}],["밀짚모자","Le Chapeau de Paille","1622–1625경","ngl","File:Le Chapeau de Paille by Peter Paul Rubens.jpg",{"tip":"모델은 훗날 루벤스의 처제가 된 수잔나 룬던으로 알려져 있습니다. 실제 모자는 밀짚이 아니라 펠트입니다."}],["사랑의 정원","The Garden of Love","1633경","prado","File:Peter Paul Rubens - Garden of Love - WGA20421.jpg",{"tip":"정원에 모여 사랑을 나누는 남녀와 그 위를 나는 아기 천사들을 그린 작품입니다. 화려한 옷차림과 건축물에서 당시 귀족 사교 문화를 엿볼 수 있습니다."}],["모피 (엘렌 푸르망)","Het Pelsken (Helena Fourment)","1636–1638경","khm","File:Peter Paul Rubens, Kunsthistorisches Museum Wien, Gemäldegalerie - Helena Fourment (\"Das Pelzchen\") - GG 688 - Kunsthistorisches Museum.jpg",{"tip":"모피 한 장만 두른 젊은 두 번째 아내 엘렌 푸르망을 그렸습니다. 루벤스가 죽을 때까지 곁에 둔 그림입니다."}],["삼손과 델릴라","Samson and Delilah","1609–1610경","ngl","Samson and Delilah (Rubens)",{"tip":"델릴라의 무릎에 잠든 삼손의 머리카락을 하인이 자르고, 문밖에는 블레셋 병사들이 기다리고 있습니다. 안트베르펜 시장 니콜라스 로콕스의 저택을 위해 그렸습니다."}],["인동덩굴 그늘의 루벤스와 이사벨라 브란트","The Honeysuckle Bower","1609경","alte","Honeysuckle Bower",{"tip":"루벤스가 첫 아내 이사벨라 브란트와 결혼한 무렵 두 사람이 인동덩굴 아래 나란히 앉은 모습을 그린 자화상입니다. 포개어진 두 손이 부부의 결속을 보여줍니다."}],["전쟁의 결과","The Consequences of War","1637–1638","pitti","Consequences of War",{"tip":"전쟁의 신 마르스가 비너스의 만류를 뿌리치고 나서며 예술과 가족을 짓밟는 우의화입니다. 루벤스가 30년 전쟁으로 고통받던 유럽을 염두에 두고 그렸습니다."}]]},{"n":"안토니 반 다이크","o":"Anthony van Dyck","l":"1599–1641","d":"루벤스의 제자. 영국 찰스 1세의 궁정화가로 귀족 초상화의 전형을 만들었습니다.","w":[["사냥 중인 찰스 1세","Charles I at the Hunt","1635경","louvre","Charles I at the Hunt",{"tip":"말에서 내려 쉬고 있는 왕을 낮은 시점에서 그려, 실제로 키가 작았던 왕을 당당하게 보이게 했습니다. 격식을 덜어낸 자연스러운 왕의 초상입니다."}],["찰스 1세 3면 초상","Charles I in Three Positions","1635–1636","royal","Charles I in Three Positions",{"tip":"왕의 얼굴을 정면과 좌우 측면에서 한 화면에 그린 초상으로, 로마의 조각가 베르니니가 흉상을 제작할 수 있도록 보내졌습니다."}],["말을 탄 찰스 1세","Equestrian Portrait of Charles I","1637–1638경","ngl","Equestrian Portrait of Charles I",{"tip":"갑옷을 입고 말을 탄 왕을 거대한 화면에 그린 초상입니다. 넓은 풍경을 배경으로 높이 앉은 모습이 왕의 권위를 강조합니다."}],["엘레나 그리말디 후작 부인","Marchesa Elena Grimaldi Cattaneo","1623","nga","File:Sir Anthony van Dyck, Marchesa Elena Grimaldi Cattaneo, 1623, NGA 1231.jpg",{"tip":"제노바 귀족 부인이 테라스를 걷는 모습을 그린 전신 초상입니다. 하인이 받쳐 든 붉은 양산이 검은 옷과 강한 대비를 이룹니다."}],["존 스튜어트 경과 버나드 스튜어트 경","Lord John Stuart and His Brother, Lord Bernard Stuart","1638경","ngl","Lord John Stuart and His Brother, Lord Bernard Stuart",{"tip":"유럽 여행을 떠나기 전의 두 귀족 형제를 그린 초상으로, 화려한 비단 옷과 거만한 자세가 영국 귀족의 우아함을 보여줍니다. 두 사람 모두 훗날 내전에서 전사했습니다."}],["찰스 1세의 다섯 자녀","The Five Eldest Children of Charles I","1637","royal","File:Anthony van Dyck (1599-1641) - The Five Eldest Children of Charles I - 267 - Royal Collection.jpg",{"tip":"훗날 찰스 2세가 될 맏아들을 중심으로 왕의 다섯 자녀가 커다란 개와 함께 서 있는 단체 초상입니다. 찰스 1세가 직접 주문한 작품입니다."}],["자화상","Self-Portrait","1620–1621경","met","Self-portrait (van Dyck, New York)",{"tip":"스무 살 무렵의 반 다이크가 자신감 있는 표정으로 자신을 그린 초상입니다. 루벤스의 조수로 일하던 시기에 그렸습니다."}]]},{"n":"프란스 할스","o":"Frans Hals","l":"1582경–1666","d":"빠르고 생생한 붓질로 웃는 얼굴을 포착한 네덜란드 초상화가입니다.","at":4,"w":[["웃는 기사","The Laughing Cavalier","1624","wallace","The Laughing Cavalier",{"tip":"제목과 달리 웃고 있다기보다는 자신만만하게 미소 짓는 표정입니다. 제목은 19세기에 붙은 것이며, 소매의 화려한 자수를 가까이에서 보세요."}],["말레 바베","Malle Babbe","1633–1635경","berlingg","Malle Babbe",{"tip":"'미친 바베'라는 별명으로 불린 하를럼의 여인을 그린 것으로, 어깨 위의 부엉이와 커다란 맥주잔이 눈길을 끕니다."}],["집시 소녀","The Gypsy Girl","1628–1630경","louvre","File:Frans Hals - Gypsy Girl - WGA11100.jpg",{"tip":"환하게 웃으며 곁눈질하는 젊은 여인을 그렸습니다. 빠르고 대담한 붓 자국이 지워지지 않고 그대로 드러나 있습니다."}],["웃는 소년","Laughing Boy","1625경","mauritshuis","File:Frans Hals - Laughing Boy - 1032 - Mauritshuis.jpg",{"tip":"둥근 화면에 활짝 웃는 소년의 얼굴을 담았습니다. 순간의 표정을 재빠른 붓질로 포착하는 화가의 장기가 잘 드러납니다."}],["이사크 마사와 베아트릭스 판 데르 란의 결혼 초상","Marriage Portrait of Isaac Massa and Beatrix van der Laen","1622경","rijks","File:Frans Hals - Portret van een stel in een landschap - Google Art Project.jpg",{"tip":"딱딱한 격식 대신 미소 짓는 부부를 그린, 당시로서는 파격적인 결혼 초상입니다."}],["즐거운 술꾼","The Merry Drinker","1628–1630","rijks","File:Frans Hals - The Merry Drinker - WGA11095.jpg",{"tip":"술잔을 든 남자가 손을 들어 보는 이에게 말을 거는 듯한 순간을 포착했습니다. 가까이서 보면 거칠고 빠른 붓질이 그대로 보입니다."}],["주막의 젊은 남녀","Young Man and Woman in an Inn","1623","met","File:Young Man and Woman in an Inn (\"Yonker Ramp and His Sweetheart\") MET DP145899.jpg",{"tip":"술잔을 높이 든 젊은이와 그의 어깨에 팔을 두른 여인을 그린 풍속화로, '용커 람프와 그의 연인'이라는 제목으로도 알려져 있습니다."}],["성 게오르기우스 민병대 장교들의 연회(1616)","The Banquet of the Officers of the St George Militia Company in 1616","1616","franshals","The Banquet of the Officers of the St George Militia Company in 1616",{"tip":"하를럼 민병대 장교들이 연회 식탁에 둘러앉은 단체 초상으로, 할스의 첫 대형 단체화입니다. 각 인물의 시선과 몸짓을 달리해 생동감 있는 장면을 만들었습니다."}],["양로원의 여성 이사들","Regentesses of the Old Men's Almshouse","1664","franshals","Regentesses of the Old Men's Almshouse",{"tip":"하를럼 양로원을 운영한 네 여성 이사와 하녀를 그린 단체 초상으로, 80대의 할스가 그린 말년의 걸작입니다. 검은 옷과 흰 깃을 거침없는 붓질로 표현했습니다."}],["칼을 든 빌럼 판 헤이트하위선","Willem van Heythuysen Posing with a Sword","1625경","alte","Willem van Heythuysen Posing with a Sword",{"tip":"부유한 하를럼 직물상이 칼을 짚고 당당하게 선 전신 초상입니다. 할스가 그린 유일한 실물 크기 전신 초상으로 알려져 있습니다."}],["카타리나 호프트와 유모","Catharina Hooft and Her Nurse","1619–1620경","berlingg","File:Frans Hals - Catharina Hooft with her Nurse - WGA11059.jpg",{"tip":"레이스 옷을 차려입은 부잣집 아기를 유모가 안고 사과를 내미는 모습입니다. 아기와 유모 사이의 다정한 순간을 생생한 붓질로 포착했습니다."}]]},{"n":"헨드릭 아베르캄프","o":"Hendrick Avercamp","l":"1585–1634","d":"얼어붙은 네덜란드의 겨울 풍경을 그린 화가. 말을 하지 못해 '캄펜의 벙어리'라 불렸습니다.","w":[["스케이트 타는 사람들이 있는 겨울 풍경","Winter Landscape with Ice Skaters","1608경","rijks","File:Avercamp, Hendrick - Winterlandschap met schaatsers - SK-A-1718.jpg",{"tip":"꽁꽁 언 강 위에서 스케이트를 타고 썰매를 끄는 수많은 사람들을 높은 시점에서 내려다보았습니다. 아베르캄프의 대표작으로, 작은 인물 하나하나를 찾아보는 재미가 있습니다."}],["마을에서의 스케이트","Ice-skating in a Village","1610경","rijks","File:Schaatsenrijden in een dorp Rijksmuseum SK-A-1320.jpeg",{"tip":"얼어붙은 마을 수로에서 스케이트와 겨울 놀이를 즐기는 사람들을 그렸습니다. 부유한 시민부터 농민까지 다양한 인물이 한 화면에 어우러져 있습니다."}],["도시 근처의 얼음 위 풍경","A Scene on the Ice near a Town","1615경","ngl","File:Hendrick Avercamp - A Scene on the Ice near a Town - WGA1075.jpg",{"tip":"도시 성벽 가까이 얼어붙은 물 위에서 사람들이 스케이트와 썰매를 즐기는 모습입니다. 옅은 겨울 하늘과 차가운 공기가 화면 전체에 감돕니다."}],["성 근처에서 스케이트 타는 사람들이 있는 겨울 풍경","A Winter Scene with Skaters near a Castle","1608–1609경","ngl","File:Hendrick Averkamp A Winter Scene with Skaters near a Castle.jpg",{"tip":"둥근 패널에 그린 작품으로, 성과 나무가 있는 얼음판 위에서 사람들이 겨울 놀이를 즐깁니다. 원형 화면이 마치 볼록 렌즈로 들여다보는 듯한 느낌을 줍니다."}]]},{"n":"렘브란트 판 레인","o":"Rembrandt van Rijn","l":"1606–1669","d":"빛과 어둠으로 인간 내면을 그린 네덜란드 황금시대 최고의 화가입니다.","w":[["야경 (프란스 바닝 코크 대장의 민병대)","The Night Watch","1642","rijks","The Night Watch",{"tip":"대규모 복원 작업 중이지만 유리 부스 너머로 관람할 수 있습니다."}],["돌아온 탕자","The Return of the Prodigal Son","1668경","hermitage","The Return of the Prodigal Son (Rembrandt)",{"tip":"무릎 꿇은 아들의 등을 감싸는 아버지의 두 손이 화면의 중심입니다. 오른쪽에 서서 지켜보는 인물은 흔히 큰아들로 해석됩니다."}],["튈프 박사의 해부학 강의","The Anatomy Lesson of Dr. Nicolaes Tulp","1632","mauritshuis","The Anatomy Lesson of Dr. Nicolaes Tulp",{"tip":"암스테르담 외과의사 조합의 의뢰로 그린 집단 초상화로, 튈프 박사가 시신의 팔 근육을 해부해 보이고 있습니다."}],["유대인 신부","The Jewish Bride","1665–1669경","rijks","The Jewish Bride",{"tip":"서로를 다정하게 감싼 남녀를 그렸으며, 남자의 소매는 물감을 두껍게 쌓아 올려 표현했습니다. 고흐는 이 그림 앞에 2주만 앉아 있을 수 있다면 수명 10년을 내놓겠다고 말했습니다."}],["직물 길드의 이사들","Syndics of the Drapers' Guild","1662","rijks","Syndics of the Drapers' Guild",{"tip":"옷감 품질을 검사하던 길드 관리들을 그린 집단 초상화로, 모두가 방금 들어온 누군가를 바라보는 듯한 순간처럼 연출되어 있습니다."}],["두 개의 원이 있는 자화상","Self-Portrait with Two Circles","1665–1669경","kenwood","Self-Portrait with Two Circles",{"tip":"팔레트와 붓을 든 노년의 화가 모습으로, 뒤편 벽에 그려진 두 개의 커다란 원이 무엇을 뜻하는지는 지금도 해석이 갈립니다."}],["63세의 자화상","Self Portrait at the Age of 63","1669","ngl","File:Rembrandt, Self Portrait at the Age of 63.jpg",{"tip":"세상을 떠난 해에 그린 마지막 자화상 가운데 하나로, 깍지 낀 두 손과 주름진 얼굴이 담담하게 그려져 있습니다."}],["사도 바울로 분장한 자화상","Self-Portrait as the Apostle Paul","1661","rijks","File:Rembrandt - Self-Portrait as the Apostle Paul - WGA19222.jpg",{"tip":"원고를 펼쳐 든 사도 바울로 분장한 자화상입니다. 바울의 상징물인 칼의 손잡이가 가슴께 옷 사이로 살짝 드러나 있습니다."}],["호메로스 흉상을 바라보는 아리스토텔레스","Aristotle with a Bust of Homer","1653","met","Aristotle with a Bust of Homer",{"tip":"철학자 아리스토텔레스가 호메로스의 흉상에 손을 얹고 생각에 잠긴 모습입니다. 시칠리아의 귀족 안토니오 루포가 주문했으며, 1961년 메트로폴리탄이 당시 최고가로 구입했습니다."}],["목욕하는 밧세바","Bathsheba at Her Bath","1654","louvre","Bathsheba at Her Bath (Rembrandt)",{"tip":"다윗 왕의 편지를 손에 든 밧세바가 깊은 생각에 잠긴 모습을 실물 크기로 그렸습니다. 렘브란트의 동반자 헨드리케 스토펠스가 모델이었다고 흔히 여겨집니다."}],["벨사살 왕의 연회","Belshazzar's Feast","1635–1638경","ngl","Belshazzar's Feast (Rembrandt)",{"tip":"연회 중 벽에 나타난 손이 히브리 글자를 쓰자 바빌론 왕 벨사살이 놀라 돌아보는 장면입니다. 극적인 빛과 쏟아지는 술잔이 순간의 충격을 전합니다."}]]},{"n":"디에고 벨라스케스","o":"Diego Velázquez","l":"1599–1660","d":"스페인 펠리페 4세의 궁정화가. 마네가 '화가 중의 화가'라 불렀습니다.","w":[["시녀들 (라스 메니나스)","Las Meninas","1656","prado","Las Meninas",{"tip":"어린 마르가리타 공주와 시녀들, 그리고 붓을 든 화가 자신이 등장합니다. 뒤쪽 거울에 비친 국왕 부부의 모습을 찾아보세요."}],["교황 인노켄티우스 10세","Portrait of Innocent X","1650경","doria","Portrait of Innocent X",{"tip":"붉은 옷을 입은 교황의 날카로운 눈빛이 인상적인 초상입니다. 20세기 화가 프랜시스 베이컨이 이 그림을 바탕으로 '절규하는 교황' 연작을 그렸습니다."}],["브레다의 항복","The Surrender of Breda","1634–1635","prado","The Surrender of Breda",{"tip":"네덜란드 측 지휘관이 스페인 장군 스피놀라에게 도시의 열쇠를 건네는 장면입니다. 오른쪽에 빽빽이 선 창들 때문에 '창'이라는 별칭으로도 불립니다."}],["실 잣는 여인들","Las Hilanderas","1655–1660경","prado","Las Hilanderas",{"tip":"앞쪽에는 실을 잣는 여인들이, 뒤쪽 밝은 공간에는 아테나와 아라크네의 신화 장면이 펼쳐지는 이중 구성의 작품입니다."}],["거울을 보는 비너스","Rokeby Venus","1647–1651","ngl","Rokeby Venus",{"tip":"큐피드가 든 거울을 들여다보는 비너스의 뒷모습을 그렸습니다. 1914년 여성 참정권 운동가가 칼로 그어 훼손한 일로도 유명합니다."}],["후안 데 파레하의 초상","Portrait of Juan de Pareja","1650","met","Portrait of Juan de Pareja",{"tip":"화가의 조수였던 후안 데 파레하를 로마에서 그린 초상으로, 판테온에 전시되어 큰 찬사를 받았습니다. 파레하는 이후 노예 신분에서 해방되어 화가로 활동했습니다."}],["달걀을 부치는 노파","Old Woman Frying Eggs","1618","edinburgh","File:Diego Velázquez - Old Woman Frying Eggs - WGA24357.jpg",{"tip":"열아홉 살 무렵 세비야에서 그린 부엌 그림(보데곤)으로, 이미 놀라운 사실 묘사를 보여 줍니다."}],["바쿠스의 승리(술꾼들)","The Triumph of Bacchus","1628–1629","prado","The Triumph of Bacchus",{"tip":"포도 덩굴관을 쓴 술의 신 바쿠스가 무릎 꿇은 젊은이에게 담쟁이 관을 씌워 주는 장면으로, 신화를 스페인 서민들의 술자리처럼 그렸습니다. '술꾼들'이라는 별명으로 더 잘 알려져 있습니다."}],["불카누스의 대장간","Apollo in the Forge of Vulcan","1630","prado","Apollo in the Forge of Vulcan",{"tip":"아폴론이 대장간에 나타나 불카누스에게 아내 비너스의 불륜을 알리는 순간입니다. 놀란 대장장이들의 표정과 근육질 몸이 생생합니다. 첫 이탈리아 여행 중 로마에서 그렸습니다."}],["십자가에 못 박힌 그리스도","Christ Crucified","1632경","prado","Christ Crucified (Velázquez)",{"tip":"어두운 배경 앞에 홀로 십자가에 매달린 그리스도를 고요하고 절제된 모습으로 그렸습니다. 얼굴 반쪽을 덮은 머리카락이 특징입니다."}],["푸른 드레스를 입은 마르가리타 테레사 공주","Infanta Margarita Teresa in a Blue Dress","1659","khm","Infanta Margarita Teresa in a Blue Dress",{"tip":"여덟 살 무렵의 공주를 그린 초상으로, 장차 남편이 될 레오폴트 1세가 있는 빈 궁정에 보내기 위해 그려졌습니다. 가까이서 보면 드레스는 거친 붓질로 이루어져 있습니다."}]]},{"n":"요하네스 페르메이르","o":"Johannes Vermeer","l":"1632–1675","d":"창으로 들어오는 고요한 빛을 그린 델프트의 화가. 현존 작품은 30여 점뿐입니다.","w":[["진주 귀고리를 한 소녀","Girl with a Pearl Earring","1665경","mauritshuis","Girl with a Pearl Earring",{"tip":"특정 인물의 초상이 아니라 이국적인 터번을 쓴 인물을 그린 '트로니'로 여겨집니다. 진주의 반짝임은 몇 번의 붓질만으로 표현되어 있습니다."}],["우유 따르는 여인","The Milkmaid","1658경","rijks","The Milkmaid (Vermeer)",{"tip":"부엌에서 조용히 우유를 따르는 하녀를 그렸습니다. 빵과 바구니 위에 찍힌 작은 빛의 점들을 가까이에서 살펴보세요."}],["델프트 풍경","View of Delft","1660–1661경","mauritshuis","View of Delft",{"tip":"강 건너편에서 바라본 델프트의 모습입니다. 프루스트가 『잃어버린 시간을 찾아서』에서 이 그림 속 '작은 노란 벽면'을 언급한 것으로 유명합니다."}],["열린 창가에서 편지를 읽는 여인","Girl Reading a Letter at an Open Window","1657–1659경","dresden","Girl Reading a Letter at an Open Window",{"tip":"2021년 복원으로 덧칠 아래 숨어 있던 큐피드 그림이 드러났습니다."}],["회화의 기술","The Art of Painting","1666–1668경","khm","The Art of Painting",{"tip":"뒷모습의 화가가 월계관을 쓰고 트럼펫을 든 모델을 그리는 장면으로, 모델은 역사의 뮤즈 클리오로 해석됩니다. 벽에 걸린 네덜란드 지도도 눈여겨보세요."}],["레이스 뜨는 여인","The Lacemaker","1669–1670경","louvre","The Lacemaker (Vermeer)",{"tip":"레이스 뜨기에 몰두한 여인을 그린 아주 작은 그림입니다. 앞쪽 바느질 쿠션에서 흘러내린 붉은 실은 일부러 흐릿하게 그려져 있습니다."}],["천문학자","The Astronomer","1668","louvre","The Astronomer (Vermeer)",{"tip":"천구의에 손을 뻗으며 연구에 몰두한 학자를 그렸습니다. 짝을 이루는 작품 '지리학자'는 프랑크푸르트 슈테델 미술관에 있습니다."}],["골목길","The Little Street","1658경","rijks","File:Johannes Vermeer - Gezicht op huizen in Delft, bekend als 'Het straatje' - Google Art Project.jpg",{"tip":"델프트의 평범한 집 앞 풍경으로, 페르메이르가 남긴 단 두 점의 풍경화 가운데 하나입니다."}],["편지를 읽는 푸른 옷의 여인","Woman in Blue Reading a Letter","1662–1663경","rijks","File:Johannes Vermeer - Woman in Blue Reading a Letter - WGA24657.jpg",{"tip":"왼쪽에서 들어오는 빛을 받으며 편지를 읽는 여인을 그렸습니다. 벽에 걸린 지도와 푸른 윗옷이 고요한 분위기를 만듭니다."}],["디아나와 님프들","Diana and Her Nymphs","1653–1654경","mauritshuis","File:Johannes Vermeer - Diana and her Nymphs - 406 - Mauritshuis.jpg",{"tip":"풍속화로 유명해지기 전, 젊은 페르메이르가 그린 드문 신화화입니다."}],["연애편지","The Love Letter","1669–1670경","rijks","File:Johannes Vermeer - The Love Letter - WGA24693.jpg",{"tip":"어두운 문간 너머로 편지를 받은 여주인과 하녀를 엿보는 듯한 구도입니다. 1971년 브뤼셀 전시 중 도난당해 손상되었다가 되찾은 일이 있습니다."}],["저울을 든 여인","Woman Holding a Balance","1664경","nga","Woman Holding a Balance",{"tip":"창가의 여인이 빈 저울을 들고 균형을 살피는 모습으로, 뒷벽에는 '최후의 심판' 그림이 걸려 있습니다. 진주와 금이 놓인 탁자가 세속과 영원을 대비시킵니다."}],["물주전자를 든 젊은 여인","Young Woman with a Water Pitcher","1662경","met","Woman with a Water Jug",{"tip":"흰 두건을 쓴 여인이 한 손으로 창문을 열고 다른 손으로 물주전자를 쥐고 있습니다. 창으로 들어온 빛이 두건과 은 대야를 은은하게 비춥니다."}],["뚜쟁이","The Procuress","1656","dresden","The Procuress (Vermeer)",{"tip":"매춘 거래 장면을 그린 풍속화로, 날짜와 서명이 있는 페르메이르의 초기작입니다. 왼쪽에서 관람자를 보고 웃는 남자는 화가의 자화상으로 추정되기도 합니다."}],["진주 목걸이를 한 여인","Woman with a Pearl Necklace","1662–1665경","berlingg","Woman with a Pearl Necklace",{"tip":"노란 모피 상의를 입은 여인이 창가 거울을 보며 진주 목걸이의 리본을 매고 있습니다. 텅 빈 하얀 벽이 고요한 분위기를 만듭니다."}],["버지널 앞에 선 여인","A Young Woman standing at a Virginal","1670–1672경","ngl","File:Jan Vermeer van Delft - Lady Standing at a Virginal - National Gallery, London.jpg",{"tip":"버지널(작은 건반 악기) 앞에 선 여인이 관람자를 바라봅니다. 뒷벽에 걸린 큐피드 그림이 사랑을 암시하며, 같은 미술관에 〈버지널 앞에 앉은 여인〉도 있습니다."}]]},{"n":"니콜라 푸생","o":"Nicolas Poussin","l":"1594–1665","d":"바로크 시대에 고전적 질서를 고수한 프랑스 화가. 훗날 신고전주의의 모범이 됩니다.","w":[["아르카디아의 목자들","Et in Arcadia ego","1637–1638경","louvre","Et in Arcadia ego (Poussin)",{"tip":"목자들이 무덤에 새겨진 '아르카디아에도 나는 있다'라는 글귀를 읽는 장면으로, 이상향에도 죽음이 존재한다는 뜻으로 해석됩니다."}],["사비니 여인들의 납치","The Abduction of the Sabine Women","1633–1634경","met","File:The Abduction of the Sabine Women MET 46 160.jpg",{"tip":"1637–1638년경의 다른 버전은 루브르에 있습니다."}],["시인의 영감","The Inspiration of the Poet","1629경","louvre","File:L'Inspiration du poète - circa 1629 - Nicolas Poussin - Louvre - RF 1774.jpg",{"tip":"아폴론과 뮤즈 곁에서 시인이 영감을 받아 글을 쓰고, 아기 천사가 그에게 월계관을 씌우려는 장면입니다."}],["겨울 (대홍수)","Winter (The Flood)","1660–1664","louvre","File:Nicolas Poussin - L'Hiver ou Le Déluge.jpg",{"tip":"푸생의 마지막 연작 〈사계〉의 마지막 그림입니다."}],["인생의 춤","A Dance to the Music of Time","1634–1636경","wallace","File:Nicolas Poussin - Dance to the Music of Time - WGA18303.jpg",{"tip":"시간의 신이 켜는 리라 소리에 맞춰 네 인물이 손을 잡고 원을 그리며 춤추는 모습으로, 인생과 운명의 순환을 상징합니다. 앤서니 파월의 연작 소설 제목이 이 그림에서 왔습니다."}],["자화상","Self-Portrait","1650","louvre","File:Poussin - Autoportrait, 1650, INV 7302 ; MR 2329.jpg",{"tip":"액자들이 겹쳐진 화실을 배경으로 화가가 관람자를 바라보는 자화상으로, 파리의 후원자 폴 프레아르 드 샹틀루를 위해 그렸습니다. 배경 그림 속 여인은 회화의 우의로 해석됩니다."}],["포키온의 유골이 있는 풍경","Landscape with the Ashes of Phocion","1648","walkerliv","Landscape with the Ashes of Phocion",{"tip":"부당하게 처형된 아테네 장군 포키온의 아내가 몰래 남편의 유골을 거두는 장면을 고요한 고전적 풍경 속에 그렸습니다. 짝을 이루는 '포키온의 장례'는 웨일스 카디프에 있습니다."}]]}],"note":"아르테미시아 젠틸레스키는 1616년 피렌체 미술 아카데미에 들어간 첫 여성 화가였습니다."},{"id":"rococo","name":"로코코","en":"Rococo","years":"1720년 – 1780년","s":1720,"e":1780,"color":"#93525d","sum":"루이 14세 사후 프랑스 귀족들은 베르사유의 장엄함 대신 파리 저택의 사교 살롱에서 가볍고 우아한 즐거움을 찾았습니다. 그 취향이 반영된 장식적이고 감각적인 양식입니다.","traits":["파스텔 톤의 밝고 부드러운 색","귀족의 사랑과 유희를 그린 '페트 갈랑트(우아한 연회)'","조개껍데기 모양 같은 장식적 곡선","작은 실내 공간을 위한 친밀한 그림","같은 시대의 다른 결: 소박한 정물과 서민 풍속화 (샤르댕)","왕실 초상과 여성 화가의 활약 (비제 르브룅)"],"diff":"바로크의 무겁고 장엄한 극적 표현이 가볍고 장난스러운 우아함으로 바뀝니다.","artists":[{"n":"장 앙투안 와토","o":"Jean-Antoine Watteau","l":"1684–1721","d":"'페트 갈랑트' 장르를 만든 로코코의 시작점입니다.","w":[["키테라섬의 순례","Pilgrimage to Cythera","1717","louvre","The Embarkation for Cythera",{"tip":"사랑의 섬 키테라를 배경으로 연인들이 짝을 지어 거니는 장면입니다. 이 작품으로 '페트 갈랑트'(우아한 연회)라는 새로운 장르가 아카데미에서 인정받았습니다."}],["피에로 (질)","Pierrot","1718–1719경","louvre","Pierrot (Watteau)",{"tip":"흰옷을 입은 희극 배우가 정면을 향해 우두커니 서 있는 모습입니다. 거의 실물 크기로 그려진 인물에서 묘한 쓸쓸함이 느껴집니다."}],["제르생의 간판","L'Enseigne de Gersaint","1720","charlottenburg","L'Enseigne de Gersaint",{"tip":"화상 제르생의 가게 간판으로 그린 작품으로, 왼쪽에서 루이 14세의 초상화를 상자에 넣는 장면이 시대의 변화를 암시합니다."}],["메즈탱","Mezzetin","1718–1720경","met","File:Mezzetin MET DP170811.jpg",{"tip":"코메디아 델아르테의 인물 메즈탱이 기타를 연주하며 사랑의 노래를 부르는 모습입니다. 뒤편 정원에는 등을 돌린 여인 조각상이 보입니다."}],["베네치아의 축제","Fêtes Vénitiennes","1718–1719경","edinburgh","Fêtes Vénitiennes",{"tip":"정원에서 춤추는 남녀와 악사들을 그린 페트 갈랑트입니다. 오른쪽에서 뮈제트(백파이프)를 부는 남자는 와토 자신으로 여겨집니다."}],["사랑의 음계","The Scale of Love","1717–1718경","ngl","File:Antoine Watteau - 'La gamme d'amour' (The Love Song) - WGA25457.jpg",{"tip":"기타를 연주하는 남자와 악보를 든 여인을 중심으로 정원의 연인들을 그렸습니다. 음악을 사랑의 은유로 삼은 와토의 대표적 주제를 보여 줍니다."}],["놀람","The Surprise","1718경","getty","The Surprise (Watteau)",{"tip":"격정적으로 포옹하는 연인 곁에서 기타를 든 메즈탱이 이를 바라보는 장면입니다. 오랫동안 판화로만 전해지다가 2000년대에 원작이 다시 발견되었습니다."}]]},{"n":"카날레토","o":"Canaletto","l":"1697–1768","d":"베네치아 풍경화(베두타)의 대가. 운하와 광장을 정밀하고 밝게 기록했습니다.","w":[["석공의 작업장","The Stonemason's Yard","1725경","ngl","The Stonemason's Yard",{"tip":"화려한 관광 명소 대신 석공들이 일하는 베네치아의 평범한 광장을 그렸습니다. 건너편으로 카리타 성당이 보입니다."}],["대운하의 레가타","A Regatta on the Grand Canal","1740경","ngl","A Regatta on the Grand Canal",{"tip":"카니발 기간에 열린 곤돌라 경주를 그렸습니다. 운하 양쪽 건물마다 구경꾼과 장식 천이 가득합니다."}],["예수 승천 대축일의 산 마르코 만","Venice: The Basin of San Marco on Ascension Day","1740경","ngl","File:Venice The Basin of San Marco on Ascension Day.jpg",{"tip":"총독의 화려한 배 부친토로가 바다와의 결혼 의식을 위해 출발하는 장면입니다. 수많은 곤돌라가 만을 메우고 있습니다."}],["산 마르코 만","Bacino di San Marco, Venice","1738경","mfa","File:Boston, Museum of Fine Art - Il bacino di San Marco c.1738 - Canaletto.jpg",{"tip":"산 마르코 만을 넓은 파노라마로 담은 대작입니다. 산 조르조 마조레 섬과 정박한 배들까지 세밀하게 그렸습니다."}]]},{"n":"프랑수아 부셰","o":"François Boucher","l":"1703–1770","d":"퐁파두르 부인이 아낀 궁정화가. 관능적인 신화화를 그렸습니다.","w":[["목욕을 마친 디아나","Diana Leaving Her Bath","1742","louvre","File:François Boucher - Diana Resting after her Bath, 1742.jpg",{"tip":"사냥을 마치고 쉬는 달의 여신 디아나와 님프를 그렸습니다. 머리의 초승달 장식과 곁에 놓인 사냥감이 디아나임을 알려 줍니다."}],["퐁파두르 부인","Madame de Pompadour","1756","alte","File:François Boucher Madame de Pompadour Munich 26102016 1.jpg",{"tip":"루이 15세의 총애를 받은 퐁파두르 부인이 책을 들고 비스듬히 기댄 모습으로, 화려한 드레스와 장미 장식이 섬세하게 그려져 있습니다."}],["아침 식사","The Breakfast","1739","louvre","File:Boucher - Das Frühstück - 1739.jpeg",{"tip":"로코코풍 실내에서 가족이 아침 음료를 즐기는 장면입니다. 신화화를 주로 그린 화가로서는 드물게 당시 파리 사람들의 일상을 담은 풍속화입니다."}],["쉬고 있는 소녀 (마리루이즈 오머피)","Resting Girl","1752","alte","File:Resting Girl by François Boucher (1753) - Alte Pinakothek - Munich - Germany 2017 (crop).jpg",{"tip":"소파에 엎드려 누운 소녀를 그린 그림으로, 모델 마리루이즈 오머피는 훗날 루이 15세의 애첩이 되었습니다."}],["비너스의 화장","The Toilet of Venus","1751","met","The Toilet of Venus (Boucher)",{"tip":"큐피드들에 둘러싸여 몸단장하는 비너스를 그린 그림으로, 퐁파두르 부인의 벨뷔 성 욕실을 장식하기 위해 제작되었습니다."}],["사랑을 위로하는 비너스","Venus Consoling Love","1751","nga","Venus Consoling Love",{"tip":"비둘기와 함께 누운 비너스가 어린 큐피드를 어루만지는 장면으로, 퐁파두르 부인을 위해 그려진 것으로 알려져 있습니다."}],["해돋이","The Rising of the Sun","1753","wallace","The Rising of the Sun",{"tip":"태양신 아폴론이 바다의 님프들 사이로 떠오르는 장면입니다. 태피스트리 밑그림으로 제작되었으며 짝을 이루는 「해넘이」와 함께 걸려 있습니다."}]]},{"n":"토머스 게인즈버러","o":"Thomas Gainsborough","l":"1727–1788","d":"영국의 초상화가이자 풍경화가. 경쾌한 붓질로 인물과 자연을 함께 담았습니다.","w":[["앤드루스 부부","Mr and Mrs Andrews","1750경","ngl","Mr and Mrs Andrews",{"tip":"신혼 부부를 그들의 영지 풍경과 함께 그렸습니다. 부인의 무릎 부분은 미완성으로 남아 있습니다."}],["파란 옷의 소년","The Blue Boy","1770경","huntington","The Blue Boy",{"tip":"반 다이크 시대풍의 푸른 새틴 옷을 입은 소년의 전신 초상입니다. 1922년 미국으로 팔렸고, 2022년 한 차례 런던에서 전시되기도 했습니다."}],["아침 산책","The Morning Walk","1785","ngl","Mr and Mrs William Hallett",{"tip":"결혼을 앞둔 젊은 부부가 개와 함께 숲길을 걷습니다. 깃털처럼 가벼운 붓질이 옷자락과 나뭇잎을 하나로 녹입니다."}],["나비를 쫓는 화가의 딸들","The Painter's Daughters Chasing a Butterfly","1756경","ngl","The Painter's Daughters Chasing a Butterfly",{"tip":"화가의 두 딸이 손을 잡고 나비를 쫓고 있습니다. 주문이 아닌 가족을 위해 그린 그림으로, 다정한 시선이 느껴집니다."}]]},{"n":"장 오노레 프라고나르","o":"Jean-Honoré Fragonard","l":"1732–1806","d":"로코코 마지막 세대. 경쾌한 붓질로 연애의 순간을 그렸습니다.","w":[["그네","The Swing","1767","wallace","The Swing (Fragonard)",{"tip":"그네를 탄 여인의 발끝에서 날아가는 신발과 덤불 속에 숨어 올려다보는 젊은이가 장난스러운 분위기를 만듭니다."}],["책 읽는 소녀","Young Girl Reading","1770경","nga","File:Jean Honoré Fragonard, Young Girl Reading, c. 1769, NGA 46303.jpg",{"tip":"노란 드레스를 입은 소녀가 책을 읽는 옆모습을 그렸습니다. 옷 주름과 쿠션을 빠르고 자유로운 붓질로 표현했습니다."}],["빗장","The Bolt","1777경","louvre","The Bolt (Fragonard)",{"tip":"남자가 한 손을 뻗어 문에 빗장을 거는 순간을 극적인 빛으로 그렸습니다. 탁자 위의 사과는 유혹을 암시하는 상징으로 해석됩니다."}],["사랑의 진전: 만남","The Progress of Love: The Meeting","1771–1772","frick","File:The Progress of Love - The Meeting - Fragonard 1771-72.jpg",{"tip":"뒤바리 부인이 주문했다가 돌려보낸 연작으로, 프릭 컬렉션의 '프라고나르 방'에 걸려 있습니다."}],["영감","Inspiration","1769경","louvre","File:Jean-Honoré Frago
