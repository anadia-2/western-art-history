 - At Eternity's Gate.jpg",{"tip":"두 주먹에 얼굴을 묻고 앉은 노인을 그린 작품입니다. 헤이그 시절의 드로잉과 석판화를 생레미에서 유화로 다시 그렸습니다."}],["먹구름 아래의 밀밭","Wheatfield under Thunderclouds","1890","vgm","File:Vincent van Gogh - Wheatfield Under Thunderclouds - VGM F778.jpg",{"tip":"오베르에서 세상을 떠나기 몇 주 전에 그린 그림입니다."}],["밀짚모자를 쓴 자화상","Self-Portrait with a Straw Hat","1887","met","File:Van Gogh Self-Portrait with Straw Hat 1887-Metropolitan.jpg",{"tip":"캔버스를 아끼려고 뒷면에 〈감자 깎는 여인〉을 그렸던 그림입니다."}],["반 고흐의 의자","Van Gogh's Chair","1888","ngl","Van Gogh's Chair",{"tip":"아를의 집에 있던 소박한 나무 의자에 파이프와 담배를 올려 두고 그렸습니다. 같은 시기에 그린 「고갱의 의자」와 짝을 이루는 작품입니다."}],["가셰 박사의 초상","Portrait of Dr. Gachet","1890","orsay","File:Vincent van Gogh - Dr Paul Gachet - Google Art Project.jpg",{"tip":"오베르쉬르우아즈에서 반 고흐를 돌봐 준 의사 가셰를 그렸습니다. 고흐는 같은 주제로 두 점을 그렸고, 이 두 번째 그림은 가셰 가족이 기증했습니다."}],["담배를 문 해골","Skull of a Skeleton with Burning Cigarette","1886","vgm","Skull of a Skeleton with Burning Cigarette",{"tip":"안트베르펜 미술학교 시절에 그린 그림으로, 해골이 불붙은 담배를 물고 있습니다. 학교의 딱딱한 해부학 수업을 비꼰 농담으로 여겨집니다."}],["자화상","Self-Portrait","1889","orsay","File:Autoportrait Vincent van Gogh Orsay.jpg",{"tip":"생레미 요양원 시절에 그린 자화상으로, 배경과 옷이 같은 푸른빛의 소용돌이치는 붓질로 이어집니다. 강렬한 시선이 인상적입니다."}]]},{"n":"폴 고갱","o":"Paul Gauguin","l":"1848–1903","d":"문명을 떠나 타히티로 간 화가. 평면적인 색면으로 상징을 그렸습니다.","w":[["우리는 어디서 왔는가, 우리는 무엇인가, 우리는 어디로 가는가","Where Do We Come From? What Are We? Where Are We Going?","1897–1898","mfa","Where Do We Come From? What Are We? Where Are We Going?",{"tip":"오른쪽의 아기에서 왼쪽의 노인까지, 오른쪽에서 왼쪽으로 읽히는 삶의 여정을 그린 타히티 시절의 대작입니다. 왼쪽 위 모서리에 제목이 적혀 있습니다."}],["설교 뒤의 환상","Vision After the Sermon","1888","edinburgh","Vision After the Sermon",{"tip":"설교를 들은 브르타뉴 여인들이 야곱과 천사의 씨름을 환상으로 보는 장면입니다. 현실과 환상을 가르는 나무줄기와 강렬한 붉은 바탕이 특징입니다."}],["황색 그리스도","The Yellow Christ","1889","buffalo","The Yellow Christ",{"tip":"브르타뉴의 들판에 노란 그리스도 십자가상과 기도하는 여인들을 배치했습니다. 퐁타벤 근처 예배당의 목조 십자가상을 모델로 했습니다."}],["타히티의 여인들","Tahitian Women on the Beach","1891","orsay","Tahitian Women on the Beach",{"tip":"타히티 해변에 앉은 두 여인을 평평한 색면과 굵은 윤곽선으로 그렸습니다. 고갱이 처음 타히티에 머물던 시기의 작품입니다."}],["이아 오라나 마리아","Ia Orana Maria","1891","met","Ia Orana Maria",{"tip":"타히티어로 ‘마리아께 인사드립니다’라는 뜻으로, 성모자를 타히티 여인과 아이로 옮겨 그렸습니다. 나무 사이의 날개 달린 천사와 두 사람 머리 위의 후광을 찾아보세요."}],["죽은 자의 혼이 지켜본다","Spirit of the Dead Watching","1892","buffalo","Spirit of the Dead Watching",{"tip":"침대에 엎드린 타히티 소녀와 그 뒤에 서 있는 검은 형상을 그렸습니다. 원주민들이 두려워하던 죽은 자의 혼을 주제로 삼았다고 고갱이 설명했습니다."}],["황색 그리스도가 있는 자화상","Self-Portrait with Yellow Christ","1890–1891","orsay","File:Paul Gauguin 109.jpg",{"tip":"뒤편에 자신의 그림 ‘황색 그리스도’와 직접 만든 도자기 항아리를 배치한 자화상입니다. 거울을 보고 그려 그림 속 그리스도가 좌우 반전되어 있습니다."}],["아레아레아 (즐거움)","Arearea","1892","orsay","File:Paul Gauguin - Arearea - Google Art Project.jpg",{"tip":"앞쪽에 타히티 여인 둘이 앉아 있고 뒤편에서는 신상 앞 의식이 벌어지는 장면입니다. 앞쪽의 붉은 개를 눈여겨보세요."}],["백마","The White Horse","1898","orsay","File:Paul Gauguin - The White Horse - Google Art Project.jpg",{"tip":"개울에서 물을 마시는 흰 말과 말 탄 사람들을 그린 타히티 풍경입니다. 주변 초목의 색이 비쳐 흰 말이 초록빛을 띠는 점을 눈여겨보세요."}],["두 타히티 여인","Two Tahitian Women","1899","met","File:Two Tahitian Women MET DT1342.jpg",{"tip":"가슴을 드러낸 두 타히티 여인이 붉은 꽃이 담긴 그릇을 들고 서 있습니다. 묵직한 인체와 단순한 배경이 조각 같은 인상을 줍니다."}],["네버모어","Nevermore","1897","courtauld","File:Paul Gauguin 091.jpg",{"tip":"제목은 에드거 앨런 포의 시 「갈까마귀」의 후렴에서 따왔습니다."}],["후광과 뱀이 있는 자화상","Self-Portrait with Halo and Snake","1889","nga","Self-Portrait with Halo and Snake",{"tip":"브르타뉴 르풀뒤의 여관 식당 문짝에 그린 자화상입니다. 머리 위의 후광과 손가락 사이의 뱀으로 성자와 유혹자를 함께 표현했습니다."}],["신의 날 (마하나 노 아투아)","Mahana no atua (Day of the God)","1894","aic","Mahana no atua",{"tip":"타히티에서 돌아온 뒤 파리에서 기억을 바탕으로 그렸습니다. 우상 아래 의식을 치르는 사람들과 추상적인 무늬처럼 칠한 물가가 대비를 이룹니다."}],["바닷가에서 (파타타 테 미티)","Fatata te Miti (By the Sea)","1892","nga","Fatata te Miti (By the Sea)",{"tip":"타히티 여인들이 바다로 뛰어드는 장면을 그렸습니다. 평평하게 칠한 강렬한 색면이 첫 타히티 체류기의 특징을 잘 보여 줍니다."}],["아름다운 앙젤","La Belle Angèle","1889","orsay","File:Paul Gauguin - La Belle Angèle - Google Art Project.jpg",{"tip":"퐁타방의 여인 앙젤 사트르를 원형 틀 안에 그리고 옆에 토속적인 조각상을 배치했습니다. 모델은 이 초상을 마음에 들어 하지 않아 받기를 거절했다고 합니다."}]]},{"n":"앙리 드 툴루즈로트레크","o":"Henri de Toulouse-Lautrec","l":"1864–1901","d":"몽마르트르의 밤 문화와 포스터 예술을 그렸습니다.","w":[["물랭 루주에서","At the Moulin Rouge","1892–1895","aic","File:Henri de Toulouse-Lautrec - At the Moulin Rouge - Google Art Project.jpg",{"tip":"물랭 루주의 테이블에 모인 사람들을 그렸으며, 뒤편에 키 큰 사촌과 함께 걷는 작은 인물이 화가 자신입니다. 오른쪽 아래 초록빛 얼굴의 여인이 강렬합니다."}],["물랭 루주의 라 굴뤼 (포스터)","Moulin Rouge: La Goulue","1891","various","Moulin Rouge: La Goulue",{"tip":"물랭 루주의 스타 무용수 라 굴뤼를 그린 로트레크의 첫 포스터입니다. 앞쪽의 그림자 같은 남자는 춤 파트너 발랑탱입니다."}],["물랭가의 살롱에서","At the Salon on the Rue des Moulins","1894","albi","File:Au Salon de la rue des Moulins - Henri de Toulouse-Lautrec.jpg",{"tip":"파리 유곽의 응접실에서 손님을 기다리는 여인들을 그린 작품입니다. 로트레크는 이들의 무료한 일상을 꾸밈없이 관찰했습니다."}],["침대에서","In Bed","1892","orsay","File:Toulouse-Lautrec - In Bed, 1892.jpg",{"tip":"이불을 덮고 나란히 누운 두 여인을 다정한 시선으로 그린 작품입니다. 로트레크가 유곽 여인들의 일상을 그린 연작 가운데 하나입니다."}],["화장 (빨강 머리 여인)","La Toilette","1889","orsay","File:Toulouse-Lautrec - Rousse (La toilette), RF 2242.jpg",{"tip":"바닥에 앉아 몸단장하는 붉은 머리 여인의 뒷모습을 위에서 내려다보듯 그렸습니다. 드가의 영향을 느낄 수 있는 구도입니다."}],["물랭 루주에서: 춤","At the Moulin Rouge: The Dance","1890","philly","File:Toulouse-Lautrec - At the Moulin Rouge The Dance, 1986-26-32.jpg",{"tip":"물랭 루주에서 무용수 발랑탱이 새 무용수에게 춤을 가르치는 장면과 이를 지켜보는 손님들을 그렸습니다. 분홍 드레스의 여인이 화면 앞쪽에 서 있습니다."}],["자르댕 드 파리의 제인 아브릴 (포스터)","Jane Avril (Jardin de Paris)","1893","various","File:Lautrec jane avril at the jardin de paris (poster) 1893.jpg",{"tip":"카바레 무용수 제인 아브릴이 춤추는 모습을 담은 포스터입니다. 앞쪽에서 화면을 감싸는 콘트라베이스 머리와 연주자의 손을 눈여겨보세요."}],["곡마사 (페르난도 서커스에서)","Equestrienne (At the Cirque Fernando)","1887–1888","aic","File:Henri de Toulouse-Lautrec - Equestrienne (At the Cirque Fernando) - 1925.523 - Art Institute of Chicago.jpg",{"tip":"몽마르트르 페르난도 서커스의 곡마 공연을 그렸습니다. 대각선으로 휘어진 링과 잘린 인물 배치에서 일본 판화의 영향이 엿보입니다."}],["춤추는 잔 아브릴","Jane Avril Dancing","1892경","orsay","File:Henri de Toulouse-Lautrec - Jane Avril Dancing - Google Art Project.jpg",{"tip":"물랭 루주의 무용수 잔 아브릴이 홀로 춤추는 모습을 그렸습니다. 판지 위에 묽은 유화 물감을 써서 빠르고 가벼운 붓질이 그대로 드러납니다."}],["광대 샤위카오","The Clownesse Cha-U-Kao","1895","orsay","File:Lautrec the clownesse cha-u-kao 1895.jpg",{"tip":"물랭 루주에서 활약한 여성 광대 샤위카오가 노란 장식 깃을 매만지는 모습입니다. 무대 밖 순간을 포착한 시선이 담담합니다."}],["빈센트 반 고흐의 초상","Portrait of Vincent van Gogh","1887","vgm","File:Toulouse-Lautrec de Henri Vincent van Gogh Sun.jpg",{"tip":"파리 시절 친구였던 반 고흐를 카페 탁자에 앉은 옆모습으로 그린 파스텔화입니다. 반 고흐의 화법을 닮은 짧은 선들로 표현했습니다."}]]},{"n":"피에르 보나르","o":"Pierre Bonnard","l":"1867–1947","d":"나비파 출신의 색채 화가. 일상의 실내와 정원을 빛나는 색으로 그렸습니다.","w":[["욕조 속의 누드","Nude in the Bath","1936–1938","mamparis","File:Pierre Bonnard - nu dans le bain (amvp 2520 554713).jpg",{"tip":"욕조에 누운 아내 마르트를 빛나는 타일과 물빛 속에 그렸습니다. 보나르는 그녀를 수십 년 동안 거듭 그렸습니다."}],["열린 창","The Open Window","1921","phillips","The Open Window (Bonnard)",{"tip":"열린 창 너머로 초록빛 정원이 펼쳐지고, 실내 한구석에는 고양이와 마르트가 숨은 듯 앉아 있습니다."}],["황혼 (크로케 놀이)","Twilight (The Croquet Game)","1892","orsay","File:Dusk-or-a-round-of-croquet-1892.jpg!HalfHD.jpg",{"tip":"저녁 정원에서 가족들이 크로케를 즐깁니다. 평면적인 패턴과 장식적 구성에서 일본 판화와 나비파의 영향이 드러납니다."}],["정원이 보이는 식당 (아침 식사실)","Dining Room Overlooking the Garden (The Breakfast Room)","1930–1931","moma","File:Pierre Bonnard, 1930-31 - The Breakfast Room.jpg",{"tip":"아침 식탁과 창밖 정원이 하나로 어우러진 실내 풍경입니다. 왼쪽 가장자리에 마르트가 반쯤 잘린 채 서 있습니다."}]]}],"note":"피사로도 1880년대 후반 잠시 점묘법을 받아들였습니다(인상주의 전시실의 〈에라니의 사과 수확〉)."},{"id":"symbolism","name":"상징주의 · 빈 분리파","en":"Symbolism & Vienna Secession","years":"1880년 – 1910년","s":1880,"e":1910,"color":"#7a6020","sum":"눈에 보이는 현실보다 꿈, 신화, 죽음, 관능 같은 내면 세계를 상징으로 표현한 흐름입니다. 빈에서는 클림트가 아카데미에서 벗어난 '빈 분리파'를 만들어 장식적이고 화려한 양식을 펼쳤습니다.","traits":["꿈과 신화, 신비주의","팜 파탈, 사랑과 죽음","금박과 장식 문양 (클림트, 아르누보)"],"diff":"사실주의와 인상주의가 바깥 세계를 관찰했다면, 상징주의는 안쪽의 정신 세계로 눈을 돌립니다. 뭉크도 이 흐름에서 출발했습니다.","artists":[{"n":"조지 프레더릭 와츠","o":"George Frederic Watts","l":"1817–1904","at":0,"d":"빅토리아 시대 영국의 화가이자 조각가. 희망, 사랑, 죽음 같은 보편적 주제를 우의적인 인물로 그려 영국 상징주의를 대표합니다. 대표작 상당수를 국가에 기증해 테이트 브리튼에서 볼 수 있습니다.","w":[["사랑과 죽음","Love and Death","1885–1887경","tateb","File:George Frederic Watts - Love and Death - Tate Britain.jpg",{"tip":"문 앞을 막아서는 어린 사랑(큐피드)을 거대한 죽음이 밀고 들어오는 장면입니다. 와츠가 여러 버전을 그린 작품입니다."}],["가장 깊은 곳에 사는 자","The Dweller in the Innermost","1885–1886","tateb","File:George Frederic Watts (1817-1904) - The Dweller in the Innermost - N01631 - National Gallery.jpg",{"tip":"인간 내면의 양심을 신비로운 인물로 형상화한 작품입니다."}],["희망","Hope","1886","tateb","File:Assistants and George Frederic Watts - Hope - Google Art Project.jpg",{"tip":"눈을 가린 여인이 줄이 하나만 남은 리라를 켜며 그 소리에 귀 기울이는 모습입니다. 테이트 소장본은 두 번째 버전이며, 이 그림을 다룬 설교가 버락 오바마의 책 제목 '담대한 희망(The Audacity of Hope)'으로 이어진 것으로도 유명합니다."}],["프시케","Psyche","1880","tateb","File:George Frederic Watts (1817-1904) - Psyche - N01585 - National Gallery.jpg",{"tip":"그리스 신화에서 에로스의 사랑을 받은 여인 프시케를 나신으로 그렸습니다. 고전 조각을 연상시키는 차분한 인체 표현이 특징입니다."}],["미노타우로스","The Minotaur","1885","tateb","The Minotaur (painting)",{"tip":"반인반우의 괴물이 성벽 너머 바다를 내다보며 손으로 작은 새를 짓누르고 있습니다. 당시 런던의 아동 성매매 폭로 기사에 대한 분노에서 그린 그림입니다."}],["맘몬","Mammon","1884–1885","tateb","File:George Frederic Watts (1817-1904) - Mammon - N01630 - National Gallery.jpg",{"tip":"당나귀 귀가 달린 관을 쓴 탐욕의 신이 해골 장식 왕좌에 앉아 한 손으로 여인의 머리를, 한 발로 쓰러진 남자를 짓누르고 있습니다."}],["선택 (엘런 테리)","Choosing","1864","npg","File:Choosing - Ellen Terry by George Frederic Watts.jpg",{"tip":"훗날 명배우가 된 젊은 엘런 테리가 화려한 동백꽃과 소박한 제비꽃 사이에서 고르는 모습입니다. 그녀는 이 무렵 와츠와 짧게 결혼했습니다."}]]},{"n":"귀스타브 모로","o":"Gustave Moreau","l":"1826–1898","d":"보석처럼 빛나는 신화화를 그린 프랑스 상징주의의 선구자. 마티스의 스승이기도 합니다.","w":[["환영","The Apparition","1876","orsay","File:Gustave Moreau - The Apparition - Google Art Project.jpg",{"tip":"춤추던 살로메 앞에 세례 요한의 잘린 머리가 빛을 내며 나타나는 장면입니다. 배경에 섬세한 선으로 그려 넣은 장식 무늬를 가까이서 살펴보세요."}],["오이디푸스와 스핑크스","Oedipus and the Sphinx","1864","met","File:Oedipus and the Sphinx MET DP-14201-023.jpg",{"tip":"오이디푸스와 그에게 매달린 스핑크스가 서로를 응시하는 장면입니다. 1864년 살롱에서 호평받으며 모로의 이름을 알린 작품입니다."}],["주피터와 세멜레","Jupiter and Semele","1894–1895","moreau","Jupiter and Semele",{"tip":"인간 세멜레가 신의 본모습을 보여 달라고 청했다가 그 광채에 타 죽는 신화를 그렸습니다. 보석처럼 촘촘한 장식이 화면을 가득 채운 모로 말년의 대작입니다."}],["오르페우스","Orpheus","1865","orsay","File:Gustave Moreau - Orpheus - Google Art Project.jpg",{"tip":"트라키아 처녀가 리라 위에 놓인 오르페우스의 잘린 머리를 들여다보는 장면입니다. 고요하고 몽환적인 분위기가 상징주의를 예고합니다."}],["헤라클레스와 레르나의 히드라","Hercules and the Lernaean Hydra","1875–1876","aic","File:Gustave Moreau - Hercules and the Lernaean Hydra - 1964.231 - Art Institute of Chicago.jpg",{"tip":"영웅 헤라클레스가 머리 여럿 달린 괴물 뱀 히드라와 맞서는 장면입니다. 희생자들의 시신이 흩어진 어두운 바위 골짜기가 긴장감을 높입니다."}],["갈라테이아","Galatea","1880경","orsay","File:Moreau - Galatée, vers 1880, RF 1997 16.jpg",{"tip":"바다 요정 갈라테이아를 외눈박이 거인 폴리페모스가 동굴 위에서 몰래 바라보고 있습니다. 보석처럼 세밀하게 그린 바다 식물이 화면을 채웁니다."}],["유니콘","The Unicorns","1885경","moreau","File:Gustave Moreau Les Licornes.jpg",{"tip":"화려한 옷차림의 여인들이 유니콘과 함께 머무는 환상적인 장면입니다. 세밀한 장식 선이 화가의 집이던 미술관에서 돋보입니다."}]]},{"n":"오딜롱 르동","o":"Odilon Redon","l":"1840–1916","d":"꿈과 무의식을 그린 상징주의 화가. 검은 목탄화에서 화사한 색채화로 나아갔습니다.","w":[["키클롭스","The Cyclops","1914경","kroller","The Cyclops (Redon)",{"tip":"외눈박이 거인 폴리페모스가 산 너머에서 잠든 님프 갈라테이아를 수줍게 내려다봅니다. 꽃이 핀 듯한 색채가 몽환적입니다."}],["눈-풍선","Eye-Balloon","1878","moma","File:Redon - Eye-Balloon (Œil-ballon) 1878.jpg",{"tip":"거대한 눈알이 열기구처럼 하늘로 떠오르는 환상적인 목탄화입니다. 르동의 '검은 그림' 시대를 대표하는 작품으로, 종이 작품이라 평소에는 전시되지 않습니다."}],["감은 눈","Closed Eyes","1890","orsay","File:Odilon Redon - Closed Eyes - Google Art Project.jpg",{"tip":"눈을 감은 얼굴이 수면 위로 떠오르듯 그려졌습니다. 르동이 목탄화에서 색채화로 넘어가는 시기를 보여 줍니다."}],["꽃 사이의 오필리아","Ophelia among the Flowers","1905–1908경","ngl","File:Odilon Redon, Ophelia among the Flowers, The National Gallery, London.jpg",{"tip":"물에 잠긴 오필리아의 옆얼굴 위로 선명한 꽃들이 피어오르는 파스텔화입니다. 르동 말년의 화려한 색채가 돋보입니다."}]]},{"n":"구스타프 클림트","o":"Gustav Klimt","l":"1862–1918","d":"빈 분리파의 초대 회장. 금박을 쓴 '황금 시기'가 유명합니다.","w":[["키스","The Kiss","1907–1908","belvedere","The Kiss (Klimt)",{"tip":"금박으로 뒤덮인 옷 속에서 연인이 입맞추는 모습을 그린 클림트 ‘황금 시기’의 대표작입니다. 남자 옷의 사각 무늬와 여자 옷의 둥근 무늬를 비교해 보세요."}],["아델레 블로흐바우어의 초상 I","Portrait of Adele Bloch-Bauer I","1907","neue","Portrait of Adele Bloch-Bauer I",{"tip":"금박 장식 속에 인물의 얼굴과 손만 사실적으로 떠오르는 초상입니다. 나치에게 빼앗겼다가 오랜 소송 끝에 상속인에게 반환된 사연으로 유명합니다."}],["유디트 I","Judith I","1901","belvedere","Judith and the Head of Holofernes (Klimt)",{"tip":"적장 홀로페르네스의 머리를 든 유디트를 관능적인 팜파탈로 그렸습니다. 금속 액자 위쪽에 주제를 밝힌 글자가 새겨져 있습니다."}],["베토벤 프리즈","Beethoven Frieze","1902","secession","Beethoven Frieze",{"tip":"베토벤을 기리는 분리파 전시를 위해 전시실 벽 위쪽에 그린 대형 벽화로, 교향곡 9번을 시각화했습니다. 마지막 장면의 포옹하는 연인을 찾아보세요."}],["생명의 나무 (스토클레 프리즈 밑그림)","Stoclet Frieze","1905–1911","mak","Stoclet Frieze",{"tip":"실제 모자이크는 브뤼셀 스토클레 저택에 있어 공개되지 않고, MAK에서 밑그림을 볼 수 있습니다."}],["죽음과 삶","Death and Life","1910–1915","leopold","Death and Life (Klimt)",{"tip":"왼쪽의 해골 모습을 한 죽음이 오른쪽에 뒤엉킨 사람들을 바라보는 구도입니다. 처음에는 금색 배경이었으나 클림트가 나중에 고쳐 그렸습니다."}],["프리차 리들러의 초상","Portrait of Fritza Riedler","1906","belvedere","File:Gustav Klimt - Fritza Riedler - 3379 - Österreichische Galerie Belvedere.jpg",{"tip":"장식 무늬의 안락의자에 앉은 빈 상류층 여성의 초상입니다. 머리 뒤의 반원형 무늬는 벨라스케스 초상화 속 머리 장식에서 착안했다고 알려져 있습니다."}],["희망 II","Hope II","1907–1908","moma","File:Gustav Klimt - Hope, II - Google Art Project.jpg",{"tip":"눈을 감은 임신부의 몸 뒤로 해골이 드러나고 아래쪽에는 고개 숙인 여인들이 있습니다. 탄생과 죽음을 한 화면에 담은 작품입니다."}],["아터 호숫가의 캄머 성 III","Schloss Kammer am Attersee III","1910","belvedere","File:Gustav Klimt - Schloss Kammer am Attersee III - 4318 - Österreichische Galerie Belvedere.jpg",{"tip":"여름마다 머물던 아터 호숫가의 풍경입니다. 클림트는 풍경화도 50점 넘게 남겼습니다."}],["소냐 크닙스의 초상","Portrait of Sonja Knips","1898","belvedere","File:Gustav Klimt - Sonja Knips - 4403 - Österreichische Galerie Belvedere.jpg",{"tip":"금박을 쓰기 전, 초기 클림트의 섬세한 초상화입니다."}],["요한나 슈타우데의 초상 (미완성)","Portrait of Johanna Staude","1917–1918","belvedere","File:Gustav Klimt - Johanna Staude - 5551 - Österreichische Galerie Belvedere.jpg",{"tip":"클림트가 세상을 떠나 미완성으로 남은 마지막 초상화 가운데 하나입니다."}],["여인의 세 시기","The Three Ages of Woman","1905","gnam","The Three Ages of Woman (Klimt)",{"tip":"아기와 젊은 어머니, 늙은 여인을 나란히 배치해 삶의 순환을 표현했습니다. 금빛 장식 무늬와 사실적인 몸의 묘사가 대비를 이룹니다."}],["에밀리 플뢰게의 초상","Portrait of Emilie Flöge","1902","wienmuseum","Portrait of Emilie Flöge",{"tip":"클림트의 평생 동반자이자 패션 디자이너였던 에밀리 플뢰게를 그렸습니다. 푸른 무늬로 가득한 긴 드레스가 몸 전체를 감쌉니다."}],["메다 프리마베시","Mäda Primavesi","1912–1913","met","File:Mäda Primavesi (1903–2000) MET DP243354.jpg",{"tip":"후원자 가문의 아홉 살 소녀가 꽃무늬 배경 앞에 당당히 서 있습니다. 클림트 후기의 밝고 화사한 색채가 잘 드러난 초상입니다."}],["아담과 이브","Adam and Eve","1917–1918","belvedere","File:Gustav Klimt - Adam und Eva - 4402 - Österreichische Galerie Belvedere.jpg",{"tip":"꽃이 흩어진 바닥 위에 밝은 피부의 이브가 서 있고 뒤에 아담이 잠든 듯 기대어 있습니다. 클림트가 세상을 떠나 미완성으로 남았습니다."}]]}]},{"id":"fauvism","name":"야수주의와 원시주의","en":"Fauvism & Primitivism","years":"1905년 – 1910년","s":1905,"e":1910,"color":"#c2452d","sum":"1905년 파리 살롱 도톤에서 거칠고 강렬한 원색 그림을 본 평론가가 '야수들(Les Fauves) 사이에 있는 도나텔로 같다'고 해서 붙은 이름입니다. 색을 사물의 재현에서 해방시켜 감정과 장식의 도구로 썼습니다.","traits":["튜브에서 짜낸 듯한 순수 원색","자연의 색과 무관한 자유로운 색 (초록 얼굴, 붉은 나무)","평면적 형태와 단순화","원시주의: 아프리카·오세아니아 조각, 민속 미술, 어린아이 같은 소박함에서 영감","선과 색면을 따로 겹쳐 그리는 경쾌한 장식 양식 (뒤피)"],"diff":"고흐와 고갱의 색채 실험을 극단까지 밀어붙였습니다. 형태를 해체한 입체주의와 달리 '색'의 혁명입니다.","note":"마티스는 미술사에서 보통 '야수주의'의 지도자로 분류됩니다. '원시주의'는 하나의 유파라기보다 비서구 미술과 소박함에서 영감을 얻은 넓은 경향을 가리키는 말로, 고갱, 앙리 루소, 초기 피카소, 마티스 등에게 두루 나타납니다.","artists":[{"n":"앙리 마티스","o":"Henri Matisse","l":"1869–1954","d":"야수주의의 지도자. 피카소와 함께 20세기 미술의 양대 거장으로 꼽힙니다.","w":[["모자를 쓴 여인","Woman with a Hat","1905","sfmoma","Woman with a Hat",{"tip":"아내 아멜리를 그린 초상으로, 1905년 살롱 도톤에서 거친 붓질과 강렬한 색 때문에 야수파 논란의 중심이 되었습니다."}],["춤","Dance","1910","hermitage","Dance (Matisse)",{"tip":"1909년에 그린 첫 번째 버전은 뉴욕 MoMA에 있습니다."}],["붉은 화실","The Red Studio","1911","moma","The Red Studio",{"tip":"화실 전체를 붉은색 하나로 덮고 그 위에 마티스 자신의 작품들을 배치했습니다. 가구가 윤곽선만 남긴 채 붉은색 속에 녹아든 점을 눈여겨보세요."}],["호사, 평온, 쾌락","Luxe, Calme et Volupté","1904","orsay","Luxe, Calme et Volupté",{"tip":"생트로페에서 시냐크와 지내며 점묘법을 시도한 작품입니다. 제목은 보들레르의 시 ‘여행에의 초대’ 구절에서 따왔습니다."}],["열린 창문, 콜리우르","Open Window, Collioure","1905","nga","Open Window, Collioure",{"tip":"콜리우르 숙소의 열린 창 너머로 항구와 배를 그린 작품입니다. 창 안팎을 순수한 색면으로 나눈 야수파 초기의 대표작입니다."}],["삶의 기쁨","Le Bonheur de vivre","1905–1906","barnes","File:Bonheur Matisse.jpg",{"tip":"목가적인 풍경 속에 쉬거나 춤추는 인물들을 펼쳐 놓았습니다. 뒤편의 원무는 훗날 ‘춤’ 연작으로 이어졌습니다."}],["붉은색의 조화 (붉은 방)","The Dessert: Harmony in Red","1908","hermitage","The Dessert: Harmony in Red",{"tip":"식탁을 차리는 하녀와 붉은 방을 그린 작품으로, 처음에는 파란색이었으나 마티스가 빨간색으로 고쳐 칠했습니다. 식탁보와 벽의 무늬가 하나로 이어집니다."}],["음악","Music","1910","hermitage","Music (Matisse)",{"tip":"러시아 수집가 시추킨의 저택을 위해 ‘춤’과 짝을 이루도록 그린 작품입니다. 붉은 인물 다섯이 초록 언덕과 파란 하늘 위에 단순하게 놓여 있습니다."}],["창문","The Window","1916","dia","File:La Fenêtre, par Henri Matisse.webp",{"tip":"파리 근교 이시레물리노 화실의 창가를 그렸습니다. 1922년 디트로이트 미술관이 사들이며 미국 공공 미술관이 소장한 첫 마티스 작품이 되었습니다."}],["루마니아 블라우스","La Blouse roumaine","1940","pompidou","La Blouse roumaine",{"cr":1,"tip":"루마니아 전통 자수 블라우스를 입은 여인을 단순한 선과 색면으로 그렸습니다."}],["강가의 목욕하는 사람들","Bathers by a River","1909–1917","aic","File:Bathers by a River.jpg",{"tip":"8년에 걸쳐 고쳐 그리며 입체주의의 영향을 받아들인 대작입니다."}],["피아노 레슨","The Piano Lesson","1916","moma","File:La Leçon de piano, par Henri Matisse.jpg",{"tip":"피아노 앞의 아들 피에르를 기하학적 색면으로 단순화한 작품입니다. 얼굴에 드리운 삼각형 그림자와 메트로놈의 형태가 서로 호응합니다."}],["금붕어와 팔레트","Goldfish and Palette","1914","moma","File:Henri Matisse - Goldfish and Palette (1914).jpg",{"tip":"어항 속 금붕어와 팔레트를 검은 띠를 중심으로 배치한 작품입니다. 오른쪽에 팔레트를 쥔 화가의 모습이 추상적으로 암시되어 있습니다."}],["달팽이","The Snail","1953","tatem","x",{"tip":"색종이를 오려 붙인 조각들이 소용돌이처럼 배치되어 달팽이 껍데기를 떠올리게 합니다. 거동이 불편했던 마티스가 조수들의 도움을 받아 완성한 말년의 대표작입니다.","cr":1}],["수영장","The Swimming Pool","1952","moma","x",{"tip":"니스 아파트 식당 벽을 둘러 수영하는 사람들을 오려 붙인 대형 종이 작품입니다. 관람객이 작품 안에 둘러싸이도록 전시됩니다.","cr":1}],["푸른 누드 II","Blue Nude II","1952","pompidou","x",{"tip":"푸른색으로 칠한 종이를 오려 앉아 있는 여인의 몸을 표현했습니다. 단순한 형태만으로 몸의 볼륨과 움직임을 전달합니다.","cr":1}],["커다란 붉은 실내","Large Red Interior","1948","pompidou","x",{"tip":"붉은색으로 가득 찬 방에 두 개의 탁자와 벽에 걸린 그림 두 점이 놓여 있습니다. 마티스가 마지막으로 그린 대형 유화 가운데 하나입니다.","cr":1}],["앙드레 드랭의 초상","Portrait of André Derain","1905","tatem","File:Henri matisse, andré derain, 1905 (tate).jpg",{"tip":"야수주의가 탄생한 1905년 여름, 콜리우르에서 함께 작업하던 동료 드랭을 그렸습니다. 얼굴에 칠한 초록과 빨강 같은 대담한 색이 눈에 띕니다."}],["곧은 머리의 나디아","Nadia aux cheveux lisses","1948","various","x",{"cr":1,"tip":"말년에 제작한 애쿼틴트(동판화) 초상으로, 붓으로 그은 듯한 몇 개의 굵은 선만으로 젊은 여인 나디아의 얼굴을 표현했습니다. 판화라 여러 미술관이 판본을 소장하고 있습니다."}]]},{"n":"앙드레 드랭","o":"André Derain","l":"1880–1954","d":"마티스와 함께 콜리우르에서 야수주의를 탄생시켰습니다.","w":[["앙리 마티스의 초상","Portrait of Henri Matisse","1905","tatem","File:André derain, ritratto di henri matisse, 1905 (tate modern) 01.jpg",{"tip":"콜리우르에서 함께 작업하던 마티스를 강렬한 색 붓질로 그렸습니다. 같은 시기 마티스가 그린 드랭의 초상도 테이트에 있습니다."}],["콜리우르의 산","Mountains at Collioure","1905","nga","Mountains at Collioure",{"tip":"콜리우르의 언덕과 나무를 짧고 굵은 원색 붓질로 그린 야수파 풍경입니다. 색이 형태를 이끄는 대담한 화면을 살펴보세요."}],["빅벤","Big Ben","1906","troyes","File:Troyes (Aube) - Musée d'Art Moderne - \"Big Ben\" (André Derain, 1906).jpg",{"tip":"화상 볼라르의 의뢰로 런던을 30점 가까이 그린 연작 가운데 하나입니다."}],["채링 크로스 다리","Charing Cross Bridge","1906","orsay","File:Charing Cross Bridge by Andre Derain (52259664204).jpg",{"tip":"화상 볼라르의 권유로 런던에 가서 템스강을 그린 연작 중 하나입니다. 모네가 그린 안개 낀 런던과 달리 강렬한 원색을 썼습니다."}],["런던의 풀","The Pool of London","1906","tatem","File:Le Bassin de Londres, par André Derain.jpg",{"tip":"런던 템스강의 붐비는 부두를 강렬한 원색으로 그렸습니다. 화상 볼라르의 의뢰로 런던을 찾아 그린 연작 중 하나입니다."}],["구불구불한 길, 레스타크","The Turning Road, L'Estaque","1906","mfah","File:The Turning Road, L´Estaque.jpg",{"tip":"마르세유 근처 레스타크의 시골길과 나무, 사람들을 강렬한 색면으로 그렸습니다. 드랭의 야수파 시기 가장 큰 그림 가운데 하나입니다."}],["국회의사당의 밤","The Houses of Parliament at Night","1905–1906","met","File:Andre-Derain-The Houses of Parliament at Night, 1906.webp",{"tip":"런던 연작 가운데 한 점으로, 밤의 템스강과 국회의사당을 강렬한 원색으로 그렸습니다."}]]},{"n":"라울 뒤피","o":"Raoul Dufy","l":"1877–1953","d":"1905년 마티스의 〈호사, 평온, 쾌락〉을 보고 야수주의에 합류했습니다. 이후 경쾌한 선과 맑은 색면을 겹치는 독자적인 화풍으로 바다, 경마장, 축제를 그린 '기쁨의 화가'입니다.","at":2,"w":[["트루빌의 포스터","Les Affiches à Trouville","1906","pompidou","File:Les Affiches à Trouville.jpg",{"tip":"노르망디 휴양지 트루빌의 산책로에 늘어선 광고 포스터를 그린 작품입니다. 화려한 포스터의 색면에서 야수파의 영향이 드러납니다."}],["깃발로 장식된 거리","La Rue pavoisée","1906","pompidou","File:La Rue pavoisée.jpg",{"tip":"프랑스 혁명 기념일에 삼색기로 장식된 거리를 그렸습니다. 거리를 가득 채운 깃발의 빨강, 파랑, 흰색이 경쾌한 리듬을 만듭니다."}],["전기 요정","La Fée Électricité","1937","mamparis","La Fée Électricité",{"cr":1,"tip":"1937년 파리 만국박람회를 위해 그린 길이 약 60m의 대형 벽화로, 전시실 한 곳을 빙 둘러쌉니다."}],["레스타크의 나무들","Trees at L'Estaque","1908","pompidou","File:Dufy, Arbres à l'Estaque.jpg",{"tip":"브라크와 함께 레스타크에서 그린 작품으로, 세잔과 입체주의의 영향이 보입니다."}],["카우스의 요트 경기","Regatta at Cowes","1934","nga","x",{"tip":"영국 와이트섬 카우스의 요트 경기를 그렸습니다. 윤곽선과 색이 서로 어긋나게 칠해진 뒤피 특유의 경쾌한 화법이 잘 드러납니다.","cr":1}],["열린 창문, 니스","Open Window, Nice","1928","aic","x",{"tip":"니스의 실내에서 열린 창문 너머 바다와 해안을 바라본 장면입니다. 푸른색이 실내와 바깥 풍경을 하나로 이어 줍니다.","cr":1}],["화가의 작업실","The Artist's Studio","1935","phillips","x",{"tip":"뒤피가 1911년부터 평생 쓴 파리 겔마 골목의 작업실을 그렸습니다. 벽에 걸린 그림들과 가구가 가벼운 필치로 묘사되어 있습니다.","cr":1}],["30년 혹은 장밋빛 인생","Thirty Years, or La Vie en Rose","1931","mamparis","x",{"cr":1,"tip":"작업실 벽과 이젤에 그동안 그린 그림들이 가득한 모습을 분홍빛 화면에 담아, 화가로 보낸 30년을 돌아본 작품입니다."}]]},{"n":"앙리 루소","o":"Henri Rousseau","l":"1844–1910","d":"세관원 출신의 독학 화가. 소박하고 환상적인 화풍으로 피카소와 초현실주의자들에게 사랑받았습니다.","w":[["잠자는 집시","The Sleeping Gypsy","1897","moma","The Sleeping Gypsy",{"tip":"달밤의 사막에서 잠든 여인과 그 곁에 다가온 사자를 그렸습니다. 고요하고 꿈같은 분위기로 훗날 초현실주의자들에게 사랑받았습니다."}],["꿈","The Dream","1910","moma","The Dream (Rousseau painting)",{"tip":"정글 한가운데 놓인 소파에 누운 여인을 그린 루소 말년의 대작입니다. 여인이 꿈속에서 정글로 옮겨 왔다고 화가가 시로 설명했습니다."}],["놀람! (열대 폭풍 속의 호랑이)","Surprised!","1891","ngl","Tiger in a Tropical Storm (Surprised!)",{"tip":"번개 치는 폭풍 속 정글에서 호랑이가 몸을 웅크린 장면입니다. 루소는 프랑스를 떠난 적이 없으며 파리 식물원 등에서 본 식물을 바탕으로 정글을 그렸습니다."}],["뱀을 부리는 여인","The Snake Charmer","1907","orsay","File:Henri Rousseau, known as le Douanier - The Snake Charmer - Google Art Project.jpg",{"tip":"달빛 아래 정글에서 피리를 부는 검은 여인과 그 소리에 이끌린 뱀들을 그렸습니다. 화가 로베르 들로네의 어머니가 주문한 작품입니다."}],["전쟁","War","1894","orsay","File:Rousseau - La Guerre, Vers 1894, RF 1946 1.jpg",{"tip":"검은 말을 탄 전쟁의 화신이 시체가 널린 들판 위를 질주하는 장면입니다. 칼과 횃불을 든 인물과 시체를 쪼는 까마귀가 전쟁의 참상을 드러냅니다."}],["사육제의 저녁","A Carnival Evening","1886","philly","File:Henri-Julien-Félix Rousseau, French - Carnival Evening - Google Art Project.jpg",{"tip":"사육제 의상을 입은 남녀가 달빛 비치는 겨울 숲속에 서 있습니다. 앙데팡당전에 처음 출품한 작품 가운데 하나입니다."}],["축구하는 사람들","The Football Players","1908","guggenheim","File:Henri Rousseau - The Football Players.jpg",{"tip":"줄무늬 옷을 입은 남자들이 가을 공원에서 공을 다투는 장면으로, 실제 경기는 럭비에 가깝습니다. 인물들의 뻣뻣한 동작이 춤추는 듯 보입니다."}],["적도의 정글","The Equatorial Jungle","1909","nga","File:Henri Rousseau, The Equatorial Jungle, 1909, NGA 46688.jpg",{"tip":"빽빽한 열대 식물 사이로 동물들이 숨어 있는 정글을 그렸습니다. 루소는 프랑스를 떠난 적이 없고 파리 식물원을 다니며 정글을 상상했습니다."}],["호랑이와 물소의 싸움","Fight Between a Tiger and a Buffalo","1908","cleveland","File:Henri Rousseau - Fight between a Tiger and a Buffalo - 1949.186 - Cleveland Museum of Art.jpg",{"tip":"울창한 정글 한가운데서 호랑이가 물소를 덮치는 장면입니다. 극적인 사건과 달리 수많은 잎사귀는 정밀하고 고요하게 그려져 있습니다."}],["사자의 식사","The Repast of the Lion","1907경","met","File:The Repast of the Lion MET DT50.jpg",{"tip":"정글 속에서 사자가 먹이를 물어뜯고 있습니다. 거대한 꽃과 잎이 장식적으로 반복되어 소박하면서도 환상적인 분위기를 만듭니다."}],["즐거운 광대들","The Merry Jesters","1906","philly","File:Rousseau - The Merry Jesters, 1906, 1950-134-176.jpg",{"tip":"열대 숲 속에서 원숭이들이 우유병과 등긁이를 가지고 노는 모습입니다. 사람 흉내를 내는 원숭이들의 표정이 익살스럽습니다."}]]}]},{"id":"expressionism","name":"표현주의","en":"Expressionism","years":"1905년 – 1925년","s":1905,"e":1925,"color":"#a3361f","sum":"외부 세계의 재현보다 화가 내면의 불안, 고독, 분노를 왜곡된 형태와 강렬한 색으로 드러낸 흐름입니다. 독일에서 크게 꽃피었습니다. 1905년 드레스덴의 '다리파(Die Brücke)'와 1911년 뮌헨의 '청기사파(Der Blaue Reiter)'가 대표적인 그룹입니다.","traits":["불안과 고통 같은 내면 감정의 표출","형태의 과장·왜곡과 거친 붓질","도시의 소외, 전쟁 전야의 불안","목판화의 부활 (다리파)","풍경에도 스며든 불안과 죽음의 기운 (실레의 크루마우 '죽음의 도시' 연작)"],"diff":"야수주의가 색의 기쁨과 조화를 추구했다면, 표현주의는 같은 강렬한 색으로 불안과 고통을 말합니다.","note":"뭉크는 상징주의에서 출발했으며 표현주의의 선구자로 평가됩니다. 칸딘스키는 청기사파를 함께 만들었지만 이 사이트에서는 추상미술에서 다룹니다.","artists":[{"n":"에드바르 뭉크","o":"Edvard Munch","l":"1863–1944","d":"사랑, 불안, 죽음을 그린 노르웨이 화가. 표현주의의 선구자입니다.","w":[["절규","The Scream","1893","oslo","The Scream",{"tip":"여러 버전이 있습니다. 1893년 템페라·크레용 버전은 국립미술관, 1910년 버전 등은 오슬로 뭉크 미술관(MUNCH)에 있습니다."}],["생의 춤","The Dance of Life","1899–1900","oslo","File:Edvard Munch - The Dance of Life - NG.M.00941 - National Museum of Art, Architecture and Design.jpg",{"tip":"달빛 비치는 해변에서 남녀들이 춤추는 장면입니다. 왼쪽 흰 옷, 가운데 붉은 옷, 오른쪽 검은 옷의 여인이 사랑과 삶의 단계를 상징합니다."}],["병든 아이","The Sick Child","1885–1886","oslo","The Sick Child (Munch)",{"tip":"결핵으로 세상을 떠난 누나 소피에를 떠올리며 그렸습니다. 긁고 덧칠한 거친 표면이 특징이며, 뭉크는 평생 이 주제를 여러 번 다시 그렸습니다."}],["마돈나","Madonna","1894–1895","oslo","Madonna (Munch)",{"tip":"여러 버전이 있으며 뭉크 미술관과 함부르크 쿤스트할레에도 있습니다."}],["불안","Anxiety","1894","munch","Anxiety (Munch)",{"tip":"절규와 같은 붉은 하늘과 피오르 풍경 앞으로 창백한 얼굴의 사람들이 정면을 향해 걸어오고 있습니다."}],["다리 위의 소녀들","The Girls on the Bridge","1901","oslo","File:Edvard Munch - The Girls on the Bridge - NG.M.00844 - National Museum of Art, Architecture and Design.jpg",{"tip":"여름 마을 오스고르스트란의 다리 난간에 기대선 소녀들을 그렸습니다. 뭉크는 이 주제를 여러 버전으로 반복해 그렸습니다."}],["시계와 침대 사이의 자화상","Self-Portrait: Between the Clock and the Bed","1940–1943","munch","File:Edvard Munch, Selvportrett. Mellom klokken og sengen.JPG",{"tip":"여든을 앞둔 말년에 삶과 죽음 사이에 선 자신을 그린 마지막 자화상 가운데 하나입니다."}],["사춘기","Puberty","1894–1895","oslo","File:Edvard Munch - Puberty - NG.M.00807 - National Museum of Art, Architecture and Design.jpg",{"tip":"침대 가장자리에 벌거벗은 채 앉은 소녀를 그린 작품으로, 소녀 뒤에 드리운 커다란 검은 그림자가 불안한 분위기를 더합니다."}],["담배를 든 자화상","Self-Portrait with Cigarette","1895","oslo","File:Edvard Munch - Self-Portrait with Cigarette - NG.M.00470 - National Museum of Art, Architecture and Design.jpg",{"tip":"담배 연기에 싸인 채 어둠 속에서 정면을 바라보는 화가 자신을 그렸습니다. 아래에서 비추는 듯한 빛이 얼굴과 손을 유령처럼 떠오르게 합니다."}],["뱀파이어","Vampire","1895","munch","File:Edvard Munch - Vampire - MM.M.00292 - Munch Museum.jpg",{"tip":"붉은 머리카락의 여인이 남자의 목덜미에 얼굴을 묻고 있는 장면입니다. 뭉크는 원래 '사랑과 고통'이라는 제목을 붙였고, '뱀파이어'라는 이름은 비평가가 붙였습니다."}],["별이 빛나는 밤","Starry Night","1893","getty","File:'Starry Night' by Edvard Munch, 1893, Getty Center.JPG",{"tip":"뭉크가 여름을 보내던 해변 마을 오스고르스트란의 밤 풍경으로, 짙푸른 하늘과 물 위에 비친 별빛이 고요하면서도 서늘한 분위기를 자아냅니다."}]]},{"n":"에른스트 루트비히 키르히너","o":"Ernst Ludwig Kirchner","l":"1880–1938","d":"다리파의 창립자. 베를린 거리의 긴장감을 날카롭게 그렸습니다.","w":[["베를린 거리 풍경","Berlin Street Scene","1913","neue","Berlin Street Scene",{"tip":"화려하게 차려입은 여인들과 신사들이 오가는 베를린 거리를 그렸습니다. 길게 늘어난 인물과 날카로운 붓질에 대도시의 긴장감이 담겨 있습니다."}],["드레스덴의 거리","Street, Dresden","1908","moma","File:Kirchner - Street, Dresden, 1908, 12.1951.jpg",{"tip":"드레스덴 번화가를 걷는 사람들을 강렬한 분홍과 주황으로 그렸습니다. 가면 같은 얼굴들이 군중 속의 고립감을 드러냅니다."}],["포츠담 광장","Potsdamer Platz","1914","neuenat","File:Ernst Ludwig Kirchner - Potsdamer Platz.jpg",{"tip":"베를린 포츠담 광장의 교통섬 위에 선 두 여인을 크게 그렸습니다. 기울어진 바닥과 뒤편의 역 건물이 도시의 불안한 분위기를 키웁니다."}],["군인으로서의 자화상","Self-Portrait as a Soldier","1915","oberlin","Self-Portrait as a Soldier",{"tip":"군복 차림의 화가가 잘린 오른손을 들고 서 있고 뒤로 누드 모델이 보입니다. 실제로 손을 잃은 것은 아니며, 전쟁으로 그림을 못 그리게 될 두려움을 표현했습니다."}],["모델과 함께 있는 자화상","Self-Portrait with Model","1910","hamburg","File:Kirchner - Selbstbildnis mit Modell 002.jpg",{"tip":"줄무늬 가운을 입고 붓을 든 화가와 뒤편의 모델을 강렬한 원색으로 그렸습니다. 1926년에 화가가 다시 손질한 작품입니다."}],["모리츠부르크의 수영하는 사람들","Bathers at Moritzburg","1909","tatem","File:Ernst Ludwig Kirchner - Badende in Moritzburg.jpg",{"tip":"드레스덴 근교 모리츠부르크 호숫가에서 화가들과 모델들이 자연 속에서 어울리던 여름을 그렸습니다. 다리파가 추구한 자유로운 삶이 담겨 있으며, 1926년에 다시 손질했습니다."}],["조각 의자 앞의 프렌치","Fränzi in Front of Carved Chair","1910","thyssen","File:Ernst Ludwig Kirchner - Fränzi vor geschnitztem Stuhl - Google Art Project.jpg",{"tip":"다리파 화가들의 모델이었던 소녀 프렌치를 초록빛 얼굴과 강렬한 색채로 그렸습니다. 뒤로 조각 장식이 있는 화실의 의자가 보입니다."}]]},{"n":"프란츠 마르크","o":"Franz Marc","l":"1880–1916","d":"청기사파의 공동 창립자. 동물을 상징적인 색으로 그렸고 1차 대전에서 전사했습니다.","w":[["큰 푸른 말들","The Large Blue Horses","1911","walker","File:Franz Marc - Die großen blauen Pferde 1911.jpg",{"tip":"세 마리의 푸른 말이 붉은 언덕을 배경으로 한 덩어리처럼 어우러져 있습니다. 마르크에게 파란색은 남성적이고 정신적인 색이었습니다."}],["노란 소","Yellow Cow","1911","guggenheim","Yellow Cow",{"tip":"노란 소가 즐겁게 뛰어오르는 모습을 그렸습니다. 마르크에게 노란색은 부드럽고 여성적인 원리를 상징했습니다."}],["동물들의 운명","Fate of the Animals","1913","basel","Fate of the Animals",{"tip":"쓰러지는 나무와 붉은 빛 속에서 동물들이 파국을 맞는 장면입니다. 화재로 오른쪽 부분이 손상되어, 마르크가 전사한 뒤 친구 파울 클레가 복원했습니다."}],["푸른 말 I","Blue Horse I","1911","lenbachhaus","File:Franz Marc Blaues Pferd 1911.jpg",{"tip":"렌바흐하우스는 청기사파 작품을 세계에서 가장 많이 소장한 미술관입니다."}],["호랑이","The Tiger","1912","lenbachhaus","File:Franz Marc - Tiger - G 13320 - Lenbachhaus.jpg",{"tip":"바위 위에 웅크린 호랑이를 입체주의풍의 각진 면과 강렬한 노란색으로 표현했습니다. 쉬고 있지만 언제든 뛰어오를 듯한 긴장감이 느껴집니다."}],["마구간","Stables","1913","guggenheim","File:Stables by Franz Marc, 1913.JPG",{"tip":"마구간 안의 말들을 빨강·파랑·노랑의 기하학적 면으로 쪼개어 표현했습니다. 형태가 해체되며 추상으로 나아가던 시기의 작품입니다."}],["마법에 걸린 물레방아","The Bewitched Mill","1913","aic","File:Franz Marc - The Bewitched Mill - Google Art Project.jpg",{"tip":"숲속 물레방아와 흐르는 물을 둥근 형태와 밝은 색채로 표현했습니다. 들로네의 영향을 받은 리듬감 있는 색면이 특징입니다."}]]},{"n":"에곤 실레","o":"Egon Schiele","l":"1890–1918","d":"클림트의 후배. 뒤틀린 선으로 적나라한 인간의 몸과 내면을 그렸습니다.","w":[["꽈리 열매가 있는 자화상","Self-Portrait with Physalis","1912","leopold","File:Egon Schiele - Self-Portrait with Physalis - Google Art Project.jpg",{"tip":"고개를 비스듬히 기울인 화가 곁에 붉은 꽈리 열매가 그려져 있습니다. 연인 발리의 초상과 짝을 이루는 작품입니다."}],["발리의 초상","Portrait of Wally","1912","leopold","Portrait of Wally",{"tip":"연인 발리 노이칠을 그린 작은 초상화입니다. 뉴욕 전시 뒤 나치 약탈 문제로 압류되어 10여 년의 소송 끝에 빈으로 돌아왔습니다."}],["포옹","The Embrace","1917","belvedere","File:Egon Schiele - Die Umarmung - 4438 - Österreichische Galerie Belvedere.jpg",{"tip":"흰 천 위에서 서로를 끌어안은 남녀를 그렸습니다. 날카롭던 초기 화풍에 비해 한결 부드러워진 후기의 선을 볼 수 있습니다."}],["가족","The Family","1918","belvedere","The Family (Schiele)",{"tip":"화가 자신과 여인, 아이를 함께 그린 가족 초상입니다. 그해 가을 임신 중이던 아내 에디트와 실레가 스페인 독감으로 사흘 간격으로 세상을 떠났습니다."}],["죽음의 도시 III (푸른 강가의 도시 III)","Dead City III","1911","leopold","File:Egon Schiele - Dead City III (City on the Blue River III) - Google Art Project.jpg",{"tip":"어머니의 고향인 체코 크루마우(지금의 체스키크룸로프)를 내려다본 풍경입니다. 실레는 이 마을을 '죽음의 도시'라 부르며 여러 번 그렸습니다."}],["강가의 집들 (옛 도시)","Houses on the River (The Old Town)","1914","thyssen","File:Egon Schiele - Häuser am Fluss.jpg",{"tip":"강가에 바짝 붙어 늘어선 오래된 집들을 그렸습니다. 창문과 벽, 지붕을 평면적인 색면처럼 짜 맞춘 구성을 살펴보세요."}],["크루마우 집들의 반원 (작은 도시 V)","Krumau – Crescent of Houses (The Small City V)","1915","israel","File:Egon Schiele - Krumau - Crescent of Houses (The small City V) - Google Art Project.jpg",{"tip":"크루마우의 집들이 굽이치는 강을 따라 반달 모양으로 빽빽이 늘어서 있습니다. 창문과 지붕을 평면적인 무늬처럼 배치한 점이 눈에 띕니다."}],["강가의 집 벽","House Wall on the River","1915","leopold","File:Egon Schiele - House Wall on the River - Google Art Project.jpg",{"tip":"블타바강에 바로 맞닿은 크루마우의 집 벽을 정면에서 평면적으로 그렸습니다."}],["죽음과 소녀","Death and the Maiden","1915","belvedere","File:Egon Schiele - Tod und Mädchen - 3171 - Österreichische Galerie Belvedere.jpg",{"tip":"연인 발리와 헤어지고 에디트와 결혼하던 무렵의 심정을 담은 그림으로 해석됩니다."}],["네 그루의 나무","Four Trees","1917","belvedere","File:Egon Schiele - Vier Bäume - 3917 - Österreichische Galerie Belvedere.jpg",{"tip":"노을 진 하늘 아래 나란히 선 네 그루의 나무를 그린 풍경화입니다. 가로로 층을 이룬 하늘과 언덕이 차분한 리듬을 만듭니다."}],["화가의 아내, 에디트 실레의 초상","Portrait of Edith Schiele","1918","belvedere","File:Egon Schiele - Bildnis der Frau des Künstlers, Edith Schiele - 1991 - Österreichische Galerie Belvedere.jpg",{"tip":"그해 가을 에디트와 실레는 스페인 독감으로 사흘 간격으로 세상을 떠났습니다."}],["추기경과 수녀(애무)","Cardinal and Nun (Caress)","1912","leopold","File:Egon Schiele - Cardinal and Nun (Caress) - Google Art Project.jpg",{"tip":"추기경과 수녀가 부둥켜안은 모습을 그린 도발적인 작품입니다. 클림트의 '키스'를 의식한 구도로 알려져 있습니다."}],["은둔자들","Hermits","1912","leopold","File:Egon Schiele - The Hermits - Google Art Project.jpg",{"tip":"검은 옷을 입은 두 인물이 겹쳐 서 있는 모습으로, 앞의 인물은 실레 자신, 뒤의 인물은 클림트로 해석됩니다."}],["에두아르트 코스마크의 초상","Portrait of Eduard Kosmack","1910","belvedere","File:Egon Schiele - Eduard Kosmack - 4702 - Österreichische Galerie Belvedere.jpg",{"tip":"출판인 에두아르트 코스마크가 정면을 응시하며 뻣뻣하게 앉아 있는 모습입니다. 강렬한 시선과 긴장된 손이 인물의 내면을 드러냅니다."}],["자기를 보는 사람 II (죽음과 남자)","Self-Seers II (Death and Man)","1911","leopold","File:Egon Schiele - Self-Seer II (Death and Man) - Google Art Project.jpg",{"tip":"화가 자신과 그 뒤에 겹쳐 선 창백한 형상을 그린 이중 자화상입니다. 뒤의 인물은 죽음으로 해석되며, 삶과 죽음에 대한 실레의 집착이 드러납니다."}],["두 아이와 어머니 III","Mother with Two Children III","1915–1917","belvedere","File:Egon Schiele - Mutter mit zwei Kindern III - 4473 - Österreichische Galerie Belvedere.jpg",{"tip":"창백한 얼굴의 어머니가 알록달록한 옷을 입은 두 아이를 안고 있습니다. 생기 있는 아이들과 지친 어머니의 대비가 눈에 띕니다."}]]},{"n":"오스카어 코코슈카","o":"Oskar Kokoschka","l":"1886–1980","d":"빈 표현주의의 대표 화가입니다.","w":[["바람의 신부","The Bride of the Wind","1913–1914","basel","The Bride of the Wind",{"cr":1,"tip":"폭풍 속 조각배 같은 공간에 코코슈카 자신과 연인 알마 말러가 누워 있습니다. 알마는 평온히 잠들어 있고 화가는 불안하게 눈을 뜨고 있습니다."}],["퇴폐 예술가로서의 자화상","Self-Portrait of a 'Degenerate Artist'","1937","snmga","x",{"cr":1,"tip":"나치가 그의 작품을 '퇴폐 미술'로 몰아 압수하자 이에 맞서 그린 자화상입니다."}],["한스 티체와 에리카 티체콘라트","Hans Tietze and Erica Tietze-Conrat","1909","moma","x",{"cr":1,"tip":"미술사학자 부부를 그린 2인 초상으로, 닿을 듯 말 듯한 두 사람의 손이 관계를 말해 줍니다. 배경에는 물감을 긁어낸 흔적이 남아 있습니다."}],["방랑하는 기사","Knight Errant","1915","guggenheim","x",{"cr":1,"tip":"갑옷 입은 기사가 황량한 풍경 위에 떠 있으며, 기사의 얼굴은 화가 자신입니다. 알마 말러와 헤어진 뒤 입대할 무렵 그린 작품입니다."}],["양과 히아신스가 있는 정물","Still Life with Lamb and Hyacinth","1910","belvedere","x",{"tip":"도살된 양과 히아신스 화분 등을 어두운 색조로 그린 정물로, 죽음과 생명이 대비를 이룹니다.","cr":1}],["타이곤","The Tigon","1926","belvedere","x",{"tip":"런던 동물원에서 본 호랑이와 사자의 잡종을 그린 작품으로, 먹이를 향해 달려드는 순간을 거친 붓질로 담았습니다.","cr":1}],["아우구스트 포렐의 초상","Portrait of Auguste Forel","1910","mannheim","x",{"tip":"스위스의 정신의학자이자 개미 연구자인 아우구스트 포렐을 그린 초상으로, 굽은 손과 깊은 눈매에 노학자의 내면을 담으려 했습니다.","cr":1}]]}]},{"id":"cubism","name":"입체주의","en":"Cubism","years":"1907년 – 1920년대","s":1907,"e":1925,"color":"#6b5a45","sum":"피카소와 브라크가 세잔의 가르침을 극단까지 밀어붙여 탄생시켰습니다. 대상을 여러 시점에서 본 모습을 기하학적 조각으로 쪼개 한 화면에 재구성했습니다.","traits":["여러 시점을 한 화면에 동시에 표현","형태를 기하학적 면으로 분해","분석적 입체주의(1909–1912): 갈색·회색 위주로 형태 분해","종합적 입체주의(1912–): 신문지 등을 붙이는 콜라주(파피에 콜레)","오르피즘: 입체주의에 밝은 색과 리듬을 더함 (들로네)","원통 형태로 기계 시대를 그린 '튜비즘' (레제)"],"diff":"르네상스 이후 500년 가까이 이어진 '한 시점에서 본 원근법'을 무너뜨린, 20세기 가장 근본적인 혁명입니다.","artists":[{"n":"파블로 피카소","o":"Pablo Picasso","l":"1881–1973","d":"입체주의의 공동 창시자. 평생 끊임없이 양식을 바꾼 20세기 최고의 화가입니다.","w":[["아비뇽의 처녀들","Les Demoiselles d'Avignon","1907","moma","Les Demoiselles d'Avignon",{"cr":1,"tip":"바르셀로나 아비뇨 거리 사창가의 다섯 여인을 그렸습니다. 오른쪽 두 인물의 가면 같은 얼굴은 입체주의로 가는 출발점이 되었습니다."}],["게르니카","Guernica","1937","reina","Guernica (Picasso)",{"cr":1,"tip":"게르니카 전시실은 사진 촬영이 금지됩니다."}],["우는 여인","The Weeping Woman","1937","tatem","The Weeping Woman",{"cr":1,"tip":"연인 도라 마르를 모델로 손수건을 입에 문 채 우는 여인을 그렸습니다. 같은 해 그린 게르니카의 슬픔을 이어받은 작품입니다."}],["늙은 기타리스트","The Old Guitarist","1903–1904","aic","The Old Guitarist",{"cr":1,"tip":"청색 시대의 대표작으로, 눈먼 노인이 몸을 웅크린 채 기타를 치고 있습니다. 표면 아래 먼저 그렸던 다른 인물의 흔적이 희미하게 비쳐 보입니다."}],["인생","La Vie","1903","cleveland","La Vie (painting)",{"cr":1,"tip":"청색 시대의 대작으로, 왼쪽 남자의 얼굴은 스스로 목숨을 끊은 친구 카사헤마스입니다. X선 조사로 원래는 피카소 자신의 얼굴이었음이 밝혀졌습니다."}],["거트루드 스타인의 초상","Portrait of Gertrude Stein","1905–1906","met","Portrait of Gertrude Stein",{"cr":1,"tip":"여러 차례 모델을 세운 끝에 얼굴을 지웠다가 이베리아 조각의 영향을 받아 가면 같은 얼굴로 다시 그렸습니다. 닮지 않았다는 말에 피카소는 결국 닮게 될 것이라 답했다고 합니다."}],["세 악사","Three Musicians","1921","moma","Three Musicians",{"cr":1,"tip":"같은 해 그린 다른 버전은 필라델피아 미술관에 있습니다."}],["과학과 자비","Science and Charity","1897","museupicasso","x",{"cr":1,"tip":"열다섯 살에 그린 아카데미 양식의 대작입니다. 바르셀로나 피카소 미술관은 소년 시절 작품을 특히 많이 소장하고 있습니다."}],["다림질하는 여인","Woman Ironing","1904","guggenheim","x",{"cr":1,"tip":"앙상한 여인이 온 힘을 다해 다림질하는 모습을 회색빛 톤으로 그렸습니다. 청색 시대 말기, 가난한 노동자에 대한 관심이 드러나는 작품입니다."}],["세 무용수","The Three Dancers","1925","tatem","x",{"cr":1,"tip":"세 인물이 격렬하게 춤추는 장면입니다. 작업 중 친구 라몬 피초트가 세상을 떠났고, 피카소는 이 그림이 그의 죽음과 관련 있다고 말했습니다."}],["거울 앞의 소녀","Girl before a Mirror","1932","moma","x",{"cr":1,"tip":"연인 마리테레즈 발테르를 모델로 거울 앞에 선 여인을 그렸습니다. 밝은 실제 모습과 달리 거울 속 모습은 어둡고 일그러져 있습니다."}],["곡예사 가족","Family of Saltimbanques","1905","nga","x",{"tip":"황량한 들판에 선 떠돌이 곡예사 가족을 그린 장미 시대의 대표작입니다. 인물들이 서로 시선을 마주치지 않아 고독한 분위기가 감돕니다.","cr":1}],["한국에서의 학살","Massacre in Korea","1951","picassoparis","x",{"tip":"한국전쟁 중 민간인 학살을 주제로, 무장한 군인들이 벌거벗은 여인과 아이들에게 총을 겨누는 장면입니다. 고야의 '1808년 5월 3일' 구도를 이어받았습니다.","cr":1}],["도라 마르의 초상","Portrait of Dora Maar","1937","picassoparis","x",{"tip":"연인이자 사진가였던 도라 마르의 얼굴을 정면과 옆모습을 겹쳐 그렸습니다. 도라 마르는 같은 해 '게르니카'의 제작 과정을 사진으로 기록했습니다.","cr":1}],["마리테레즈의 초상","Portrait of Marie-Thérèse","1937","picassoparis","x",{"cr":1,"tip":"연인 마리테레즈 발테르를 밝은 색과 부드러운 곡선으로 그린 초상입니다. 같은 해에 그린 〈도라 마르의 초상〉과 함께 파리 피카소 미술관의 대표 소장품입니다."}],["프랑수아즈의 초상","Portrait of Françoise","1946","picassoparis","x",{"cr":1,"tip":"화가 프랑수아즈 질로를 연필과 목탄으로 그린 초상 드로잉입니다. 종이 작품이라 늘 전시되지는 않습니다."}]]},{"n":"조르주 브라크","o":"Georges Braque","l":"1882–1963","d":"피카소와 함께 입체주의를 만들었습니다. '입체주의'라는 이름은 그의 그림에서 나왔습니다.","w":[["레스타크의 집들","Houses at L'Estaque","1908","bern","Houses at L'Estaque",{"cr":1,"tip":"나무 사이로 쌓인 집들을 상자 같은 단순한 형태로 그렸습니다. 이런 그림을 두고 비평가가 '작은 입방체'라고 한 데서 입체주의라는 이름이 나왔습니다."}],["바이올린과 촛대","Violin and Candlestick","1910","sfmoma","Violin and Candlestick",{"cr":1,"tip":"바이올린과 촛대를 잘게 쪼갠 면으로 재구성한 분석적 입체주의 작품입니다. 갈색과 회색 톤 속에서 악기와 촛대의 형태를 찾아보세요."}],["포르투갈 사람","The Portuguese","1911","basel","The Portuguese (Braque)",{"cr":1,"tip":"기타를 든 포르투갈 음악가를 잘게 쪼갠 면으로 그렸습니다. 스텐실로 찍은 글자와 숫자를 처음 그림에 넣은 작품으로 알려져 있습니다."}],["병과 물고기","Bottle and Fishes","1910–1912경","tatem","x",{"cr":1,"tip":"식탁 위의 병과 물고기를 각진 면으로 나눠 그린 정물화입니다. 갈색과 회색만으로 사물의 형태를 겹겹이 쌓아 올린 분석적 입체주의 시기의 작품입니다."}],["과일 그릇과 유리잔","Fruit Dish and Glass","1912","met","x",{"cr":1,"tip":"신문지와 벽지를 오려 붙인 최초의 '파피에 콜레' 작품으로 꼽힙니다."}],["라 시오타의 풍경","Landscape at La Ciotat","1907","moma","x",{"cr":1,"tip":"남프랑스 지중해 항구 마을을 밝은 분홍, 보라, 주황으로 그렸습니다. 입체주의 이전, 야수파 시절의 화풍을 볼 수 있습니다."}],["기타를 든 여인","Woman with a Guitar","1913","pompidou","x",{"cr":1,"tip":"기타를 든 여인을 평평한 색면들을 겹쳐 구성했습니다. 글자와 무늬를 그려 넣어 종이 콜라주처럼 보이게 한 종합적 입체주의 시기의 작품입니다."}],["바이올린과 팔레트","Violin and Palette","1909","guggenheim","x",{"tip":"바이올린과 악보를 잘게 쪼갠 면으로 그렸지만, 위쪽의 못만은 그림자까지 사실적으로 그려 넣었습니다. 환영과 해체를 대비시킨 장치입니다.","cr":1}],["큰 누드","Large Nude","1907–1908","pompidou","x",{"tip":"피카소의 '아비뇽의 처녀들'을 본 뒤 그린 작품으로, 각진 몸과 굵은 윤곽선에서 입체주의로 향하는 출발점을 볼 수 있습니다.","cr":1}],["기타를 든 남자","Man with a Guitar","1911–1912","moma","x",{"tip":"기타를 든 남자를 갈색과 회색의 작은 면으로 해체한 분석적 입체주의 작품입니다. 형태의 단서를 찾아 화면을 천천히 살펴보는 재미가 있습니다.","cr":1}],["새들(루브르 천장화)","The Birds (ceiling)","1953","louvre","x",{"tip":"루브르 박물관 앙리 2세 전실의 천장에 그린 그림으로, 푸른 바탕 위를 나는 검은 새 두 마리가 단순한 형태로 표현되어 있습니다.","cr":1}]]},{"n":"후안 그리스","o":"Juan Gris","l":"1887–1927","d":"명료한 색과 구성으로 종합적 입체주의를 발전시켰습니다.","w":[["파블로 피카소의 초상","Portrait of Pablo Picasso","1912","aic","File:Juan Gris - Portrait of Pablo Picasso - Google Art Project.jpg",{"tip":"그리스가 존경하던 피카소에게 바친 초상으로, 팔레트를 든 모습입니다. 1912년 앙데팡당전에 출품해 화가로서 이름을 알린 작품입니다."}],["아침 식사","Breakfast","1914","moma","File:1914 Gris Le Petit Déjeuner.jpg",{"tip":"커피 잔과 신문 등이 놓인 아침 식탁을 그렸습니다. 벽지와 인쇄물 조각을 직접 붙이고 그 위에 그림을 더한 콜라주 기법을 사용했습니다."}],["차양","The Sunblind","1914","tatem","File:Juan Gris 001.jpg",{"tip":"창가 탁자 위의 정물과 창의 차양을 각진 면으로 나누어 그렸습니다. 신문 조각과 종이를 붙인 콜라주 기법이 쓰였습니다."}],["체크무늬 식탁보가 있는 정물","Still Life with Checked Tablecloth","1915","met","File:Still Life with Checked Tablecloth MET DP332907 ms.jpg",{"tip":"체크무늬 식탁보 위의 정물을 여러 시점에서 본 면들로 짜 맞췄습니다. 선명한 색과 정돈된 구성이 종합적 입체주의의 특징을 보여 줍니다."}],["조세트의 초상","Portrait of Josette","1916","reina","File:Juan Gris - Portrait de Madame Josette Gris - Google Art Project.jpg",{"tip":"화가의 반려자 조세트를 기하학적 면으로 단순화해 그린 초상으로, 차분한 색조와 단단한 구성이 특징입니다."}],["열린 창 앞의 정물: 라비냥 광장","Still Life before an Open Window, Place Ravignan","1915","philly","File:Juan Gris (José Victoriano González Pérez), Spanish - Still Life before an Open Window, Place Ravignan - Google Art Project.jpg",{"tip":"탁자 위의 정물과 창밖 몽마르트르 라비냥 광장의 풍경을 하나의 화면에 겹쳐 놓았습니다. 실내와 실외를 잇는 푸른 색조가 인상적입니다."}],["카페의 남자","The Man in the Café","1912","philly","File:Juan Gris - Man in a Café.jpg",{"tip":"카페에 앉은 신사를 각진 면으로 분할해 그린 작품으로, 입체주의에 뛰어든 초기의 대작입니다."}]]},{"n":"페르낭 레제","o":"Fernand Léger","l":"1881–1955","d":"원통형 형태의 '튜비즘'으로 기계 시대를 그렸습니다.","w":[["도시","The City","1919","philly","The City (Léger)",{"tip":"간판, 철골, 계단 위의 기계 같은 인물들을 선명한 색면으로 조합해 현대 도시의 리듬을 표현한 대작입니다."}],["세 여인","Three Women","1921","moma","File:Trois Femmes Fernand Léger.jpg",{"tip":"세 명의 누드 여인이 실내에서 커피를 마시는 장면을 매끈한 원통형 몸으로 그렸습니다. 고전적 누드를 기계 시대의 감각으로 다시 해석했습니다."}],["형태의 대비","Contrast of Forms","1913","philly","File:Contrast of Forms, 1913-1914 - Fernand Léger.png",{"tip":"원통과 원뿔 같은 형태를 빨강, 파랑, 흰색으로 대비시킨 추상화입니다. 굵은 붓 자국이 남은 흰 하이라이트가 형태에 입체감을 줍니다."}],["숲속의 누드","Nudes in the Forest","1909–1911","kroller","File:Fernand Léger, 1910, Nudes in the forest (Nus dans la forêt), oil on canvas, 120 x 170 cm, Kröller-Müller Museum.jpg",{"tip":"숲속에서 나무를 베는 사람들을 원통과 덩어리 같은 형태로 그렸습니다. 이 무렵 레제의 화풍에는 '튜비즘'이라는 별명이 붙었습니다."}],["카드놀이 하는 사람들","The Card Players","1917","kroller","File:La-partie-de-cartes-fernand-leger-kroller-muller-museum.jpg",{"tip":"1차 세계대전에 참전한 레제가 전선에서 본 병사들을 금속 기계처럼 원통형으로 표현했습니다. 전쟁 경험이 그의 기계적 양식을 낳았습니다."}],["여가 – 루이 다비드에게 바치는 경의","Leisure – Homage to Louis David","1948–1949","pompidou","File:Les Loisirs-Hommage à Louis David.png",{"tip":"자전거와 함께 휴일을 즐기는 노동자 가족을 그렸습니다. 한 인물이 든 종이에 '루이 다비드에게 경의를'이라는 문구가 적혀 있습니다."}],["흡연자들","The Smokers","1911–1912","guggenheim","File:Fernand Léger, 1911-1912, Les Fumeurs (The Smokers), oil on canvas, 129.2 x 96.5 cm, Solomon R. Guggenheim Museum, New York..jpg",{"tip":"담배를 피우는 인물과 피어오르는 연기, 바깥 풍경을 둥근 입체 덩어리로 쪼개어 표현한 초기 입체주의 작품입니다."}]]},{"n":"로베르 들로네","o":"Robert Delaunay","l":"1885–1941","d":"입체주의에 밝은 색과 리듬을 더한 '오르피즘'을 이끌었습니다.","w":[["에펠탑","Eiffel Tower","1911","guggenheim","File:Robert Delaunay - Eiffel Tower - 1911 - Solomon R. Guggenheim Museum.jpg",{"tip":"에펠탑을 여러 시점에서 본 조각들로 나누어 흔들리며 무너지는 듯한 모습으로 그렸습니다. 들로네는 에펠탑을 주제로 여러 점의 연작을 남겼습니다."}],["도시의 동시적 창들","Simultaneous Windows on the City","1912","hamburg","File:Robert Delaunay, 1912, Les Fenêtres simultanée sur la ville (Simultaneous Windows on the City), 40 x 46 cm, Kunsthalle Hamburg.jpg",{"tip":"창 너머 도시 풍경을 투명하게 겹치는 색면들로 분해했습니다. 형태보다 색의 대비만으로 빛과 움직임을 표현하려 한 '창' 연작의 하나입니다."}],["파리 시","The City of Paris","1910–1912","pompidou","File:Robert Delaunay, 1912, La Ville de Paris, oil on canvas, 267 × 406 cm, Musée National d'Art Moderne.jpg",{"tip":"가운데 세 미의 여신을 두고 왼쪽에 센강 변 풍경, 오른쪽에 에펠탑을 배치한 대작입니다. 고전과 현대 파리를 한 화면에 결합했습니다."}],["블레리오에게 바치는 경의","Homage to Blériot","1914","basel","File:Robert Delaunay, Hommage à Blériot, 1914.jpg",{"tip":"1909년 비행기로 영국 해협을 처음 횡단한 블레리오를 기린 작품입니다. 프로펠러와 원반 모양의 색 고리들이 비행의 회전과 빛을 표현합니다."}],["동시적 대비: 해와 달","Simultaneous Contrasts: Sun and Moon","1913","moma","File:Robert Delaunay - Simultaneous Contrasts-Sun and Moon - 1912.jpg",{"tip":"해와 달을 동심원의 색 원반으로 표현해, 색의 대비만으로 빛과 움직임을 나타내려 했습니다."}],["카디프 팀","The Cardiff Team","1912–1913","mamparis","File:Robert Delaunay, 1913, L'Équipe de Cardiff, oil on canvas, 326 × 208 cm, Musée d'Art Moderne de la ville de Paris.jpg",{"tip":"럭비 선수들 뒤로 에펠탑과 관람차, 비행기, 광고판이 어우러진 현대 도시의 활기를 담았습니다."}],["생세브랭 3번","Saint-Séverin No. 3","1909–1910","guggenheim","File:GUGG Saint-Séverin No. 3.jpg",{"tip":"파리 생세브랭 성당의 고딕 회랑을 휘어지고 기울어진 기둥으로 그렸습니다. 빛에 의해 형태가 흔들리는 듯한 효과를 탐구한 연작입니다."}]]}],"note":"피카비아의 〈우드니〉(1913)도 이 무렵 입체주의·오르피즘에 가까운 작품입니다. 피카비아는 이후 다다로 옮겨 가 「다다와 초현실주의」 전시실에서 다룹니다."},{"id":"futurism","name":"미래주의","en":"Futurism","years":"1909년 – 1916년","s":1909,"e":1916,"color":"#a04823","sum":"1909년 시인 마리네티의 〈미래주의 선언〉으로 시작된 이탈리아 운동입니다. 과거의 미술관을 불태우자고 외치며 속도, 기계, 도시, 역동성을 찬미했습니다.","traits":["속도와 움직임의 연속 동작 표현","입체주의의 분해 기법 + 강렬한 색과 운동감","자동차, 기차, 산업 도시"],"diff":"입체주의가 정지한 사물을 여러 각도로 쪼갰다면, 미래주의는 움직이는 대상을 시간 속에서 쪼갰습니다.","artists":[{"n":"움베르토 보초니","o":"Umberto Boccioni","l":"1882–1916","d":"미래주의 최고의 화가이자 조각가. 1차 대전 중 사망했습니다.","w":[["도시가 일어나다","The City Rises","1910","moma","The City Rises",{"tip":"거대한 붉은 말과 노동자들이 뒤엉켜 건설 중인 도시의 에너지를 표현했습니다. 미래주의 회화의 첫 대작으로 꼽힙니다."}],["공간 속 연속성의 독특한 형태 (조각)","Unique Forms of Continuity in Space","1913","moma","Unique Forms of Continuity in Space",{"tip":"걸어가는 인체가 공기를 가르며 흐르는 듯한 형태로 표현된 청동 조각입니다. 이탈리아의 20센트 유로 동전에도 새겨져 있습니다."}],["마음의 상태: 이별","States of Mind I: The Farewells","1911","moma","File:Boccioni - States of Mind The Farewells, 1911.jpg",{"tip":"기차역에서 이별하는 사람들의 감정을 소용돌이치는 선과 기관차로 표현했습니다. '마음의 상태' 3부작 가운데 첫 번째 작품입니다."}],["거리가 집 안으로 들어오다","The Street Enters the House","1911","sprengel","The Street Enters the House",{"tip":"발코니에서 거리를 내려다보는 여인의 뒷모습을 그렸습니다. 건물과 소음이 집 안으로 밀려드는 듯 사방으로 휘어진 공간이 특징입니다."}],["축구 선수의 역동성","Dynamism of a Soccer Player","1913","moma","Dynamism of a Soccer Player",{"tip":"공을 차는 선수의 움직임을 소용돌이치는 색과 형태로 분해해 속도와 에너지를 표현했습니다."}],["탄력","Elasticity","1912","novecento","File:Umberto Boccioni, 1912, Elasticity (Elasticità), oil on canvas, 100 x 100 cm, Museo del Novecento.jpg",{"tip":"질주하는 말과 기수를 배경의 공장, 전신주와 뒤섞어 움직임이 공간으로 퍼져 나가는 느낌을 담았습니다."}],["인체의 역동성","Dynamism of a Human Body","1913","novecento","File:Boccioni - dynamism-of-a-human-body.jpg",{"tip":"달리는 인체를 근육의 덩어리와 색면으로 분해해, 몸이 공간을 가르는 힘을 표현했습니다."}]]},{"n":"자코모 발라","o":"Giacomo Balla","l":"1871–1958","d":"움직임을 연속 사진처럼 겹쳐 그렸습니다.","w":[["끈에 매인 개의 역동성","Dynamism of a Dog on a Leash","1912","buffalo","Dynamism of a Dog on a Leash",{"cr":1,"tip":"닥스훈트와 주인의 발을 여러 겹으로 겹쳐 그려 걸음의 움직임을 표현했습니다. 연속 사진의 영향을 받은 미래주의의 대표작입니다."}],["발코니를 달리는 소녀","Girl Running on a Balcony","1912","novecento","Girl Running on a Balcony",{"cr":1,"tip":"발코니를 달리는 소녀의 움직임을 작은 색 조각들로 반복해 표현했습니다. 점묘법에 가까운 기법으로 연속 동작을 한 화면에 담았습니다."}],["가로등","Street Light","1909","moma","x",{"cr":1,"tip":"전기 가로등의 빛이 V자 모양의 색 조각으로 퍼져 나가는 모습을 그렸습니다. 한쪽 위의 작은 초승달이 인공 빛에 밀려나 있습니다."}],["추상적 속도 + 소리","Abstract Speed + Sound","1913–1914","pgc","x",{"cr":1,"tip":"달리는 자동차의 속도와 소음을 색과 선만으로 표현한 추상화입니다. 휘어지는 곡선과 날카로운 사선이 속도감을 만듭니다."}],["칼새: 운동의 궤적 + 역동적 연속","Swifts: Paths of Movement + Dynamic Sequences","1913","moma","x",{"tip":"창밖을 나는 칼새들의 비행 궤적을 반복되는 곡선으로 겹쳐 그려, 움직임의 연속을 한 화면에 담았습니다.","cr":1}],["질주하는 자동차","Speeding Automobile","1912","moma","x",{"tip":"달리는 자동차의 바퀴와 차체를 겹쳐진 선과 반복되는 형태로 표현해 속도감을 시각화했습니다.","cr":1}],["추상적 속도 – 자동차가 지나갔다","Abstract Speed – The Car Has Passed","1913","tatem","x",{"tip":"자동차가 지나간 뒤 풍경에 남은 공기의 흔들림을 추상적인 선과 색으로 표현했습니다. 원래 세 점으로 구성된 연작의 한 부분입니다.","cr":1}]]}]},{"id":"abstraction","name":"추상미술","en":"Abstract Art","years":"1906년 – 1940년대","s":1906,"e":1944,"color":"#2f4f8f","sum":"그림이 무언가를 '닮아야 한다'는 오랜 전제를 버리고 색, 선, 형태 그 자체로 화면을 구성한 미술입니다. 칸딘스키의 음악적인 서정 추상, 말레비치의 절대주의, 몬드리안의 신조형주의(데 스테일)가 대표적입니다. 오랫동안 칸딘스키가 '최초의 추상화가'로 알려졌지만, 그보다 앞선 1906년부터 추상화를 그린 힐마 아프 클린트가 뒤늦게 알려지며 추상의 역사가 다시 쓰이고 있습니다.","traits":["구체적 대상의 재현을 버림","칸딘스키: 색과 형태로 음악처럼 감정을 울림 (뜨거운 추상)","몬드리안: 수직·수평선과 삼원색만 쓰는 질서 (차가운 추상)","말레비치: 순수한 기하학 형태의 '절대주의'","바우하우스 교육과 디자인·건축으로 확산","신비주의(신지학)에서 출발한 영적 추상 (힐마 아프 클린트)","동화 같은 기호와 선의 시적인 추상 (클레)"],"diff":"입체주의는 형태를 쪼개도 대상이 남아 있었지만, 추상은 대상을 완전히 지웁니다.","artists":[{"n":"힐마 아프 클린트","o":"Hilma af Klint","l":"1862–1944","at":0,"d":"스웨덴의 화가이자 신비주의자. 칸딘스키보다 몇 년 앞선 1906년부터 추상화를 그렸지만, '사후 20년 동안 공개하지 말라'는 유언 때문에 1980년대에야 세상에 알려져 추상미술의 역사를 다시 쓰게 만들었습니다.","w":[["원초적 혼돈, No. 16","Primordial Chaos, No. 16","1906–1907","hakf","File:Hilma af Klint, 1906-07, Primordial Chaos - No 16.jpg",{"tip":"'신전을 위한 그림' 연작의 첫 그룹으로, 서양 미술사에서 가장 이른 추상화 가운데 하나로 꼽힙니다."}],["큰 인물화, No. 5 (지금까지 모든 작업의 열쇠)","The Large Figure Paintings, No. 5, The Key to All Works to Date","1907","hakf","File:Hilma af Klint - 1907 - The Large Figure Paintings - nr 5 - The Key to All Works to Date - Group III - The WU-Rosen Series.jpg",{"tip":"'신전을 위한 그림'의 그룹 III '큰 인물화' 연작 가운데 하나로, 제목처럼 그때까지의 작업을 풀어 주는 열쇠 같은 도식을 담았습니다."}],["10점의 대작, No. 3, 청년기","The Ten Largest, No. 3, Youth","1907","hakf","File:Hilma af Klint - The Ten Largest No. 3 - Youth - 1907.jpg",{"tip":"'10점의 대작'(그룹 IV)은 유년기 2점, 청년기 2점, 성년기 4점, 노년기 2점으로 이루어져 있습니다. 이 그림은 청년기 2점(No. 3–4) 가운데 첫 번째 작품입니다."}],["10점의 대작, No. 7, 성년기","The Ten Largest, No. 7, Adulthood","1907","hakf","File:Hilma af Klint - The Ten Largest No. 7 - Adulthood - 1907.jpg",{"tip":"유년기부터 노년기까지 인생의 단계를 높이 3m가 넘는 화면 10점에 담은 연작(그룹 IV)입니다. 성년기 4점 가운데 하나입니다."}],["10점의 대작, No. 8, 성년기","The Ten Largest, No. 8, Adulthood","1907","hakf","File:Hilma af Klint - The Ten Largest No. 8 - Adulthood - 1907.jpg",{"tip":"성년기 4점(No. 5–8) 가운데 마지막 작품입니다. 영어로는 'Adulthood' 또는 'Maturity'로 소개됩니다."}],["백조, No. 17","The Swan, No. 17","1915","hakf","File:Hilma af Klint, 1915, Svanen, No. 17.jpg",{"tip":"검은 백조와 흰 백조로 시작한 연작이 점점 기하학적인 원과 면으로 바뀌어 가는 과정의 한 장면입니다."}],["제단화, No. 1","Altarpiece No. 1","1915","hakf","File:8 hilma af klint, altarpiece no 1, 1915.jpg",{"tip":"'신전을 위한 그림' 193점을 마무리하는 제단화 3점 가운데 첫 번째입니다."}],["10점의 대작, No. 1, 유년기","The Ten Largest, No. 1, Childhood","1907","hakf","File:Hilma af Klint - The Ten Largest No. 1 - Childhood - 1907.jpg",{"tip":"인간의 생애 단계를 주제로 한 높이 3m가 넘는 연작의 첫 그림으로, 푸른 바탕 위에 꽃잎과 나선 같은 형태가 떠다닙니다."}],["10점의 대작, No. 4, 청년기","The Ten Largest, No. 4, Youth","1907","hakf","File:Hilma af Klint - The Ten Largest No. 4 - Youth - 1907.jpg",{"tip":"청년기를 주제로 한 그림으로, 꽃과 나선, 글자 같은 기호들이 화면 가득 피어나듯 펼쳐집니다."}],["10점의 대작, No. 9, 노년기","The Ten Largest, No. 9, Old Age","1907","hakf","File:Hilma af Klint - The Ten Largest No. 9 - 1907.jpg",{"tip":"노년기를 주제로 한 그림으로, 원과 기하학적 형태들이 화면에 차분하게 배치되어 있습니다."}],["백조, No. 1","The Swan, No. 1","1915","hakf","File:Hilma af Klint - Group IX SUW, The Swan No. 1 (13947).jpg",{"tip":"검은 백조와 흰 백조가 마주한 모습을 그려, 빛과 어둠 같은 대립과 그 합일을 상징했습니다."}]]},{"n":"바실리 칸딘스키","o":"Wassily Kandinsky","l":"1866–1944","d":"러시아 출신으로 청기사파를 만들고 바우하우스에서 가르쳤습니다. 최초의 추상화가 중 한 명입니다.","w":[["구성 VII","Composition VII","1913","tretyakov","Composition VII",{"tip":"수십 점의 습작을 거쳐 며칠 만에 완성한, 제1차 세계대전 이전 칸딘스키의 가장 복잡한 작품으로 꼽힙니다. 최후의 심판과 대홍수 같은 주제가 색과 형태 속에 녹아 있습니다."}],["노랑-빨강-파랑","Yellow-Red-Blue","1925","pompidou","File:Kandinsky - Jaune Rouge Bleu.jpg",{"tip":"노랑, 빨강, 파랑 세 원색을 각기 다른 형태와 짝지어 배치한 바우하우스 시기 작품입니다. 밝은 왼쪽과 어두운 오른쪽이 대비를 이룹니다."}],["청기사","The Blue Rider","1903","zurich","File:Kandinsky-Blue Rider.jpg",{"tip":"뷔를레 재단 소장품으로 취리히 미술관에서 전시됩니다."}],["구성 VIII","Composition VIII","1923","guggenheim","File:Kandinsky - Composition 8, 1923.jpg",{"tip":"원, 삼각형, 직선이 정확하게 배치된 기하학적 추상화입니다. 바우하우스에서 가르치던 시기에 그렸으며, 이전 구성 연작의 격렬함과 달리 질서정연합니다."}],["몇 개의 원","Several Circles","1926","guggenheim","File:Vassily Kandinsky, 1926 - Several Circles, Gugg 0910 25.jpg",{"tip":"어두운 배경 위에 크고 작은 원들이 투명하게 겹쳐 떠 있습니다. 칸딘스키는 원을 가장 우주적인 형태로 여겼습니다."}],["구성 IV","Composition IV","1911","k20","File:Vassily Kandinsky, 1911 - Composition No 4.jpg",{"tip":"말 탄 기사, 언덕 위의 성 같은 형상이 색과 선 속으로 녹아들며 추상으로 넘어가는 과정을 보여 줍니다."}],["즉흥 28 (두 번째 버전)","Improvisation 28 (second version)","1912","guggenheim","File:Vasily Kandinsky Improvisation 28 (second version).jpg",{"tip":"무의식적으로 떠오른 내면의 감정을 그린 '즉흥' 연작의 하나입니다. 구겐하임은 세계에서 칸딘스키 작품을 가장 많이 소장한 미술관 가운데 하나입니다."}],["푸른 산","Blue Mountain","1908–1909","guggenheim","File:Blue Mountain by Vasily Kandinsky, 1908-09.JPG",{"tip":"붉은 나무와 노란 나무 사이로 솟은 푸른 산 앞을 말 탄 사람들이 달리고 있습니다. 형태가 색으로 녹아드는 추상 직전의 화풍을 볼 수 있습니다."}],["검은 선들","Black Lines","1913","guggenheim","File:Black Lines by Vasily Kandinsky, 1913.JPG",{"tip":"밝은 색 얼룩들 위로 가늘고 검은 선들이 자유롭게 지나갑니다. 대상을 거의 알아볼 수 없는 초기 추상화로, 색과 선이 따로 움직이는 듯합니다."}],["무르나우의 철도","Railway at Murnau","1909","lenbachhaus","File:Wassily Kandinsky - Eisenbahn bei Murnau - GMS 49 - Lenbachhaus.jpg",{"tip":"무르나우 마을 앞을 지나는 검은 기차와 연기를 강렬한 색면으로 그렸습니다. 이 무렵 칸딘스키는 가브리엘레 뮌터와 함께 무르나우에서 지냈습니다."}],["즉흥 19","Improvisation 19","1911","lenbachhaus","File:Wassily Kandinsky - Improvisation 19 - GMS 79 - Lenbachhaus.jpg",{"tip":"렌바흐하우스는 칸딘스키와 청기사파 작품을 세계에서 가장 많이 소장하고 있습니다."}],["인상 III (콘서트)","Impression III (Concert)","1911","lenbachhaus","File:Wassily Kandinsky - Impression III (Konzert) - GMS 78 - Lenbachhaus.jpg",{"tip":"쇤베르크의 음악회를 들은 직후 그린 작품으로, 커다란 노란색 면이 울려 퍼지는 소리를, 검은 형태가 피아노를 떠올리게 합니다."}],["구성 X","Composition X","1939","k20","File:Kandinsky-Wassily-Komposition-X Kunstsammlung NRW 1024.jpg",{"tip":"검은 바탕 위에 밝은 색의 형태들이 떠 있는 듯한 작품으로, '구성' 연작의 마지막 작품입니다."}],["원 속의 원","Circles in a Circle","1923","philly","File:Kandinsky - Circles in a Circle, 1923, 1950-134-104.jpg",{"tip":"큰 검은 원 안에 크고 작은 원들과 교차하는 선들을 배치한 바우하우스 시기의 작품입니다."}],["흰색 위에 II","On White II","1923","pompidou","File:Vassily Kandinsky, 1923 - On White II.jpg",{"tip":"흰 바탕 위에 날카로운 선과 기하학적 형태가 교차하는 작품으로, 바우하우스 시기의 정제된 추상을 보여 줍니다."}]]},{"n":"카지미르 말레비치","o":"Kazimir Malevich","l":"1879–1935","d":"흰 바탕 위 검은 사각형으로 회화의 '영도'를 선언한 절대주의의 창시자입니다.","w":[["검은 사각형","Black Square","1915","tretyakov","Black Square (painting)",{"tip":"'0,10' 전시에서 러시아 가정의 성상 자리인 방 구석 높은 곳에 걸렸던 작품입니다. 갈라진 표면 사이로 먼저 그린 다른 색이 비쳐 보입니다."}],["절대주의 구성: 흰색 위의 흰색","Suprematist Composition: White on White","1918","moma","White on White",{"tip":"흰 바탕 위에 약간 기울어진 흰 사각형을 그렸습니다. 두 흰색은 색조와 붓 자국이 미묘하게 달라 가까이에서 보면 구분됩니다."}],["붉은 사각형","Red Square","1915","russian","Red Square (painting)",{"tip":"한쪽이 살짝 기울어진 붉은 사각형 하나를 그렸습니다. 원래 제목은 '2차원 속 농촌 여인의 회화적 사실주의'입니다."}],["눈보라 뒤 마을의 아침","Morning in the Village after Snowstorm","1912","guggenheim","File:Morning in the Village after Snowstorm (Malevich, 1912).jpg",{"tip":"눈 덮인 마을과 사람들을 금속처럼 반짝이는 원통형 형태로 그렸습니다. 입체주의와 미래주의를 결합한 입체미래주의 시기의 작품입니다."}],["칼 가는 사람","The Knife Grinder","1912–1913","yale","File:The Knife Grinder Principle of Glittering by Kazimir Malevich.jpeg",{"tip":"칼 가는 사람의 손과 발, 계단을 여러 겹 반복해 그려 움직임을 표현했습니다. 미래주의의 영향을 받은 입체미래주의의 대표작입니다."}],["물통을 든 여인","Woman with Pails: Dynamic Arrangement","1912–1913","moma","File:Woman with Pails (Malevich, 1912).jpg",{"tip":"물통을 지고 가는 농촌 여인을 원통과 원뿔 형태로 분해해 그렸습니다. 사람의 형태가 거의 기계처럼 보이는 입체미래주의 작품입니다."}],["절대주의 구성: 비행기의 비행","Suprematist Composition: Airplane Flying","1915","moma","File:Suprematist Composition - Airplane Flying (Malevich, 1915).jpg",{"tip":"여러 색의 직사각형들이 흰 바탕 위에 대각선 방향으로 비스듬히 떠 있습니다. 제목은 비행기지만 실제 비행기의 모습은 그리지 않았습니다."}],["검은 십자가","Black Cross","1915","pompidou","File:Kazimir Malevich Black Cross.jpg",{"tip":"흰 바탕 위에 검은 십자가를 그린 절대주의 작품입니다. 검은 사각형처럼 가장 기본적인 도형만으로 순수한 감각을 표현하려 했습니다."}],["모스크바의 영국인","An Englishman in Moscow","1914","stedelijk","File:An Englishman in Moscow, by Kazimir Malevich.jpg",{"tip":"스테델레이크 미술관은 러시아 밖에서 가장 큰 말레비치 컬렉션을 소장하고 있습니다."}],["회화적 사실주의. 배낭을 멘 소년 (검은 사각형과 붉은 사각형)","Painterly Realism. Boy with Knapsack","1915","moma","File:Black Square and Red Square (Malevich, 1915).jpg",{"tip":"큰 검은 사각형과 그보다 작은 붉은 사각형, 단 두 개의 도형만 그려져 있습니다. 제목은 소년을 말하지만 대상을 완전히 지운 순수한 형태로 그렸습니다."}],["절대주의 회화 (검은 사다리꼴과 붉은 사각형)","Suprematist Painting with Black Trapezium and Red Square","1915","stedelijk","File:Amsterdam - Stedelijk Museum - Kazimir Malevich (1878-1935) - Suprematist Painting (with Black Trapezium and Red Square) (A 7681) 1915.jpg",{"tip":"흰 바탕 위에 기울어진 검은 사다리꼴과 붉은 사각형, 작은 도형들이 떠 있습니다. 위아래가 없는 공간에서 도형들이 부유하는 듯합니다."}],["달리는 사람","Running Man","1930–1933경","pompidou","File:Kasimir malévitch, l'uomo che corre, 1930-31.JPG",{"tip":"텅 빈 들판을 달리는 농부를 그린 후기작으로, 칼과 십자가가 놓인 풍경 속에서 무언가를 피해 달아나는 듯한 모습입니다."}],["나무꾼","The Woodcutter","1912","stedelijk","File:Woodcutter by Kazimir Malevich.jpg",{"tip":"도끼를 든 나무꾼과 쌓인 통나무를 금속처럼 빛나는 원통형으로 표현한 입체-미래주의 시기의 작품입니다."}],["호밀 수확","Taking in the Rye","1912","stedelijk","File:Taking in the Rye Kazimir Malevich 1911.jpeg",{"tip":"호밀을 거둬들이는 농부들을 원통형으로 단순화해 그린 작품으로, 금속성 형태와 강한 색이 특징입니다."}],["여덟 개의 빨간 직사각형이 있는 절대주의 구성","Suprematist Composition with Eight Red Rectangles","1915","stedelijk","File:Malevich-Suprematism..jpg",{"tip":"흰 바탕 위에 빨간 직사각형 여덟 개가 비스듬히 떠 있는 작품으로, 중력에서 벗어난 듯한 공간감을 추구한 절대주의 초기의 작품입니다."}]]},{"n":"피트 몬드리안","o":"Piet Mondrian","l":"1872–1944","d":"나무 연작에서 출발해 점점 단순화하여 순수한 격자 추상에 이르렀습니다.","w":[["빨강, 파랑, 노랑의 구성","Composition with Red, Blue and Yellow","1930","zurich","Composition with Red, Blue and Yellow",{"tip":"오른쪽 위의 큰 빨간 사각형과 아래쪽의 작은 파랑, 노랑이 검은 선으로 나뉘어 균형을 이룹니다. 수평선, 수직선, 삼원색만 쓴 신조형주의의 대표작입니다."}],["브로드웨이 부기우기","Broadway Boogie Woogie","1942–1943","moma","Broadway Boogie Woogie",{"tip":"뉴욕의 격자형 거리와 부기우기 재즈의 리듬을 노랑, 빨강, 파랑의 작은 사각형으로 표현했습니다. 검은 선 대신 노란 선을 쓴 뉴욕 시기의 작품입니다."}],["붉은 나무","Red Tree","1908–1910","denhaag","File:Piet Mondrian, 1908-10, Evening; Red Tree (Avond; De rode boom), oil on canvas, 70 x 99 cm, Gemeentemuseum Den Haag.jpg",{"tip":"푸른 하늘을 배경으로 가지를 뻗은 붉은 나무를 그렸습니다. 이후 점점 추상으로 나아가는 몬드리안 나무 연작의 출발점입니다."}],["회색 나무","Gray Tree","1911","denhaag","Gray Tree",{"tip":"나무를 회색과 검은 선의 리듬으로 단순화했습니다. 붉은 나무에서 시작된 연작이 입체주의를 거쳐 추상으로 바뀌어 가는 과정을 보여 줍니다."}],["빅토리 부기우기 (미완성)","Victory Boogie Woogie","1942–1944","denhaag","Victory Boogie Woogie",{"tip":"헤이그 시립미술관은 세계 최대 몬드리안 컬렉션을 소장하고 있습니다."}],["구성 10 (부두와 바다)","Composition 10 in Black and White (Pier and Ocean)","1915","kroller","File:Mondrian Compositie 10.jpg",{"tip":"바다로 뻗은 부두와 물결을 짧은 가로·세로 선으로만 줄여 그렸습니다. 나무 연작에서 격자 추상으로 넘어가는 중간 단계입니다."}],["커다란 빨간 면, 노랑, 검정, 회색, 파랑의 구성","Composition with Large Red Plane, Yellow, Black, Grey and Blue","1921","denhaag","File:Piet Mondriaan, 1921 - Composition en rouge, jaune, bleu et noir.jpg",{"tip":"검은 선과 삼원색, 무채색만으로 균형을 잡는 '신조형주의' 양식이 완성된 무렵의 작품입니다."}],["진화 (세 폭)","Evolution","1911","denhaag","File:Mondrian, Evolution (Triptychon), 1911.jpg",{"tip":"신지학에 심취했던 시기의 작품으로, 영적 깨달음의 세 단계를 세 폭에 담았습니다."}],["꽃 피는 사과나무","The Flowering Apple Tree","1912","denhaag","File:Blossoming apple tree, by Piet Mondriaan.jpg",{"tip":"사과나무의 가지를 곡선의 리듬으로 단순화한 작품으로, 나무 연작이 추상으로 넘어가는 단계를 보여 줍니다."}],["뉴욕 시티 I","New York City I","1941","k20","File:New York City I.jpg",{"tip":"색 테이프를 붙여 만든 미완성 작품으로, 2022년 수십 년 동안 거꾸로 걸려 있었을 가능성이 제기되어 화제가 되었습니다."}],["노랑, 검정, 파랑, 빨강, 회색의 마름모 구성","Lozenge Composition with Yellow, Black, Blue, Red, and Gray","1921","aic","File:Piet Mondrian - Lozenge Composition with Yellow, Black, Blue, Red, and Gray - 1957.307 - Art Institute of Chicago.jpg",{"tip":"정사각형 캔버스를 45도 돌린 마름모 화면에 검은 선과 색면을 배치했습니다. 가장자리에서 잘린 선이 화면 밖으로 이어지는 듯한 느낌을 줍니다."}]]},{"n":"파울 클레","o":"Paul Klee","l":"1879–1940","d":"스위스 출신. 바우하우스에서 가르쳤고 시적이고 동화 같은 추상을 그렸습니다.","w":[["세네치오","Senecio","1922","basel","Senecio (Klee)",{"tip":"둥근 얼굴을 주황과 노랑의 색면으로 나누어 그렸습니다. 단순한 기하학적 형태만으로 가면 같은 인물의 표정을 만들어 냈습니다."}],["지저귀는 기계","Twittering Machine","1922","moma","Twittering Machine",{"tip":"가는 선으로 그린 새들이 손잡이 달린 기계 위에 앉아 있습니다. 유채 전사 드로잉과 수채를 결합한 종이 작품입니다."}],["새로운 천사","Angelus Novus","1920","israel","Angelus Novus",{"tip":"발터 벤야민이 소장했던 작품으로, 그는 이 천사를 과거의 폐허를 바라보는 '역사의 천사'로 해석했습니다. 유채 전사와 수채로 그린 종이 작품입니다."}],["파르나소스로","Ad Parnassum","1932","bern","Ad Parnassum (Klee)",{"tip":"베른의 첸트룸 파울 클레에서도 클레 작품을 대규모로 볼 수 있습니다."}],["금붕어","The Goldfish","1925","hamburg","File:Der Goldfisch, 1925 - Paul Klee.jpg",{"tip":"짙푸른 물속에서 빛나는 금붕어 한 마리와 그 주위로 흩어진 작은 물고기들을 그렸습니다. 어둠 속에서 붉게 빛나는 금붕어가 시선을 붙잡습니다."}],["붉은 풍선","Red Balloon","1922","guggenheim","File:Paul Klee, 1922, Red Balloon, oil on chalk-primed gauze, mounted on board, 31.7 x 31.1 cm, Solomon R. Guggenheim Museum.jpg",{"tip":"집과 건물을 연상시키는 색면들 위로 붉은 풍선이 떠 있습니다. 작은 화면 안에 동화 같은 분위기를 담았습니다."}],["저녁의 불","Fire in the Evening","1929","moma","File:Fire in the Evening by Paul Klee in the MOMA.jpg",{"tip":"이집트 여행에서 본 풍경과 빛을 색 띠로 옮긴 작품입니다."}],["물고기 마술","Fish Magic","1925","philly","File:Paul Klee, Swiss - Fish Magic - Google Art Project.jpg",{"tip":"어두운 바탕 위에 물고기와 꽃, 시계, 인물이 떠 있는 환상적인 장면입니다. 화면 가운데에 천 조각을 덧대어 그렸습니다."}],["고양이와 새","Cat and Bird","1928","moma","File:NY Moma klee cat and bird.JPG",{"tip":"고양이 얼굴을 화면 가득 크게 그리고 그 이마에 작은 새를 그려 넣어, 고양이의 머릿속 생각을 보여 주는 듯합니다."}],["고가교의 혁명","Revolution of the Viaduct","1937","hamburg","File:Revolution des Viadukts, 1937 - Paul Klee.jpg",{"tip":"다리의 아치들이 줄을 벗어나 앞으로 걸어 나오는 모습으로, 나치의 획일주의에 맞선 저항으로 해석되곤 합니다."}],["인술라 둘카마라","Insula Dulcamara","1938","zpk","File:Paul Klee, Insula dulcamara.jpg",{"tip":"굵은 검은 선과 밝은 색면으로 섬과 얼굴, 배를 떠올리게 하는 형태를 그린 말년의 대작입니다."}]]}],"note":"아프 클린트는 '사후 20년 동안 공개하지 말라'는 유언을 남겼고, 그녀의 추상화는 1986년 로스앤젤레스의 전시 「미술 속의 영성」을 통해 비로소 널리 알려졌습니다."},{"id":"ecole-de-paris","name":"에콜 드 파리 (파리 화파)","en":"École de Paris","years":"1910년 – 1940년","s":1910,"e":1940,"color":"#4a5d6e","sum":"20세기 초 파리 몽마르트르와 몽파르나스에 모여든 외국 출신 화가들을 묶어 부르는 이름입니다. 선언이나 공통 양식이 있는 유파가 아니라, 러시아, 이탈리아, 벨라루스 등에서 온 이방인들이 파리에서 각자의 기억과 감성을 독자적인 화풍으로 그려 낸 흐름입니다. 몽마르트르 토박이였던 쉬잔 발라동과 그의 아들 모리스 위트릴로, 피카소 주변에서 활동한 마리 로랑생도 이 시기 파리 미술계를 대표합니다.","traits":["유파나 선언 없이 화가 개인의 양식이 중심","고향의 기억, 유대 문화, 민속적인 환상 (샤갈)","길게 늘인 목과 아몬드형 눈의 초상 (모딜리아니)","격렬하게 뒤틀린 붓질과 진한 색 (수틴)","입체주의·야수주의·표현주의를 흡수하면서도 인물과 이야기를 지킴","몽마르트르의 골목과 성당을 그린 서정적 풍경 (위트릴로)","여성의 시선으로 그린 여성 (발라동, 로랑생)"],"diff":"같은 시기 파리에서 입체주의와 추상이 형태를 쪼개거나 대상을 지웠다면, 에콜 드 파리의 화가들은 인물과 이야기를 지키며 감정과 서정을 그렸습니다.","note":"샤갈은 입체주의, 표현주의, 초현실주의와 두루 닿아 있지만 어느 유파에도 속하지 않았고, 초현실주의 그룹의 합류 제안도 거절했습니다. 마리 로랑생은 1956년에 세상을 떠나 유럽 저작권이 2026년 말까지 보호되므로 이미지를 싣지 않았습니다. 2027년부터는 이미지를 넣을 수 있습니다.","artists":[{"n":"쉬잔 발라동","o":"Suzanne Valadon","l":"1865–1938","d":"르누아르, 툴루즈로트레크의 모델로 일하다 독학으로 화가가 되었고, 드가에게 재능을 인정받았습니다. 여성의 몸을 여성의 시선으로 대담하게 그린 화가이며, 위트릴로의 어머니입니다.","w":[["에릭 사티의 초상","Portrait of Erik Satie","1892–1893","pompidou","File:SatiebyValadon.jpg",{"tip":"작곡가 에릭 사티와 짧은 연애를 하던 시기에 그렸습니다."}],["아담과 이브","Adam and Eve","1909","pompidou","File:Adam and Eve, Suzanne Valadon.jpg",{"tip":"여성 화가가 남성 누드를 그린 최초의 대형 작품 가운데 하나로, 모델은 연인이던 앙드레 위테르와 발라동 자신입니다."}],["삶의 기쁨","Joy of Life","1911","met","File:Joy of Life MET DT356454.jpg",{"tip":"물가에서 쉬는 누드의 여인들과 이를 바라보는 남자를 그렸습니다. 남성 화가들이 즐겨 다룬 목욕하는 여인 주제를 여성 화가의 시선으로 다시 그렸습니다."}],["푸른 방","The Blue Room","1923","pompidou","File:The Blue Room by Suzanne Valadon.jpg",{"tip":"코르셋 대신 편한 옷을 입고 담배를 문 채 누운 여인을 그려, 남성의 시선에 맞춘 전통적인 오달리스크를 뒤집었습니다."}],["누워 있는 누드","Reclining Nude","1928","met","File:Reclining Nude MET DT3142.jpg",{"tip":"소파에 누운 여인을 굵은 윤곽선으로 그렸습니다. 남성 화가들의 이상화된 누드와 달리 꾸밈없는 몸을 담았습니다."}],["줄무늬 이불 위의 누드","Nude with Striped Blanket","1922","mamparis","File:Nu à la couverture rayée, par Suzanne Valadon.jpg",{"tip":"줄무늬 이불 위에 누운 여인을 굵은 윤곽선과 화려한 무늬로 그린 작품으로, 발라동 특유의 대담한 색채가 돋보입니다."}],["가족 초상","Family Portrait","1912","orsay","File:Portrait de famille, 1912 - Suzanne Valadon.jpg",{"tip":"화가 자신과 어머니, 아들 위트릴로, 연인 앙드레 위테르를 함께 그린 작품으로, 화가는 가운데에서 가슴에 손을 얹고 있습니다."}]]},{"n":"모리스 위트릴로","o":"Maurice Utrillo","l":"1883–1955","d":"쉬잔 발라동의 아들. 몽마르트르의 골목, 성당, 하얀 벽의 집들을 쓸쓸한 서정으로 그렸습니다. 특히 회반죽을 섞어 그린 1909–1914년 무렵을 '하얀 시기'라고 부릅니다.","w":[["노트르담","Notre-Dame","1909경","orangerie","File:Notre-Dame, 1909 - Maurice Utrillo.jpg",{"tip":"노트르담 대성당의 정면을 차분한 흰색과 회색 톤으로 그렸습니다. 흰색을 두껍게 쓴 이른바 '백색 시대'의 작품입니다."}],["클리냥쿠르 성당","The Church of Clignancourt","1914경","orangerie","File:Église de Clignancourt - Maurice Utrillo.jpg",{"tip":"몽마르트르 북쪽 클리냥쿠르 지역의 성당과 그 앞 거리를 그렸습니다. 텅 빈 거리와 단정한 건물 정면이 고요한 분위기를 자아냅니다."}],["라팽 아질","Le Lapin Agile","1915","private","File:Le Lapin Agile, 1915 - Maurice Utrillo.jpg",{"tip":"피카소와 모딜리아니도 드나든 몽마르트르의 카바레로, 지금도 영업하고 있어 실제 장소를 찾아가 볼 수 있습니다."}],["베르노 집","La Maison Bernot","1924","orangerie","File:Maurice utrillo, la maison bernot, 1924, 02.jpg",{"tip":"오랑주리 미술관은 위트릴로 작품을 10점 소장하고 있습니다."}],["몽세니 거리","Rue du Mont-Cenis","1914","orangerie","File:Maurice Utrillo. Rue du Mont-Cenis. 1914. Musée de l'Orangerie.jpg",{"tip":"몽마르트르 언덕을 오르는 몽세니 거리를 그린 작품으로, 위트릴로가 평생 즐겨 그린 몽마르트르 거리 풍경의 하나입니다."}],["생피에르 성당","Church of Saint-Pierre","1914","orangerie","File:Église Saint-Pierre, 1914 - Maurice Utrillo.jpg",{"tip":"몽마르트르 언덕의 생피에르 성당을 그린 작품으로, 하얀 벽면과 차분한 색조가 위트릴로의 이른바 '백색 시대'를 보여 줍니다."}],["베를리오즈의 집","The House of Berlioz","1914","orangerie","File:Maurice Utrillo. La Maison de Berlioz. 1914.jpg",{"tip":"작곡가 베를리오즈가 한때 살았던 몽마르트르의 집을 그렸습니다. 위트릴로는 이처럼 몽마르트르의 거리와 건물을 즐겨 그렸습니다."}]]},{"n":"마리 로랑생","o":"Marie Laurencin","l":"1883–1956","d":"피카소, 브라크와 함께 바토 라부아르에 드나들던 화가. 시인 아폴리네르의 연인이었으며, 분홍·회색·하늘색의 부드러운 색으로 꿈꾸는 듯한 여인들을 그렸습니다. 한국과 일본에서 특히 사랑받는 화가입니다.","w":[["아폴리네르와 그의 친구들","Apollinaire and His Friends","1909","pompidou","x",{"cr":1,"tip":"아폴리네르를 가운데 두고 피카소와 로랑생 자신 등을 그린 단체 초상입니다."}],["비둘기와 여인들","Women with Doves","1919","pompidou","x",{"cr":1,"tip":"부드러운 분홍과 회색 톤으로 비둘기와 함께 있는 여인들을 그렸습니다. 아몬드 모양의 검은 눈과 창백한 얼굴이 로랑생 특유의 화풍입니다."}],["코코 샤넬의 초상","Portrait of Mademoiselle Chanel","1923","orangerie","x",{"cr":1,"tip":"샤넬이 자신과 닮지 않았다며 받기를 거절한 그림입니다."}],["암사슴들","Les Biches","1923","orangerie","x",{"cr":1,"tip":"로랑생은 발레 뤼스의 발레 '암사슴들'(1924)의 무대와 의상을 맡았습니다. 부드러운 분홍과 회색 톤 속 창백한 여인들의 모습을 살펴보세요."}],["스페인 무희들","Spanish Dancers","1920–1921","orangerie","x",{"tip":"1차 세계대전 중 스페인에 머물렀던 경험이 반영된 작품으로, 부드러운 색조의 여인들이 몽환적으로 춤추고 있습니다.","cr":1}],["폴 기욤 부인의 초상","Portrait of Madame Paul Guillaume","1928경","orangerie","x",{"tip":"화상 폴 기욤의 아내 도메니카를 부드러운 파스텔 색조로 그렸습니다. 이 부부가 모은 작품이 오늘날 컬렉션의 바탕이 되었습니다.","cr":1}],["개와 함께 있는 여인들","Women with Dog","1923","orangerie","x",{"tip":"여인들과 개를 회색과 분홍의 부드러운 색조로 그린 작품으로, 로랑생 특유의 우아한 분위기가 드러납니다.","cr":1}]]},{"n":"아메데오 모딜리아니","o":"Amedeo Modigliani","l":"1884–1920","d":"이탈리아 출신. 길게 늘인 목과 눈동자 없는 아몬드형 눈의 초상으로 유명하며, 35세에 요절했습니다.","w":[["잔 에뷔테른","Jeanne Hébuterne","1919","met","File:Amedeo Modigliani, 1919, Jeanne Hébuterne, oil on canvas, 91.4 x 73 cm, Metropolitan Museum of Art.jpg",{"tip":"길게 늘어진 목과 기울어진 얼굴로 연인 잔 에뷔테른을 그렸습니다. 이듬해 화가가 세상을 떠난 직후 잔도 스스로 목숨을 끊었습니다."}],["누워 있는 누드","Reclining Nude","1917","moma","File:Modigliani, Amedeo - Reclining Nude - MoMA.jpg",{"tip":"길게 누운 여인의 몸을 따뜻한 살색으로 화면 가득 그린 누드입니다. 1917년 개인전에서는 이런 누드화들이 외설 시비로 경찰에 의해 철거되기도 했습니다."}],["폴 기욤, 노보 필로타","Paul Guillaume, Novo Pilota","1915","orangerie","File:Amedeo Modigliani - Paul Guillaume, Novo Pilota - Google Art Project.jpg",{"tip":"화상 폴 기욤을 그린 초상으로, 화면에 적힌 '노보 필로타'는 '새로운 키잡이'라는 뜻입니다. 젊은 화상에 대한 기대가 담겨 있습니다."}],["노란 스웨터를 입은 잔 에뷔테른","Jeanne Hébuterne with Yellow Sweater","1918–1919","guggenheim","File:Modigliani, Amedeo - Jeanne Hébuterne with yellow sweater.jpeg",{"tip":"노란 스웨터를 입고 앉은 잔 에뷔테른을 긴 목과 가면 같은 얼굴로 그렸습니다. 기울어진 어깨선이 우아한 리듬을 만듭니다."}],["큰 모자를 쓴 잔 에뷔테른","Jeanne Hébuterne with Large Hat","1918","private","File:Modigliani Amedeo 14.jpg",{"tip":"모딜리아니가 그린 아내 잔 에뷔테른의 초상 20여 점 가운데 하나로, 공개 전시되지 않는 개인 소장품입니다."}],["화가 부인의 초상 (잔 에뷔테른)","Portrait of the Artist's Wife","1918","nortonsimon","File:Portrait-of-the-Artist's-Wife 1918 Amedeo Modigliani.jpg",{"tip":"의자 등받이에 팔을 걸치고 앉은 아내 잔 에뷔테른을 그렸습니다. 이듬해 모딜리아니가 세상을 떠나자 잔도 이틀 뒤 뒤따랐습니다."}],["젊은 견습생","The Young Apprentice","1918–1919","orangerie","File:Amedeo Modigliani - The Young Apprentice - Google Art Project.jpg",{"tip":"화상 폴 기욤의 컬렉션으로 오랑주리 미술관에 들어왔습니다."}],["푸른 쿠션 위의 누드","Nude on a Blue Cushion","1917","nga","File:Amedeo Modigliani, Nude on a Blue Cushion, 1917, NGA 46521.jpg",{"tip":"푸른 쿠션에 기댄 여인을 따뜻한 살구빛 피부로 그린 누드입니다. 1917년 개인전에 나온 그의 누드화들은 외설 논란으로 경찰이 개입하기도 했습니다."}],["여성 누드","Female Nude","1916경","courtauld","File:Amedeo Modigliani 060.jpg",{"tip":"고개를 기울이고 눈을 감은 여인을 그린 누드로, 길게 늘인 목과 단순화된 얼굴에서 화가 특유의 양식을 볼 수 있습니다."}],["후안 그리스","Juan Gris","1915","met","File:Juan Gris (1887–1927) MET DT2533.jpg",{"tip":"입체주의 화가이자 친구였던 후안 그리스를 그린 초상입니다. 길게 늘인 얼굴과 단순한 형태에 모딜리아니 특유의 양식이 드러납니다."}],["안나 즈보롭스카","Anna Zborowska","1917","moma","File:Anna Zborowska 1917 Amedeo Modigliani.jpg",{"tip":"모딜리아니의 화상 레오폴드 즈보롭스키의 아내 안나를 그린 초상입니다. 긴 목과 기울어진 얼굴, 단순한 색면이 우아한 분위기를 만듭니다."}]]},{"n":"마르크 샤갈","o":"Marc Chagall","l":"1887–1985","d":"벨라루스 비텝스크 출신의 유대인 화가. 고향 마을, 연인, 하늘을 나는 사람들을 꿈같은 색채로 그렸고, 98세까지 회화, 스테인드글라스, 무대미술, 천장화를 남겼습니다.","w":[["나와 마을","I and the Village","1911","moma","I and the Village",{"cr":1,"tip":"파리에서 고향 비텝스크를 떠올리며 그렸습니다. 초록 얼굴의 남자와 마주 본 소의 머리 안에 젖 짜는 여인이 작게 그려져 있습니다."}],["생일","Birthday","1915","moma","Birthday (Chagall)",{"cr":1,"tip":"생일에 꽃을 들고 찾아온 연인 벨라에게 몸을 뒤틀며 떠올라 입 맞추는 화가 자신을 그렸습니다. 결혼 직전에 그린 행복한 장면입니다."}],["도시 위에서","Over the Town","1914–1918","tretyakov","Over the Town",{"cr":1,"tip":"샤갈과 아내 벨라가 고향 비텝스크의 마을 위를 함께 날아가는 모습입니다. 아래로 펼쳐진 집과 울타리, 교회를 찾아보세요."}],["하얀 십자가","White Crucifixion","1938","aic","White Crucifixion",{"cr":1,"tip":"프란치스코 교황이 가장 좋아하는 그림으로 꼽아 화제가 되었습니다."}],["파리 오페라 극장 천장화","Ceiling of the Palais Garnier","1964","garnier","Palais Garnier",{"cr":1,"tip":"공연이 없는 낮 시간대 극장 견학으로 볼 수 있습니다."}],["성서 메시지 연작","Le Message Biblique","1954–1967","chagallnice","Musée Marc Chagall",{"cr":1,"tip":"샤갈이 직접 설립에 참여한 미술관으로, 성서를 주제로 한 대작 17점이 모여 있습니다."}],["창 너머 보이는 파리","Paris Through the Window","1913","guggenheim","x",{"cr":1,"tip":"창밖으로 에펠탑과 낙하산 탄 사람이 보이고, 앞쪽엔 두 얼굴의 인물과 사람 얼굴을 한 고양이가 있습니다. 파리와 고향이 뒤섞인 그림입니다."}],["초록 바이올린 연주자","Green Violinist","1923–1924","guggenheim","x",{"cr":1,"tip":"초록 얼굴의 악사가 지붕 위에서 바이올린을 켭니다. 모스크바 유대인 극장을 위해 그린 벽화의 악사를 바탕으로 다시 그린 작품입니다."}],["미국의 창","America Windows","1977","aic","x",{"cr":1,"tip":"미국 독립 200주년을 기념해 만든 스테인드글라스입니다."}],["일곱 손가락의 자화상","Self-Portrait with Seven Fingers","1912–1913","stedelijk","x",{"cr":1,"tip":"'일곱 손가락으로'는 이디시어로 솜씨 좋게 해낸다는 뜻의 표현입니다. 창밖엔 파리가, 구름 속엔 고향 마을이 보입니다."}],["바이올린 연주자","The Fiddler","1912–1913","stedelijk","x",{"cr":1,"tip":"초록 얼굴의 악사가 마을 지붕 위에서 바이올린을 켜는 모습입니다. 동유럽 유대인 마을의 결혼식과 축제에 빠지지 않던 악사를 그렸습니다."}],["포도주 잔을 든 이중 초상","Double Portrait with Wine Glass","1917–1918","pompidou","x",{"tip":"아내 벨라의 어깨 위에 올라탄 채 잔을 든 화가 자신을 그렸습니다. 머리 위로는 천사가 날고 아래로는 고향 비텝스크가 펼쳐집니다.","cr":1}],["러시아와 당나귀와 그 밖의 것들에게","To Russia, Asses and Others","1911","pompidou","x",{"tip":"지붕 위의 붉은 소가 젖을 먹이고, 머리가 몸에서 떨어져 나간 젖 짜는 여인이 하늘을 나는 꿈같은 장면입니다.","cr":1}],["골고다","Calvary","1912","moma","x",{"tip":"십자가에 매달린 어린아이 같은 예수를 입체주의풍의 밝은 색면으로 그렸습니다. 십자가 아래에는 슬퍼하는 인물들이 서 있습니다.","cr":1}],["곡예사","The Juggler","1943","aic","x",{"tip":"새의 머리를 한 곡예사가 서커스 무대에서 묘기를 부리는 모습입니다. 샤갈이 평생 즐겨 그린 서커스 주제를 보여 줍니다.","cr":1}]]},{"n":"샤임 수틴","o":"Chaïm Soutine","l":"1893–1943","d":"벨라루스 출신 유대인 화가. 뒤틀린 형태와 격렬한 붓질로 훗날 추상표현주의 화가들에게 큰 영향을 주었습니다.","w":[["쇠고기 덩어리","Carcass of Beef","1925경","buffalo","File:Carcass of Beef by Chaim Soutine, c. 1925, Albright-Knox Art Gallery.jpg",{"tip":"렘브란트의 〈도살된 소〉(루브르)에서 영감을 받은 연작입니다."}],["어린 제과사","The Little Pastry Cook","1922–1923경","orangerie","File:Chaïm Soutine - Le Petit Pâtissier.jpg",{"tip":"흰 제복의 어린 제과사를 거칠고 일그러진 붓질로 그렸습니다. 수틴은 이 무렵 요리사와 제과사를 여러 점 그렸습니다."}],["막심 레스토랑의 시동","Page Boy at Maxim's","1927경","buffalo","File:Soutine - Page Boy at Maxim's, ca. 1927, 19534.tif",{"tip":"파리 레스토랑 막심의 붉은 제복 차림 벨보이를 그렸습니다. 수틴은 호텔과 레스토랑에서 일하는 사람들을 즐겨 그렸습니다."}],["마을","The Village","1923경","orangerie","File:Chaïm soutine, il villaggio, 1923 ca..JPG",{"tip":"남프랑스 체류 시기에 그린 풍경으로, 집과 길이 흔들리듯 휘어져 있습니다. 두텁고 격렬한 붓질에서 수틴 표현주의의 특징이 잘 보입니다."}],["마들렌 카스탱의 초상","Portrait of Madeleine Castaing","1929경","met","File:Portrait of Madeleine Castaing by Chaim Soutine at Metropolitan Museum of Art.jpg",{"tip":"후원자이자 실내장식가였던 마들렌 카스탱이 검은 옷을 입고 앉아 있는 모습을 그렸습니다."}],["벨보이","The Bellboy (Le Groom)","1925","pompidou","File:ChaimSoutine 1925 - Le groom.png",{"tip":"붉은 제복을 입은 호텔 벨보이를 일그러진 형태와 강렬한 색으로 그렸습니다. 수틴은 호텔과 식당의 종업원을 즐겨 그렸습니다."}],["폭풍우 뒤 학교에서 돌아오는 아이들","Return from School after the Storm","1939경","phillips","File:Return From School (c.1939) oil on canvas, 18 x 19.75 in., The Phillips Collcetion, Washington, D. C.jpg",{"tip":"폭풍이 지나간 뒤 바람에 휘어진 나무 아래를 걷는 두 아이를 그린 말년의 풍경화입니다."}]]}]},{"id":"surrealism","name":"다다와 초현실주의","en":"Dada & Surrealism","years":"1916년 – 1950년","s":1916,"e":1950,"color":"#5a3f7a","sum":"1차 대전의 참혹함 속에서 이성과 기존 예술을 조롱한 다다가 먼저 등장했습니다. 그 뒤를 이어 1924년 앙드레 브르통이 〈초현실주의 선언〉을 발표했습니다. 프로이트의 정신분석에 영향을 받아 꿈과 무의식의 세계를 그렸습니다.","traits":["다다: 기성품(레디메이드)을 예술로 제시하는 반예술","무의식을 끌어내는 자동기술법","데페이즈망: 익숙한 사물을 낯선 맥락에 놓기 (마그리트)","극사실적인 기법으로 그린 비현실 (달리, 마그리트) vs 유기적 형태의 추상 (미로)","다다는 취리히에서 시작해 뉴욕·파리·베를린으로 퍼짐 (뉴욕과 파리 다다의 뒤샹, 피카비아)","기계를 사람처럼 그린 '기계 형태' 그림 (피카비아)"],"diff":"추상미술이 형태의 질서를 탐구했다면, 초현실주의는 이성 너머 꿈과 무의식을 탐구했습니다.","note":"프리다 칼로는 브르통이 초현실주의자라 불렀지만, 본인은 \"나는 꿈이 아니라 나의 현실을 그렸다\"며 그 분류를 거부했습니다.","artists":[{"n":"마르셀 뒤샹","o":"Marcel Duchamp","l":"1887–1968","d":"변기에 서명해 전시한 〈샘〉으로 '무엇이 예술인가'를 물은 다다의 핵심 인물입니다.","w":[["샘 (1964년 재제작본)","Fountain","1917","tatem","Fountain (Duchamp)",{"cr":1,"tip":"1917년 원본은 사라졌고, 1960년대 재제작본이 테이트 모던, 퐁피두 등 여러 곳에 있습니다."}],["계단을 내려오는 누드 No.2","Nude Descending a Staircase, No. 2","1912","philly","Nude Descending a Staircase, No. 2",{"cr":1,"tip":"움직이는 인체를 여러 순간으로 겹쳐 표현했습니다. 1913년 뉴욕 아모리 쇼에서 큰 스캔들을 일으키며 유명해진 작품입니다."}],["큰 유리 (그녀의 독신자들에 의해 발가벗겨진 신부, 조차도)","The Large Glass","1915–1923","philly","The Large Glass",{"cr":1,"tip":"두 장의 유리판에 납선과 물감 등으로 위쪽엔 신부를, 아래쪽엔 독신자들을 그렸습니다. 운송 중 생긴 금을 뒤샹은 그대로 작품의 일부로 받아들였습니다."}],["자전거 바퀴 (1951년 재제작)","Bicycle Wheel","1913","moma","x",{"cr":1,"tip":"부엌 의자 위에 자전거 바퀴를 거꾸로 꽂은 최초의 레디메이드입니다. 1913년 원본은 사라졌고, 이것은 뒤샹이 1951년에 다시 만든 것입니다."}],["에탕 도네 (주어진 것)","Étant donnés","1946–1966","philly","x",{"tip":"낡은 나무 문에 뚫린 작은 구멍 두 개로만 안을 들여다볼 수 있는 설치 작품입니다. 20년 동안 비밀리에 만들었고 작가가 세상을 떠난 뒤인 1969년에 공개되었습니다.","cr":1}],["기차 안의 슬픈 청년","Sad Young Man on a Train","1911","pgc","x",{"tip":"열차 안에 선 청년을 여러 겹으로 겹친 윤곽으로 그려 흔들림과 움직임을 표현했습니다. 작가 자신을 그린 것으로 알려져 있으며, 「계단을 내려오는 나부」로 이어지는 실험을 보여 줍니다.","cr":1}],["빠른 나체들에 둘러싸인 왕과 왕비","The King and Queen Surrounded by Swift Nudes","1912","philly","x",{"tip":"체스의 왕과 왕비를 기계 같은 형체로 그리고, 그 사이를 빠르게 지나가는 나체의 움직임을 겹쳐 놓았습니다. 평생 체스를 즐긴 작가의 관심이 드러납니다.","cr":1}]]},{"n":"프랑시스 피카비아","o":"Francis Picabia","l":"1879–1953","at":1,"d":"인상주의 풍경화로 출발해 입체주의·오르피즘, 다다, 초현실주의, 다시 구상화까지 끊임없이 양식을 바꾼 화가입니다. 뒤샹과 함께 뉴욕과 파리 다다의 핵심 인물이었고, 기계를 사람처럼 그린 '기계 형태' 그림으로 유명합니다.","w":[["우드니 (젊은 미국 아가씨, 춤)","Udnie (Young American Girl, The Dance)","1913","pompidou","File:Francis Picabia, 1913, Udnie (Young American Girl, The Dance), oil on canvas, 290 x 300 cm, Musée National d’Art Moderne, Centre Georges Pompidou, Paris..jpg",{"tip":"1913년 뉴욕으로 가는 배에서 본 무용수의 춤을 거의 추상에 가까운 색면으로 풀어낸 대작(290×300cm)입니다. 다다 이전, 입체주의·오르피즘 시기의 대표작입니다. 2026년 서울 여의도 퐁피두센터 한화 개관전 「큐비스트: 시각의 혁신가들」(10월 4일까지)에서도 전시됐습니다."}],["가슴 (Seins)","Seins","1927","unknown","File:Francis Picabia, 1927 - Seins.jpg",{"tip":"현재 소장처를 공개 자료로 확인하지 못했습니다. 개인 소장품일 가능성이 높습니다."}],["이리스","Iris","1929경","private","File:Francis picabia iris 2019 CKS 16931 0124 000(042608).jpg",{"tip":"얼굴, 손, 꽃 같은 여러 이미지를 반투명하게 겹쳐 그린 '투명(Transparences)' 연작 시기의 작품입니다. 2019년 런던 크리스티 경매에 나온 개인 소장품입니다."}],["캐치 애즈 캐치 캔 (레슬링)","Catch as Catch Can","1913","philly","File:Francis Picabia, 1913, Catch as Catch Can, oil on canvas, 100.6 x 81.6 cm, Philadelphia Museum of Art.jpg",{"tip":"레슬링 선수들이 맞붙는 동작을 색면과 곡선 조각으로 잘게 분해했습니다. 형체를 알아보기 어려울 만큼 추상에 가까워진 초기작입니다."}],["카코딜산 눈","L'Œil cacodylate (The Cacodylic Eye)","1921","pompidou","File:Francis Picabia, 1921, L'oeil cacodylate, oil and collage on canvas, 148.6 x 117.4 cm, Musée National d'Art Moderne.jpg",{"tip":"눈병으로 카코딜산 치료를 받던 시기에 그린 작품으로, 커다란 눈 하나 주위를 친구와 방문객들이 남긴 서명과 글귀가 가득 채우고 있습니다."}],["나는 다시 기억 속에서 사랑하는 우드니를 본다","I See Again in Memory My Dear Udnie","1914","moma","File:Francis Picabia, I See Again in Francis Picabia, I See Again in Memory My Dear UdnieMemory My Dear Udnie (50393838796).jpg",{"tip":"뉴욕으로 가는 배에서 본 무용수에 대한 기억을 곡선과 기계적인 형태로 풀어낸 대형 추상화입니다. 퐁피두 센터의 「우드니」와 같은 기억에서 출발했습니다."}],["에드타오니슬 (성직자)","Edtaonisl (Ecclesiastic)","1913","aic","File:Francis Picabia, 1913, Edtaonisl (Ecclesiastic), oil on canvas, 300.4 x 300.7 cm, Art Institute of Chicago.jpg",{"tip":"대서양 횡단 여객선에서 본 성직자와 무용수의 모습을 잘게 쪼갠 색면으로 표현했습니다. 제목은 두 단어의 글자를 번갈아 섞어 만든 조어입니다."}]]},{"n":"조르조 데 키리코","o":"Giorgio de Chirico","l":"1888–1978","d":"텅 빈 광장과 기묘한 사물의 '형이상회화'로 초현실주의에 큰 영향을 주었습니다.","w":[["사랑의 노래","The Song of Love","1914","moma","The Song of Love",{"cr":1,"tip":"석고 아폴론 두상과 고무장갑, 초록 공이 나란히 놓인 기묘한 조합입니다. 마그리트가 이 그림을 보고 눈물을 흘렸다는 일화가 유명합니다."}],["거리의 신비와 우울","Mystery and Melancholy of a Street","1914","private","Mystery and Melancholy of a Street",{"cr":1,"tip":"굴렁쇠를 굴리는 소녀가 텅 빈 거리를 달려가고, 그 앞에 보이지 않는 누군가의 긴 그림자가 드리워져 있습니다. 불안한 정적이 감도는 형이상학 회화의 대표작입니다."}],["몽파르나스역 (출발의 우울)","Gare Montparnasse (The Melancholy of Departure)","1914","moma","x",{"cr":1,"tip":"아케이드와 시계탑, 멀리 연기를 내뿜는 기차가 기울어진 원근법 속에 놓였습니다. 앞쪽의 바나나 다발도 놓치지 마세요."}],["아리아드네","Ariadne","1913","met","x",{"cr":1,"tip":"고대 조각 '잠든 아리아드네'가 텅 빈 광장에 누워 있고, 뒤로 탑과 기차가 보입니다. 긴 그림자가 오후의 적막을 더합니다."}],["시인의 불확실성","The Uncertainty of the Poet","1913","tatem","x",{"tip":"텅 빈 아케이드 앞에 고전 조각의 토르소와 바나나 다발이 나란히 놓여 있습니다. 멀리 지나가는 기차가 낯설고 불안한 분위기를 더합니다.","cr":1}],["무한의 향수","The Nostalgia of the Infinite","1912–1913경","moma","x",{"tip":"깃발이 휘날리는 높은 탑과 길게 늘어진 그림자, 아주 작은 두 인물을 대비시켜 고요하면서도 불안한 광장을 그렸습니다.","cr":1}],["붉은 탑","The Red Tower","1913","pgc","x",{"tip":"아케이드가 늘어선 광장 너머로 붉은 원통형 탑이 솟아 있는 형이상학적 풍경입니다. 비스듬한 빛과 긴 그림자가 멈춰 버린 시간의 느낌을 줍니다.","cr":1}]]},{"n":"막스 에른스트","o":"Max Ernst","l":"1891–1976","d":"다다에서 초현실주의로 넘어간 독일 화가. 프로타주 기법을 개발했습니다.","w":[["셀레베스의 코끼리","Celebes","1921","tatem","Celebes (painting)",{"cr":1,"tip":"코끼리 모양의 거대한 형체는 인류학 잡지에 실린 아프리카의 곡물 저장통 사진에서 착안했습니다. 오른쪽 아래 머리 없는 여인도 눈여겨보세요."}],["신부의 단장","The Robing of the Bride","1940","pgc","The Robing of the Bride",{"cr":1,"tip":"붉은 깃털 망토를 두른 신부 곁에 새 모습의 인물과 여인들이 서 있습니다. 벽에 걸린 그림 속에도 비슷한 신부의 모습이 반복됩니다."}],["나이팅게일에게 위협받는 두 아이","Two Children Are Threatened by a Nightingale","1924","moma","x",{"cr":1,"tip":"그림 액자 밖으로 나무 문과 집, 손잡이가 실제로 튀어나와 있습니다. 회화와 오브제를 섞은 초기 초현실주의 작품입니다."}],["비 온 뒤의 유럽 II","Europe after the Rain II","1940–1942","wadsworth","x",{"cr":1,"tip":"폐허처럼 녹아내린 유럽 풍경을 물감을 눌렀다 떼는 데칼코마니 기법으로 표현했습니다. 제2차 세계대전 중 미국으로 망명하며 완성했습니다."}],["위뷔 황제","Ubu Imperator","1923","pompidou","x",{"tip":"알프레드 자리의 희곡 속 폭군 위뷔를 기울어진 팽이 같은 붉은 형체로 그렸습니다. 권력의 위태로움을 풍자한 작품으로 읽힙니다.","cr":1}],["숲과 비둘기","Forest and Dove","1927","tatem","x",{"tip":"물감을 칠한 캔버스를 긁어내는 그라타주 기법으로 빽빽한 숲의 질감을 만들었습니다. 작가가 즐겨 그린 새가 숲속에 갇힌 듯 놓여 있습니다.","cr":1}],["대립 교황","The Antipope","1941–1942","pgc","x",{"tip":"말의 머리를 한 인물들이 물가에 모여 있는 환상적인 장면입니다. 페기 구겐하임과 함께 지내던 시기에 그렸으며, 인물들은 작가 주변 사람들과 연결해 해석되곤 합니다.","cr":1}]]},{"n":"호안 미로","o":"Joan Miró","l":"1893–1983","d":"스페인 카탈루냐 출신. 아이 같은 기호와 원색으로 무의식을 그렸습니다.","w":[["어릿광대의 사육제","Harlequin's Carnival","1924–1925","buffalo","Harlequin's Carnival",{"cr":1,"tip":"작은 생명체와 악기, 사다리가 축제처럼 뒤엉켜 있습니다. 미로는 가난으로 굶주리던 시절에 본 환각에서 이 그림이 나왔다고 말했습니다."}],["경작지","The Tilled Field","1923–1924","guggenheim","The Tilled Field",{"cr":1,"tip":"고향 몽트로이그의 농장을 그렸는데, 나무에 귀가 달리고 땅에 눈이 박혀 있습니다. 미로가 초현실주의로 넘어가는 전환점이 된 작품입니다."}],["사냥꾼 (카탈루냐 풍경)","The Hunter (Catalan Landscape)","1923–1924","moma","The Hunter (Catalan Landscape)",{"cr":1,"tip":"파이프를 문 카탈루냐 사냥꾼과 정어리, 'SARD' 글자가 단순한 기호로 흩어져 있습니다. 기호를 하나씩 찾아보는 재미가 있습니다."}],["달을 보고 짖는 개","Dog Barking at the Moon","1926","philly","x",{"cr":1,"tip":"어두운 밤하늘 아래 개가 달을 보고 짖고, 사다리가 하늘로 이어집니다. 단순한 형태에 유머와 쓸쓸함이 함께 담겼습니다."}],["블루 II","Blue II","1961","pompidou","x",{"cr":1,"tip":"넓은 파란 바탕에 검은 점들과 붉은 선 하나만 놓인 대형 세 폭 연작 중 두 번째입니다. 최소한의 요소로 넓은 공간감을 만들어 냅니다."}],["농장","The Farm","1921–1922","nga","x",{"cr":1,"tip":"소설가 어니스트 헤밍웨이가 사들여 아꼈던 그림입니다."}],["자화상 I","Self-Portrait I","1937–1938","moma","x",{"cr":1,"tip":"스페인 내전 중 파리에서 그린 자화상으로, 연필 선을 주로 써서 얼굴을 그렸습니다. 별과 불꽃처럼 이글거리는 눈이 인상적입니다."}],["미지의 세계를 연인에게 알려 주는 아름다운 새","The Beautiful Bird Revealing the Unknown to a Pair of Lovers","1941","moma","x",{"cr":1,"tip":"'별자리' 연작 23점 가운데 하나입니다."}],["세계의 탄생","The Birth of the World","1925","moma","x",{"tip":"고르지 않게 밑칠한 캔버스에 물감을 흘리고 문질러 우연한 얼룩을 만든 뒤 몇 개의 선과 형태를 더했습니다. 작가는 이 그림을 일종의 창세기라고 불렀습니다.","cr":1}],["낡은 구두가 있는 정물","Still Life with Old Shoe","1937","moma","x",{"tip":"구두, 포크에 꽂힌 사과, 병, 빵 조각 같은 평범한 사물을 강렬하고 불길한 색으로 그렸습니다. 스페인 내전 중에 그린 그림으로 전쟁의 고통이 배어 있습니다.","cr":1}],["달빛 속 여인들과 새","Women and Bird in the Moonlight","1949","tatem","x",{"tip":"검은 윤곽선과 원색 면으로 여인, 새, 달, 별을 그렸습니다. 작가가 평생 반복한 여인·새·별 모티프가 경쾌한 리듬으로 어우러집니다.","cr":1}]]},{"n":"르네 마그리트","o":"René Magritte","l":"1898–1967","d":"평범한 사물을 낯설게 배치해 이미지와 현실의 관계를 묻는 벨기에 화가입니다.","w":[["이미지의 배반 (이것은 파이프가 아니다)","The Treachery of Images","1929","lacma","The Treachery of Images",{"cr":1,"tip":"파이프를 사실적으로 그려 놓고 그 아래 '이것은 파이프가 아니다'라고 적었습니다. 그림과 실제 사물의 차이를 묻는 유명한 작품입니다."}],["빛의 제국","The Empire of Light","1950","moma","The Empire of Light",{"cr":1,"tip":"20여 점의 연작으로, 브뤼셀 마그리트 미술관과 베네치아 페기 구겐하임 컬렉션에도 있습니다."}],["사람의 아들","The Son of Man","1964","private","The Son of Man",{"cr":1,"tip":"중산모를 쓴 남자의 얼굴을 초록 사과가 가리고 있습니다. 마그리트가 자화상으로 그린 작품으로, 개인 소장이라 직접 보기는 어렵습니다."}],["연인들","The Lovers","1928","moma","The Lovers (Magritte)",{"cr":1,"tip":"천으로 얼굴을 감싼 두 연인이 입을 맞추고 있습니다. 같은 해 그린 다른 버전이 호주 국립미술관에 있습니다."}],["골콩드","Golconda","1953","menil","Golconda (painting)",{"cr":1,"tip":"중산모에 코트를 입은 남자들이 빗방울처럼 하늘에 떠 있습니다. 가까이 보면 인물마다 자세와 크기가 조금씩 다릅니다."}],["가짜 거울","The False Mirror","1929","moma","x",{"cr":1,"tip":"커다란 눈의 홍채 자리에 구름 낀 푸른 하늘이 비칩니다. 검은 동공이 하늘 한가운데 떠 있는 듯한 기묘한 장면을 살펴보세요."}],["인간의 조건","The Human Condition","1933","nga","x",{"cr":1,"tip":"창 앞 이젤 위의 캔버스가 바깥 풍경과 감쪽같이 이어집니다. 그림과 현실의 경계를 묻는 마그리트의 대표 주제입니다."}],["멈춘 시간","Time Transfixed","1938","aic","x",{"cr":1,"tip":"벽난로에서 기관차가 튀어나오는 장면으로, 마그리트의 대표적인 데페이즈망 작품입니다."}],["위협받는 암살자","The Menaced Assassin","1927","moma","x",{"tip":"축음기 소리에 귀 기울이는 살인자와 쓰러진 여인, 문 옆에 숨어 기다리는 두 남자를 그렸습니다. 당시 범죄 소설과 영화의 영향을 받은 장면입니다.","cr":1}],["청취실","The Listening Room","1952","menil","x",{"tip":"거대한 초록 사과 하나가 방 안을 가득 채우고 있습니다. 익숙한 사물의 크기를 바꿔 낯설게 만드는 작가의 대표적인 방식이 잘 드러납니다.","cr":1}],["개인적 가치","Personal Values","1952","sfmoma","x",{"tip":"빗, 비누, 유리잔, 면도솔 같은 일상 소품이 침실 가구보다 훨씬 크게 그려졌습니다. 벽에는 하늘과 구름이 그려져 있어 실내와 바깥의 경계가 흐려집니다.","cr":1}]]},{"n":"살바도르 달리","o":"Salvador Dalí","l":"1904–1989","d":"'편집증적 비판' 방법으로 꿈을 사진처럼 정밀하게 그렸습니다.","w":[["기억의 지속","The Persistence of Memory","1931","moma","The Persistence of Memory",{"cr":1,"tip":"가로 33cm 남짓한 작은 그림이라 실물을 보면 놀라는 사람이 많습니다."}],["불타는 기린","The Burning Giraffe","1937","basel","The Burning Giraffe",{"cr":1,"tip":"몸에서 서랍이 튀어나온 여인 뒤로 불타는 기린이 서 있습니다. 달리는 이 그림을 다가올 전쟁의 예감이라고 말했습니다."}],["나르키소스의 변형","Metamorphosis of Narcissus","
