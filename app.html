nard - Inspiration.jpg",{"tip":"한 시간 만에 그렸다고 전해지는 '환상의 인물' 연작 가운데 하나로, 빠른 붓질이 돋보입니다."}],["목욕하는 여인들","The Bathers","1765경","louvre","File:Jean-Honoré Fragonard - The Bathers - WGA8074.jpg",{"tip":"자연 속에서 물놀이하는 여인들을 소용돌이치듯 자유로운 붓질로 그렸습니다. 인물과 풍경이 하나로 녹아드는 듯한 화면이 특징입니다."}],["정원의 까막잡기 놀이","Blindman's Buff","1775–1780경","nga","File:Jean Honoré Fragonard, Blindman's Buff, c. 1775-1780, NGA 46115.jpg",{"tip":"거대한 정원 풍경 속에서 사람들이 작게 눈가리개 놀이를 즐기는 모습으로, 인물보다 나무와 하늘이 화면을 압도합니다."}],["칼리로에를 구하려 자신을 희생하는 코레수스","Coresus Sacrificing Himself to Save Callirhoe","1765","louvre","Coresus Sacrificing Himself to Save Callirhoe",{"tip":"사랑하는 여인 대신 스스로 칼을 겨눈 사제 코레수스를 그린 역사화로, 1765년 살롱에서 호평을 받아 아카데미 입회를 이끈 작품입니다."}],["드니 디드로의 초상","Portrait of Denis Diderot","1769경","louvre","File:Jean-Honoré Fragonard - Denis Diderot (Fanciful Figure) - WGA8064.jpg",{"tip":"책장을 넘기다 고개를 돌린 남자를 빠른 붓질로 그린 '환상 인물' 연작의 하나입니다. 전통적으로 계몽사상가 디드로로 여겨져 왔으나 확실하지는 않습니다."}],["연애편지","The Love Letter","1770년대","met","File:The Love Letter MET DP-1014-001.jpg",{"tip":"꽃다발 속에 편지를 숨긴 채 고개를 돌려 바라보는 여인을 그렸습니다. 편지에 적힌 글씨 때문에 모델의 정체를 두고 여러 해석이 있습니다."}],["시소","The See-Saw","1750–1752경","thyssen","The See-Saw (Fragonard, Madrid)",{"tip":"숲속에서 시소를 타며 노는 젊은 남녀를 그린 초기작으로, 스승 부셰의 영향이 짙게 남아 있습니다."}],["까막잡기 놀이","Blind-Man's Buff","1750–1752경","toledoma","File:Jean-Honoré Fragonard - Blind-Man’s Buff - Google Art Project.jpg",{"tip":"눈을 가린 젊은 여인이 술래가 되어 손을 뻗는 장면을 화사한 정원 속에 그렸습니다. 워싱턴 내셔널 갤러리의 초기작 〈그네〉와 짝을 이루는 그림입니다."}]]},{"n":"장 바티스트 시메옹 샤르댕","o":"Jean-Baptiste-Siméon Chardin","l":"1699–1779","d":"로코코 시대에 소박한 정물과 서민의 일상을 고요하게 그렸습니다.","w":[["식전 기도","Saying Grace","1740","louvre","Saying Grace (Chardin)",{"tip":"식탁을 차리는 어머니 앞에서 어린아이가 식사 전 기도를 드리는 장면으로, 소박한 가정의 일상을 차분하게 담았습니다."}],["비눗방울","Soap Bubbles","1733–1734경","met","Soap Bubbles (Chardin)",{"tip":"창턱에 기대 비눗방울을 부는 젊은이를 그렸습니다. 금방 터질 비눗방울은 덧없음을 상징하며, 비슷한 구도의 다른 버전도 남아 있습니다."}],["가오리","The Ray","1728","louvre","File:Jean Siméon Chardin - The Ray - WGA04738.jpg",{"tip":"배가 갈린 채 매달린 가오리와 굴 위로 올라선 고양이를 그린 정물화로, 이 작품 덕분에 화가는 왕립 아카데미 회원이 되었습니다."}],["어린 여선생","The Little Schoolmistress","1740 이후","nga","File:Jean Siméon Chardin, The Little Schoolmistress, after 1740, NGA 98.jpg",{"tip":"어린 소녀가 더 어린 아이에게 글자를 짚어 가며 가르치는 장면으로, 조용히 집중하는 순간을 담았습니다."}],["팽이를 돌리는 소년","Boy with a Spinning-Top","1738","louvre","Boy with a Spinning-Top",{"tip":"책상 위에서 도는 팽이에 시선을 고정한 소년을 그렸습니다. 모델은 보석상 고드프루아의 아들 오귀스트 가브리엘입니다."}],["브리오슈","The Brioche","1763","louvre","File:Jean Siméon Chardin - 'La Brioche' (Cake) - WGA04779.jpg",{"tip":"오렌지 꽃가지를 꽂은 브리오슈와 과일, 사탕 그릇을 그린 정물화로, 말년의 샤르댕이 이룬 부드러운 빛과 질감을 보여 줍니다."}],["찬장","The Buffet","1728","louvre","The Buffet (Chardin)",{"tip":"은식기와 과일 사이로 앵무새와 개가 등장하는 화려한 정물화로, 「가오리」와 함께 왕립 아카데미 입회 작품으로 제출되었습니다."}]]},{"n":"엘리자베스 비제 르브룅","o":"Élisabeth Vigée Le Brun","l":"1755–1842","d":"마리 앙투아네트의 초상화가로 이름을 떨친 여성 화가입니다.","w":[["마리 앙투아네트와 아이들","Marie Antoinette and Her Children","1787","versailles","Marie Antoinette and Her Children",{"tip":"왕비의 나쁜 평판을 바꾸려는 의도로 주문된 가족 초상입니다. 오른쪽의 빈 요람은 제작 무렵 세상을 떠난 어린 공주를 떠올리게 합니다."}],["밀짚모자를 쓴 자화상","Self-portrait in a Straw Hat","1782 이후","ngl","Self-portrait in a Straw Hat",{"tip":"루벤스의 그림 '밀짚모자'를 보고 감명받아 그린 자화상으로, 야외의 빛 아래 팔레트를 든 화가 자신의 모습을 담았습니다."}],["딸 쥘리와 함께 있는 자화상","Self-Portrait with Her Daughter, Julie","1789","louvre","File:Elisabeth Vigée-Lebrun - Self-Portrait with Her Daughter, Julie - WGA25083.jpg",{"tip":"고대풍의 단순한 옷차림으로 딸을 품에 안은 자화상입니다. 모녀의 다정한 포옹이 따뜻하게 그려져 있습니다."}],["장미를 든 마리 앙투아네트","Marie Antoinette with a Rose","1783","versailles","File:Louise Elisabeth Vigée-Lebrun - Marie-Antoinette dit « à la Rose » - Google Art Project.jpg",{"tip":"왕비가 얇은 슈미즈 드레스를 입은 초상이 격식에 어긋난다는 비난을 받자, 비단 드레스 차림으로 다시 그린 작품입니다."}],["자화상","Self-Portrait","1790","uffizi","Self-Portrait Painting Marie Antoinette",{"tip":"혁명을 피해 이탈리아에 머물던 중 우피치의 화가 자화상 컬렉션을 위해 그린 그림으로, 캔버스에 마리 앙투아네트를 그리는 모습입니다."}],["그랑 부인","Madame Grand","1783","met","File:Madame Grand (Noël Catherine Vorlée, 1761–1835) MET DP320094.jpg",{"tip":"훗날 외교관 탈레랑과 결혼하는 그랑 부인이 고개를 들어 위를 올려다보는 모습으로, 1783년 살롱에 출품되었습니다."}],["풍요를 되찾아 오는 평화","Peace Bringing Back Abundance","1780","louvre","Peace Bringing Back Abundance",{"tip":"평화와 풍요를 두 여인으로 의인화한 알레고리화로, 1783년 왕립 아카데미에 입회할 때 제출한 작품입니다."}]]}],"note":"비제 르브룅은 1783년 프랑스 왕립 회화·조각 아카데미 회원이 된 몇 안 되는 여성 화가로, 마리 앙투아네트의 초상을 30점 넘게 그렸습니다. 게인즈버러(영국 초상·풍경화)와 카날레토(베네치아 풍경화)는 로코코 양식의 화가는 아니지만, 같은 18세기를 대표하는 화가로 이 전시실에서 함께 소개합니다."},{"id":"neoclassicism","name":"신고전주의","en":"Neoclassicism","years":"1760년 – 1830년","s":1760,"e":1830,"color":"#3d5a73","sum":"폼페이 유적 발굴과 계몽사상의 영향으로 고대 그리스·로마의 절제와 도덕을 되살리려 한 양식입니다. 프랑스 혁명과 나폴레옹 시대에 공화국의 미덕과 영웅을 기리는 공식 미술이 되었습니다.","traits":["고대 조각처럼 명확한 윤곽선과 매끈한 표면","좌우 균형의 안정된 구도","애국심, 희생, 시민의 미덕 같은 교훈적 주제","색보다 선(소묘)을 중시","나폴레옹 시대의 영웅적 선전 초상 (다비드 〈알프스를 넘는 나폴레옹〉, 앵그르 〈왕좌에 앉은 나폴레옹 1세〉)"],"diff":"로코코의 경박하고 사치스러운 귀족 취향에 대한 반발로, 엄격함과 이성을 내세웁니다.","artists":[{"n":"자크 루이 다비드","o":"Jacques-Louis David","l":"1748–1825","d":"혁명의 화가이자 나폴레옹의 수석 화가입니다.","w":[["호라티우스 형제의 맹세","Oath of the Horatii","1784","louvre","Oath of the Horatii",{"tip":"세 형제가 아버지가 내민 칼 앞에서 조국을 위해 싸우기로 맹세하는 장면입니다. 오른쪽에서 슬픔에 잠긴 여인들과의 대비를 눈여겨보세요."}],["마라의 죽음","The Death of Marat","1793","brussels","The Death of Marat",{"tip":"욕조에서 살해된 혁명가 마라를 그렸습니다. 손에 쥔 편지에는 암살자 샤를로트 코르데의 이름이 적혀 있습니다."}],["나폴레옹 1세의 대관식","The Coronation of Napoleon","1805–1807","louvre","The Coronation of Napoleon",{"tip":"나폴레옹이 무릎 꿇은 조제핀에게 관을 씌우는 장면입니다. 실제로는 식에 참석하지 않은 나폴레옹의 어머니가 중앙 관람석에 그려져 있습니다."}],["소크라테스의 죽음","The Death of Socrates","1787","met","The Death of Socrates",{"tip":"독배를 받으면서도 손가락을 들어 제자들에게 가르침을 이어 가는 소크라테스를 그렸습니다. 침대 끝에 등을 돌리고 앉은 노인은 플라톤입니다."}],["알프스를 넘는 나폴레옹","Napoleon Crossing the Alps","1801","malmaison","File:David - Napoleon crossing the Alps - Malmaison1.jpg",{"tip":"다섯 가지 버전이 있으며 베르사유, 샤를로텐부르크, 빈 벨베데레에도 있습니다."}],["레카미에 부인","Portrait of Madame Récamier","1800","louvre","Portrait of Madame Récamier",{"tip":"고대풍 의자에 기대 앉은 레카미에 부인을 그린 초상으로, 미완성으로 남아 배경이 텅 비어 있습니다."}],["라부아지에 부부의 초상","Antoine-Laurent Lavoisier and His Wife","1788","met","File:Antoine-Laurent Lavoisier (1743–1794) and His Wife (Marie-Anne-Pierrette Paulze, 1758–1836) MET DT1992.jpg",{"tip":"근대 화학의 아버지 라부아지에와 실험을 도운 아내를 그렸습니다. 라부아지에는 몇 년 뒤 혁명 중에 처형되었습니다."}],["사비니 여인들의 중재","The Intervention of the Sabine Women","1799","louvre","The Intervention of the Sabine Women",{"tip":"로마인과 사비니인의 전투 한가운데로 헤르실리아가 팔을 벌리고 뛰어든 장면으로, 혁명 이후의 화해를 호소한 작품으로 읽힙니다."}],["브루투스에게 아들들의 시신을 운반하는 호위병들","The Lictors Bring to Brutus the Bodies of His Sons","1789","louvre","The Lictors Bring to Brutus the Bodies of His Sons",{"tip":"반역에 가담한 두 아들을 처형하게 한 로마 집정관 브루투스를 그린 그림으로, 혁명이 일어난 1789년 살롱에 전시되었습니다."}],["튈르리 궁 서재의 나폴레옹","The Emperor Napoleon in His Study at the Tuileries","1812","nga","The Emperor Napoleon in His Study at the Tuileries",{"tip":"시계가 새벽 4시 13분을 가리키고 촛불이 거의 타 버린 모습으로, 밤새 법전을 다듬은 근면한 황제의 이미지를 연출했습니다."}],["테르모필레의 레오니다스","Leonidas at Thermopylae","1814","louvre","Leonidas at Thermopylae",{"tip":"페르시아군과의 결전을 앞둔 스파르타 왕 레오니다스와 병사들을 그린 대작으로, 1799년경 시작해 오랜 중단 끝에 1814년에 완성했습니다."}]]},{"n":"장 오귀스트 도미니크 앵그르","o":"Jean-Auguste-Dominique Ingres","l":"1780–1867","d":"다비드의 제자. 선의 순수성을 지킨 신고전주의의 수호자로, 들라크루아와 맞섰습니다.","w":[["그랑드 오달리스크","Grande Odalisque","1814","louvre","Grande Odalisque",{"tip":"뒤돌아 누운 여인의 등이 실제보다 길게 늘어나 있어, 발표 당시 척추뼈가 몇 개 더 있다는 비판을 받았습니다."}],["발팽송의 목욕하는 여인","The Valpinçon Bather","1808","louvre","The Valpinçon Bather",{"tip":"등을 돌리고 앉은 여인의 뒷모습만으로 고요한 분위기를 만들어 낸 작품입니다. 한때 이 그림을 소장한 발팽송 가문의 이름에서 제목이 붙었습니다."}],["왕좌에 앉은 나폴레옹 1세","Napoleon I on His Imperial Throne","1806","armee","Napoleon I on His Imperial Throne",{"tip":"황제의 관과 홀, 망토로 치장한 나폴레옹을 정면에서 엄숙하게 그렸습니다. 발표 당시에는 지나치게 고풍스럽다는 비판을 받기도 했습니다."}],["터키탕","The Turkish Bath","1862","louvre","The Turkish Bath",{"tip":"원형 화면에 수많은 나체 여인을 빽빽하게 배치한 작품으로, 화가가 80세가 넘어 완성했습니다."}],["루이 프랑수아 베르탱의 초상","Portrait of Monsieur Bertin","1832","louvre","Portrait of Monsieur Bertin",{"tip":"신문 발행인 베르탱이 두 손을 무릎에 얹고 앉은 모습으로, 당시 부르주아 계층의 자신감을 보여 주는 초상으로 꼽힙니다."}],["오송빌 백작부인","Comtesse d'Haussonville","1845","frick","File:Jean-Auguste-Dominique Ingres - Comtesse d'Haussonville - Google Art Project.jpg",{"tip":"턱에 손가락을 댄 백작부인의 뒷모습이 뒤쪽 거울에 비쳐 보입니다. 푸른 비단 드레스의 질감 표현도 눈여겨보세요."}],["무아테시에 부인 (앉은 모습)","Madame Moitessier","1856","ngl","File:Dominique Ingres - Mme Moitessier.jpg",{"tip":"서 있는 모습을 그린 다른 초상(1851)은 워싱턴 내셔널 갤러리에 있습니다."}],["샘","La Source","1856","orsay","File:Jean Auguste Dominique Ingres - The Spring - Google Art Project 2.jpg",{"tip":"40년 가까이 구상해 일흔여섯 살에 완성한 이상적인 누드입니다."}],["오이디푸스와 스핑크스","Oedipus and the Sphinx","1808","louvre","Oedipus and the Sphinx (Ingres)",{"tip":"스핑크스의 수수께끼에 답하는 오이디푸스를 그린 그림으로, 로마 유학 중 파리로 보낸 과제작이며 훗날 화면을 넓혀 다시 손보았습니다."}],["호메로스 예찬","The Apotheosis of Homer","1827","louvre","The Apotheosis of Homer (Ingres)",{"tip":"승리의 여신에게 월계관을 받는 호메로스 주위로 고금의 시인과 예술가들이 모인 장면으로, 루브르의 천장화로 주문되었습니다."}],["브로이 공작부인","The Princesse de Broglie","1851–1853","met","The Princesse de Broglie",{"tip":"브로이 가문의 젊은 부인이 푸른 공단 드레스를 입고 의자에 기댄 초상으로, 옷감과 보석의 질감을 놀랍도록 정밀하게 묘사했습니다."}]]}]},{"id":"romanticism","name":"낭만주의","en":"Romanticism","years":"1790년 – 1850년","s":1790,"e":1850,"color":"#8c3b1f","sum":"이성과 규범을 앞세운 신고전주의에 맞서 개인의 감정, 상상력, 자연의 숭고함을 표현한 흐름입니다. 혁명과 전쟁, 난파 같은 동시대 사건과 이국적인 동방, 거대한 자연이 주제가 되었습니다.","traits":["격정적인 감정과 극적인 장면","선보다 색, 거친 붓질과 역동적 구도","자연 앞에 선 인간의 '숭고'","영국의 풍경화 혁신 (터너, 컨스터블)","전쟁의 참상과 인간의 어둠을 그린 '검은 그림' (고야)","빛과 대기 속에 형태가 녹아드는 말년의 풍경 (터너) → 인상주의와 추상의 선구"],"diff":"신고전주의가 '선과 이성'이라면 낭만주의는 '색과 감정'입니다. 앵그르와 들라크루아의 대립이 이를 상징합니다.","artists":[{"n":"프란시스코 고야","o":"Francisco Goya","l":"1746–1828","d":"스페인 궁정화가. 전쟁의 참상과 인간의 어둠을 그려 근대 미술의 문을 열었습니다.","w":[["1808년 5월 3일","The Third of May 1808","1814","prado","The Third of May 1808",{"tip":"프랑스군 총살대 앞에서 흰 셔츠를 입은 남자가 두 팔을 벌리고 있습니다. 바닥에 놓인 등불이 이 인물을 강하게 비춥니다."}],["아들을 잡아먹는 사투르누스","Saturn Devouring His Son","1819–1823","prado","Saturn Devouring His Son",{"tip":"말년의 화가가 자기 집 벽에 직접 그린 '검은 그림' 연작 중 하나로, 훗날 벽에서 떼어 내 캔버스로 옮겨졌습니다."}],["1808년 5월 2일","The Second of May 1808","1814","prado","The Second of May 1808",{"tip":"마드리드 시민들이 프랑스군의 맘루크 기병대에 맞서 봉기한 장면입니다. 짝을 이루는 '1808년 5월 3일'과 함께 보면 좋습니다."}],["카를로스 4세의 가족","Charles IV of Spain and His Family","1800–1801","prado","Charles IV of Spain and His Family",{"tip":"국왕 가족을 꾸밈없이 그려 낸 단체 초상으로, 왼쪽 어둠 속에는 캔버스 앞에 선 화가 자신이 숨어 있습니다."}],["옷을 벗은 마하","La maja desnuda","1797–1800경","prado","La maja desnuda",{"tip":"신화 속 여신이 아닌 현실의 여인을 나체로 그린 작품으로, 같은 자세의 '옷을 입은 마하'와 짝을 이룹니다. 관람자를 똑바로 바라보는 시선을 눈여겨보세요."}],["옷을 입은 마하","La maja vestida","1800–1807경","prado","La maja vestida",{"tip":"두 마하는 프라도에서 나란히 걸려 있습니다."}],["붉은 옷의 소년 (마누엘 오소리오)","Manuel Osorio Manrique de Zúñiga","1787–1788","met","File:Manuel Osorio Manrique de Zuñiga (1784–1792) MET DP287624.jpg",{"tip":"소년이 끈에 묶은 까치를 고양이들이 노려보는 모습에 순수함과 위험이 함께 담겨 있습니다."}],["개","The Dog","1819–1823","prado","File:Perro semihundido.jpg",{"tip":"광막한 빈 공간 아래로 개의 머리만 보이는 '검은 그림'으로, 고야의 집 벽에 그렸던 것을 훗날 캔버스로 옮겼습니다."}],["마녀들의 안식일 (거대한 숫염소)","Witches' Sabbath (The Great He-Goat)","1820–1823","prado","File:Francisco de Goya y Lucientes - Witches' Sabbath (The Great He-Goat).jpg",{"tip":"숫염소 모습의 악마 앞에 모인 마녀들을 그린 '검은 그림'으로, 일그러진 얼굴들을 통해 맹신에 빠진 군중을 표현했습니다."}],["양산","The Parasol","1777","prado","File:El Quitasol (Goya).jpg",{"tip":"왕립 태피스트리 공장을 위한 밑그림으로, 초록 양산 아래 앉은 여인의 얼굴에 비친 부드러운 빛이 돋보입니다."}],["이성이 잠들면 괴물이 깨어난다","The Sleep of Reason Produces Monsters","1797–1799","various","The Sleep of Reason Produces Monsters",{"tip":"판화집 「로스 카프리초스」의 43번으로, 책상에 엎드려 잠든 남자 주위로 올빼미와 박쥐가 몰려드는 장면입니다."}]]},{"n":"윌리엄 블레이크","o":"William Blake","l":"1757–1827","d":"시인이자 판화가. 자신만의 신화와 환상을 독창적인 이미지로 그렸습니다.","w":[["벼룩의 유령","The Ghost of a Flea","1819–1820경","tateb","The Ghost of a Flea",{"tip":"블레이크가 환영으로 보았다고 말한 벼룩의 유령을 그린 작은 템페라화입니다. 피를 담을 그릇을 든 채 무대 위를 걷습니다."}],["뉴턴","Newton","1795–1805경","tateb","Newton (Blake)",{"tip":"바닷속 바위에 앉은 뉴턴이 컴퍼스로 도형을 그립니다. 이성만으로 세계를 재려는 태도에 대한 블레이크의 비판이 담겨 있습니다. 빛에 약한 종이 작품이라 늘 전시되지는 않습니다."}],["느부갓네살","Nebuchadnezzar","1795–1805경","tateb","Nebuchadnezzar (Blake)",{"tip":"신의 벌을 받아 짐승처럼 풀을 먹게 된 바빌론 왕을 그린 채색 판화입니다. 「뉴턴」과 짝을 이루는 연작입니다. 빛에 약한 종이 작품이라 늘 전시되지는 않습니다."}],["거대한 붉은 용과 태양을 입은 여인","The Great Red Dragon and the Woman Clothed with the Sun","1805경","nga","File:William Blake - The Great Red Dragon and the Woman Clothed with the Sun - Google Art Project.jpg",{"tip":"요한계시록의 붉은 용이 태양을 입은 여인을 덮치려는 장면을 그린 수채화입니다. 이 연작은 소설 『레드 드래곤』으로 널리 알려졌습니다. 종이 작품이라 평소에는 전시되지 않습니다."}]]},{"n":"카스파르 다비트 프리드리히","o":"Caspar David Friedrich","l":"1774–1840","d":"독일 낭만주의를 대표하는 풍경화가. 고요하고 명상적인 숭고를 그렸습니다.","w":[["안개 바다 위의 방랑자","Wanderer above the Sea of Fog","1818경","hamburg","Wanderer above the Sea of Fog",{"tip":"안개 낀 산봉우리를 내려다보는 뒷모습의 남자를 그렸습니다. 관람자가 인물의 시선을 따라 풍경을 바라보게 되는 구도입니다."}],["바닷가의 수도사","The Monk by the Sea","1808–1810","altenat","The Monk by the Sea",{"tip":"광활한 하늘과 바다 앞에 작은 수도사 한 명만 서 있는 대담한 구성입니다. '떡갈나무 숲속의 수도원'과 짝을 이루는 작품입니다."}],["얼음 바다","The Sea of Ice","1823–1824","hamburg","The Sea of Ice",{"tip":"날카롭게 솟은 얼음 조각들이 화면을 채우고, 오른쪽에는 얼음에 짓눌려 가라앉는 배의 선체가 보입니다."}],["뤼겐섬의 백악 절벽","Chalk Cliffs on Rügen","1818","reinhart","Chalk Cliffs on Rügen",{"tip":"신혼여행으로 찾은 뤼겐섬에서 영감을 받은 그림으로, 하얀 절벽 사이로 푸른 바다를 내려다보는 세 인물이 그려져 있습니다."}],["떡갈나무 숲속의 수도원","The Abbey in the Oakwood","1809–1810","altenat","The Abbey in the Oakwood",{"tip":"앙상한 떡갈나무 사이 폐허가 된 수도원으로 관을 메고 가는 수도사들의 행렬을 그렸으며, 「바닷가의 수도사」와 짝을 이룹니다."}],["바다 위의 월출","Moonrise over the Sea","1822","altenat","Moonrise over the Sea",{"tip":"바위에 앉은 세 사람이 떠오르는 달과 돌아오는 범선을 바라보는 뒷모습을 그렸습니다."}],["달을 바라보는 두 남자","Two Men Contemplating the Moon","1825–1830경","met","File:Caspar David Friedrich - Zwei Männer in Betrachtung des Mondes (Metropolitan Museum of Art).jpg",{"tip":"드레스덴에 있는 1819년작을 화가가 다시 그린 판본으로, 쓰러진 나무 옆에서 초승달을 바라보는 두 사람의 뒷모습을 담았습니다."}]]},{"n":"테오도르 제리코","o":"Théodore Géricault","l":"1791–1824","d":"실제 난파 사건을 거대한 화폭에 담아 프랑스 낭만주의를 열었습니다.","w":[["메두사호의 뗏목","The Raft of the Medusa","1818–1819","louvre","The Raft of the Medusa",{"tip":"1816년 아프리카 서쪽 바다에서 난파한 메두사호의 생존자들을 그렸습니다. 수평선의 배를 향해 손을 흔드는 인물들을 따라 시선이 위로 올라갑니다."}],["돌격하는 근위 기병 장교","The Charging Chasseur","1812","louvre","The Charging Chasseur",{"tip":"뒤돌아보며 칼을 든 기병 장교와 앞발을 든 말을 역동적인 대각선 구도로 그린, 젊은 화가의 살롱 데뷔작입니다."}],["도박에 빠진 여인","The Woman with a Gambling Mania","1819–1822경","louvre","The Woman with a Gambling Mania",{"tip":"정신과 의사를 위해 그린 '편집광' 초상 연작 중 하나로, 도박에 집착하는 나이 든 여인의 공허한 눈빛을 담았습니다."}],["엡섬의 더비 경마","The Derby at Epsom","1821","louvre","File:Le Derby de 1821 à Epsom - Théodore Géricault - Musée du Louvre Peintures MI 708.jpg",{"tip":"네 다리를 앞뒤로 쭉 뻗고 달리는 말들을 그렸는데, 훗날 연속 사진을 통해 실제 말은 이렇게 달리지 않는다는 사실이 밝혀졌습니다."}],["부상당한 흉갑기병","The Wounded Cuirassier","1814","louvre","The Wounded Cuirassier",{"tip":"다친 기병이 말을 끌고 전장을 떠나는 모습으로, 나폴레옹이 퇴위한 1814년 살롱에 출품되어 패전의 분위기를 전합니다."}],["석고 가마","The Plaster Kiln","1822–1823경","louvre","File:Le Four à plâtre - Théodore Géricault - Musée du Louvre Peintures INV 4888 ; MN 28.jpg",{"tip":"파리 근교 석고 가마 앞에 매여 있는 말들과 허름한 건물을 그린 풍경입니다. 영웅적인 주제 대신 평범한 일상 풍경을 택한 말년 작품입니다."}],["기수 없는 말들의 경주","Race of the Riderless Horses","1817","getty","File:Théodore Géricault - The Race of the Riderless Horses - 85.PC.406 - J. Paul Getty Museum.jpg",{"tip":"로마 카니발 때 열린 기수 없는 말 경주를 주제로 한 습작입니다. 이탈리아 체류 중 대작으로 구상했지만 완성하지 못했습니다."}]]},{"n":"외젠 들라크루아","o":"Eugène Delacroix","l":"1798–1863","d":"프랑스 낭만주의의 지도자. 강렬한 색채는 인상주의자들에게도 영향을 주었습니다.","w":[["민중을 이끄는 자유의 여신","Liberty Leading the People","1830","louvre","Liberty Leading the People",{"tip":"1830년 7월 혁명을 그린 작품으로, 삼색기를 든 자유의 여신이 시민들을 이끌고 바리케이드를 넘어 나아갑니다."}],["사르다나팔루스의 죽음","The Death of Sardanapalus","1827","louvre","The Death of Sardanapalus",{"tip":"적에게 포위된 아시리아 왕이 침대에 누워 애첩과 말들이 죽임을 당하는 모습을 지켜보는 장면입니다. 바이런의 희곡에서 영감을 받았습니다."}],["키오스섬의 학살","The Massacre at Chios","1824","louvre","The Massacre at Chios",{"tip":"그리스 독립 전쟁 중 1822년 오스만 군대가 키오스섬 주민을 학살한 사건을 그렸습니다. 당대의 비극을 생생하게 고발한 작품입니다."}],["단테의 조각배","The Barque of Dante","1822","louvre","The Barque of Dante",{"tip":"단테와 베르길리우스가 지옥의 강을 건너는 장면으로, 화가의 살롱 데뷔작입니다. 배에 매달린 망자들의 몸에 맺힌 물방울 표현을 눈여겨보세요."}],["알제의 여인들","The Women of Algiers","1834","louvre","The Women of Algiers",{"tip":"북아프리카 여행에서 본 알제의 실내를 바탕으로, 화려한 옷차림의 여인들이 쉬는 모습을 그렸습니다. 훗날 피카소가 이 작품을 변주한 연작을 남겼습니다."}],["프레데리크 쇼팽의 초상","Frédéric Chopin","1838","louvre","File:Eugène Delacroix - Frédéric Chopin - WGA06194.jpg",{"tip":"원래 쇼팽과 조르주 상드를 함께 그린 그림이 둘로 잘린 것으로, 상드 부분은 코펜하겐 오르드룹고르 미술관에 있습니다."}],["십자군의 콘스탄티노플 입성","The Entry of the Crusaders into Constantinople","1840","louvre","File:The Entry of the Crusaders into Constantinople - 1840 - Eugène Delacroix - Louvre - Inv 3821.jpg",{"tip":"1204년 제4차 십자군이 콘스탄티노플에 들어서는 장면으로, 말 탄 지휘관들 앞에서 시민들이 자비를 구하고 있습니다."}],["천사와 씨름하는 야곱 (벽화)","Jacob Wrestling with the Angel","1855–1861","stsulpice","File:Jacob Angel Delacroix.jpg",{"tip":"들라크루아의 마지막 대작으로, 생쉴피스 성당 '천사들의 예배당' 벽에 그렸습니다."}],["묘지의 고아 소녀","Orphan Girl at the Cemetery","1824경","louvre","Orphan Girl at the Cemetery",{"tip":"눈물 맺힌 눈으로 위를 올려다보는 소녀를 그린 그림으로, 「키오스 섬의 학살」을 준비하던 시기에 그려졌습니다."}],["모로코의 유대인 결혼식","Jewish Wedding in Morocco","1837–1841","louvre","Jewish Wedding in Morocco",{"tip":"1832년 모로코 여행 중 직접 본 결혼 잔치를 스케치와 기억을 바탕으로 그린 그림입니다."}],["성전에서 쫓겨나는 헬리오도로스","Heliodorus Driven from the Temple","1855–1861","stsulpice","File:Eugène Delacroix - Heliodoros Driven from the Temple - WGA06222.jpg",{"tip":"「천사와 씨름하는 야곱」 맞은편 벽에 그린 벽화로, 성전 보물을 약탈하려던 헬리오도로스가 천상의 기사에게 쓰러지는 장면입니다."}]]},{"n":"윌리엄 터너","o":"J. M. W. Turner","l":"1775–1851","d":"빛과 대기를 녹여 낸 영국의 풍경화가. 인상주의와 추상의 선구로 평가됩니다.","w":[["전함 테메레르","The Fighting Temeraire","1839","ngl","The Fighting Temeraire",{"tip":"트라팔가르 해전에서 활약한 전함이 증기 예인선에 끌려 해체되러 가는 마지막 항해를 그렸습니다. 지는 해가 한 시대의 끝을 암시합니다."}],["비, 증기, 속도 – 그레이트 웨스턴 철도","Rain, Steam and Speed","1844","ngl","Rain, Steam and Speed – The Great Western Railway",{"tip":"그레이트 웨스턴 철도의 기차가 비를 뚫고 다리 위를 달려오는 장면입니다. 선로 앞을 달리는 작은 토끼를 찾아보세요."}],["눈보라: 알프스를 넘는 한니발과 그의 군대","Snow Storm: Hannibal and his Army Crossing the Alps","1812","tateb","Snow Storm: Hannibal and his Army Crossing the Alps",{"tip":"소용돌이치는 거대한 눈보라가 화면을 뒤덮어, 그 아래 한니발의 군대는 아주 작게 보입니다. 자연의 압도적인 힘을 강조한 작품입니다."}],["눈보라 – 항구 어귀의 증기선","Snow Storm – Steam-Boat off a Harbour's Mouth","1842","tateb","File:Joseph Mallord William Turner - Snow Storm - Steam-Boat off a Harbour's Mouth - WGA23178.jpg",{"tip":"테이트 브리튼 '클로어 갤러리'에 터너 유증 작품이 모여 있습니다."}],["노예선","The Slave Ship","1840","mfa","The Slave Ship",{"tip":"폭풍 속 노예선에서 노예들을 바다에 던지는 장면으로, 오른쪽 아래 물속에 쇠사슬에 묶인 다리와 몰려드는 물고기들이 보입니다."}],["국회의사당의 화재, 1834년 10월 16일","The Burning of the Houses of Lords and Commons","1834–1835","philly","File:Joseph Mallord William Turner, English - The Burning of the Houses of Lords and Commons, October 16, 1834 - Google Art Project.jpg",{"tip":"터너가 템스강가에서 직접 본 화재를 그렸습니다. 같은 사건을 다른 각도에서 그린 두 번째 그림은 클리블랜드 미술관에 있습니다."}],["노럼성, 해돋이","Norham Castle, Sunrise","1845경","tateb","File:Joseph Mallord William Turner - Norham Castle, Sunrise - WGA23182.jpg",{"tip":"형태가 빛 속에 거의 녹아 버린 말년작으로, 인상주의와 추상을 앞선 그림으로 자주 꼽힙니다."}],["카르타고를 건설하는 디도","Dido building Carthage","1815","ngl","Dido building Carthage",{"tip":"떠오르는 해 아래 디도가 카르타고를 건설하는 장면으로, 터너는 이 그림을 클로드 로랭의 「시바 여왕의 승선」 옆에 걸도록 유언했습니다."}],["폴리페모스를 조롱하는 율리시스","Ulysses Deriding Polyphemus","1829","ngl","Ulysses Deriding Polyphemus",{"tip":"눈먼 거인 폴리페모스에게서 벗어나 배를 띄운 율리시스를 붉게 타오르는 새벽빛 속에 그렸습니다."}],["평화—수장","Peace – Burial at Sea","1842","tateb","Peace – Burial at Sea",{"tip":"귀국길에 숨져 지브롤터 앞바다에 수장된 동료 화가 데이비드 윌키를 추모한 그림으로, 검게 칠한 돛이 애도를 나타냅니다."}],["빛과 색 (괴테의 이론)","Light and Colour (Goethe's Theory)","1843","tateb","Light and Colour (Goethe's Theory)",{"tip":"괴테의 색채론에 영향을 받아 따뜻한 색의 소용돌이로 대홍수 다음 날 아침을 그렸으며, 차가운 색조의 「그늘과 어둠」과 짝을 이룹니다."}]]},{"n":"존 컨스터블","o":"John Constable","l":"1776–1837","d":"고향 서퍽의 평범한 시골을 직접 관찰해 그린 영국 풍경화가입니다. 프랑스 바르비종파에 영향을 주었습니다.","w":[["건초 마차","The Hay Wain","1821","ngl","The Hay Wain",{"tip":"스투어강을 건너는 건초 마차와 왼쪽의 농가를 그린 시골 풍경입니다. 1824년 파리 살롱에서 금메달을 받아 프랑스 화가들에게도 영향을 주었습니다."}],["주교 정원에서 본 솔즈베리 대성당","Salisbury Cathedral from the Bishop's Grounds","1823","va","Salisbury Cathedral from the Bishop's Grounds",{"tip":"여러 버전이 있으며 프릭 컬렉션과 메트로폴리탄에도 있습니다."}],["플랫퍼드 방앗간","Flatford Mill","1816–1817","tateb","Flatford Mill (Scene on a Navigable River)",{"tip":"화가의 아버지가 소유했던 방앗간 근처의 강가 풍경으로, 바지선과 말을 다루는 사람들이 그려져 있습니다."}],["데덤 골짜기","Dedham Vale","1828","edinburgh","File:John Constable - Dedham Vale - NG 2016 - National Galleries of Scotland.jpg",{"tip":"굽이진 스투어강 골짜기 너머로 데덤 마을의 교회 탑이 멀리 보이는 풍경입니다. 화가가 나고 자란 고향 일대를 그렸습니다."}],["밀밭","The Cornfield","1826","ngl","The Cornfield",{"tip":"시골길 개울에 엎드려 물을 마시는 소년과 양 떼를 그렸으며, 화가가 세상을 떠난 뒤 지인들이 사들여 내셔널 갤러리에 기증했습니다."}],["초원에서 본 솔즈베리 대성당","Salisbury Cathedral from the Meadows","1831","tateb","Salisbury Cathedral from the Meadows",{"tip":"폭풍우가 지나가는 대성당 위로 무지개가 걸린 그림으로, 아내를 잃은 뒤 화가의 심경이 반영된 것으로 해석됩니다."}],["흰 말","The White Horse","1819","frick","The White Horse (Constable)",{"tip":"스투어 강에서 흰 말을 실은 거룻배를 그린 대형 '6피트 그림' 연작의 첫 작품으로, 이 그림으로 왕립 아카데미 준회원에 선출되었습니다."}]]}]},{"id":"pre-raphaelite","name":"라파엘전파","en":"Pre-Raphaelite Brotherhood","years":"1848년 – 1900년대 초","s":1848,"e":1910,"color":"#4f6b4a","sum":"영국 왕립아카데미의 판에 박힌 교육에 반발해 1848년 밀레이, 로세티, 홀먼 헌트가 결성한 모임입니다. 라파엘로 이전 중세·초기 르네상스 미술의 순수함으로 돌아가자는 뜻에서 이름을 지었습니다. 한 세대 뒤 워터하우스가 그 양식을 이어받아 20세기 초까지 영향을 남겼습니다.","traits":["선명하고 밝은 색","식물 하나까지 정밀하게 관찰한 자연 묘사","중세 전설, 셰익스피어, 문학에서 가져온 주제","종교적·도덕적 메시지를 담은 상징 (홀먼 헌트)","아서왕 전설과 그리스 신화 속 여성 (워터하우스)"],"diff":"같은 시기 프랑스 사실주의가 현실의 노동을 그렸다면, 영국 라파엘전파는 문학과 중세의 이상을 정밀한 사실 기법으로 그렸습니다.","artists":[{"n":"존 에버렛 밀레이","o":"John Everett Millais","l":"1829–1896","d":"라파엘전파의 창립 멤버입니다.","w":[["오필리아","Ophelia","1851–1852","tateb","File:John Everett Millais - Ophelia - Google Art Project.jpg",{"tip":"물에 떠내려가는 오필리아를 그린 그림으로, 모델 엘리자베스 시달은 물을 채운 욕조에 누워 포즈를 취했습니다. 강가의 꽃과 풀을 하나하나 정밀하게 묘사했습니다."}],["부모 집의 그리스도","Christ in the House of His Parents","1849–1850","tateb","Christ in the House of His Parents",{"tip":"목수 일터에서 손을 다친 어린 예수를 성모가 달래는 장면입니다. 성가족을 너무 평범하게 그렸다며 찰스 디킨스가 혹평한 일로 유명합니다."}],["마리아나","Mariana","1850–1851","tateb","File:John Everett Millais - Mariana - Google Art Project.jpg",{"tip":"테니슨의 시에 나오는 버림받은 여인 마리아나가 자수를 하다 허리를 펴는 순간을 그렸습니다. 스테인드글라스 창과 푸른 드레스의 색이 선명합니다."}],["눈먼 소녀","The Blind Girl","1854–1856","birmingham","File:John Everett Millais - The Blind Girl.jpg",{"tip":"쌍무지개를 등지고 앉은 눈먼 소녀 곁에서 어린 소녀가 뒤돌아 무지개를 바라봅니다. 소녀의 숄에 앉은 나비도 찾아보세요."}],["이사벨라","Isabella","1848–1849","walkerliv","Isabella (Millais painting)",{"tip":"키츠의 시를 바탕으로 이사벨라와 연인 로렌초, 두 사람을 못마땅해하는 그녀의 오빠들을 그렸으며, 밀레이가 라파엘전파 양식으로 처음 전시한 작품입니다."}],["가을 낙엽","Autumn Leaves","1855–1856","manchester","Autumn Leaves (painting)",{"tip":"해 질 녘 낙엽을 쌓는 네 소녀를 그린 그림으로, 러스킨은 '완벽하게 그려진 황혼의 첫 사례'라고 평했습니다."}],["롤리의 소년 시절","The Boyhood of Raleigh","1870","tateb","The Boyhood of Raleigh",{"tip":"데번 해안에서 선원이 바다 너머를 가리키며 들려주는 이야기에 귀 기울이는 어린 월터 롤리와 형제를 그렸습니다."}]]},{"n":"단테 가브리엘 로세티","o":"Dante Gabriel Rossetti","l":"1828–1882","d":"시인이자 화가로 라파엘전파의 중심인물입니다.","w":[["베아타 베아트릭스","Beata Beatrix","1864–1870경","tateb","Beata Beatrix",{"tip":"세상을 떠난 아내 엘리자베스 시달을 단테의 베아트리체로 그린 작품입니다. 붉은 새가 그녀의 손에 떨어뜨리는 양귀비는 죽음을 암시합니다."}],["프로세르피나","Proserpine","1874","tateb","Proserpine (Rossetti painting)",{"tip":"지하 세계에 붙잡힌 프로세르피나가 석류를 든 모습으로, 모델은 윌리엄 모리스의 아내 제인 모리스입니다. 석류를 먹으면 지상으로 완전히 돌아갈 수 없다는 신화를 담았습니다."}],["수태고지 (주님의 여종을 보라!)","Ecce Ancilla Domini!","1849–1850","tateb","File:Dante Gabriel Rossetti - Ecce Ancilla Domini! - Google Art Project.jpg",{"tip":"흰색을 중심으로 한 절제된 색으로 수태고지를 그린 라파엘전파 초기작입니다. 침대 위에서 몸을 움츠린 마리아의 모델은 화가의 여동생 크리스티나 로세티입니다."}],["백일몽","The Day Dream","1880","va","File:Dante Gabriel Rossetti - The Day Dream - Google Art Project.jpg",{"tip":"나무 위에 앉아 책을 무릎에 놓은 채 생각에 잠긴 여인을 그렸습니다. 모델은 로세티의 오랜 뮤즈였던 제인 모리스입니다."}],["성모 마리아의 소녀 시절","The Girlhood of Mary Virgin","1848–1849","tateb","The Girlhood of Mary Virgin",{"tip":"수를 놓는 어린 마리아를 그린 로세티의 첫 완성 유화로, 화가의 어머니와 누이 크리스티나가 모델을 섰습니다."}],["입맞춤 받은 입술","Bocca Baciata","1859","mfa","Bocca Baciata",{"tip":"패니 콘퍼스를 모델로 한 로세티의 첫 단독 여성 반신상으로, 이후 그의 대표 양식이 되었습니다."}],["시리아의 아스타르테","Astarte Syriaca","1877","manchester","File:Astarte Syriaca Rossetti.jpg",{"tip":"제인 모리스를 모델로 사랑의 여신 아스타르테를 그린 대형 작품으로, 액자에는 화가가 직접 쓴 소네트가 새겨져 있습니다."}]]},{"n":"윌리엄 홀먼 헌트","o":"William Holman Hunt","l":"1827–1910","d":"라파엘전파 창립 멤버 가운데 평생 그 원칙을 지킨 화가입니다.","w":[["세상의 빛","The Light of the World","1851–1853","keble","File:Hunt-light-of-the-world.jpeg",{"tip":"훗날 그린 대형 버전은 런던 세인트폴 대성당에 있습니다."}],["깨어나는 양심","The Awakening Conscience","1853","tateb","File:William Holman Hunt - The Awakening Conscience - Google Art Project.jpg",{"tip":"남자의 무릎에서 문득 일어서는 젊은 여인을 통해 정부의 삶에서 깨어나는 순간을 그렸습니다. 뒤쪽 거울에 비친 밝은 창밖 풍경과 방 안의 상징적 소품을 찾아보세요."}],["속죄양","The Scapegoat","1854–1856","ladylever","File:William Holman Hunt - The Scapegoat - WGA11808.jpg",{"tip":"사해 근처에서 직접 그렸으며, 작은 버전이 맨체스터 미술관에 있습니다."}],["고용된 양치기","The Hireling Shepherd","1851","manchester","File:William Holman Hunt - The Hireling Shepherd.jpg",{"tip":"양치기가 일을 내버려 둔 채 시골 처녀에게 나방을 보여 주는 사이 양들이 곡식밭으로 흩어지고 있습니다. 직무를 소홀히 하는 성직자에 대한 풍자로 읽히기도 합니다."}],["샬롯의 여인","The Lady of Shalott","1888–1905","wadsworth","The Lady of Shalott (William Holman Hunt)",{"tip":"저주가 풀리는 순간 베틀의 실에 휘감긴 샬롯의 여인을 그렸으며, 시력이 나빠진 헌트가 조수의 도움을 받아 완성했습니다."}],["죽음의 그림자","The Shadow of Death","1870–1873","manchester","The Shadow of Death",{"tip":"목공소에서 기지개를 켜는 청년 예수의 그림자가 벽에 십자가 모양으로 드리운 장면으로, 성지에 머물며 그렸습니다."}],["성전에서 발견된 예수","The Finding of the Saviour in the Temple","1854–1860","birmingham","The Finding of the Saviour in the Temple",{"tip":"성전에서 학자들과 이야기하던 소년 예수를 마리아와 요셉이 찾아낸 장면으로, 사실성을 위해 예루살렘에서 현지인을 모델로 그렸습니다."}]]},{"n":"프레더릭 레이턴","o":"Frederic Leighton","l":"1830–1896","at":3,"d":"빅토리아 시대 영국 미술계의 중심인물로 왕립아카데미 회장을 지냈고, 화가로는 처음으로 귀족 작위를 받았습니다. 라파엘전파 회원은 아니지만 같은 시대에 고대 그리스·로마 신화를 아름다운 인체와 화려한 색으로 그린 탐미주의·고전주의 화가입니다.","w":[["포로가 된 안드로마케","Captive Andromache","1886–1888경","manchester","File:Leighton Captive Andromache.jpg",{"tip":"트로이 전쟁 뒤 노예가 되어 우물에서 물을 긷는 헥토르의 아내를 그린 가로 4m가 넘는 대작입니다."}],["프시케의 목욕","The Bath of Psyche","1890경","tateb","File:Frederic Lord, Leighton - The Bath of Psyche - Google Art Project.jpg",{"tip":"좁고 긴 세로 화면에 연못가에서 옷을 벗는 프시케를 그렸습니다. 고대 조각처럼 매끈한 누드와 양옆의 고전 기둥에서 레이턴 특유의 고전주의가 드러납니다."}],["헤스페리데스의 정원","The Garden of the Hesperides","1892","ladylever","File:Frederic Leighton (1830-1896) - The Garden of Hesperides - LL 3139 - Lady Lever Art Gallery.jpg",{"tip":"황금 사과를 지키는 세 님프를 둥근 화면에 그렸습니다."}],["타오르는 6월","Flaming June","1895","ponce","File:Frederic Leighton - Flaming June (1895) - Museo de Arte de Ponce.jpg",{"tip":"레이턴의 가장 유명한 작품입니다. 20세기 중반 빅토리아 시대 미술이 외면받던 시절 경매에서 팔리지 않을 만큼 값이 떨어졌는데, 1963년 푸에르토리코 폰세 미술관이 사들였습니다."}],["치마부에의 성모 행렬","Cimabue's Celebrated Madonna","1853–1855","royal","Cimabue's Celebrated Madonna",{"tip":"피렌체 시민들이 치마부에의 성모화를 들고 거리를 행진하는 장면으로, 1855년 왕립 아카데미 전시 때 빅토리아 여왕이 구입했습니다. 현재 런던 내셔널 갤러리에 대여되어 있습니다."}],["페르세우스와 안드로메다","Perseus and Andromeda","1891","walkerliv","Perseus and Andromeda (Leighton)",{"tip":"페가수스를 탄 페르세우스가 바위에 묶인 안드로메다를 지키는 용을 향해 화살을 겨누는 장면입니다."}],["화가의 신혼여행","The Painter's Honeymoon","1864경","mfa","The Painter's Honeymoon",{"tip":"젊은 화가와 신부가 나란히 앉아 한 장의 그림을 들여다보는 모습으로, 평생 독신으로 산 레이턴이 그린 작품입니다."}]]},{"n":"존 윌리엄 워터하우스","o":"John William Waterhouse","l":"1849–1917","d":"한 세대 뒤에 라파엘전파 양식을 이어받아 문학 속 여성을 그렸습니다.","w":[["샬럿의 아가씨","The Lady of Shalott","1888","tateb","File:Waterhouse, The Lady of Shallott, 1888.jpg",{"tip":"테니슨의 시를 바탕으로, 저주를 안고 배에 올라 카멜롯으로 떠나는 아가씨를 그렸습니다. 뱃머리의 꺼져 가는 촛불과 배에 걸친 태피스트리를 찾아보세요."}],["마법의 원","The Magic Circle","1886","tateb","File:John William Waterhouse - Magic Circle.JPG",{"tip":"지팡이로 땅에 원을 그리며 주문을 거는 여자 마법사를 그렸습니다. 연기가 피어오르는 원 안과 황량한 원 밖 풍경의 대비를 살펴보세요."}],["힐라스와 님프들","Hylas and the Nymphs","1896","manchester","File:Waterhouse Hylas and the Nymphs Manchester Art Gallery 1896.15.jpg",{"tip":"물을 길으러 갔던 아르고호 원정대원 힐라스가 연못의 님프들에게 이끌리는 장면입니다. 2018년 미술관이 이 그림을 잠시 내려 전시를 둘러싼 논쟁을 일으킨 일로도 알려져 있습니다."}],["에코와 나르키소스","Echo and Narcissus","1903","walkerliv","File:John William Waterhouse - Echo and Narcissus - Google Art Project.jpg",{"tip":"물에 비친 자기 모습에 빠진 나르키소스와 그를 애타게 바라보는 에코를 그렸습니다. 오비디우스의 『변신 이야기』에 나오는 이야기로, 물가에 핀 수선화를 찾아보세요."}],["성녀 에울랄리아","Saint Eulalia","1885","tateb","File:John William Waterhouse - Saint Eulalia - 1885.jpg",{"tip":"순교한 소녀 성인의 시신 위로 눈이 내리고 비둘기들이 모여드는 장면으로, 바닥에 누운 인물의 과감한 단축법이 돋보입니다."}],["신탁을 묻다","Consulting the Oracle","1884","tateb","File:John William Waterhouse - Consulting the Oracle - Tate Britain.jpg",{"tip":"등불이 밝혀진 방에서 여사제가 신탁에 귀를 기울이고, 반원으로 둘러앉은 여인들이 그 말을 기다리는 장면입니다."}],["무정한 미녀","La Belle Dame sans Merci","1893","darmstadt","File:John William Waterhouse - La Belle Dame sans Merci (1893).jpg",{"tip":"키츠의 시를 바탕으로, 요정 여인이 자신의 머리카락을 기사의 목에 감아 끌어당기는 장면을 그렸습니다."}]]}]},{"id":"realism","name":"사실주의","en":"Realism","years":"1840년 – 1880년","s":1840,"e":1880,"color":"#5b5246","sum":"산업혁명과 1848년 혁명 이후, 낭만주의의 상상과 아카데미의 역사화를 거부하고 눈앞의 현실을 있는 그대로 그리자는 운동입니다. 농민과 노동자, 평범한 시민이 처음으로 대형 그림의 주인공이 되었습니다.","traits":["\"천사를 보여 주면 천사를 그리겠다\" (쿠르베)","노동자와 농민의 일상, 사회 문제","역사화 크기의 화폭에 평범한 사람을 그림","바르비종파: 퐁텐블로 숲에서 자연을 직접 관찰해 그린 풍경화","사회를 고발한 풍자 석판화 (도미에 〈트랑스노냉 거리〉)","동물을 정밀하게 관찰한 대형 동물화 (로자 보뇌르)"],"diff":"낭만주의의 영웅, 이국, 상상 대신 지금 여기의 현실을 그립니다.","artists":[{"n":"귀스타브 쿠르베","o":"Gustave Courbet","l":"1819–1877","d":"사실주의라는 이름을 스스로 내건 선언자입니다.","w":[["오르낭의 매장","A Burial at Ornans","1849–1850","orsay","A Burial at Ornans",{"tip":"고향 오르낭의 평범한 장례식을 역사화에나 쓰던 거대한 화면에 그렸습니다. 마을 사람들을 실물 크기로 늘어세운 구성이 당시 큰 논란을 일으켰습니다."}],["화가의 아틀리에","The Painter's Studio","1855","orsay","The Painter's Studio",{"tip":"그림을 그리는 화가를 가운데 두고 왼쪽에 사회의 여러 인물을, 오른쪽에 친구와 후원자들을 배치했습니다. 1855년 만국박람회에서 거절당하자 쿠르베는 따로 전시관을 열어 이 그림을 걸었습니다."}],["안녕하세요, 쿠르베 씨","Bonjour, Monsieur Courbet","1854","fabre","Bonjour, Monsieur Courbet",{"tip":"몽펠리에 근교 길에서 후원자 알프레드 브뤼야스가 하인과 함께 화가를 맞이하는 장면입니다. 배낭을 멘 채 고개를 꼿꼿이 든 쿠르베의 모습에서 화가의 자부심이 드러납니다."}],["돌 깨는 사람들","The Stone Breakers","1849","lost","The Stone Breakers",{"tip":"사실주의의 상징 같은 작품이지만 지금은 사진으로만 남아 있습니다."}],["앵무새와 여인","Woman with a Parrot","1866","met","File:Gustave Courbet - Woman with a Parrot - Google Art Project.jpg",{"tip":"침대에 누운 누드 여인이 들어 올린 손끝에 앵무새를 앉히고 있습니다. 풀어 헤친 머리칼과 사실적인 몸 묘사로 1866년 살롱에서 화제가 되었습니다."}],["폭풍우 뒤의 에트르타 절벽","The Cliffs at Étretat after the Storm","1870","orsay","File:Gustave Courbet - The Etretat Cliffs after the Storm - Google Art Project.jpg",{"tip":"폭풍이 지나간 뒤 맑게 갠 노르망디 해안의 절벽과 아치형 바위를 그렸습니다. 두텁게 바른 물감으로 표현한 바위와 파도의 질감을 가까이에서 살펴보세요."}],["폭풍우 치는 바다 (파도)","The Stormy Sea (The Wave)","1870","orsay","File:La Mer orageuse - Gustave Courbet.jpg",{"tip":"노르망디 에트르타에서 그린 '파도' 연작의 대표작입니다."}],["목욕하는 여인들","The Bathers","1853","fabre","The Bathers (Courbet)",{"tip":"풍만한 나체 여인의 뒷모습을 사실적으로 그려 살롱에서 큰 논란을 일으켰으며, 후원자 알프레드 브뤼야스가 사들였습니다."}],["마을의 아가씨들","Young Ladies of the Village","1851–1852","met","Young Ladies of the Village",{"tip":"고향 오르낭 근처 계곡에서 소 치는 소녀에게 먹을 것을 건네는 세 여인을 그렸으며, 화가의 세 누이가 모델을 섰습니다."}],["부상당한 남자","The Wounded Man","1844–1854","orsay","File:Portrait of the Artist called The Wounded Man (L'homme blessé) by Gustave Courbet.jpg",{"tip":"나무에 기대 쓰러진 자신을 그린 자화상으로, X선 조사 결과 원래 연인과 함께 있던 모습을 고쳐 그린 것으로 밝혀졌습니다."}],["아름다운 아일랜드 여인, 조","Jo, La Belle Irlandaise","1865–1866","met","File:Jo, La Belle Irlandaise MET DT1909.jpg",{"tip":"휘슬러의 연인이던 조애나 히퍼넌이 거울을 들고 붉은 머리칼을 쓸어내리는 모습입니다. 쿠르베는 같은 그림을 여러 점 그렸고, 그 가운데 하나가 메트로폴리탄에 있습니다."}],["봄의 발정기, 수사슴의 싸움","Spring Rutting, Battle of Stags","1861","orsay","File:Courbet - Le Rut du printemps. Combat de cerfs, 1861, RF 326.jpg",{"tip":"숲속에서 뿔을 맞부딪치며 싸우는 수사슴들을 커다란 화면에 담은 대작입니다. 사냥을 즐긴 쿠르베는 동물과 숲 풍경을 즐겨 그렸습니다."}]]},{"n":"장 프랑수아 밀레","o":"Jean-François Millet","l":"1814–1875","d":"바르비종에 살며 농민의 노동을 경건하게 그렸습니다.","w":[["이삭 줍는 여인들","The Gleaners","1857","orsay","The Gleaners",{"tip":"추수가 끝난 밭에서 떨어진 이삭을 줍는 세 여인을 그렸습니다. 허리를 굽힌 전경의 여인들과 멀리 쌓인 풍성한 곡식 더미가 대비를 이룹니다."}],["만종","The Angelus","1857–1859","orsay","The Angelus (painting)",{"tip":"해 질 녘 밭에서 멀리 울리는 삼종기도 종소리에 일손을 멈추고 기도하는 부부를 그렸습니다. 지평선 끝에 보이는 교회 첨탑을 찾아보세요."}],["씨 뿌리는 사람","The Sower","1850","mfa","The Sower (Millet)",{"tip":"어두운 비탈을 성큼성큼 내려오며 씨앗을 흩뿌리는 농부를 그렸습니다. 반 고흐가 깊이 감탄해 여러 차례 따라 그린 주제이기도 합니다."}],["괭이를 든 남자","Man with a Hoe","1860–1862","getty","Man with a Hoe",{"tip":"돌투성이 메마른 땅에서 괭이에 기대 숨을 고르는 농부를 그렸습니다. 이 그림에서 영감을 받은 에드윈 마크햄의 시가 미국에서 큰 반향을 일으켰습니다."}],["봄","Spring","1868–1873","orsay","File:Jean-François Millet (II) - Spring - WGA15693.jpg",{"tip":"사계절 연작 가운데 하나로, 비 갠 뒤 무지개가 뜬 바르비종 들판을 그렸습니다."}],["빵 굽는 여인","Woman Baking Bread","1854","kroller","File:Jean-François Millet (II) 005.jpg",{"tip":"화덕에 빵 반죽을 밀어 넣는 농촌 여인을 그렸습니다. 평범한 일상의 노동에 기념비적인 무게를 부여한 밀레의 시선이 잘 드러납니다."}],["가을의 건초 더미","Haystacks: Autumn","1874경","met","File:Haystacks- Autumn MET DP124093.jpg",{"tip":"가을 들판에 쌓인 커다란 건초 더미와 풀을 뜯는 양 떼를 그린 말년의 풍경화입니다. 낮게 드리운 하늘과 넓은 들판에서 밀레 후기의 풍경 감각을 볼 수 있습니다."}],["그레빌 교회","The Church at Gréville","1871–1874","orsay","File:Jean-François Millet, L'Eglise de Gréville.jpg",{"tip":"화가가 태어난 노르망디 그레빌 마을의 교회를 그린 말년작으로, 소박한 돌 성당과 고향 풍경을 차분하게 담았습니다."}],["양 떼를 지키는 양치기 소녀","Shepherdess with Her Flock","1863경","orsay","File:Millet - Bergère avec son troupeau, RF 1879.jpg",{"tip":"들판에서 뜨개질을 하며 양 떼를 지키는 소녀를 그린 그림으로, 1864년 살롱에서 큰 호평을 받았습니다."}],["정오의 휴식","Noonday Rest","1866","mfa","File:La Méridienne - Jean-François Millet - Museum of Fine Arts,Boston.jpg",{"tip":"건초 더미 그늘에서 낮잠을 자는 남녀 농부를 그린 파스텔화로, 반 고흐가 이 구도를 바탕으로 「낮잠」을 그렸습니다."}],["별이 빛나는 밤","Starry Night","1850–1865경","yale","File:Starry Night by Jean-François Millet.jpeg",{"tip":"별똥별이 지나가는 밤하늘 아래 어둑한 들판을 그린 드문 야경화로, 오랜 기간에 걸쳐 고쳐 그렸습니다."}]]},{"n":"오노레 도미에","o":"Honoré Daumier","l":"1808–1879","d":"풍자 판화가이자 화가로 도시 서민의 삶을 그렸습니다.","w":[["삼등 열차","The Third-Class Carriage","1862–1864경","met","The Third-Class Carriage",{"tip":"비좁은 삼등칸에 앉은 할머니와 젊은 엄마, 잠든 소년을 그렸습니다. 같은 주제의 다른 버전이 캐나다 국립미술관에 있습니다."}],["세탁부","The Laundress","1863경","orsay","The Laundress (Daumier)",{"tip":"무거운 빨래 보따리를 든 세탁부가 아이의 손을 잡고 센강변 계단을 오르는 모습입니다. 밝은 배경 앞에 실루엣처럼 어둡게 처리한 인물이 인상적입니다."}],["돈키호테와 산초 판사","Don Quixote and Sancho Panza","1870경","courtauld","File:Honoré Daumier (1808-1879) - Don Quixote and Sancho Panza - P.1932.SC.86 - Courtauld Institute of Art.jpg",{"tip":"말을 탄 돈키호테와 당나귀를 탄 산초 판사를 빠르고 대담한 붓질로 그렸습니다. 도미에는 말년에 세르반테스의 이 이야기를 여러 차례 그렸습니다."}],["트랑스노냉 거리, 1834년 4월 15일 (석판화)","Rue Transnonain, April 15, 1834","1834","various","File:Honoré Daumier, Rue Transnonain, le 15 avril 1834, 1834, NGA 6133.jpg",{"tip":"정부군의 민간인 학살을 고발한 석판화로, 여러 미술관이 소장하고 있습니다."}],["봉기","The Uprising","1848 이후","phillips","File:Honoré Daumier - The Uprising (L'Emeute) - Google Art Project.jpg",{"tip":"팔을 높이 든 남자를 앞세워 거리로 몰려나온 군중을 그린 그림으로, 거칠고 빠른 붓질이 격앙된 움직임을 전합니다."}],["크리스팽과 스카팽","Crispin and Scapin","1864경","orsay","File:Honoré Daumier, Crispin and Scapin (1864), oil on canvas, 61 x 82 cm., Musée d'Orsay, Paris.jpg",{"tip":"연극 속 두 하인이 귓속말로 음모를 꾸미는 장면으로, 강한 조명 대비로 무대 위 연극의 분위기를 살렸습니다."}],["가르강튀아","Gargantua","1831","various","File:Honoré Daumier - Gargantua.jpg",{"tip":"백성의 세금을 끝없이 삼키는 거인으로 국왕 루이 필리프를 풍자한 석판화로, 이 작품 때문에 도미에는 6개월간 수감되었습니다."}]]},{"n":"장 바티스트 카미유 코로","o":"Jean-Baptiste-Camille Corot","l":"1796–1875","d":"바르비종파의 풍경화가. 은빛 대기로 인상주의에 다리를 놓았습니다.","w":[["모르트퐁텐의 추억","Souvenir de Mortefontaine","1864","louvre","Souvenir de Mortefontaine",{"tip":"호숫가에서 나뭇가지에 손을 뻗는 여인과 아이들을 은빛 안개 같은 부드러운 색조로 그렸습니다. 실제 풍경을 기억 속에서 다시 지은 코로 후기 '추억' 풍경화의 대표작입니다."}],["진주의 여인","Woman with a Pearl","1868–1870경","louvre","File:Camille Corot - Woman with a Pearl.jpg",{"tip":"모나리자를 떠올리게 하는 자세로 앉은 여인의 초상입니다. 제목의 '진주'는 실제로는 이마에 드리운 작은 나뭇잎 장식이 진주처럼 보이는 것입니다."}],["망트의 다리","The Bridge at Mantes","1868–1870","louvre","File:Jean-Baptiste-Camille Corot - The Bridge at Mantes - WGA05299.jpg",{"tip":"나무줄기 사이로 망트의 아치 다리가 내다보이는 풍경입니다. 수직으로 선 나무들과 수평으로 뻗은 다리가 만드는 구도를 살펴보세요."}],["빌다브레","Ville-d'Avray","1865경","nga","File:Jean-Baptiste Camille Corot - Ville-d’Avray.jpg",{"tip":"파리 근교 빌다브레의 연못과 집들을 그렸습니다. 코로는 이곳에 가족 별장이 있어 평생에 걸쳐 이 풍경을 즐겨 그렸습니다."}],["푸른 옷의 여인","Lady in Blue","1874","louvre","File:La Dame en bleu - Jean-Baptiste Camille Corot - Musée du Louvre Peintures RF 2056.jpg",{"tip":"팔꿈치를 괴고 선 여인의 푸른 드레스가 화면을 지배하는 그림으로, 코로가 말년에 그린 인물화의 대표작입니다."}],["나르니의 다리","The Bridge at Narni","1826","louvre","The Bridge at Narni",{"tip":"이탈리아 여행 중 현장에서 그린 유화 스케치로, 무너진 로마 시대 다리를 밝은 빛과 빠른 붓질로 담았습니다."}],["광야의 하갈","Hagar in the Wilderness","1835","met","Hagar in the Wilderness",{"tip":"광야에서 죽어 가는 아들 이스마엘 곁의 하갈에게 천사가 날아오는 장면으로, 1835년 살롱 출품작입니다."}],["중단된 독서","Interrupted Reading","1870경","aic","File:Jean Baptiste Camille Corot - Interrupted Reading - 1922.410 - Art Institute of Chicago.jpg",{"tip":"책을 무릎에 내려놓고 생각에 잠긴 여인을 그린 말년의 인물화입니다. 풍경화로 이름을 떨친 코로는 이런 인물화를 생전에 거의 전시하지 않았습니다."}]]},{"n":"로자 보뇌르","o":"Rosa Bonheur","l":"1822–1899","d":"동물을 정밀하게 관찰해 그린 19세기 가장 유명한 여성 화가입니다.","w":[["마시장","The Horse Fair","1852–1855","met","The Horse Fair",{"tip":"파리 마시장의 말들과 말을 다루는 사람들을 그린 대작입니다. 보뇌르는 말을 관찰하기 위해 경찰 허가를 받아 남장을 하고 시장에 드나들었습니다."}],["니베르네의 쟁기질","Ploughing in the Nivernais","1849","orsay","File:Rosa Bonheur - Ploughing in Nevers - Google Art Project.jpg",{"tip":"니베르네 지방에서 소들이 쟁기를 끌며 밭을 가는 모습입니다. 국가의 주문으로 그린 작품으로, 소의 근육과 갈아엎은 흙의 질감 묘사가 뛰어납니다."}],["엘 시드 (사자)","El Cid","1879","prado","File:Museo del Prado - P004318 - El Cid.jpg",{"tip":"갈기가 풍성한 수사자의 머리를 정면에 가깝게 그렸습니다. 보뇌르는 자신의 집에서 실제로 사자를 기르며 관찰했습니다."}],["송아지 젖떼기","Weaning the Calves","1879","met","File:Weaning the Calves MET DT2579.jpg",{"tip":"어미 소와 떨어지는 송아지들을 그린 목가적인 장면입니다. 동물의 털과 표정을 섬세하게 묘사한 보뇌르의 솜씨를 살펴보세요."}],["오베르뉴의 건초 수확","Haymaking in the Auvergne","1855","fontainebleau","Haymaking in the Auvergne",{"tip":"풀을 베고 소달구지에 건초를 싣는 농부들을 넓은 하늘 아래 그린 대작으로, 일하는 소들의 묘사가 특히 생생합니다. 오르세 미술관 소장품으로, 퐁텐블로 궁전에 장기 대여되어 있습니다."}],["버펄로 빌의 초상","Portrait of William F. Cody","1889","cody","File:Rosa Bonheur - Portrait de Col. William F. Cody.jpg",{"tip":"와일드 웨스트 쇼를 이끌고 파리에 온 버펄로 빌을 퐁텐블로 근처 자택에서 그린 그림으로, 그는 이 초상을 쇼 포스터에 사용했습니다."}],["사냥을 마친 바르바로","Barbaro after the Hunt","1858경","philly","File:Rosa Bonheur - Barbaro after the Hunt.jpg",{"tip":"사냥을 마치고 쉬고 있는 사냥개를 그린 그림으로, 동물의 털과 근육을 정밀하게 관찰한 보뇌르의 솜씨를 보여 줍니다."}]]},{"n":"라이문도 데 마드라소 이 가레타","o":"Raimundo de Madrazo y Garreta","l":"1841–1920","d":"로마에서 태어난 스페인 화가. 파리 상류층 여성의 초상과 화사한 풍속화로 큰 인기를 얻었습니다.","w":[["목욕 후","After the Bath","1895경","prado","File:RAIMUNDO DE MADRAZO Y GARRETA - Después del baño (Museo del Prado, Madrid, c. 1895).jpg",{"tip":"목욕을 마친 여인을 그린 작품으로, 부드러운 살결과 천의 질감을 섬세하게 표현했습니다."}],["창가의 소녀들","Girls at a Window","1875경","met","File:Girls at a Window MET DT253717.jpg",{"tip":"창가에 기대어 바깥을 내다보는 소녀들을 그린 풍속화입니다. 밝은 빛과 옷감의 질감을 생생하게 살렸습니다."}],["가면무도회 참가자들","Masqueraders","1875–1878","met","File:Masqueraders MET DT3156.jpg",{"tip":"가면무도회 의상을 차려입은 인물들을 비단과 레이스의 질감까지 섬세하게 그렸습니다. 로버트 레먼 컬렉션 소장품으로 늘 전시되지는 않습니다."}],["마리아 한의 초상","Portrait of María Hahn","1901","prado","File:María Hahn, esposa del pintor, por Raimundo de Madrazo.jpg",{"tip":"화가의 아내 마리아 한을 그린 초상으로, 우아한 의상과 차분한 표정이 돋보입니다."}]]}],"note":"쿠르베의 〈돌 깨는 사람들〉은 1945년 드레스덴 폭격 때 사라져 지금은 사진으로만 전합니다. 라이문도 데 마드라소는 사실주의 운동의 화가는 아니지만, 같은 시대 파리에서 활약한 초상·풍속화가로 이 전시실에서 함께 소개합니다."},{"id":"impressionism","name":"인상주의","en":"Impressionism","years":"1860년대 – 1890년","s":1863,"e":1890,"color":"#3f6f8f","sum":"관전(살롱)에서 거부당한 젊은 화가들이 1874년 사진작가 나다르의 옛 스튜디오에서 독자적인 전시회를 열었습니다. 모네의 〈인상, 해돋이〉를 비꼰 평론에서 '인상주의'라는 이름이 붙었고, 전시는 1886년까지 여덟 번 이어졌습니다. 야외에서 시시각각 변하는 빛과 색, 근대 도시 파리의 일상을 빠른 붓질로 담았습니다.","traits":["야외에서 직접 그림 (튜브 물감의 발명 덕분)","빛과 시간에 따라 변하는 색, 색이 있는 그림자","짧게 끊어 찍은 붓질, 물감을 섞지 않고 나란히 칠함","카페, 기차역, 무도회 같은 근대 도시 생활","사진과 일본 우키요에 판화의 영향","실내, 무대, 경마장을 사진처럼 잘라 낸 대담한 구도와 원근법 (드가, 카유보트)","여성 화가의 활약: 가정과 여성의 일상을 그림 (모리조, 카사트)"],"diff":"사실주의가 '무엇을' 그릴지(현실)를 바꿨다면, 인상주의는 '어떻게' 볼지(빛과 순간)를 바꿨습니다.","note":"마네는 인상주의의 선구자이자 정신적 지도자였지만 인상주의 전시회에는 한 번도 참가하지 않았습니다. 바지유는 첫 전시회 4년 전 보불전쟁에서 전사했습니다. 휘슬러와 사전트는 인상주의 전시회에 참가하지는 않았지만, 파리에서 활동하며 인상주의 화가들과 교류한 미국 출신 화가라 이 전시실에서 함께 소개합니다.","artists":[{"n":"에두아르 마네","o":"Édouard Manet","l":"1832–1883","d":"전통 회화를 뒤흔든 스캔들로 근대 회화의 출발점이 된 인상주의의 선구자입니다.","w":[["풀밭 위의 점심 식사","Le Déjeuner sur l'herbe","1863","orsay","Le Déjeuner sur l'herbe",{"tip":"옷을 갖춰 입은 남자들 사이에 나체 여인이 앉아 있는 장면으로, 1863년 낙선전에서 큰 스캔들을 일으켰습니다. 구도는 라파엘로의 도안을 옮긴 판화에서 빌려 왔습니다."}],["올랭피아","Olympia","1863","orsay","Olympia (Manet)",{"tip":"티치아노의 우르비노의 비너스를 본뜬 구도에 당대의 매춘부를 그려 1865년 살롱에서 격렬한 비난을 받았습니다. 관람자를 똑바로 보는 시선과 발치의 검은 고양이를 살펴보세요."}],["폴리베르제르의 술집","A Bar at the Folies-Bergère","1882","courtauld","A Bar at the Folies-Bergère",{"tip":"바텐더 뒤 거울에 비친 홀의 풍경을 담은 마네의 마지막 대작입니다. 거울 속 여인과 손님의 위치가 실제와 어긋나 있어 오랫동안 논쟁거리가 되었습니다."}],["피리 부는 소년","The Fifer","1866","orsay","The Fifer",{"tip":"배경을 거의 비운 평평한 화면 앞에 선 소년 군악대원을 그렸습니다. 벨라스케스의 영향이 뚜렷한 작품으로, 1866년 살롱에서 낙선했습니다."}],["발코니","The Balcony","1868–1869","orsay","The Balcony (Manet)",{"tip":"발코니에 모인 세 인물 가운데 앞쪽에 앉은 여인이 베르트 모리조입니다. 모리조가 처음으로 마네의 모델이 된 작품으로, 고야의 그림에서 영감을 받았습니다."}],["제비꽃 장식을 단 베르트 모리조","Berthe Morisot with a Bouquet of Violets","1872","orsay","Berthe Morisot with a Bouquet of Violets",{"tip":"검은 옷과 모자 차림의 베르트 모리조를 그린 초상입니다. 마네가 그린 모리조 초상 가운데 가장 유명하며, 검은색의 다양한 농담을 눈여겨보세요."}],["막시밀리안 황제의 처형","The Execution of Emperor Maximilian","1868–1869","mannheim","The Execution of Emperor Maximilian",{"tip":"여러 버전이 있으며 보스턴 미술관, 런던 내셔널 갤러리(조각난 부분)에도 있습니다."}],["튈르리 정원의 음악회","Music in the Tuileries","1862","ngl","File:Édouard Manet - Music in the Tuileries Gardens.jpg",{"tip":"더블린 휴 레인 미술관과 공동 소장하여 두 곳을 오가며 전시됩니다."}],["철도 (생라자르역)","The Railway","1873","nga","File:Edouard Manet, The Railway, 1873, NGA 43624.jpg",{"tip":"생라자르역 철책 앞에서 책을 든 여인과 철로 쪽을 바라보는 소녀를 그렸습니다. 여인의 모델은 '올랭피아'의 모델이기도 한 빅토린 뫼랑입니다."}],["아스파라거스 한 줄기","Asparagus","1880","orsay","File:Edouard Manet - Asparagus - Google Art Project.jpg",{"tip":"아스파라거스 다발 그림값을 넉넉히 받은 마네가 '하나가 빠졌다'며 덤으로 그려 보낸 작품입니다."}],["에밀 졸라의 초상","Portrait of Émile Zola","1868","orsay","File:Manet, Edouard - Portrait of Emile Zola.jpg",{"tip":"마네를 옹호한 소설가 졸라를 그렸습니다. 벽에 〈올랭피아〉와 일본 판화가 걸려 있습니다."}],["뱃놀이","Boating","1874","met","File:Edouard Manet Boating.jpg",{"tip":"돛단배 위의 남녀를 가까이에서 잘라 낸 구도로, 일본 판화의 영향이 엿보입니다. 아르장퇴유에서 모네와 가까이 지내던 여름에 그렸습니다."}],["온실에서","In the Conservatory","1879","altenat","File:In the Conservatory.jpg",{"tip":"온실 벤치에 앉은 여인과 그 뒤에 기댄 남자를 그렸습니다. 모델은 마네의 지인인 기유메 부부이며, 나란히 놓인 두 사람의 손을 눈여겨보세요."}],["죽은 투우사","The Dead Toreador","1864경","nga","File:Edouard Manet, The Dead Toreador, probably 1864, NGA 1179.jpg",{"tip":"살롱에서 혹평받은 큰 그림을 잘라 낸 일부입니다. 잘린 다른 부분은 뉴욕 프릭 컬렉션에 있습니다."}],["1866년의 젊은 여인 (앵무새와 여인)","Young Lady in 1866","1866","met","File:Young Lady in 1866 MET DP273977.jpg",{"tip":"같은 해 쿠르베가 그린 〈앵무새와 여인〉과 나란히 비교해 볼 만합니다."}],["나나","Nana","1877","hamburg","Nana (Manet)",{"tip":"속옷 차림으로 화장하는 여인과 소파에 앉은 정장 신사를 그렸습니다. 1877년 살롱에서 거절당한 뒤 파리 카퓌신 대로의 상점 진열창에 걸려 많은 사람이 몰렸습니다."}],["늙은 음악가","The Old Musician","1862","nga","The Old Musician",{"tip":"바이올린을 든 늙은 거리 악사 주위에 아이들과 떠돌이들이 모여 있습니다. 마네의 가장 큰 그림 가운데 하나로, 오른쪽에 「압생트 마시는 사람」의 인물이 다시 등장합니다."}],["롤라 드 발랑스","Lola de Valence","1862","orsay","File:Lola de Valence (1862) - Edouard Manet (Musée d'Orsay, Paris).jpg",{"tip":"파리에 공연을 온 스페인 무용단의 무용수 롤라 멜레아를 그린 전신 초상입니다. 보들레르가 이 그림에 바치는 4행시를 지었습니다."}],["르 봉 보크","Le Bon Bock","1873","philly","File:Édouard Manet, French - Le Bon Bock - Google Art Project.jpg",{"tip":"판화가 에밀 벨로가 파이프를 문 채 맥주잔을 든 모습을 그렸습니다. 프란스 할스의 영향이 엿보이며, 1873년 살롱에서 큰 호평을 받았습니다."}]]},{"n":"제임스 맥닐 휘슬러","o":"James McNeill Whistler","l":"1834–1903","d":"미국 출신으로 런던에서 활동한 화가. 그림을 음악처럼 색의 조화로 보았습니다.","w":[["화가의 어머니","Arrangement in Grey and Black No. 1 (Whistler's Mother)","1871","orsay","Whistler's Mother",{"tip":"옆으로 앉은 어머니를 회색과 검은색의 조화로 그렸습니다. 휘슬러는 초상보다 색의 배치라는 점을 제목으로 강조했습니다."}],["검정과 금색의 녹턴: 떨어지는 불꽃","Nocturne in Black and Gold – The Falling Rocket","1875경","dia","Nocturne in Black and Gold – The Falling Rocket",{"tip":"밤하늘에 터지는 불꽃놀이를 흩뿌린 물감으로 그렸습니다. 비평가 러스킨의 혹평으로 유명한 명예훼손 소송이 벌어졌습니다."}],["흰색 교향곡 1번: 하얀 옷의 소녀","Symphony in White, No. 1: The White Girl","1862","nga","Symphony in White, No. 1: The White Girl",{"tip":"흰 커튼 앞에 흰 드레스를 입은 여인이 늑대 가죽 위에 서 있습니다. 1863년 낙선전에서 큰 주목을 받았습니다."}],["청색과 금색의 녹턴: 옛 배터시 다리","Nocturne: Blue and Gold – Old Battersea Bridge","1872–1875경","tateb","Nocturne: Blue and Gold – Old Battersea Bridge",{"tip":"템스강의 밤 풍경을 푸른 안개 속에 담았습니다. 높게 솟은 다리의 구도에는 일본 우키요에의 영향이 엿보입니다."}]]},{"n":"클로드 모네","o":"Claude Monet","l":"1840–1926","d":"평생 빛을 좇은 인상주의의 상징. 같은 대상을 시간대별로 그린 연작으로 유명합니다.","w":[["인상, 해돋이","Impression, Sunrise","1872","marmottan","Impression, Sunrise",{"tip":"르아브르 항구의 새벽 풍경으로, 1874년 첫 전시에서 이 제목이 조롱받으며 '인상주의'라는 이름이 생겨났습니다. 안개 속에 떠 있는 주황빛 해를 살펴보세요."}],["수련 (대장식화)","Water Lilies","1914–1926","orangerie","Water Lilies (Monet series)",{"tip":"오랑주리 미술관의 타원형 전시실 두 곳을 수련 대작 8점이 둘러쌉니다."}],["양산을 쓴 여인","Woman with a Parasol","1875","nga","Woman with a Parasol – Madame Monet and Her Son",{"tip":"언덕 위에서 양산을 쓴 아내 카미유와 아들 장을 아래에서 올려다보듯 그렸습니다. 바람에 날리는 베일과 풀잎의 빠른 붓질이 야외의 빛을 생생하게 전합니다."}],["생라자르역","La Gare Saint-Lazare","1877","orsay","File:Claude Monet - The Saint-Lazare Station - Google Art Project.jpg",{"tip":"증기 기관차가 뿜어내는 연기와 유리 지붕으로 들어오는 빛을 그렸습니다. 모네는 이 역을 주제로 여러 점을 그려 1877년 인상주의 전시에 함께 출품했습니다."}],["루앙 대성당 연작","Rouen Cathedral series","1892–1894","orsay","Rouen Cathedral (Monet series)",{"tip":"30여 점의 연작 가운데 다섯 점이 오르세에 나란히 걸려 있습니다."}],["건초더미 연작","Haystacks series","1890–1891","aic","Haystacks (Monet series)",{"tip":"시카고 미술관이 건초더미 연작을 여러 점 소장하고 있습니다."}],["라 그르누예르","La Grenouillère","1869","met","La Grenouillère (Monet)",{"tip":"센강의 수상 휴양지 라 그르누예르를 그렸습니다. 르누아르와 나란히 앉아 같은 장면을 그린 작품으로, 물 위의 반사를 짧은 붓질로 표현했습니다."}],["정원의 여인들","Women in the Garden","1866–1867","orsay","File:Claude Monet 024.jpg",{"tip":"야외에서 그리려고 땅에 도랑을 파 큰 캔버스를 내려 가며 작업했다고 전해집니다."}],["개양귀비 들판 (아르장퇴유)","Poppy Field","1873","orsay","File:Claude Monet - Poppy Field - Google Art Project.jpg",{"tip":"아르장퇴유 들판에서 붉은 개양귀비 사이를 걷는 두 쌍의 엄마와 아이를 그렸습니다. 같은 인물을 언덕 위와 아래에 반복해 배치해 걸어 내려오는 움직임을 암시합니다."}],["수련 연못 (일본식 다리)","The Water-Lily Pond","1899","ngl","File:Claude Monet, The Water-Lily Pond (National Gallery, London).jpg",{"tip":"지베르니 정원 연못을 가로지르는 일본식 다리와 수면을 덮은 수련을 그렸습니다. 같은 구도의 다른 버전이 미국의 여러 미술관에도 있습니다."}],["런던 국회의사당, 안개 속의 햇빛","Houses of Parliament, Sunlight in the Fog","1904","orsay","File:London, the Houses of Parliament, Sunlight Opening in Fog, by Claude Monet.jpg",{"tip":"런던에 머물며 그린 국회의사당 연작 가운데 하나로, 안개를 뚫고 비치는 햇빛을 담았습니다. 모네는 템스강 건너편 세인트토머스 병원에서 이 풍경을 바라보았습니다."}],["꽃병 (아욱꽃)","Vase of Flowers","1881–1882경","courtauld","File:Vase of Flowers Claude Monet.jpg",{"tip":"들에서 꺾은 아욱꽃을 꽂은 정물화입니다. 모네는 1880년대 초 풍경화와 함께 꽃 정물을 여러 점 그렸습니다."}],["생타드레스의 정원","Garden at Sainte-Adresse","1867","met","File:Garden at Sainte-Adresse MET DT48.jpg",{"tip":"바닷가 테라스에서 바다를 바라보는 사람들과 깃발, 꽃밭을 그렸습니다. 높은 시점에서 내려다본 구도와 펄럭이는 두 깃발을 눈여겨보세요."}],["트루빌 해변","The Beach at Trouville","1870","ngl","File:Claude Monet 002.jpg",{"tip":"신혼여행 중에 그린 그림으로, 물감 속에 실제 모래알이 박혀 있습니다."}],["일본 여인 (기모노를 입은 카미유)","La Japonaise","1876","mfa","File:Claude Monet-Madame Monet en costume japonais.jpg",{"tip":"당시 파리에 불던 일본 취향(자포니즘)을 보여 주는 작품입니다."}],["까치","The Magpie","1868–1869","orsay","The Magpie (Monet)",{"tip":"눈 덮인 시골 풍경 속 나무 울타리 위에 까치 한 마리가 앉아 있습니다. 눈의 그림자를 푸른색과 보라색으로 표현했으며, 1869년 살롱에서 낙선했습니다."}],["풀밭 위의 점심 식사","Le Déjeuner sur l'herbe","1865–1866","orsay","Le Déjeuner sur l'herbe (Monet, Paris)",{"tip":"숲속 소풍을 그린 거대한 그림의 남은 부분입니다. 집세 대신 맡겨 둔 사이 습기로 손상되자 모네가 직접 잘라 내어 두 조각만 전해집니다."}],["임종을 맞은 카미유","Camille Monet on Her Deathbed","1879","orsay","File:Claude Monet, 1879, Camille sur son lit de mort, oil on canvas, 90 x 68 cm, Musée d'Orsay, Paris.jpg",{"tip":"1879년 세상을 떠난 첫 부인 카미유의 마지막 모습을 그렸습니다. 모네는 훗날 죽은 아내의 얼굴에서도 색의 변화를 관찰하던 자신을 돌아보았다고 전해집니다."}],["웨스트민스터 아래 템스강","The Thames below Westminster","1871경","ngl","File:Claude Monet - The Thames below Westminster.jpg",{"tip":"보불전쟁을 피해 런던에 머물던 시기에 그린 그림으로, 안개 낀 국회의사당과 공사 중인 강변 부두를 담았습니다."}]]},{"n":"피에르 오귀스트 르누아르","o":"Pierre-Auguste Renoir","l":"1841–1919","d":"행복한 사람들과 빛나는 살결을 그린 화가입니다.","w":[["물랭 드 라 갈레트의 무도회","Bal du moulin de la Galette","1876","orsay","Bal du moulin de la Galette",{"tip":"몽마르트르 언덕의 야외 무도회장에서 춤추고 담소를 나누는 사람들을 그렸습니다. 나뭇잎 사이로 떨어져 옷과 바닥에 어른거리는 햇빛을 눈여겨보세요."}],["뱃놀이 일행의 점심","Luncheon of the Boating Party","1880–1881","phillips","Luncheon of the Boating Party",{"tip":"센강변 푸르네즈 식당의 발코니에 모인 친구들을 그렸습니다. 왼쪽에서 강아지를 안은 여인은 훗날 르누아르의 아내가 되는 알린 샤리고입니다."}],["그네","The Swing","1876","orsay","The Swing (Renoir)",{"tip":"그네 옆에 선 여인과 남자들 위로 나뭇잎 사이 햇빛이 얼룩져 떨어지는 장면입니다. 1877년 인상주의 전시에 출품되었습니다."}],["피아노 치는 소녀들 (오르세 버전)","Young Girls at the Piano","1892","orsay","File:Auguste Renoir - Young Girls at the Piano - Google Art Project.jpg",{"tip":"프랑스 정부의 의뢰로 같은 구도를 여러 점 그렸고, 그중 이 그림을 국가가 사들였습니다. 르누아르 작품 가운데 프랑스 국가가 처음 산 그림입니다."}],["피아노 치는 소녀들 (메트로폴리탄 버전)","Two Young Girls at the Piano","1892","met","File:Two Young Girls at the Piano MET rl1975.1.201.R.jpg",{"tip":"오르세 버전과 같은 해에 그린 다른 판본으로, 로버트 레먼 컬렉션 소장입니다. 두 그림을 비교하면 색감과 마무리 정도가 조금씩 다릅니다."}],["부지발의 무도회","Dance at Bougival","1883","mfa","Dance at Bougival",{"tip":"야외 무도회에서 춤추는 남녀를 거의 실물 크기로 그렸습니다. 여인의 모델은 훗날 화가가 되는 쉬잔 발라동입니다."}],["이렌 카엥 당베르 양의 초상","Portrait of Irène Cahen d'Anvers","1880","zurich","Portrait of Irène Cahen d'Anvers",{"tip":"뷔를레 재단 소장품으로 취리히 미술관에서 전시됩니다."}],["특별석","La Loge","1874","courtauld","File:Pierre-Auguste Renoir, La Loge, Courtauld Gallery.jpg",{"tip":"극장 특별석에 앉은 여인과 오페라글라스를 든 남자를 그렸습니다. 1874년 첫 인상주의 전시에 출품되었으며, 남자의 모델은 화가의 동생 에드몽입니다."}],["샤르팡티에 부인과 아이들","Madame Georges Charpentier and Her Children","1878","met","File:Renoir - Madame Georges Charpentier et ses enfants.jpg",{"tip":"출판인의 아내 샤르팡티에 부인과 두 아이를 그린 초상입니다. 1879년 살롱에서 호평을 받아 르누아르가 이름을 알리는 계기가 되었습니다."}],["시골의 무도회","Dance in the Country","1883","orsay","File:Pierre Auguste Renoir - Country Dance - Google Art Project.jpg",{"tip":"시골 무도회에서 춤추는 남녀를 그렸으며, 여인의 모델은 훗날 아내가 된 알린 샤리고입니다. 같은 시기에 그린 '도시의 무도회'와 짝을 이루는 작품입니다."}],["도시의 무도회","Dance in the City","1883","orsay","File:Pierre-Auguste Renoir 019.jpg",{"tip":"모델은 훗날 화가가 된 쉬잔 발라동입니다. 〈시골의 무도회〉와 나란히 걸려 있습니다."}],["우산","The Umbrellas","1881–1886경","ngl","File:Pierre-Auguste Renoir, The Umbrellas, ca. 1881-86.jpg",{"tip":"비 오는 파리 거리에서 우산을 받쳐 든 사람들을 그렸습니다. 오른쪽의 부드러운 붓질과 왼쪽의 단단한 윤곽이 섞여 있어 몇 년에 걸쳐 화풍이 바뀐 흔적을 볼 수 있습니다."}],["퐁뇌프","Pont-Neuf, Paris","1872","nga","File:Auguste Renoir, Pont Neuf, Paris, 1872, NGA 52202.jpg",{"tip":"높은 곳에서 내려다본 퐁뇌프 다리와 오가는 사람들, 햇살 가득한 파리 풍경입니다. 르누아르의 동생 에드몽이 행인을 붙잡아 두는 역할을 했다는 일화가 전합니다."}],["첫 외출","La Première Sortie","1876–1877","ngl","File:Pierre-Auguste Renoir - La Première Sortie.jpg",{"tip":"극장 특별석에서 처음으로 공연을 보러 나온 소녀의 설렘을 그렸습니다. 소녀의 옆얼굴 너머로 흐릿하게 처리한 객석이 들뜬 분위기를 전합니다."}],["목욕하는 여인들","The Large Bathers","1884–1887","philly","File:Pierre-Auguste Renoir, French - The Large Bathers - Google Art Project.jpg",{"tip":"인상주의의 흐릿한 붓질에서 벗어나 윤곽이 뚜렷한 고전적 화풍을 시도한 작품입니다."}],["두 자매(테라스에서)","Two Sisters (On the Terrace)","1881","aic","Two Sisters (On the Terrace)",{"tip":"센강 변 샤투의 푸르네즈 식당 테라스에 앉은 젊은 여인과 소녀를 그렸습니다. 「뱃놀이 일행의 점심」과 같은 장소입니다."}],["물뿌리개를 든 소녀","A Girl with a Watering Can","1876","nga","A Girl with a Watering Can",{"tip":"정원 길에 서서 물뿌리개를 든 어린 소녀를 그린 그림입니다. 레이스 장식 옷과 주위 꽃밭이 짧은 붓질로 부드럽게 어우러집니다."}],["페르난도 서커스의 곡예사들","Acrobats at the Cirque Fernando","1879","aic","File:Pierre-Auguste Renoir - Acrobats at the Cirque Fernando (Francisca and Angelina Wartenberg) - 1922.440 - Art Institute of Chicago.jpg",{"tip":"몽마르트르 페르난도 서커스의 어린 곡예사 자매가 공연 뒤 관객이 던져 준 오렌지를 모으는 장면입니다."}],["목욕하는 여인들 (만년작)","The Bathers","1918–1919","orsay","The Bathers (Renoir)",{"tip":"강가 풀밭에 누운 두 나부를 그린 말년의 대작입니다. 류머티즘으로 손이 굳은 상태에서 완성했으며, 사후 세 아들이 국가에 기증했습니다."}]]},{"n":"에드가 드가","o":"Edgar Degas","l":"1834–1917","d":"인상주의 전시를 이끌었지만 야외보다 실내, 무용수와 도시인을 그렸습니다.","w":[["발레 수업","The Dance Class","1874–1876","orsay","File:Edgar Degas - The Ballet Class - Google Art Project.jpg",{"tip":"늙은 발레 교사 쥘 페로가 지팡이를 짚고 무희들을 지도하는 장면입니다. 무희들의 제각각인 자세와 깊게 뻗은 바닥의 원근감을 살펴보세요."}],["압생트","L'Absinthe","1875–1876","orsay","L'Absinthe",{"tip":"카페에 멍하니 앉아 있는 여인과 파이프를 문 남자를 그렸습니다. 모델은 배우 엘렌 앙드레와 판화가 마르슬랭 데부탱입니다."}],["무대 위의 무희 (에투알)","L'Étoile","1876–1878경","orsay","File:Edgar Degas - Ballet (L'Étoile).jpg",{"tip":"무대에서 한쪽 다리를 들고 춤추는 프리마 발레리나를 위에서 내려다본 시점으로 그린 파스텔화입니다. 무대 옆 막 뒤에 서 있는 검은 옷의 남자를 찾아보세요."}],["벨렐리 가족","The Bellelli Family","1858–1869","orsay","The Bellelli Family",{"tip":"피렌체에 살던 고모 가족을 그린 대형 초상화입니다. 서로 시선을 피하는 부부의 모습에서 불편한 가족 관계가 드러납니다."}],["다림질하는 여인들","Women Ironing","1884–1886경","orsay","File:Edgar Degas - Repasseuses - Musée d'Orsay.jpg",{"tip":"하품하는 여인과 온 힘으로 다리미를 누르는 여인을 그렸습니다. 거친 캔버스 질감이 그대로 드러나 노동의 피로감을 더합니다."}],["14세의 어린 무용수 (조각)","Little Dancer of Fourteen Years","1878–1881","nga","Little Dancer of Fourteen Years",{"tip":"밀랍 원작은 워싱턴에 있고, 사후 청동 주조본은 오르세 등 여러 곳에 있습니다."}],["뉴올리언스의 면화 사무소","A Cotton Office in New Orleans","1873","pau","File:Cottonexchange1873-Degas.jpg",{"tip":"외가가 있던 미국 뉴올리언스에서 그렸으며, 미술관이 산 그의 첫 작품입니다."}],["욕조","The Tub","1886","orsay","File:Degas - Le tub, RF 4046, Recto.jpg",{"tip":"욕조에 웅크려 몸을 씻는 여인을 위에서 내려다본 파스텔화입니다. 오른쪽 선반이 화면을 가로질러 몰래 엿보는 듯한 시점을 만듭니다."}],["푸른 무희들","Blue Dancers","1893경","orsay","File:Edgar degas, ballerine blu, 1893 ca. 01.JPG",{"tip":"무대 옆에서 옷매무새를 고치는 푸른 의상의 무희들을 그린 후기작입니다. 굵은 윤곽과 강렬한 색에서 말년의 드가 화풍을 볼 수 있습니다."}],["꽃병 옆에 앉은 여인","A Woman Seated beside a Vase of Flowers","1865","met","File:A Woman Seated beside a Vase of Flowers (Madame Paul Valpinçon?) MET DT1566.jpg",{"tip":"화면 한가운데를 꽃다발이 차지하고 인물은 가장자리로 밀려난 대담한 구도가 특징입니다."}],["오페라 극장의 오케스트라","The Orchestra at the Opera","1870경","orsay","File:Edgar Degas - The Orchestra at the Opera - Google Art Project.jpg",{"tip":"바순 연주자인 친구 데지레 디오를 중심에 두고, 무대 위 무희들은 다리와 치마만 보이도록 잘라 냈습니다."}],["시골의 경마장에서","At the Races in the Countryside","1869","mfa","File:Edgar Degas - At the Races in the Countryside - Google Art Project.jpg",{"tip":"시골 경마장 옆에 세운 마차 안의 가족을 그렸습니다. 마차를 화면 가장자리에서 과감하게 잘라 낸 구도가 눈에 띕니다."}],["무대 위의 발레 리허설","The Rehearsal of the Ballet Onstage","1874경","met","File:The Rehearsal of the Ballet Onstage MET DT1565.jpg",{"tip":"무대 위에서 리허설하는 무희들과 한쪽에서 지켜보는 남자들을 그렸습니다. 화려한 공연보다 연습 과정을 즐겨 그린 드가의 관심이 잘 드러납니다."}],["모자 가게에서 (파스텔)","At the Milliner's","1882","met","File:At the Milliner's MET DT1046.jpg",{"tip":"거울 앞에서 모자를 써 보는 손님과 모자를 건네는 점원을 그린 파스텔화입니다. 점원은 거울에 가려 일부만 보이도록 대담하게 배치했습니다."}],["바에서 연습하는 무희들","Dancers Practicing at the Barre","1877","met","File:Dancers Practicing at the Barre MET DT840.jpg",{"tip":"바에 다리를 올리고 연습하는 두 무희를 그렸습니다. 바닥에 놓인 물뿌리개와 비스듬히 뻗은 마룻바닥의 구도를 살펴보세요."}],["페르난도 서커스의 미스 라라","Miss La La at the Cirque Fernando","1879","ngl","Miss La La at the Cirque Fernando",{"tip":"곡예사 미스 라라가 이로 밧줄을 물고 서커스 천장으로 끌어 올려지는 순간을 아래에서 올려다본 시점으로 그렸습니다."}],["운동하는 스파르타의 젊은이들","Young Spartans Exercising","1860경","ngl","Young Spartans Exercising",{"tip":"고대 스파르타의 소녀들이 소년들에게 겨루기를 청하는 장면을 그린 초기 역사화입니다. 드가는 이 그림을 평생 작업실에 간직했습니다."}],["실내","Interior","1868–1869","philly","Interior (Degas)",{"tip":"등불이 켜진 방에서 남자는 문가에 서 있고 여인은 등을 돌린 채 앉아 있으며, 열린 바느질 상자가 놓여 있습니다. 「강간」이라는 별칭으로도 불리며, 장면의 의미는 지금도 해석이 갈립니다."}],["목욕 후 몸을 닦는 여인","After the Bath, Woman Drying Herself","1890–1895경","ngl","After the Bath, Woman Drying Herself",{"tip":"몸을 앞으로 숙인 채 수건으로 목덜미를 닦는 여인을 뒤에서 본 파스텔화입니다. 등뼈를 따라 꺾인 자세가 드가 말년 목욕 연작의 특징을 잘 보여 줍니다."}]]},{"n":"프레데리크 바지유","o":"Frédéric Bazille","l":"1841–1870","d":"모네, 르누아르와 화실을 함께 쓰며 가난한 동료들을 도운 인상주의 초기 멤버. 보불전쟁에서 스물여덟에 전사해 첫 인상주의 전시회를 보지 못했습니다.","at":4,"w":[["가족 모임","Family Reunion","1867","orsay","File:Réunion de famille - Frédéric Bazille - musée d'Orsay RF 2749.jpg",{"tip":"고향 메릭 별장의 테라스에 모인 바지유 가족을 그렸습니다. 왼쪽 끝에 서 있는 키 큰 남자가 화가 자신입니다."}],["분홍 드레스","The Pink Dress","1864경","orsay","File:Frédéric Bazille - The Pink Dress - Google Art Project.jpg",{"tip":"분홍 줄무늬 드레스를 입은 사촌이 뒤돌아 앉아 햇빛 속 마을 풍경을 바라보는 모습입니다. 야외의 빛 아래 인물과 풍경을 함께 다룬 바지유의 초기작입니다."}],["여름 풍경 (멱 감는 사람들)","Summer Scene","1869","harvard","File:Bazille, Frédéric ~ Summer Scene, 1869, Oil on canvas Fogg Art Museum, Cambridge, Massachusetts.jpg",{"tip":"강가에서 멱을 감고 쉬는 젊은 남자들을 그렸습니다. 야외의 빛 속에서 남성 누드를 다룬 작품으로, 1870년 살롱에 출품되었습니다."}],["바지유의 화실","Bazille's Studio","1870","orsay","File:Frédéric Bazille - Bazille's Studio - Google Art Project.jpg",{"tip":"마네, 르누아르, 모네 등 동료들이 화실에 모인 장면으로, 키 큰 바지유 자신은 마네가 그려 넣었습니다."}],["즉석 야전병원","The Improvised Field Hospital","1865","orsay","The Improvised Field Hospital",{"tip":"다리를 다쳐 침대에 누워 있는 친구 모네를 그렸습니다. 의학을 공부했던 바지유가 물이 떨어지게 해 상처를 식히는 장치를 직접 만들어 주었다고 합니다."}],["마을 풍경","View of the Village","1868","fabre","View of the Village",{"tip":"몽펠리에 근처 카스텔노 마을을 내려다보는 나무 아래 분홍 줄무늬 옷의 소녀가 앉아 있습니다. 1869년 살롱에 입선했습니다."}],["화장","La Toilette","1870","fabre","La Toilette (Bazille)",{"tip":"몸단장하는 여인 곁에서 두 시녀가 시중드는 실내 장면입니다. 들라크루아의 동방 취향과 마네의 「올랭피아」를 떠올리게 하는 구성입니다."}]]},{"n":"카미유 피사로","o":"Camille Pissarro","l":"1830–1903","d":"여덟 번의 인상주의 전시에 모두 참가한 유일한 화가. 동료들의 아버지 같은 존재였습니다.","w":[["몽마르트르 대로, 밤","The Boulevard Montmartre at Night","1897","ngl","File:Camille Pissarro, The Boulevard Montmartre at Night, 1897.jpg",{"tip":"호텔 창에서 내려다본 몽마르트르 대로의 밤 풍경으로, 이 연작 가운데 유일한 야경입니다. 가로등과 상점 불빛이 젖은 길에 번지는 모습을 살펴보세요."}],["붉은 지붕","The Red Roofs","1877","orsay","File:Camille Pissarro - Red roofs, corner of a village, winter - Google Art Project.jpg",{"tip":"퐁투아즈 마을의 붉은 지붕들이 겨울나무 사이로 보이는 풍경입니다. 두텁고 촘촘한 붓질로 화면 전체를 짜 맞춘 점이 특징입니다."}],["퐁투아즈의 에르미타주 언덕","The Hermitage at Pontoise","1867","guggenheim","File:Pissarro L'Hermitage à Pontoise,1867.jpg",{"tip":"퐁투아즈의 언덕 마을과 그 아래 밭을 그린 대형 풍경화입니다. 이 시기 피사로의 단단한 구성과 차분한 색조가 잘 드러납니다."}],["서리 내린 아침 (에느리 옛길)","Hoarfrost","1873","orsay","File:Camille Pissarro - Gelée blanche, ancienne route d´Ennery, Pontoise - 1873.jpg",{"tip":"서리 내린 겨울 아침, 나뭇짐을 지고 걷는 농부와 길게 드리운 그림자를 그렸습니다. 1874년 첫 인상주의 전시에 출품되었습니다."}],["로드십 레인 역, 덜위치","Lordship Lane Station, Dulwich","1871","courtauld","File:Pissarro - Lordship Lane Station, Dulwich (1871).jpg",{"tip":"보불전쟁을 피해 런던에 머물던 시기에 그린 기차 풍경입니다."}],["몽마르트르 대로, 겨울 아침","The Boulevard Montmartre on a Winter Morning","1897","met","File:The Boulevard Montmartre on a Winter Morning MET DT1906.jpg",{"tip":"호텔 창문에서 같은 거리를 시간과 날씨를 바꿔 가며 그린 연작 14점 가운데 하나입니다."}],["테아트르 프랑세 광장","La Place du Théâtre Français","1898","lacma","File:Camille Pissarro, La Place du Théâtre Français.jpg",{"tip":"호텔 창에서 내려다본 광장의 마차와 행인들을 그렸습니다. 말년의 피사로는 눈병 때문에 야외 대신 창가에서 도시 풍경을 즐겨 그렸습니다."}],["에라니의 사과 수확","Apple Harvest","1888","dallas","File:Camille Pissarro - Apple Harvest - 1955.17.M - Dallas Museum of Art.jpg",{"tip":"쇠라의 점묘법을 받아들였던 신인상주의 시기의 작품입니다."}],["시드넘의 가로수길","The Avenue, Sydenham","1871","ngl","File:Camille Pissarro - The Avenue, Sydenham - National Gallery London.jpg",{"tip":"보불전쟁을 피해 런던 남쪽에 머물 때 그린 그림으로, 나무가 늘어선 길을 걷는 사람들과 멀리 교회가 보입니다."}],["레르미타주의 코트 데 뵈","Côte des Bœufs at L'Hermitage","1877","ngl","Côte des Bœufs at L'Hermitage",{"tip":"퐁투아즈 언덕 마을의 집들을 앞쪽의 키 큰 나무 줄기 사이로 내다본 구도입니다. 촘촘하게 겹친 붓질이 화면 전체를 덮고 있습니다."}],["퐁투아즈의 잘레 언덕","Jalais Hill, Pontoise","1867","met","File:Camille Pissarro Jalais Hill, Pontoise The Metropolitan Museum of Art.jpg",{"tip":"퐁투아즈 근교 잘레 언덕의 길과 집, 밭을 그린 풍경입니다. 1868년 살롱에 출품되어 졸라의 호평을 받았습니다."}]]},{"n":"알프레드 시슬레","o":"Alfred Sisley","l":"1839–1899","d":"평생 풍경만 그린 가장 순수한 인상주의자입니다.","w":[["홍수 속의 배, 포르마를리","The Boat in the Flood, Port-Marly","1876","orsay","File:Sisley - The-Boat-In-The-Flood,-Port-Marly,-1876.jpg",{"tip":"센강이 범람해 물에 잠긴 포르마를리 마을과 거리 위에 뜬 배를 그렸습니다. 시슬레는 같은 홍수를 여러 점의 그림으로 남겼습니다."}],["루브시엔의 눈","Snow at Louveciennes","1878","orsay","File:La neige à Louveciennes (Snow at Louveciennes).jpg",{"tip":"눈 덮인 루브시엔 골목길을 걸어가는 한 사람을 그렸습니다. 흰 눈 속에 섞인 푸른빛과 분홍빛 색조를 살펴보세요."}],["모레의 다리","The Bridge at Moret","1893","orsay","File:Sisley - The-Bridge-At-Moret,-1893.jpg",{"tip":"말년을 보낸 모레쉬르루앙의 다리와 마을을 그렸습니다. 시슬레는 이곳의 다리와 성당을 반복해서 그렸습니다."}],["생마르탱 운하","View of the Canal Saint-Martin","1870","orsay","File:Sisley - View-Of-The-Canal-Saint-Martin,-Paris,-1870.jpg",{"tip":"파리 생마르탱 운하의 수면에 비친 하늘과 정박한 배들을 그렸습니다. 화면의 상당 부분을 하늘과 물에 할애한 시슬레다운 구성입니다."}],["빌뇌브라가렌의 다리","The Bridge at Villeneuve-la-Garenne","1872","met","File:The Bridge at Villeneuve-la-Garenne MET DT1040.jpg",{"tip":"센강을 가로지르는 현수교와 강가에서 쉬는 사람들을 그렸습니다. 다리를 비스듬히 배치해 화면에 깊이를 더했습니다."}],["몰지의 보트 경주","Regatta at Molesey","1874","orsay","File:Sisley - Regatta-At-Molesey,-1874.jpg",{"tip":"영국 템스강 상류의 몰지에서 열린 보트 경주를 그렸습니다. 펄럭이는 깃발과 물결을 빠르고 경쾌한 붓질로 표현했습니다."}],["아르장퇴유의 보행자 다리","The Footbridge at Argenteuil","1872","orsay","File:Sisley, Alfred - Passerelle d'Argenteuil.jpg",{"tip":"아르장퇴유의 보행자 다리를 가까이에서 그렸습니다. 다리 구조물이 만드는 원근선과 강물 위의 빛을 살펴보세요."}],["루브시엔의 마신 길","The Road from the Machine, Louveciennes","1873","orsay","File:Alfred sisley, strada de la machine, louveciennes, 1872.JPG",{"tip":"'마신'이라 불린 루브시엔의 양수 시설로 이어지는 길을 그렸습니다. 길 양옆의 가로수가 소실점으로 모이는 구도가 인상적입니다."}],["루브시엔의 첫눈","Early Snow at Louveciennes","1870–1871","mfa","File:Sisley-Early Snow at Louveciennes.jpg",{"tip":"첫눈이 덮인 루브시엔 마을 길과 담장, 나무를 차분한 회색 톤으로 그렸습니다. 시슬레가 살던 마을의 고요한 겨울 풍경입니다."}],["햄프턴 코트의 몰지 둑","Molesey Weir, Hampton Court","1874","edinburgh","File:Alfred Sisley - Molesey Weir, Hampton Court - NG 2235 - National Galleries of Scotland.jpg",{"tip":"1874년 영국에 머물 때 햄프턴 코트 근처 템스강의 둑을 그렸습니다. 둑을 넘쳐흐르는 물과 넓은 하늘이 시원하게 펼쳐집니다."}],["포르마를리의 센강, 모래 더미","The Seine at Port-Marly, Piles of Sand","1875","aic","The Seine at Port-Marly, Piles of Sand",{"tip":"센강 변에 쌓인 모래 더미와 하역 작업을 그렸습니다. 강가의 일하는 풍경을 차분한 색조로 담은 작품입니다."}]]},{"n":"베르트 모리조","o":"Berthe Morisot","l":"1841–1895","d":"첫 인상주의 전시에 참가한 여성 화가. 가정과 여성의 삶을 섬세하게 그렸습니다.","w":[["요람","The Cradle","1872","orsay","The Cradle (Morisot)",{"tip":"요람 속 잠든 아기를 지켜보는 언니 에드마를 그렸습니다. 1874년 첫 인상주의 전시에 출품된 모리조의 대표작입니다."}],["부지발 정원의 외젠 마네와 딸","Eugène Manet and His Daughter at Bougival","1881","marmottan","File:Eugene Manet and His Daughter at Bougival 1881 Berthe Morisot.jpg",{"tip":"남편 외젠 마네와 딸 쥘리가 정원에 함께 앉아 있는 모습입니다. 빠르고 가벼운 붓질로 가족의 평범한 한때를 포착했습니다."}],["여름날","Summer's Day","1879","ngl","File:Berthe Morisot - Jour d'été, 1879.jpg",{"tip":"불로뉴 숲 호수에서 보트를 탄 두 여인을 그렸습니다. 지그재그로 이어지는 빠른 붓질이 물결과 햇빛을 생생하게 전합니다."}],["무도회 드레스를 입은 젊은 여인","Young Woman in a Ball Gown","1879","orsay","File:Berthe Morisot - Young Girl in a Ball Gown - Google Art Project.jpg",{"tip":"무도회 드레스를 입은 젊은 여인과 뒤편의 꽃과 잎을 거침없는 붓질로 그렸습니다. 드레스와 배경이 경계 없이 어우러지는 점을 살펴보세요."}],["프시케 (전신 거울)","Psyché","1876","thyssen","File:El espejo de vestir.jpg",{"tip":"회전식 전신 거울 앞에서 옷매무새를 살피는 젊은 여인을 그렸습니다. 프랑스어로 '프시케'는 바로 이런 전신 거울을 뜻합니다."}],["로리앙 항구","The Harbor at Lorient","1869","nga","File:Berthe Morisot, The Harbor at Lorient, 1869, NGA 52192.jpg",{"tip":"브르타뉴의 로리앙 항구와 둑 위에 양산을 쓰고 앉은 언니 에드마를 그렸습니다. 넓게 펼쳐진 수면과 물에 비친 배들의 반영을 살펴보세요."}],["화장하는 여인","Woman at Her Toilette","1875–1880","aic","File:Berthe Morisot - Woman at Her Toilette - 1924.127 - Art Institute of Chicago.jpg",{"tip":"거울 앞에서 머리를 매만지는 여인을 뒷모습으로 그렸습니다. 흰색과 은빛이 어우러진 화면을 빠른 붓질로 완성했습니다."}],["화가의 어머니와 언니","The Mother and Sister of the Artist","1869–1870","nga","The Mother and Sister of the Artist",{"tip":"검은 옷의 어머니가 책을 읽고 임신한 언니 에드마가 흰 옷을 입고 곁에 앉아 있습니다. 출품 직전 마네가 손을 대 모리조가 당황했다는 일화가 있습니다."}],["식당에서","In the Dining Room","1886","nga","In the Dining Room",{"tip":"식당 찬장 옆에 선 하녀와 발치의 작은 개를 그렸습니다. 빠르고 자유로운 붓질이 모리조 특유의 경쾌한 화면을 보여 줍니다."}],["나비 잡기","The Butterfly Hunt","1874","orsay","File:Berthe Morisot Chasse aux papillons.jpg",{"tip":"언니 에드마와 그 아이들이 나무 그늘 아래에서 나비를 잡는 모습을 그렸습니다. 햇빛이 비치는 숲의 공기를 가볍게 담아냈습니다."}],["쥘리 마네와 그레이하운드 라에르트","Julie Manet and Her Greyhound Laërte","1893","marmottan","File:Berthe Morisot - Julie Manet et sa levrette Laërte - Musée Marmottan-Monet.jpg",{"tip":"딸 쥘리가 그레이하운드 라에르트와 함께 앉아 있는 초상입니다. 남편 외젠 마네가 세상을 떠난 이듬해에 그렸습니다."}]]},{"n":"귀스타브 카유보트","o":"Gustave Caillebotte","l":"1848–1894","d":"화가이자 후원자. 대담한 원근법으로 새로 바뀐 파리를 그렸습니다.","w":[["파리의 거리, 비 오는 날","Paris Street; Rainy Day","1877","aic","Paris Street; Rainy Day",{"tip":"오스만식 대로가 만나는 파리의 교차로를 우산 쓴 행인들과 함께 그린 대작입니다. 비에 젖은 포석의 반사와 화면을 가르는 가로등 기둥을 눈여겨보세요."}],["마루 깎는 사람들","The Floor Scrapers","1875","orsay","The Floor Scrapers",{"tip":"인부들이 웃통을 벗고 마룻바닥을 긁어내는 모습을 그린 작품입니다. 주제가 저속하다는 이유로 살롱에서 거절된 뒤 인상주의 전시회에 출품되었습니다."}],["유럽 다리","Le Pont de l'Europe","1876","geneva","Le Pont de l'Europe",{"tip":"생라자르역 철로 위에 놓인 철골 다리를 걷는 사람들을 그렸습니다. 거대한 철제 난간과 강한 원근감이 근대 도시 파리의 풍경을 보여 줍니다."}],["창가의 젊은 남자","Young Man at His Window","1876","getty","Young Man at His Window",{"tip":"화가의 동생 르네가 아파트 창가에 서서 거리를 내려다보는 뒷모습을 그렸습니다. 관람자도 그의 시선을 따라 파리의 대로를 바라보게 되는 구도입니다."}],["오렌지 나무","The Orange Trees","1878","mfah","File:Gustave Caillebotte - The Orange Trees - Google Art Project.jpg",{"tip":"예르에 있던 가족 별장의 정원에서 여름날을 보내는 인물들을 그렸습니다. 강한 햇빛과 나무 그늘이 만드는 명암 대비가 돋보입니다."}],["목욕하는 남자","Man at His Bath","1884","mfa","File:Gustave Caillebotte -Man at His Bath.jpg",{"tip":"목욕을 마치고 수건으로 몸을 닦는 남성의 뒷모습을 그린 작품입니다. 당시 드물던 남성 누드를 일상 장면으로 다루었으며, 바닥에 남은 젖은 발자국도 눈여겨보세요."}],["눈 덮인 지붕","Rooftops in the Snow","1878","orsay","File:Gustave Caillebotte - Rooftops in the Snow (snow effect) - Google Art Project.jpg",{"tip":"눈 덮인 파리의 지붕과 굴뚝을 창에서 내려다본 풍경입니다. 회색 하늘과 젖은 지붕의 차분한 색조가 겨울 도시의 공기를 전합니다."}],["뱃놀이","Boating Party","1877–1878","orsay","Boating Party",{"tip":"실크해트를 쓴 정장 차림의 남자가 작은 배의 노를 젓는 모습을 배 안에서 바라본 구도입니다. 2023년 LVMH의 후원으로 프랑스가 사들여 오르세에 들어왔습니다."}],["예르강의 카누","Skiffs","1877","nga","File:Gustave Caillebotte, Skiffs, 1877, NGA 66404.jpg",{"tip":"예르강에서 길쭉한 1인용 카누를 젓는 사람들을 그렸습니다. 카유보트 가족의 별장이 있던 예르에서 보낸 여름의 풍경입니다."}],["진열대 위의 과일","Fruit Displayed on a Stand","1881–1882경","mfa","File:Gustave Caillebotte - Fruit Displayed on a Stand - Google Art Project.jpg",{"tip":"시장 진열대에 놓인 여러 과일을 위에서 내려다본 대담한 구도로 그린 정물화입니다."}],["아르장퇴유의 돛단배","Sailing Boats at Argenteuil","1888","orsay","File:Caillebotte, Gustave - Sailboats at Argenteuil - Musée d’Orsay RF 1954 31.jpg",{"tip":"아르장퇴유 센강의 나무 선착장과 돛단배를 그렸습니다. 요트 경주에 열중하고 직접 배를 설계하기도 했던 카유보트의 관심이 담겨 있습니다."}]]},{"n":"메리 카사트","o":"Mary Cassatt","l":"1844–1926","d":"파리에서 활동한 미국 화가. 어머니와 아이의 일상을 그렸습니다.","w":[["파란 안락의자의 소녀","Little Girl in a Blue Armchair","1878","nga","Little Girl in a Blue Armchair",{"tip":"파란 안락의자에 나른하게 기대앉은 소녀를 그린 작품입니다. 드가가 배경 일부에 손을 댔다고 카사트 자신이 편지에 밝혔습니다."}],["아이의 목욕","The Child's Bath","1893","aic","The Child's Bath",{"tip":"어머니가 무릎에 앉힌 아이의 발을 씻기는 장면입니다. 위에서 내려다본 시점과 줄무늬 옷의 평면적 무늬에서 일본 판화의 영향을 볼 수 있습니다."}],["특별석에서","In the Loge","1878","mfa","File:Mary Stevenson Cassatt - In the Loge - Google Art Project.jpg",{"tip":"검은 옷의 여인이 오페라글라스로 무대를 바라보는 동안, 뒤편의 남자도 쌍안경으로 그녀를 보고 있습니다. 보는 사람과 보이는 사람의 관계를 재치 있게 담았습니다."}],["진주 목걸이를 한 여인","Woman with a Pearl Necklace in a Loge","1879","philly","File:Mary Stevenson Cassatt, American - Woman with a Pearl Necklace in a Loge - Google Art Project.jpg",{"tip":"극장 특별석에 앉은 여인 뒤로 거울에 비친 샹들리에와 객석이 반짝입니다. 여인의 얼굴과 어깨에 떨어지는 따뜻한 조명을 눈여겨보세요."}],["차 한 잔","The Cup of Tea","1880–1881","met","File:Mary Cassatt - The Cup of Tea - MMA 22.16.17.jpg",{"tip":"분홍 드레스 차림의 여인이 찻잔을 든 채 안락의자에 앉아 있습니다. 차를 마시는 부르주아 여성의 일상은 카사트가 즐겨 다룬 주제입니다."}],["뱃놀이","The Boating Party","1893–1894","nga","File:Mary Cassatt, The Boating Party, 1893-1894, NGA 46569.jpg",{"tip":"노 젓는 남자와 아이를 안은 여인이 탄 배를 가까이서 그렸습니다. 대담하게 잘린 구도와 선명한 색면에서 일본 판화의 영향이 드러납니다."}],["편지 (판화)","The Letter","1890–1891","various","File:Mary Cassatt - The Letter - NGC 29876.jpg",{"tip":"일본 우키요에에서 영감을 받은 컬러 판화 연작으로, 여러 미술관이 소장하고 있습니다."}],["티 테이블의 부인","Lady at the Tea Table","1883–1885","met","Lady at the Tea Table",{"tip":"어머니의 사촌 리들 부인이 푸른 도자기 찻잔 세트 앞에 앉은 모습입니다. 가족이 초상을 마음에 들어 하지 않아 카사트가 오랫동안 간직했습니다."}],["해변에서 노는 아이들","Children Playing on the Beach","1884","nga","File:Mary Cassatt, Children Playing on the Beach, 1884, NGA 52163.jpg",{"tip":"모래사장에서 양동이와 삽을 가지고 노는 두 아이를 가까이에서 내려다본 그림입니다."}],["머리를 매만지는 소녀","Girl Arranging Her Hair","1886","nga","File:Mary Cassatt - Girl Arranging Her Hair - Google Art Project.jpg",{"tip":"잠옷 차림의 소녀가 머리를 땋는 모습을 그렸습니다. 드가가 이 그림을 사들여 평생 소장했습니다."}],["어머니와 아이(타원형 거울)","Mother and Child (The Oval Mirror)","1899경","met","File:Mother and Child (The Oval Mirror) MET DT2025.jpg",{"tip":"아이를 안은 어머니 뒤 타원형 거울이 아이의 머리를 후광처럼 감쌉니다. 르네상스 성모자 그림을 떠올리게 해 소장자 해브마이어 부부는 「피렌체의 성모」라고 불렀습니다."}]]},{"n":"존 싱어 사전트","o":"John Singer Sargent","l":"1856–1925","d":"당대 최고의 초상화가. 빠르고 자신감 있는 붓질로 인물의 품격을 포착했습니다.","w":[["마담 X","Madame X (Madame Pierre Gautreau)","1883–1884","met","Portrait of Madame X",{"tip":"파리 사교계 여인을 검은 드레스와 창백한 피부로 그린 초상입니다. 원래 어깨끈이 흘러내린 모습이 살롱에서 스캔들이 되어 나중에 고쳐 그렸습니다."}],["카네이션, 백합, 백합, 장미","Carnation, Lily, Lily, Rose","1885–1886","tateb","Carnation, Lily, Lily, Rose",{"tip":"해 질 녘 정원에서 두 소녀가 종이 등불을 밝힙니다. 해가 지는 짧은 시간에만 야외에서 조금씩 그려 두 해에 걸쳐 완성했습니다."}],["에드워드 달리 보이트의 딸들","The Daughters of Edward Darley Boit","1882","mfa","The Daughters of Edward Darley Boit",{"tip":"네 자매가 넓은 실내에 흩어져 서 있는 독특한 단체 초상입니다. 그림 속 커다란 일본 도자기 화병들도 함께 미술관에 기증되었습니다."}],["로크노의 애그뉴 부인","Lady Agnew of Lochnaw","1892","edinburgh","Lady Agnew of Lochnaw",{"tip":"의자에 기대어 정면을 바라보는 여인의 편안하고 친밀한 초상입니다. 발표 당시 사전트의 명성을 크게 높였습니다."}]]}]},{"id":"post-impressionism","name":"신인상주의 · 후기인상주의","en":"Neo- & Post-Impressionism","years":"1886년 – 1905년","s":1886,"e":1905,"color":"#94690f","sum":"인상주의를 거친 화가들이 각자 다른 길로 나아간 시기입니다. '후기인상주의'는 하나의 양식이 아니라, 1910년 영국 평론가 로저 프라이가 이들을 묶어 붙인 이름입니다. 이들의 길이 20세기 미술의 출발점이 됩니다.","traits":["신인상주의: 색점을 과학적으로 배치하는 점묘법 (쇠라, 시냐크)","세잔: 자연을 원통·구·원뿔로 → 입체주의로","고흐: 감정을 담은 색과 붓질 → 표현주의로","고갱: 평면적 색면과 원시에 대한 동경 → 야수주의와 원시주의로","더 크고 네모난 색점의 점묘 (크로스) → 마티스와 야수주의에 영향","몽마르트르의 밤 문화와 석판 포스터 (툴루즈로트레크)"],"diff":"인상주의가 눈에 비친 순간의 빛을 기록했다면, 이들은 구조(세잔), 감정(고흐), 상징(고갱), 과학(쇠라)을 더했습니다.","artists":[{"n":"조르주 쇠라","o":"Georges Seurat","l":"1859–1891","d":"색채 이론에 따라 작은 점을 찍어 그린 점묘법의 창시자입니다.","w":[["그랑드자트섬의 일요일 오후","A Sunday Afternoon on the Island of La Grande Jatte","1884–1886","aic","A Sunday Afternoon on the Island of La Grande Jatte",{"tip":"센강의 섬에서 여가를 즐기는 파리 시민들을 작은 색점으로 그려 낸 점묘법의 대표작입니다. 가까이서는 점이 보이고 물러서면 색이 섞여 보이는 효과를 확인해 보세요."}],["아니에르의 물놀이","Bathers at Asnières","1884","ngl","Bathers at Asnières",{"tip":"센강 변에서 쉬는 노동자 청년들을 그린 대작으로, 살롱에서 거절된 뒤 앵데팡당전에 출품되었습니다. 배경 멀리 공장 굴뚝이 보입니다."}],["서커스","The Circus","1890–1891","orsay","The Circus (Seurat)",{"tip":"말 위의 여성 곡예사와 광대, 관객을 그린 마지막 대작으로, 쇠라가 세상을 떠날 때 미완성 상태였습니다. 위로 솟구치는 곡선이 활기찬 분위기를 만듭니다."}],["포즈를 취하는 여인들","Les Poseuses","1886–1888","barnes","Les Poseuses",{"tip":"화실에서 옷을 벗고 쉬는 세 모델을 그린 작품으로, 왼쪽 벽에 ‘그랑드자트섬의 일요일 오후’가 걸려 있습니다."}],["에펠탑","The Eiffel Tower","1889경","legion","File:Georges Seurat - La Tour Eiffel (ca. 1889).jpg",{"tip":"완공 직전의 에펠탑을 그린 작은 그림입니다."}],["르 샤위 (캉캉 춤)","Le Chahut","1889–1890","kroller","File:Georges Seurat, 1889-90, Le Chahut, oil on canvas, 170 x 141 cm, Kröller-Müller Museum.jpeg",{"tip":"카바레에서 다리를 높이 차올리는 캉캉 무용수들을 그렸습니다. 위로 향하는 선이 즐거운 감정을 불러일으킨다는 당대의 선·색채 이론을 적용한 작품입니다."}],["그랑캉의 베크 뒤 오크","Le Bec du Hoc, Grandcamp","1885","tatem","File:Seurat-Le Bec du Hoc à Grandcamp.jpg",{"tip":"노르망디 해안에 솟은 절벽을 점묘로 그린 풍경입니다. 화면을 크게 차지한 바위와 잔잔한 바다의 대비가 독특한 긴장감을 줍니다."}],["분 바르는 젊은 여인","Young Woman Powdering Herself","1889–1890","courtauld","File:Georges Seurat, 1889-90, Jeune femme se poudrant (Young Woman Powdering Herself), oil on canvas, 95.5 x 79.5 cm, Courtauld Institute of Art.jpg",{"tip":"모델은 쇠라의 연인 마들렌 크노블로흐입니다."}],["서커스 퍼레이드","Circus Sideshow","1887–1888","met","Parade de cirque",{"tip":"서커스 천막 앞에서 손님을 끌기 위해 벌이는 밤의 호객 공연을 그렸습니다. 가스등 불빛 아래 점묘로 표현한 어스름한 야경이 신비로운 분위기를 자아냅니다."}],["그라블린 운하, 저녁","The Channel at Gravelines, Evening","1890","moma","File:Georges-Pierre Seurat - The Channel at Gravelines, Evening - Google Art Project.jpg",{"tip":"쇠라가 세상을 떠나기 전 마지막 여름에 북프랑스 해안에서 그린 풍경입니다. 점으로 칠한 테두리가 그림 안쪽의 색과 조화를 이루도록 계산되어 있습니다."}],["포르탕베생, 항구 입구","Port-en-Bessin, Entrance to the Harbor","1888","moma","File:Georges Seurat - Port-en-Bessin - Entrance to the Harbor.jpg",{"tip":"노르망디의 작은 어항 입구를 내려다본 풍경입니다. 수면 위에 떠 있는 구름 그림자가 평온한 화면에 리듬을 더합니다."}]]},{"n":"폴 시냐크","o":"Paul Signac","l":"1863–1935","d":"쇠라와 함께 신인상주의를 이끌고 이론을 정리했습니다.","w":[["펠릭스 페네옹의 초상","Portrait of Félix Fénéon","1890","moma","Portrait of Félix Fénéon",{"tip":"점묘법을 옹호한 비평가 페네옹을 소용돌이치는 색채 무늬 앞에 옆모습으로 그렸습니다. 원제에는 ‘작품 번호 217’ 같은 음악적인 제목이 붙어 있습니다."}],["붉은 부표 (생트로페)","The Red Buoy","1895","orsay","File:Signac - Saint-Tropez. La Bouée rouge, 1895, RF 1957 12.jpg",{"tip":"생트로페 항구의 물결 위에 떠 있는 붉은 부표와 건물의 반영을 굵은 색점으로 그렸습니다. 점이 커지고 색이 대담해진 후기 점묘법을 잘 보여 줍니다."}],["우물가의 여인들","Women at the Well","1892","orsay","File:Paul Signac Femmes au puits 1892.jpg",{"tip":"남프랑스 생트로페에서 우물가의 여인들을 그린 작품입니다. 강렬한 햇빛 아래 보색 대비를 활용한 점묘 기법이 돋보입니다."}],["아비뇽, 저녁 (교황청)","Avignon, Evening (Palace of the Popes)","1909","orsay","File:Signac - Avignon. Soir (le château des Papes), 1909, RF 1977 323.jpg",{"tip":"론강 건너편에서 바라본 아비뇽 교황청을 저녁 노을빛 속에 그렸습니다. 모자이크처럼 큼직한 색점이 물과 하늘을 빛나게 합니다."}],["아침 식사 (식당)","Breakfast (The Dining Room)","1886–1887","kroller","File:Paul Signac - Breakfast - Google Art Project.jpg",{"tip":"부르주아 가정의 식당에서 아침 식사를 하는 인물들을 엄격한 점묘법으로 그렸습니다. 굳은 자세의 인물들이 차갑고 정적인 분위기를 만듭니다."}],["카포 디 놀리","Capo di Noli","1898","wallraf","File:Paul Signac - Capo di Noli.jpg",{"tip":"이탈리아 리구리아 해안의 곶과 바다를 강렬한 색점으로 그린 풍경입니다. 나란히 놓인 보색 점들이 만들어 내는 눈부신 빛을 살펴보세요."}],["생트로페의 소나무","The Pine Tree at Saint-Tropez","1909","pushkin","File:Paul Signac, 1909, The Pine Tree at Saint Tropez, oil on canvas, 72 x 92 cm, Pushkin Museum, Moscow.jpg",{"tip":"생트로페의 커다란 소나무를 모자이크 같은 색점으로 그린 작품입니다. 화면 가운데를 채운 나무와 밝은 색채가 남프랑스의 햇빛을 전합니다."}],["노트르담 드 라 가르드, 마르세유","Notre-Dame-de-la-Garde (La Bonne-Mère), Marseilles","1905–1906","met","File:Notre-Dame-de-la-Garde (La Bonne-Mère), Marseilles MET DT2567.jpg",{"tip":"마르세유 언덕 위의 성당과 항구를 내려다본 풍경입니다. 후기의 시냐크답게 점이 넓은 모자이크 같은 붓질로 바뀌어 색채가 한층 강렬합니다."}],["카시스의 방파제, 작품 198","The Jetty at Cassis, Opus 198","1889","met","File:The Jetty at Cassis, Opus 198 MET DT2166.jpg",{"tip":"지중해 어촌 카시스의 방파제와 잔잔한 바다를 그렸습니다. 작품에 음악처럼 작품 번호를 붙이던 시냐크의 습관이 제목에 남아 있습니다."}],["레 장들리, 강둑","Les Andelys, the Riverbank","1886","orsay","File:Signac - Les Andelys. La Berge, 1886, RF 1996 6.jpg",{"tip":"노르망디 센강 변 마을에서 보낸 여름에 그린 그림으로, 시냐크가 점묘법을 본격적으로 시도한 초기 작품입니다."}],["생카스트 항구","Port of Saint-Cast","1890","mfa","File:Paul Signac - Port of Saint-Cast - Google Art Project.jpg",{"tip":"브르타뉴 북쪽 해안의 작은 항구를 그렸습니다. 고른 색 점들이 물과 하늘, 해안의 빛을 차분하게 엮어 냅니다."}]]},{"n":"앙리 에드몽 크로스","o":"Henri-Edmond Cross","l":"1856–1910","d":"시냐크와 함께 지중해의 빛을 점묘법으로 그린 신인상주의 화가. 크고 네모난 색점은 마티스의 야수주의에 영향을 주었습니다.","at":2,"w":[["황금 섬","The Golden Isles","1891–1892","orsay","File:Les Îles d'Or, par Henri-Edmond Cross.jpg",{"tip":"남프랑스 이에르 앞바다의 섬들을 수평의 띠처럼 그린 작품입니다. 단순한 구도와 고른 색점으로 거의 추상에 가까운 효과를 냅니다."}],["저녁 바람","The Evening Air","1893–1894","orsay","File:Cross - L'air du soir.JPG",{"tip":"해 질 녘 바닷가 소나무 아래에서 쉬는 여인들을 그린 목가적인 장면입니다. 은은한 보랏빛과 분홍빛 색조가 꿈같은 분위기를 만듭니다."}],["비냐스 해변","Beach at La Vignasse","1891–1892","muma","File:Plage de la Vignasse (Cross).jpg",{"tip":"크로스가 머물던 남프랑스 지중해 연안의 해변 풍경을 점묘법으로 그렸습니다. 차분한 색점으로 바다와 햇빛의 반짝임을 표현했습니다."}],["별이 있는 풍경 (수채화)","Landscape with Stars","1905–1908경","met","File:Landscape with Stars MET DT736.jpg",{"tip":"말년에 그린 수채화로, 점 대신 짧은 색 획으로 밤하늘을 그렸습니다. 로버트 레먼 컬렉션 소장이며 빛에 약한 종이 작품이라 늘 전시되지는 않습니다."}],["카바송 해변 (뱅퀴 해변)","Beach at Cabasson (Baigne-Cul)","1891–1892","aic","File:Henri Edmond Cross - Beach at Cabasson (Baigne-Cul) - 1983.513 - Art Institute of Chicago.jpg",{"tip":"크로스가 정착한 남프랑스 바르 해안의 해변을 그렸습니다. 조밀한 점으로 지중해의 밝은 햇빛과 고요한 물빛을 표현했습니다."}],["파르디공의 오후","Afternoon at Pardigon","1907","orsay","File:Afternoon in Pardigon Cross Orsay RF 1977 125.jpg",{"tip":"크로스가 머물던 남프랑스 지중해 연안 파르디공의 햇빛 가득한 풍경입니다. 후기로 갈수록 커진 직사각형 붓질과 선명한 색이 돋보입니다."}],["카뉴의 사이프러스","Cypresses at Cagnes","1908","orsay","File:Henri-Edmond Cross, 1908, Les cyprès à Cagnes, oil on canvas, 81 x 100 cm, Musée d'Orsay, Paris.jpg",{"tip":"남프랑스 카뉴의 사이프러스 나무와 언덕 풍경을 그렸습니다. 굵은 색 조각들이 겹쳐 화면 전체가 장식적인 리듬을 띱니다."}]]},{"n":"폴 세잔","o":"Paul Cézanne","l":"1839–1906","d":"'현대 미술의 아버지'. 사물의 견고한 구조를 탐구했습니다.","w":[["생트빅투아르산","Mont Sainte-Victoire","1902–1904","philly","Mont Sainte-Victoire (Cézanne)",{"tip":"같은 산을 그린 연작이 여러 점 있으며 세계 각지 미술관에 흩어져 있습니다."}],["카드놀이하는 사람들","The Card Players","1894–1895","orsay","The Card Players",{"tip":"두 농부가 마주 앉아 카드놀이를 하는 장면으로, 세잔은 이 주제로 여러 점을 그렸습니다. 가운데 놓인 술병을 축으로 좌우가 균형을 이루는 구도를 살펴보세요."}],["사과와 오렌지","Apples and Oranges","1899경","orsay","Still Life with Apples and Oranges",{"tip":"흰 천과 꽃무늬 직물 위에 사과와 오렌지를 쌓아 올린 정물입니다. 여러 시점이 뒤섞인 듯한 탁자와 그릇에서 세잔 특유의 화면 구성을 볼 수 있습니다."}],["대수욕도","The Large Bathers","1898–1905","philly","The Bathers (Cézanne)",{"tip":"삼각형으로 기울어진 나무 아래 여성 누드들이 어우러진 대작으로, 세잔이 말년까지 매달린 수욕도 연작 가운데 하나입니다."}],["붉은 조끼를 입은 소년","The Boy in the Red Vest","1888–1890","zurich","The Boy in the Red Vest",{"tip":"뷔를레 재단 소장품으로 취리히 미술관에서 전시됩니다."}],["목맨 사람의 집","The House of the Hanged Man","1873","orsay","File:Paul Cezanne, The Hanged Man's House, 1873.jpg",{"tip":"1874년 첫 인상주의 전시회에 출품한 작품입니다."}],["붉은 안락의자의 세잔 부인","Madame Cézanne in a Red Armchair","1877경","mfa","File:Paul Cézanne - Madame Cézanne in a Red Armchair - Google Art Project.jpg",{"tip":"붉은 안락의자에 앉은 아내 오르탕스를 그린 초상입니다. 의자와 치마의 무늬, 색면이 견고하게 짜여 인물을 하나의 구조물처럼 보이게 합니다."}],["사과 바구니","The Basket of Apples","1893경","aic","File:Paul Cézanne - The Basket of Apples - 1926.252 - Art Institute of Chicago.jpg",{"tip":"식탁과 병이 서로 다른 시점에서 그려져 있어 입체주의의 출발점으로 꼽힙니다."}],["커피포트를 든 여인","Woman with a Coffeepot","1895경","orsay","File:Paul Cézanne - Woman with a Coffeepot - Google Art Project.jpg",{"tip":"푸른 옷을 입은 여인이 커피포트와 잔 옆에 꼿꼿이 앉아 있습니다. 인물과 사물을 똑같이 단단한 원통과 면으로 쌓아 올린 구성이 특징입니다."}],["석고 큐피드가 있는 정물","Still Life with Plaster Cupid","1894경","courtauld","File:Cézanne, Still Life with Plaster Cupid.jpg",{"tip":"작업실의 석고 큐피드상과 과일, 기대어 놓은 캔버스들을 그렸습니다. 바닥이 기울어 보이는 등 여러 시점이 한 화면에 섞여 있습니다."}],["안시 호수","Lake Annecy","1896","courtauld","File:Lac d'Annecy, par Paul Cézanne.jpg",{"tip":"프랑스 알프스의 안시 호수에서 휴가 중에 그린 풍경입니다. 짙은 푸른색 붓질이 호수와 산, 나무를 하나의 구조로 묶습니다."}]]},{"n":"빈센트 반 고흐","o":"Vincent van Gogh","l":"1853–1890","d":"10년 남짓한 화가 생활 동안 약 900점의 유화를 남겼습니다.","w":[["별이 빛나는 밤","The Starry Night","1889","moma","The Starry Night",{"tip":"생레미 요양원 시절 창밖 풍경을 바탕으로 그린 밤하늘로, 소용돌이치는 하늘과 불꽃 같은 사이프러스가 특징입니다. 아래쪽 마을은 상상으로 덧붙였습니다."}],["해바라기","Sunflowers","1888","ngl","Sunflowers (Van Gogh series)",{"tip":"해바라기 연작은 런던, 암스테르담, 뮌헨, 필라델피아, 도쿄 등에 나뉘어 있습니다."}],["아를의 침실","Bedroom in Arles","1888","vgm","Bedroom in Arles",{"tip":"아를 ‘노란 집’의 침실을 그린 작품으로, 반 고흐는 같은 구도로 세 점을 남겼습니다. 선명한 색으로 휴식의 느낌을 주려 했다고 편지에 썼습니다."}],["밤의 카페 테라스","Café Terrace at Night","1888","kroller","Café Terrace at Night",{"tip":"아를의 포룸 광장에 있는 카페 테라스를 별이 뜬 밤하늘 아래 그렸습니다. 검은색 없이 파랑과 노랑으로 밤을 표현한 점을 눈여겨보세요."}],["감자 먹는 사람들","The Potato Eaters","1885","vgm","The Potato Eaters",{"tip":"뉘넌 시절 농부 가족이 램프 아래에서 감자를 먹는 모습을 그린 초기 대표작입니다. 땅을 일군 바로 그 손으로 음식을 먹는다는 것을 보여 주려 했다고 편지에 썼습니다."}],["론강의 별이 빛나는 밤","Starry Night Over the Rhône","1888","orsay","File:Starry Night Over the Rhone.jpg",{"tip":"아를의 론강 변에서 바라본 밤하늘과 가스등 불빛의 반영을 그렸습니다. 강가를 걷는 연인과 하늘의 북두칠성을 찾아보세요."}],["밤의 카페","The Night Café","1888","yale","The Night Café",{"tip":"밤새 문을 여는 아를의 카페 내부를 강렬한 빨강과 초록으로 그렸습니다. 사람이 스스로를 망치고 미칠 수도 있는 곳을 표현하려 했다고 편지에 남겼습니다."}],["귀에 붕대를 감은 자화상","Self-Portrait with Bandaged Ear","1889","courtauld","Self-Portrait with Bandaged Ear",{"tip":"귀를 자해한 사건 직후 그린 자화상으로, 실제로 다친 것은 왼쪽 귀지만 거울을 보고 그려 오른쪽에 붕대가 보입니다. 뒤 벽에는 일본 판화가 걸려 있습니다."}],["붓꽃 (생레미 정원)","Irises","1889","getty","Irises (painting)",{"tip":"생레미 요양원 정원의 붓꽃밭을 그렸습니다. 이듬해 그린 꽃병 속 아이리스는 메트로폴리탄에 있습니다."}],["꽃 피는 아몬드 나무","Almond Blossoms","1890","vgm","Almond Blossoms",{"tip":"동생 테오의 아들이 태어난 것을 축하하며 그린 그림입니다. 새 생명을 상징하는 아몬드 꽃이 푸른 하늘을 배경으로 피어 있습니다."}],["오베르의 교회","The Church at Auvers","1890","orsay","The Church at Auvers",{"tip":"오베르쉬르우아즈의 교회를 아래에서 올려다보듯 그렸습니다. 일렁이는 건물 윤곽과 짙은 파란 하늘, 두 갈래로 나뉘는 길이 인상적입니다."}],["까마귀가 나는 밀밭","Wheatfield with Crows","1890","vgm","Wheatfield with Crows",{"tip":"폭풍이 몰려오는 듯한 짙푸른 하늘 아래 밀밭 위를 나는 까마귀 떼를 그린 오베르 시절 작품입니다. 밀밭 사이로 갈라져 나가는 세 갈래 길을 눈여겨보세요."}],["탕기 영감의 초상","Portrait of Père Tanguy","1887","rodin","File:Van Gogh - Portrait of Pere Tanguy 1887-8.JPG",{"tip":"배경을 일본 우키요에로 가득 채웠습니다. 조각가 로댕이 사들여 로댕 미술관에 있습니다."}],["노란 집","The Yellow House","1888","vgm","File:Vincent van Gogh - The yellow house ('The street').jpg",{"tip":"고갱과 함께 살며 '남쪽의 화실'을 꿈꾸었던 아를의 집입니다."}],["사이프러스가 있는 밀밭","Wheat Field with Cypresses","1889","met","File:Wheat-Field-with-Cypresses-(1889)-Vincent-van-Gogh-Met.jpg",{"tip":"같은 구도의 다른 버전이 런던 내셔널 갤러리에 있습니다."}],["아이리스 (꽃병의 붓꽃)","Irises","1890","met","File:Vincent van Gogh - Irises (1890).jpg",{"tip":"생레미 요양원을 떠나기 직전에 그린 정물화로, 원래 분홍색이던 배경이 세월이 흐르며 빛이 바래 지금의 흰색에 가깝게 변했습니다."}],["회색 펠트 모자를 쓴 자화상","Self-Portrait with Grey Felt Hat","1887","vgm","File:Vincent van Gogh - Self-portrait with grey felt hat - Google Art Project.jpg",{"tip":"파리 시절 신인상주의 점묘법을 받아들여 짧은 붓질로 그린 자화상입니다."}],["수확","The Harvest","1888","vgm","File:Vincent van Gogh - De oogst - Google Art Project.jpg",{"tip":"고흐 자신이 '다른 모든 것을 압도한다'고 할 만큼 아낀 그림입니다."}],["고갱의 의자","Gauguin's Chair","1888","vgm","File:De stoel van Gauguin - s0048V1962 - Van Gogh Museum.jpg",{"tip":"고갱과 함께 지내던 아를에서, 자신의 소박한 의자(런던 내셔널 갤러리)와 짝을 이루도록 그렸습니다."}],["사이프러스와 별이 있는 길","Road with Cypress and Star","1890","kroller","File:Vincent van Gogh - Road with Cypress and Star - c. 12-15 May 1890.jpg",{"tip":"생레미를 떠나기 직전에 그린 밤 풍경입니다."}],["영원의 문에서 (슬퍼하는 노인)","At Eternity's Gate","1890","kroller","File:Van Gogh
