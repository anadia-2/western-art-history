ylae||1814":"The Spartan king Leonidas and his men before the battle against the Persians; begun around 1799, the work was completed only in 1814.","Jean-Auguste-Dominique Ingres||Oedipus and the Sphinx||1808":"Oedipus answers the Sphinx's riddle. Sent to Paris as a student work from Rome, it was later enlarged and reworked by the artist.","Jean-Auguste-Dominique Ingres||The Apotheosis of Homer||1827":"Homer is crowned by Victory amid an assembly of poets and artists from antiquity to modern times; commissioned as a ceiling for the Louvre.","Jean-Auguste-Dominique Ingres||The Princesse de Broglie||1851–1853":"The princess leans on an upholstered chair in blue satin; the fabrics and jewellery are rendered with remarkable precision.","Francisco Goya||The Dog||1819–1823":"One of the \"Black Paintings\": only a dog's head appears beneath a vast empty expanse. It was painted on a wall of Goya's house and later transferred to canvas.","Francisco Goya||Witches' Sabbath (The Great He-Goat)||1820–1823":"A \"Black Painting\" of witches gathered before the Devil in the form of a goat, their distorted faces evoking a crowd in the grip of superstition.","Francisco Goya||The Parasol||1777":"A cartoon for the Royal Tapestry Factory; note the soft light filtered onto the young woman's face by the green parasol.","Francisco Goya||The Sleep of Reason Produces Monsters||1797–1799":"Plate 43 of \"Los Caprichos\": owls and bats swarm around a man asleep at his desk.","Caspar David Friedrich||The Abbey in the Oakwood||1809–1810":"Monks carry a coffin toward a ruined abbey among bare oaks; it was conceived as the pendant to \"The Monk by the Sea.\"","Caspar David Friedrich||Moonrise over the Sea||1822":"Three figures seated on rocks, seen from behind, watch the moon rise and sailing ships return.","Caspar David Friedrich||Two Men Contemplating the Moon||1825–1830경":"A later version by Friedrich of his 1819 painting in Dresden: two figures beside an uprooted tree gaze at a crescent moon.","Théodore Géricault||The Wounded Cuirassier||1814":"A wounded cavalryman leads his horse from the battlefield; shown at the Salon of 1814, after Napoleon's abdication.","Théodore Géricault||The Plaster Kiln||1822–1823경":"Horses tethered in front of a plaster kiln and its shabby buildings on the outskirts of Paris. A late work that chooses an ordinary everyday scene over a heroic subject.","Théodore Géricault||Race of the Riderless Horses||1817":"A study on the theme of the riderless horse race held during the Roman Carnival. Géricault planned it as a large painting during his stay in Italy but never completed it.","Eugène Delacroix||Orphan Girl at the Cemetery||1824경":"A girl looks upward with tear-filled eyes; it was painted while Delacroix was preparing \"The Massacre at Chios.\"","Eugène Delacroix||Jewish Wedding in Morocco||1837–1841":"A wedding celebration Delacroix witnessed on his 1832 journey to Morocco, painted from his sketches and memory.","Eugène Delacroix||Heliodorus Driven from the Temple||1855–1861":"Opposite \"Jacob Wrestling with the Angel,\" this mural shows Heliodorus, who came to plunder the Temple treasury, struck down by a heavenly horseman.","J. M. W. Turner||Dido building Carthage||1815":"Dido oversees the building of Carthage beneath a rising sun; Turner bequeathed the painting on condition that it hang beside Claude's \"Seaport with the Embarkation of the Queen of Sheba.\"","J. M. W. Turner||Ulysses Deriding Polyphemus||1829":"Ulysses sails away from the blinded Cyclops Polyphemus in a blaze of fiery dawn light.","J. M. W. Turner||Peace – Burial at Sea||1842":"A tribute to the painter David Wilkie, who died on his voyage home and was buried at sea off Gibraltar; the blackened sails signal mourning.","J. M. W. Turner||Light and Colour (Goethe's Theory)||1843":"Inspired by Goethe's colour theory, a vortex of warm hues depicts the morning after the Deluge; its pendant is the cool-toned \"Shade and Darkness.\"","John Constable||The Cornfield||1826":"A boy drinks from a stream as a flock passes along a country lane; after Constable's death, a group of admirers bought it for the National Gallery.","John Constable||Salisbury Cathedral from the Meadows||1831":"A rainbow arcs over the cathedral as a storm passes, often read as reflecting Constable's state of mind after his wife's death.","John Constable||The White Horse||1819":"A barge ferrying a white horse on the River Stour, the first of his large \"six-footers\"; it helped win his election as an Associate of the Royal Academy.","John Everett Millais||Isabella||1848–1849":"Based on Keats's poem, it shows Lorenzo and Isabella among her jealous brothers; it was Millais's first exhibited Pre-Raphaelite work.","John Everett Millais||Autumn Leaves||1855–1856":"Four girls heap fallen leaves at dusk; Ruskin called it \"the first instance of a perfectly painted twilight.\"","John Everett Millais||The Boyhood of Raleigh||1870":"On the Devon shore, the young Walter Raleigh and his brother listen to a sailor who points out to sea.","Dante Gabriel Rossetti||The Girlhood of Mary Virgin||1848–1849":"The young Virgin at her embroidery, Rossetti's first completed oil; his mother and his sister Christina posed for the figures.","Dante Gabriel Rossetti||Bocca Baciata||1859":"Modelled by Fanny Cornforth, this was Rossetti's first single half-length female figure, a format that became his trademark.","Dante Gabriel Rossetti||Astarte Syriaca||1877":"Jane Morris poses as Astarte, goddess of love, in this large canvas; Rossetti's own sonnet is inscribed on the frame.","William Holman Hunt||The Lady of Shalott||1888–1905":"The Lady of Shalott is caught in the threads of her loom as the curse falls; with failing eyesight, Hunt completed it with an assistant's help.","William Holman Hunt||The Shadow of Death||1870–1873":"As the young Christ stretches in the carpenter's workshop, his shadow falls on the wall in the shape of a crucifixion; painted in the Holy Land.","William Holman Hunt||The Finding of the Saviour in the Temple||1854–1860":"Mary and Joseph find the boy Jesus among the elders in the Temple; for authenticity, Hunt worked in Jerusalem with local models.","Frederic Leighton||Cimabue's Celebrated Madonna||1853–1855":"Florentines carry Cimabue's Madonna in procession through the streets; Queen Victoria bought it at the Royal Academy in 1855. It is on loan to the National Gallery, London.","Frederic Leighton||Perseus and Andromeda||1891":"Riding Pegasus, Perseus takes aim at the dragon guarding Andromeda, who is chained to a rock.","Frederic Leighton||The Painter's Honeymoon||1864경":"A young painter and his bride sit close together studying a drawing, painted by Leighton, who never married.","John William Waterhouse||Saint Eulalia||1885":"Snow falls and doves gather over the body of the young martyr; note the bold foreshortening of the figure lying on the ground.","John William Waterhouse||Consulting the Oracle||1884":"In a lamp-lit chamber a priestess listens to the oracle while women seated in a semicircle await its words.","John William Waterhouse||La Belle Dame sans Merci||1893":"Based on Keats's poem, the enchantress draws the knight toward her by winding her hair around his neck.","Gustave Courbet||L'Origine du monde||1866":"Commissioned by the Ottoman diplomat Khalil Bey, the painting was later owned by the psychoanalyst Jacques Lacan and entered the Musée d'Orsay in 1995.","Gustave Courbet||The Bathers||1853":"Its frankly realistic, fleshy nude caused a scandal at the Salon; the patron Alfred Bruyas bought it.","Gustave Courbet||Young Ladies of the Village||1851–1852":"Three young women offer food to a cowherd girl in a valley near Ornans; Courbet's three sisters posed for them.","Gustave Courbet||The Wounded Man||1844–1854":"A self-portrait as a wounded man slumped against a tree; X-rays revealed that it was painted over an earlier image of the artist with a lover.","Jean-François Millet||The Church at Gréville||1871–1874":"A late view of the church at Gréville, the Normandy village where Millet was born, depicting the simple stone church and his native landscape in calm tones.","Jean-François Millet||Shepherdess with Her Flock||1863경":"A young shepherdess knits as she watches her flock on the plain; the painting was a great success at the Salon of 1864.","Jean-François Millet||Noonday Rest||1866":"A pastel of two harvesters napping in the shade of a haystack; van Gogh based his \"Noon: Rest from Work\" on this composition.","Jean-François Millet||Starry Night||1850–1865경":"A rare nocturne of shooting stars over a darkened field, reworked by Millet over many years.","Honoré Daumier||The Uprising||1848 이후":"A crowd surges through the street behind a man with his arm raised; rough, rapid brushwork conveys its agitated energy.","Honoré Daumier||Crispin and Scapin||1864경":"Two scheming servants from the comic stage whisper together, lit by strong stage-like contrasts of light and shadow.","Honoré Daumier||Gargantua||1831":"A lithograph caricaturing King Louis-Philippe as a giant devouring the people's taxes; it earned Daumier six months in prison.","Jean-Baptiste-Camille Corot||Lady in Blue||1874":"A woman leaning on her elbow, her blue dress dominating the canvas; one of the finest of Corot's late figure paintings.","Jean-Baptiste-Camille Corot||The Bridge at Narni||1826":"An oil sketch made on the spot during his Italian journey, capturing the ruined Roman bridge with bright light and quick brushwork.","Jean-Baptiste-Camille Corot||Hagar in the Wilderness||1835":"An angel flies to Hagar as her son Ishmael lies dying in the wilderness; the painting was shown at the Salon of 1835.","Rosa Bonheur||Haymaking in the Auvergne||1855":"A monumental scene of peasants mowing and loading hay onto an ox cart beneath a broad sky; the working oxen are rendered with particular vividness. It belongs to the Musée d'Orsay and is on long-term loan to the Château de Fontainebleau.","Rosa Bonheur||Portrait of William F. Cody||1889":"Painted at Bonheur's estate near Fontainebleau when Buffalo Bill's Wild West show came to Paris; Cody used the portrait on his show posters.","Rosa Bonheur||Barbaro after the Hunt||1858경":"A hound at rest after the hunt, showing Bonheur's close observation of animal coat and anatomy.","Édouard Manet||Nana||1877":"A woman in her underclothes at her toilette, watched by a seated gentleman in evening dress. Rejected by the 1877 Salon, it drew crowds in a shop window on the Boulevard des Capucines.","Édouard Manet||The Old Musician||1862":"Children and drifters gather around an elderly street violinist. One of Manet's largest canvases, it reuses the figure from \"The Absinthe Drinker\" at the right.","Édouard Manet||Lola de Valence||1862":"Full-length portrait of Lola Melea, a dancer with a Spanish troupe performing in Paris. Baudelaire wrote a quatrain dedicated to the painting.","Édouard Manet||Le Bon Bock||1873":"The engraver Émile Bellot with his pipe and a glass of beer. Showing the influence of Frans Hals, it was a popular success at the 1873 Salon.","Claude Monet||The Magpie||1868–1869":"A lone magpie perches on a wooden gate in a snowy landscape. The shadows on the snow are rendered in blues and violets; the 1869 Salon rejected it.","Claude Monet||Le Déjeuner sur l'herbe||1865–1866":"Surviving parts of a huge picnic scene in the forest. After it was damaged by damp while left as security for rent, Monet cut it up; only two fragments remain.","Claude Monet||Camille Monet on Her Deathbed||1879":"Monet's first wife, Camille, on the day of her death in 1879. He later recalled finding himself observing the changing colours of her face even then.","Claude Monet||The Thames below Westminster||1871경":"Painted while Monet was in London to escape the Franco-Prussian War, it shows the Houses of Parliament in haze and a jetty under construction on the river.","Pierre-Auguste Renoir||Two Sisters (On the Terrace)||1881":"A young woman and a little girl on the terrace of the Maison Fournaise at Chatou, the same setting as \"Luncheon of the Boating Party\".","Pierre-Auguste Renoir||A Girl with a Watering Can||1876":"A small girl holding a watering can on a garden path. Short, feathery strokes blend her lace-trimmed dress with the surrounding flowers.","Pierre-Auguste Renoir||Acrobats at the Cirque Fernando||1879":"Two young sisters, acrobats at the Cirque Fernando in Montmartre, gather oranges tossed to them by the audience after their act.","Pierre-Auguste Renoir||The Bathers||1918–1919":"A late masterpiece of two nudes reclining by a river, completed despite crippling rheumatism. Renoir's three sons gave it to the French state.","Edgar Degas||Miss La La at the Cirque Fernando||1879":"The acrobat Miss La La hangs by a rope gripped in her teeth as she is hoisted to the circus roof, seen from far below.","Edgar Degas||Young Spartans Exercising||1860경":"An early history painting of Spartan girls challenging boys to a contest. Degas kept it in his studio for the rest of his life.","Edgar Degas||Interior||1868–1869":"In a lamplit room a man stands by the door while a woman sits with her back to him beside an open sewing box. Also known as \"The Rape\", its meaning is still debated.","Edgar Degas||After the Bath, Woman Drying Herself||1890–1895경":"A pastel of a woman, seen from behind, leaning forward as she dries her neck with a towel. The twisting spine is typical of Degas's late bather series.","Frédéric Bazille||The Improvised Field Hospital||1865":"Bazille's friend Monet lies in bed with an injured leg. Bazille, a former medical student, rigged a device to drip water onto the wound.","Frédéric Bazille||View of the Village||1868":"A girl in a pink striped dress sits under a tree above the village of Castelnau near Montpellier. It was accepted at the 1869 Salon.","Frédéric Bazille||La Toilette||1870":"Two attendants help a woman at her toilette. The composition recalls Delacroix's Orientalist scenes and Manet's \"Olympia\".","Camille Pissarro||The Avenue, Sydenham||1871":"Painted in south London, where Pissarro took refuge during the Franco-Prussian War: strollers on a tree-lined avenue with a church beyond.","Camille Pissarro||Côte des Bœufs at L'Hermitage||1877":"Village houses on a hillside near Pontoise glimpsed through a screen of tall bare trees, worked in dense, layered brushstrokes.","Camille Pissarro||Jalais Hill, Pontoise||1867":"A road, houses and fields on the Jalais Hill near Pontoise. Shown at the 1868 Salon, it was praised by Zola.","Alfred Sisley||Early Snow at Louveciennes||1870–1871":"A village lane, walls and trees under the first snow, in quiet greys. A winter view of Louveciennes, where Sisley lived.","Alfred Sisley||Molesey Weir, Hampton Court||1874":"Painted during Sisley's 1874 stay in England: the weir on the Thames near Hampton Court, with rushing water under a broad sky.","Alfred Sisley||The Seine at Port-Marly, Piles of Sand||1875":"Piles of sand and unloading work on the banks of the Seine, a working riverside scene in calm tones.","Berthe Morisot||The Mother and Sister of the Artist||1869–1870":"The artist's mother, in black, reads beside her pregnant sister Edma in white. Manet famously retouched it just before it went to the Salon, to Morisot's dismay.","Berthe Morisot||In the Dining Room||1886":"A maid stands by a dining-room cupboard with a small dog at her feet. The quick, free brushwork is characteristic of Morisot.","Berthe Morisot||The Butterfly Hunt||1874":"Morisot's sister Edma and her children hunt butterflies in the shade of trees, in light-filled, airy brushwork.","Berthe Morisot||Julie Manet and Her Greyhound Laërte||1893":"Morisot's daughter Julie seated with her greyhound Laërte, painted the year after the death of Morisot's husband, Eugène Manet.","Gustave Caillebotte||Boating Party||1877–1878":"A man in a top hat and suit rows a small boat, seen from inside the boat. France acquired it for the Musée d'Orsay in 2023 with funding from LVMH.","Gustave Caillebotte||Skiffs||1877":"Men paddle narrow single-seat skiffs on the Yerres River, near the Caillebotte family's country estate.","Gustave Caillebotte||Fruit Displayed on a Stand||1881–1882경":"A still life of fruit on a market stall, seen from a bold overhead viewpoint.","Gustave Caillebotte||Sailing Boats at Argenteuil||1888":"A wooden landing stage and sailing boats on the Seine at Argenteuil, reflecting Caillebotte's passion for yacht racing and boat design.","Mary Cassatt||Lady at the Tea Table||1883–1885":"Mrs. Robert Moore Riddle, a cousin of Cassatt's mother, sits behind a blue-and-white tea service. Her family disliked the portrait, and Cassatt kept it for decades.","Mary Cassatt||Children Playing on the Beach||1884":"Two small children play with a pail and shovel on the sand, seen from close above.","Mary Cassatt||Girl Arranging Her Hair||1886":"A girl in a nightgown braids her hair. Degas acquired the painting and kept it for the rest of his life.","Mary Cassatt||Mother and Child (The Oval Mirror)||1899경":"A mother holds her child before an oval mirror that frames the boy's head like a halo. Its echo of Renaissance Madonnas led its owners, the Havemeyers, to call it \"The Florentine Madonna\".","Georges Seurat||Circus Sideshow||1887–1888":"A nighttime sideshow staged outside a circus tent to lure customers. Rendered in dots under gaslight, the dusky scene takes on a mysterious stillness.","Georges Seurat||The Channel at Gravelines, Evening||1890":"Painted on the northern French coast during Seurat's last summer. Even the dotted painted border is calibrated to harmonize with the colors of the scene.","Georges Seurat||Port-en-Bessin, Entrance to the Harbor||1888":"A view down onto the entrance of a small Normandy fishing harbor. Cloud shadows drifting across the water add rhythm to the calm composition.","Paul Signac||Notre-Dame-de-la-Garde (La Bonne-Mère), Marseilles||1905–1906":"The hilltop basilica overlooking the port of Marseille. Typical of Signac's later style, the dots have grown into broad, mosaic-like strokes of intense color.","Paul Signac||The Jetty at Cassis, Opus 198||1889":"The jetty and calm sea at the Mediterranean fishing town of Cassis. The opus number in the title reflects Signac's habit of numbering works like musical compositions.","Paul Signac||Les Andelys, the Riverbank||1886":"Painted during a summer in a Normandy village on the Seine, this is one of Signac's first works fully in the pointillist technique.","Paul Signac||Port of Saint-Cast||1890":"A small harbor on the northern Brittany coast, where even dots of color calmly weave together water, sky and shoreline light.","Henri-Edmond Cross||Beach at Cabasson (Baigne-Cul)||1891–1892":"A beach on the Var coast in southern France, where Cross settled. Dense dots capture the bright Mediterranean light and still water.","Henri-Edmond Cross||Afternoon at Pardigon||1907":"A sunlit view of Pardigon on the Mediterranean coast of southern France, near where Cross lived. The larger, block-like strokes and vivid color are characteristic of his later work.","Henri-Edmond Cross||Cypresses at Cagnes||1908":"Cypress trees and hills at Cagnes in southern France. Overlapping blocks of strong color give the whole surface a decorative rhythm.","Paul Cézanne||Woman with a Coffeepot||1895경":"A woman in blue sits upright beside a coffeepot and cup. Figure and objects alike are built up from solid, cylinder-like forms and planes.","Paul Cézanne||Still Life with Plaster Cupid||1894경":"A plaster cupid, fruit and canvases propped in the studio. The tilting floor shows how Cézanne combined several viewpoints in one picture.","Paul Cézanne||Lake Annecy||1896":"Painted while on holiday at Lake Annecy in the French Alps. Deep blue brushstrokes bind lake, mountains and trees into a single structure.","Vincent van Gogh||Van Gogh's Chair||1888":"His simple wooden chair in Arles, with a pipe and tobacco on the seat. It forms a pair with \"Gauguin's Chair,\" painted at the same time.","Vincent van Gogh||Portrait of Dr. Gachet||1890":"Dr. Gachet, who looked after Van Gogh in Auvers-sur-Oise. Van Gogh painted two versions; this second one was donated by the Gachet family.","Vincent van Gogh||Skull of a Skeleton with Burning Cigarette||1886":"Painted during his time at the Antwerp academy, a skull clenches a lit cigarette. It is usually read as a joke at the expense of academic anatomy lessons.","Vincent van Gogh||Self-Portrait||1889":"Painted at the asylum in Saint-Rémy, the background and clothing merge in the same swirling blue brushwork. The intense gaze is unforgettable.","Paul Gauguin||Self-Portrait with Halo and Snake||1889":"Painted on a cupboard door in an inn at Le Pouldu, Brittany. A halo and a snake between his fingers cast him as both saint and tempter.","Paul Gauguin||Mahana no atua (Day of the God)||1894":"Painted in Paris from memory after his first stay in Tahiti. Figures performing a ritual beneath an idol contrast with the water, laid in like abstract patterns.","Paul Gauguin||Fatata te Miti (By the Sea)||1892":"Tahitian women plunging into the sea. Flat areas of intense color typify Gauguin's first stay in Tahiti.","Paul Gauguin||La Belle Angèle||1889":"Angèle Satre, a woman of Pont-Aven, framed in a circle beside a primitive idol. The sitter reportedly disliked the portrait and refused to accept it.","Henri de Toulouse-Lautrec||Equestrienne (At the Cirque Fernando)||1887–1888":"A bareback act at the Cirque Fernando in Montmartre. The sweeping diagonal ring and cropped figures show the influence of Japanese prints.","Henri de Toulouse-Lautrec||Jane Avril Dancing||1892경":"The Moulin Rouge dancer Jane Avril performing alone. Thinned oil paint on cardboard leaves the quick, light brushwork visible.","Henri de Toulouse-Lautrec||The Clownesse Cha-U-Kao||1895":"The female clown Cha-U-Kao, a Moulin Rouge performer, adjusting her yellow ruff. The offstage moment is observed with cool detachment.","Henri de Toulouse-Lautrec||Portrait of Vincent van Gogh||1887":"A pastel of his friend Van Gogh in profile at a café table during their Paris years, drawn in short strokes that echo Van Gogh's own manner.","George Frederic Watts||The Minotaur||1885":"The half-bull monster gazes out to sea while crushing a small bird in his hand. Watts painted it in anger at newspaper exposés of child prostitution in London.","George Frederic Watts||Mammon||1884–1885":"The god of greed, wearing a crown with ass's ears, sits on a skull-decorated throne, pressing down a woman's head with his hand and a prostrate man with his foot.","George Frederic Watts||Choosing||1864":"The young Ellen Terry, later a celebrated actress, chooses between showy camellias and humble violets. She was briefly married to Watts at the time.","Gustave Moreau||Hercules and the Lernaean Hydra||1875–1876":"Hercules confronts the many-headed serpent Hydra. The bodies of its victims strewn across a dark rocky ravine heighten the tension.","Gustave Moreau||Galatea||1880경":"The one-eyed giant Polyphemus secretly watches the sea nymph Galatea in her grotto. Jewel-like marine plants fill the picture.","Gustave Moreau||The Unicorns||1885경":"Richly dressed women linger with unicorns in a dreamlike setting. Its intricate ornamental line stands out in the painter's former house, now his museum.","Gustav Klimt||The Three Ages of Woman||1905":"An infant, a young mother and an old woman together express the cycle of life. Decorative gold patterning contrasts with the realistic bodies.","Gustav Klimt||Portrait of Emilie Flöge||1902":"Emilie Flöge, fashion designer and Klimt's lifelong companion. A long dress covered in blue patterns envelops her whole figure.","Gustav Klimt||Mäda Primavesi||1912–1913":"The nine-year-old daughter of a patron family stands confidently before a flowered backdrop, showing the bright palette of Klimt's late portraits.","Gustav Klimt||Adam and Eve||1917–1918":"A pale Eve stands on a ground strewn with flowers, with Adam seemingly asleep behind her. Klimt's death left it unfinished.","Henri Matisse||The Snail||1953":"Cut and painted paper shapes spiral to suggest a snail's shell. A key late work, made by the infirm Matisse with the help of assistants.","Henri Matisse||The Swimming Pool||1952":"Cut-paper swimmers once ran around the walls of the dining room in Matisse's Nice apartment. It is installed so viewers are surrounded by it.","Henri Matisse||Blue Nude II||1952":"Paper painted blue is cut to form a seated female nude. Simple shapes alone convey the body's volume and movement.","Henri Matisse||Large Red Interior||1948":"A room flooded with red holds two tables and two pictures on the wall. It is among the last major oil paintings Matisse made.","André Derain||The Pool of London||1906":"The busy docks of the Thames painted in bold, unmixed color. It belongs to a series made after the dealer Vollard sent Derain to London.","André Derain||The Turning Road, L'Estaque||1906":"A country road, trees and figures at L'Estaque near Marseille, built from intense planes of color. It is among Derain's largest Fauve canvases.","Raoul Dufy||Regatta at Cowes||1934":"A regatta at Cowes on the Isle of Wight. Outlines and patches of color deliberately fall out of register in Dufy's light-hearted manner.","Raoul Dufy||Open Window, Nice||1928":"A view from a Nice interior through an open window to the sea and shore. Blue tones unite the room with the landscape outside.","Raoul Dufy||The Artist's Studio||1935":"Dufy's studio on the Impasse Guelma in Paris, which he kept from 1911 until his death. Pictures on the walls and furniture are sketched with a light touch.","Henri Rousseau||The Equatorial Jungle||1909":"Animals hide among dense tropical foliage. Rousseau never left France; he imagined his jungles from visits to the Paris botanical garden.","Henri Rousseau||Fight Between a Tiger and a Buffalo||1908":"A tiger attacks a buffalo in the heart of a lush jungle. The drama contrasts with the meticulous, still rendering of countless leaves.","Henri Rousseau||The Repast of the Lion||1907경":"A lion devours its prey in the jungle. Oversized flowers and leaves repeat decoratively, creating a naive yet dreamlike atmosphere.","Henri Rousseau||The Merry Jesters||1906":"Monkeys in a tropical forest play with a milk bottle and a back scratcher. Their human-like antics give the scene a comic note.","Edvard Munch||Puberty||1894–1895":"A naked girl sits on the edge of a bed; the large dark shadow looming behind her heightens the sense of unease.","Edvard Munch||Self-Portrait with Cigarette||1895":"The artist gazes out from the darkness, wreathed in cigarette smoke; light from below makes his face and hand emerge like an apparition.","Edvard Munch||Vampire||1895":"A red-haired woman buries her face in a man's neck. Munch originally titled it \"Love and Pain\"; the name \"Vampire\" came from a critic.","Edvard Munch||Starry Night||1893":"A night view of Åsgårdstrand, the seaside village where Munch spent his summers; the deep blue sky and starlight reflected in the water create a calm yet chilly mood.","Ernst Ludwig Kirchner||Self-Portrait with Model||1910":"The painter, in a striped robe and holding a brush, stands before his model in intense primary colours. Kirchner reworked the canvas in 1926.","Ernst Ludwig Kirchner||Bathers at Moritzburg||1909":"Artists and models relax by the lakes at Moritzburg near Dresden, embodying the free life the Brücke group sought. Kirchner reworked it in 1926.","Ernst Ludwig Kirchner||Fränzi in Front of Carved Chair||1910":"Fränzi, a young girl who modelled for the Brücke artists, is painted with a green-tinged face and vivid colour, a carved studio chair behind her.","Franz Marc||The Tiger||1912":"A tiger crouches among rocks, built from angular, Cubist-inspired planes of vivid yellow; at rest, yet poised to spring.","Franz Marc||Stables||1913":"Horses in their stables are broken into geometric planes of red, blue and yellow, from the period when Marc was moving toward abstraction.","Franz Marc||The Bewitched Mill||1913":"A mill and its rushing water in the forest are rendered in curving forms and bright colour, with rhythmic planes that show Delaunay's influence.","Egon Schiele||Cardinal and Nun (Caress)||1912":"A provocative image of a cardinal and a nun in an embrace, widely seen as a response to Klimt's \"The Kiss\".","Egon Schiele||Seated Male Nude (Self-Portrait)||1910":"A large nude self-portrait of the artist's gaunt body in reddish and yellow tones; cut off at the feet, the figure seems to float in empty space.","Egon Schiele||Hermits||1912":"Two figures in black robes stand close together; the front figure is read as Schiele himself and the one behind as Klimt.","Egon Schiele||Portrait of Eduard Kosmack||1910":"The publisher Eduard Kosmack sits rigidly and stares straight ahead; his intense gaze and tense hands reveal his inner state.","Oskar Kokoschka||Still Life with Lamb and Hyacinth||1910":"A dark-toned still life of a slaughtered lamb and a potted hyacinth, setting death against life.","Oskar Kokoschka||The Tigon||1926":"A tiger-lion hybrid Kokoschka saw at London Zoo, captured with vigorous brushwork as it lunges forward.","Oskar Kokoschka||Portrait of Auguste Forel||1910":"A portrait of the Swiss psychiatrist and ant researcher Auguste Forel, seeking to capture the elderly scholar's inner life in his bent hands and deep-set eyes.","Pablo Picasso||Family of Saltimbanques||1905":"A key work of the Rose Period showing a family of itinerant performers in a barren landscape; no one meets another's gaze, lending a sense of isolation.","Pablo Picasso||Massacre in Korea||1951":"Painted during the Korean War, it shows armed soldiers aiming at naked women and children, echoing the composition of Goya's \"The Third of May 1808\".","Pablo Picasso||Portrait of Dora Maar||1937":"Picasso's companion, the photographer Dora Maar, is shown with frontal and profile views merged in one face. That same year she photographed the making of \"Guernica\".","Pablo Picasso||Portrait of Daniel-Henry Kahnweiler||1910":"An Analytic Cubist portrait of Kahnweiler, the dealer who championed Cubism; clues such as his hair and clasped hands emerge from the fractured planes.","Georges Braque||Violin and Palette||1909":"The violin and sheet music are broken into small facets, yet the nail at the top is painted realistically, shadow and all, contrasting illusion with fragmentation.","Georges Braque||Large Nude||1907–1908":"Painted after Braque saw Picasso's \"Les Demoiselles d'Avignon\"; its angular body and heavy contours mark a starting point on the road to Cubism.","Georges Braque||Man with a Guitar||1911–1912":"An Analytic Cubist work dissolving a man with a guitar into small brown and grey facets; it rewards slow looking for clues to the forms.","Georges Braque||The Birds (ceiling)||1953":"Painted for the ceiling of the Salle Henri II in the Louvre, it shows two black birds in simplified form flying across a blue ground.","Juan Gris||Portrait of Josette||1916":"Gris's companion Josette is simplified into geometric planes, in a portrait marked by sober colour and firm structure.","Juan Gris||Still Life before an Open Window, Place Ravignan||1915":"A still life on a table merges with the view of Place Ravignan in Montmartre outside the window, linked by a pervasive blue.","Juan Gris||The Man in the Café||1912":"A gentleman seated in a café, divided into angular planes; one of Gris's major early Cubist paintings.","Fernand Léger||The Card Players||1917":"Léger, who served in the First World War, depicts soldiers at the front as metallic, machine-like cylinders; the war shaped his mechanical style.","Fernand Léger||Leisure – Homage to Louis David||1948–1949":"A working-class family enjoys a day off with their bicycles; one figure holds a sheet inscribed \"Homage to Louis David\".","Robert Delaunay||Simultaneous Contrasts: Sun and Moon||1913":"Sun and moon become concentric discs of colour, conveying light and movement through colour contrast alone.","Robert Delaunay||The Cardiff Team||1912–1913":"Rugby players leap before the Eiffel Tower, a Ferris wheel, a biplane and billboards, capturing the energy of the modern city.","Robert Delaunay||Saint-Séverin No. 3||1909–1910":"The Gothic ambulatory of Saint-Séverin in Paris, its columns bending and tilting; part of a series exploring how light seems to make forms waver.","Umberto Boccioni||Dynamism of a Soccer Player||1913":"The movement of a player kicking a ball is broken into swirling colours and forms to express speed and energy.","Umberto Boccioni||Elasticity||1912":"A galloping horse and rider merge with factories and pylons behind them, as if their motion were spreading into space.","Umberto Boccioni||Dynamism of a Human Body||1913":"A running figure is broken into muscular masses and planes of colour, expressing the force of a body cutting through space.","Giacomo Balla||Swifts: Paths of Movement + Dynamic Sequences||1913":"The flight paths of swifts outside a window are layered as repeating curves, capturing a sequence of motion in a single image.","Giacomo Balla||Speeding Automobile||1912":"The wheels and body of a moving car are rendered as overlapping lines and repeated forms, making speed visible.","Giacomo Balla||Abstract Speed – The Car Has Passed||1913":"The disturbance left in the landscape after a car has passed, expressed in abstract lines and colour. It was originally one panel of a triptych.","Hilma af Klint||The Ten Largest, No. 1, Childhood||1907":"The first of a series of paintings over three metres tall on the stages of human life; petal and spiral forms float on a blue ground.","Hilma af Klint||The Ten Largest, No. 4, Youth||1907":"Devoted to youth, it fills the canvas with blossoming flowers, spirals and letter-like signs.","Hilma af Klint||The Ten Largest, No. 9, Old Age||1907":"Devoted to old age, it arranges circles and geometric forms calmly across the canvas.","Hilma af Klint||The Swan, No. 1||1915":"A black swan and a white swan face each other, symbolizing opposites such as light and dark, and their union.","Wassily Kandinsky||Impression III (Concert)||1911":"Painted just after a Schoenberg concert; a large field of yellow evokes the resounding music and a black shape suggests the piano.","Wassily Kandinsky||Composition X||1939":"Bright forms seem to float on a black ground in the last painting of the \"Composition\" series.","Wassily Kandinsky||Circles in a Circle||1923":"From the Bauhaus years: circles of various sizes and intersecting bands set within a large black ring.","Wassily Kandinsky||On White II||1923":"Sharp lines and geometric forms intersect on a white ground, showing the refined abstraction of Kandinsky's Bauhaus period.","Kazimir Malevich||Running Man||1930–1933경":"A late work showing a peasant running across an empty landscape marked by a sword and a cross, as if fleeing.","Kazimir Malevich||The Woodcutter||1912":"From Malevich's Cubo-Futurist period: a woodcutter with his axe and stacked logs rendered as gleaming, metallic cylinders.","Kazimir Malevich||Taking in the Rye||1912":"Peasants bringing in the rye harvest are simplified into cylindrical, metallic forms in strong colour.","Kazimir Malevich||Suprematist Composition with Eight Red Rectangles||1915":"Eight red rectangles float diagonally on a white ground, an early Suprematist work seeking a space free of gravity.","Piet Mondrian||The Flowering Apple Tree||1912":"The branches of an apple tree are reduced to a rhythm of curves, showing the tree series on its way to abstraction.","Piet Mondrian||New York City I||1941":"An unfinished work made with coloured tape; in 2022 it drew attention when a curator suggested it had hung upside down for decades.","Paul Klee||Fish Magic||1925":"Fish, flowers, a clock and figures float against a dark ground in a dreamlike scene; a piece of fabric is attached at the centre of the canvas.","Paul Klee||Cat and Bird||1928":"A cat's face fills the picture, with a small bird on its forehead, as if showing what is on the cat's mind.","Paul Klee||Revolution of the Viaduct||1937":"The arches of a viaduct break ranks and march forward, often read as resistance to Nazi conformity.","Paul Klee||Insula Dulcamara||1938":"A large late work in which thick black lines and bright colour fields suggest an island, a face and a boat.","Suzanne Valadon||Reclining Nude||1928":"A woman reclining on a sofa is drawn with bold contours; unlike the idealized nudes of male painters, the body is shown unadorned.","Suzanne Valadon||Nude with Striped Blanket||1922":"A woman lies on a striped blanket, painted with bold outlines and lively patterns in Valadon's characteristically daring colour.","Suzanne Valadon||Family Portrait||1912":"Valadon portrays herself with her mother, her son Utrillo and her partner André Utter; she stands at the centre with a hand on her chest.","Maurice Utrillo||Rue du Mont-Cenis||1914":"A view of the Rue du Mont-Cenis climbing the hill of Montmartre, one of the Montmartre street scenes Utrillo painted throughout his life.","Maurice Utrillo||Church of Saint-Pierre||1914":"Saint-Pierre de Montmartre, painted in pale walls and muted tones typical of Utrillo's so-called 'White Period'.","Maurice Utrillo||The House of Berlioz||1914":"The Montmartre house where the composer Berlioz once lived; Utrillo returned again and again to the streets and buildings of Montmartre.","Marie Laurencin||Spanish Dancers||1920–1921":"Reflecting Laurencin's years in Spain during the First World War, it shows women dancing dreamily in soft tones.","Marie Laurencin||Portrait of Madame Paul Guillaume||1928경":"Domenica, wife of the dealer Paul Guillaume, painted in soft pastel tones; the couple's collection forms the basis of the museum's holdings.","Marie Laurencin||Women with Dog||1923":"Women and a dog in soft greys and pinks, showing Laurencin's characteristic elegance.","Amedeo Modigliani||Nude on a Blue Cushion||1917":"A woman reclines on a blue cushion, her skin in warm apricot tones. When his nudes were shown in his 1917 solo exhibition, the police intervened over alleged indecency.","Amedeo Modigliani||Female Nude||1916경":"A nude with tilted head and closed eyes; the elongated neck and simplified face show Modigliani's distinctive style.","Marc Chagall||Double Portrait with Wine Glass||1917–1918":"Chagall, glass raised, sits on the shoulders of his wife Bella; an angel hovers above and his hometown of Vitebsk lies below.","Marc Chagall||To Russia, Asses and Others||1911":"A dreamlike scene: a red cow on a rooftop suckles its young while a milkmaid, her head detached from her body, floats in the sky.","Marc Chagall||Calvary||1912":"A childlike Christ on the cross is painted in bright, Cubist-inspired planes of colour, with mourning figures below.","Marc Chagall||The Juggler||1943":"A bird-headed performer displays his skills in the circus ring, a theme Chagall returned to throughout his life.","Chaïm Soutine||Portrait of Madeleine Castaing||1929경":"Madeleine Castaing, Soutine's patron and later a celebrated interior designer, sits dressed in black.","Chaïm Soutine||The Bellboy (Le Groom)||1925":"A hotel bellboy in a red uniform, painted with distorted forms and intense colour; Soutine often depicted hotel and restaurant staff.","Chaïm Soutine||Return from School after the Storm||1939경":"A late landscape of two children walking home beneath wind-bent trees after a storm.","Marcel Duchamp||Étant donnés||1946–1966":"An installation seen only through two peepholes in an old wooden door. Made in secret over two decades, it was unveiled in 1969, after the artist's death.","Marcel Duchamp||Sad Young Man on a Train||1911":"A young man in a train is rendered in overlapping contours that convey motion and swaying. Known as a self-portrait, it anticipates the experiments of \"Nude Descending a Staircase.\"","Marcel Duchamp||The King and Queen Surrounded by Swift Nudes||1912":"The chess king and queen appear as mechanical forms, crossed by the blur of swiftly moving nudes. It reflects the artist's lifelong passion for chess.","Francis Picabia||L'Œil cacodylate (The Cacodylic Eye)||1921":"Painted while the artist was being treated with cacodylate for an eye ailment; a single large eye is surrounded by signatures and phrases added by friends and visitors.","Francis Picabia||I See Again in Memory My Dear Udnie||1914":"A large abstraction that recasts the memory of a dancer seen on the voyage to New York in curving, machine-like forms. It grows from the same memory as \"Udnie\" in the Centre Pompidou.","Francis Picabia||Edtaonisl (Ecclesiastic)||1913":"A priest and a dancer seen aboard a transatlantic liner are broken into small facets of color. The title is a coinage made by interleaving the letters of two words.","Giorgio de Chirico||The Uncertainty of the Poet||1913":"A classical torso and a bunch of bananas sit side by side before an empty arcade. A distant passing train adds to the strange, uneasy mood.","Giorgio de Chirico||The Nostalgia of the Infinite||1912–1913경":"A tall tower with fluttering flags, long shadows and two tiny figures create a square that is both silent and unsettling.","Giorgio de Chirico||The Red Tower||1913":"A metaphysical scene in which a red cylindrical tower rises beyond an arcaded square. Raking light and long shadows suggest time standing still.","Max Ernst||Ubu Imperator||1923":"Alfred Jarry's tyrant Ubu becomes a tilted, top-like red form. The work is read as a satire on the precariousness of power.","Max Ernst||Forest and Dove||1927":"The dense forest texture was made by grattage, scraping paint across the canvas. A small bird, one of the artist's favorite motifs, seems trapped among the trees.","Max Ernst||The Antipope||1941–1942":"A fantastical scene of horse-headed figures gathered by the water. Painted while the artist lived with Peggy Guggenheim, its figures are often linked to people around him.","Joan Miró||The Birth of the World||1925":"Paint was poured and rubbed onto an unevenly primed canvas to create chance stains, then a few lines and shapes were added. The artist called it \"a sort of genesis.\"","Joan Miró||Still Life with Old Shoe||1937":"Ordinary objects such as a shoe, an apple pierced by a fork, a bottle and a heel of bread glow in harsh, ominous colors. Painted during the Spanish Civil War, it carries the anguish of the conflict.","Joan Miró||Women and Bird in the Moonlight||1949":"Women, a bird, the moon and stars are drawn in black outlines and flat primary colors. The artist's lifelong motifs of woman, bird and star combine in a lively rhythm.","René Magritte||The Menaced Assassin||1927":"A murderer listens to a gramophone beside his victim while two men lie in wait by the door. The scene draws on crime fiction and films of the day.","René Magritte||The Listening Room||1952":"A giant green apple fills an entire room. It shows the artist's signature device of making familiar things strange by changing their scale.","René Magritte||Personal Values||1952":"Everyday items such as a comb, soap, a glass and a shaving brush dwarf the bedroom furniture. The walls are painted as cloudy sky, blurring inside and outside.","Salvador Dalí||Crucifixion (Corpus Hypercubus)||1954":"Christ floats before a cross formed from the unfolded net of a four-dimensional hypercube, watched from below by the artist's wife, Gala.","Salvador Dalí||The Great Masturbator||1929":"A distorted face based on a rock formation at Cap de Creus on the Catalan coast dominates the canvas. The artist kept the painting until his death.","Salvador Dalí||The Temptation of St. Anthony||1946":"Holding up a cross, Saint Anthony faces a horse and elephants on spindly legs bearing symbols of temptation. It was painted for a competition linked to a film.","Frida Kahlo||Frieda and Diego Rivera||1931":"A double portrait painted in San Francisco two years after the couple married; the small Kahlo holds hands with the massive Rivera, who carries a palette.","Frida Kahlo||Henry Ford Hospital||1932":"Painted on metal, it records the artist's miscarriage in Detroit. She lies on a hospital bed, linked by red cords to symbolic objects floating around her.","Frida Kahlo||The Frame||1938":"A self-portrait framed by flowers in the style of Mexican folk decoration. Bought by the Louvre in 1939, it was the first work by a 20th-century Mexican artist acquired by a major international museum.","Edward Hopper||Hotel Room||1931":"A woman sits on the edge of a hotel bed reading a sheet of paper. Unpacked luggage and bare walls convey the loneliness of being away from home.","Edward Hopper||Office at Night||1940":"A man reads papers late at night while his secretary stands at a filing cabinet. The artist said the idea came from glimpses of offices seen from the elevated train.","Edward Hopper||Rooms by the Sea||1951":"An open door gives directly onto the sea in this uncanny composition, where sunlight in an empty room is the real subject. It began with the artist's studio on Cape Cod.","Edward Hopper||Cape Cod Evening||1939":"At dusk a man sits on the doorstep while a woman stands beside him and a dog looks off beyond the tall grass. Figures who never meet each other's gaze create a quiet tension.","Grant Wood||Daughters of Revolution||1932":"Three elderly women stand before a reproduction of \"Washington Crossing the Delaware.\" The artist called it his only satire.","Grant Wood||Parson Weems' Fable||1939":"Parson Weems, who invented the tale, draws back a curtain on young George Washington confessing to cutting the cherry tree. The boy's face is taken from Gilbert Stuart's portrait of Washington.","Grant Wood||The Birthplace of Herbert Hoover||1931":"A bird's-eye view of President Hoover's birthplace and its neighborhood in West Branch, Iowa. Rounded trees and tidy roads form the artist's characteristic stylized countryside. It is jointly owned with the Minneapolis Institute of Art and shown at both museums.","Andrew Wyeth||Albert's Son||1959":"A boy stands alone before a weathered house, painted in muted tempera. Full of the artist's quiet melancholy, it is a rare chance to see his work in a European public museum.","Andrew Wyeth||Public Sale||1943":"A farm auction in rural Pennsylvania seen from a high vantage point. The broad fields and small clustered figures create a somber mood.","Andrew Wyeth||Northern Point||1950":"A tempera of the Maine coast, where the artist spent his summers, seen from a dramatic viewpoint. Its precise detail and restrained palette are typical of his landscapes.","Jackson Pollock||Full Fathom Five||1947":"One of the first major poured paintings; nails, tacks, buttons, cigarette butts and a key are embedded in its surface. The title comes from Shakespeare's \"The Tempest.\"","Jackson Pollock||Alchemy||1947":"An early drip painting made by pouring and flinging enamel, aluminum and other paints. Metallic paint glints among the thickly built-up layers.","Jackson Pollock||Summertime: Number 9A||1948":"Black lines and patches of yellow and blue run rhythmically across a canvas more than five meters long. Walk its length to follow the artist's gestures.","Jackson Pollock||The Deep||1953":"A late work in which a deep black chasm opens through layers of white. It reflects the artist's search for a new direction after the drip paintings.","Willem de Kooning||Woman and Bicycle||1952–1953":"Part of the \"Woman\" series, it shows a grinning, wide-eyed figure in violent brushwork. Look for the second smile drawn at her neck.","Willem de Kooning||Gotham News||1955":"As its title, a nickname for New York, suggests, the city's clamor is rendered in rough strokes and strong color. Newsprint pressed into wet paint has left traces of type.","Willem de Kooning||Easter Monday||1955–1956":"An abstraction evoking the urban landscape, with newsprint transferred from pressed newspaper visible throughout the surface.","Mark Rothko||Slow Swirl at the Edge of the Sea||1944":"A work from the Surrealist phase before the color fields, in which two organic figures intertwine as if dancing at the shore.","Mark Rothko||Orange and Yellow||1956":"A classic color-field painting in which large orange and yellow rectangles float with soft, bleeding edges. Stand close to feel enveloped by the color.","Mark Rothko||Four Darks in Red||1958":"Bands of black and deep brown are stacked on a red ground. It marks the period when the artist moved from bright to darker colors.","Mark Rothko||Ochre and Red on Red||1954":"It hangs in the Rothko Room, a small gallery holding only four of his paintings. The artist advised on the installation, and a bench invites quiet contemplation.","Barnett Newman||Broken Obelisk||1963–1967":"An inverted obelisk, its tip broken off, balances on a pyramid in Cor-Ten steel. It stands in the reflecting pool outside the Rothko Chapel, dedicated to Martin Luther King Jr.","Barnett Newman||Adam||1951–1952":"Vertical red bands, the artist's \"zips,\" cut through a dark reddish-brown field. Named after the first man in the Bible, it alludes to the moment of creation.","Barnett Newman||Cathedra||1951":"A deep blue field more than five meters wide, crossed by thin vertical lines. Slashed by a visitor in 1997, it underwent a long restoration.","Andy Warhol||Green Coca-Cola Bottles||1962":"112 silkscreened Coca-Cola bottles repeat in rows. They look identical, but each shows slight variations in the printing.","Andy Warhol||Ten Lizes||1963":"Elizabeth Taylor's face is printed ten times on a silver ground. The film-strip-like repetition shows celebrity as a mass-produced commodity.","Andy Warhol||Sixteen Jackies||1964":"Press photographs of Jacqueline Kennedy from before and after the assassination of President Kennedy repeat sixteen times, alternating smiles and grief.","Andy Warhol||Ethel Scull 36 Times||1963":"Made from photo-booth snapshots of the collector Ethel Scull, it was the artist's first commissioned portrait. It is jointly owned by the Met and the Whitney, so it may be shown at either museum.","Roy Lichtenstein||As I Opened Fire||1964":"A triptych enlarging three comic-book panels of a fighter pilot opening fire; Ben-Day dots and bold outlines imitate comic printing.","Roy Lichtenstein||Big Painting No. 6||1965":"Gestural Abstract Expressionist brushstrokes are recast mechanically in Ben-Day dots and crisp outlines. In 1970 it set a record price for a work by a living American artist.","Roy Lichtenstein||Brushstroke with Spatter||1966":"Part of the \"Brushstrokes\" series, it depicts a bold stroke and spatters in cartoon-like form. The irony lies in carefully planning what looks spontaneous.","Roy Lichtenstein||House I||1996–1998":"A painted aluminum sculpture of a house in simple lines and planes, set in the Sculpture Garden. As you walk past, the house seems to project and recede.","David Hockney||Bigger Trees Near Warter||2007":"A monumental landscape of Yorkshire trees in winter, painted on fifty joined canvases. The artist gave it to Tate in 2008.","David Hockney||Pearblossom Hwy., 11–18th April 1986, #2||1986":"A photocollage of a California desert crossroads assembled from hundreds of photographs. Images taken from many viewpoints combine into a single landscape.","David Hockney||Mulholland Drive: The Road to the Studio||1980":"The winding hillside road from the artist's Los Angeles home to his studio, in vivid color and a map-like spread of viewpoints. It captures the experience of driving through the landscape.","Jean-Michel Basquiat||Gold Griot||1984":"A large skeletal figure is painted on wooden slats. A griot is a West African oral poet and keeper of history.","Jean-Michel Basquiat||Melting Point of Ice||1984":"A large painting layered with words and images, showing the dense, improvisational surface typical of Basquiat.","Jean-Michel Basquiat||Eyes and Eggs||1983":"A large work painted on a cotton drop cloth fitted with metal hinges. A figure, eggs and assorted signs are drawn in raw, rough lines.","Jean-Michel Basquiat||LNAPRK||1982":"Paper collaged onto canvas, with rope attached; words, signs and raw drawing combine in the artist's signature style.","Keith Haring||The Life of Christ (Altarpiece)||1990":"A bronze triptych finished in white gold, completed only weeks before the artist's death as his last work. It is one of nine casts.","Keith Haring||Once Upon a Time...||1989":"A mural covering every wall of a former second-floor men's room at the LGBT Community Center. Made for a show marking the 20th anniversary of Stonewall, it celebrates sexual liberation before the AIDS epidemic.","Keith Haring||Ignorance = Fear||1989":"A poster for the AIDS activist group ACT UP, showing three figures covering their eyes, ears and mouth. With the slogan \"Silence = Death,\" it denounces indifference to AIDS.","Anselm Kiefer||Athanor||2007":"A large painting installed in a stairwell of the Louvre, showing the artist lying beneath a star-strewn sky. It was the first permanent commission for a living artist since Braque.","Anselm Kiefer||Margarethe||1981":"Straw attached to the canvas evokes the golden-haired Margarete of Paul Celan's poem \"Death Fugue.\"","Anselm Kiefer||Interior (Innenraum)||1981":"Based on a photograph of the interior of the New Reich Chancellery in Nazi Germany, it depicts a grand hall that looks empty and ruined.","Piero della Francesca||The Baptism of Christ||1440년대":"Christ is baptised in the Jordan; the dove above his head and the pale tree trunk form the picture's vertical axis.","Piero della Francesca||The Flagellation of Christ||1455–1460경":"The scourging takes place in the background while three figures stand in front; their identity is still debated, and the perspective is famously exact.","Piero della Francesca||Diptych of Federico da Montefeltro and Battista Sforza||1473–1475경":"A diptych of the Duke and Duchess of Urbino facing each other in profile; the duke, who lost his right eye in a tournament, was always shown from the left.","Piero della Francesca||The Nativity||1470–1475경":"Lute-playing angels sing to the Christ Child lying on the ground; parts were left unfinished, revealing the painter's working process.","Fra Angelico||Annunciation (San Marco)||1440–1445경":"This fresco greets visitors at the top of the stairs to the convent's upper floor; angel and Virgin meet quietly in a plain loggia.","Fra Angelico||The Annunciation||1425–1426":"The angel brings the news to Mary in a golden loggia, while Adam and Eve are expelled from Paradise at the left; the predella below tells the life of the Virgin.","Fra Angelico||Deposition of Christ||1432–1434경":"Christ is lowered from the cross before a clear Tuscan landscape; it was painted as the altarpiece for the church of Santa Trinita in Florence.","Fra Angelico||Coronation of the Virgin||1430–1432경":"Saints and angels gather on the steps below as Christ crowns the Virgin; the gold ground and vivid blues stand out.","Paolo Veronese||The Wedding at Cana||1563":"The largest painting in the Louvre, hung opposite the \"Mona Lisa\"; the miracle of water turned into wine becomes a Venetian banquet with over 130 figures.","Paolo Veronese||The Feast in the House of Levi||1573":"Painted as a \"Last Supper\", it drew the Inquisition's objections to its dwarfs and drunken soldiers; Veronese simply changed the title.","Paolo Veronese||The Family of Darius before Alexander||1565–1567경":"The family of the defeated Persian king kneels before Alexander, in the episode where Darius's mother mistook a companion for the king.","Paolo Veronese||Mars and Venus United by Love||1570년대":"Cupid binds Mars and Venus together with a ribbon, in an allegory of love in which milk flows from Venus's breast.","Tintoretto||Miracle of the Slave||1548":"Saint Mark plunges head-first from the sky to rescue a slave from torture; this picture made Tintoretto's name in Venice.","Tintoretto||Susanna and the Elders||1555–1556경":"Two elders spy on Susanna at her bath from behind a hedge; her luminous body contrasts with the mirror and still life around her.","Tintoretto||The Origin of the Milky Way||1575경":"Jupiter holds the infant Hercules to the breast of the sleeping Juno, and her spilled milk becomes the stars.","Tintoretto||The Washing of the Feet||1548–1549":"Christ washes the disciples' feet in a deep perspective setting; the canvas was painted for the church of San Marcuola in Venice.","Lucas Cranach the Elder||Adam and Eve||1526":"Adam scratches his head as he takes the apple from Eve, surrounded by the animals of Paradise, among them a stag.","Lucas Cranach the Elder||The Fountain of Youth||1546":"Old women enter the pool on the left and emerge young on the right, where feasting and dancing await.","Lucas Cranach the Elder||Judith with the Head of Holofernes||1530경":"Richly dressed, Judith calmly faces the viewer holding the sword and the enemy general's head, a subject Cranach painted often.","Lucas Cranach the Elder||Cupid Complaining to Venus||1526–1527경":"Stung by bees while stealing honey, Cupid complains to Venus, a lesson that pleasure brings pain.","Thomas Gainsborough||Mr and Mrs Andrews||1750경":"A newly married couple posed with their estate; the area on the wife's lap was left unfinished.","Thomas Gainsborough||The Blue Boy||1770경":"A full-length portrait of a boy in blue satin costume in the manner of Van Dyck; sold to America in 1922, it was briefly shown in London in 2022.","Thomas Gainsborough||The Morning Walk||1785":"A young couple about to marry stroll through woods with their dog; feathery brushwork blends dress and foliage.","Thomas Gainsborough||The Painter's Daughters Chasing a Butterfly||1756경":"The painter's two daughters chase a butterfly hand in hand; painted for the family rather than on commission, it is warm and intimate.","Canaletto||The Stonemason's Yard||1725경":"Instead of a tourist sight, Canaletto shows an everyday Venetian square where stonemasons work, with the church of the Carità across the canal.","Canaletto||A Regatta on the Grand Canal||1740경":"A gondola race held during Carnival; every building along the canal is crowded with spectators and hung with drapery.","Canaletto||Venice: The Basin of San Marco on Ascension Day||1740경":"The doge's gilded barge, the Bucintoro, sets out for the ceremony of the Marriage of the Sea, surrounded by countless gondolas.","Canaletto||Bacino di San Marco, Venice||1738경":"A broad panorama of the basin of San Marco, painted in fine detail as far as the island of San Giorgio Maggiore and the moored ships.","William Blake||The Ghost of a Flea||1819–1820경":"A small tempera of the flea's ghost that Blake said appeared to him in a vision; it stalks across a stage holding a bowl for blood.","William Blake||Newton||1795–1805경":"Newton, seated on a rock beneath the sea, draws with compasses, embodying Blake's critique of reason alone. As a light-sensitive work on paper, it is not always on display.","William Blake||Nebuchadnezzar||1795–1805경":"A colour print of the Babylonian king condemned to eat grass like a beast, from the same series as \"Newton\". As a light-sensitive work on paper, it is not always on display.","William Blake||The Great Red Dragon and the Woman Clothed with the Sun||1805경":"A watercolour of the red dragon of Revelation looming over the woman clothed with the sun; the series became widely known through the novel \"Red Dragon\". As a work on paper, it is rarely displayed.","James McNeill Whistler||Arrangement in Grey and Black No. 1 (Whistler's Mother)||1871":"The artist's mother sits in profile in a harmony of grey and black; the title stresses colour arrangement rather than portraiture.","James McNeill Whistler||Nocturne in Black and Gold – The Falling Rocket||1875경":"Fireworks bursting in the night sky, rendered in flecks of paint; Ruskin's attack on it led to a famous libel trial.","James McNeill Whistler||Symphony in White, No. 1: The White Girl||1862":"A woman in white stands on a wolfskin rug before a white curtain; it drew great attention at the 1863 Salon des Refusés.","James McNeill Whistler||Nocturne: Blue and Gold – Old Battersea Bridge||1872–1875경":"The Thames at night, veiled in blue mist; the towering bridge reflects the influence of Japanese ukiyo-e prints.","John Singer Sargent||Madame X (Madame Pierre Gautreau)||1883–1884":"A Parisian society beauty in a black gown with pale skin; the strap originally slipping off her shoulder caused a Salon scandal and was later repainted.","John Singer Sargent||Carnation, Lily, Lily, Rose||1885–1886":"Two girls light paper lanterns in a garden at dusk; Sargent painted outdoors only in the brief twilight, finishing over two summers.","John Singer Sargent||The Daughters of Edward Darley Boit||1882":"An unusual group portrait of four sisters scattered through a large interior; the tall Japanese vases in the picture were also given to the museum.","John Singer Sargent||Lady Agnew of Lochnaw||1892":"A relaxed, intimate portrait of a woman leaning back in her chair and meeting our gaze; it greatly enhanced Sargent's reputation.","Odilon Redon||The Cyclops||1914경":"The one-eyed giant Polyphemus peers shyly over a hill at the sleeping nymph Galatea, in dreamlike, flowering colour.","Odilon Redon||Eye-Balloon||1878":"A giant eyeball rises into the sky like a hot-air balloon; a key charcoal of Redon's 'noirs' period, it is rarely displayed as a work on paper.","Odilon Redon||Closed Eyes||1890":"A face with closed eyes rises as if from water, marking Redon's transition from charcoal to colour.","Odilon Redon||Ophelia among the Flowers||1905–1908경":"A pastel in which vivid flowers bloom above the drowned Ophelia's profile, showing the radiant colour of Redon's late work.","Pierre Bonnard||Nude in the Bath||1936–1938":"Bonnard's wife Marthe lies in the bath amid shimmering tiles and water; he painted her in this setting again and again over decades.","Pierre Bonnard||The Open Window||1921":"Through the open window lies a green garden, while Marthe and a cat sit half-hidden in a corner of the room.","Pierre Bonnard||Twilight (The Croquet Game)||1892":"Family members play croquet in an evening garden; the flat patterns and decorative design show the influence of Japanese prints and the Nabis.","Pierre Bonnard||Dining Room Overlooking the Garden (The Breakfast Room)||1930–1931":"The breakfast table and the garden beyond merge into one; Marthe stands at the left edge, half cut off by the frame.","Georgia O'Keeffe||Black Iris||1926":"A single iris magnified to fill the canvas; the soft gradations of its petals verge on abstraction.","Georgia O'Keeffe||Cow's Skull: Red, White, and Blue||1931":"A cow's skull from the New Mexico desert set against the red, white and blue of the flag, as a statement of a truly American art.","Georgia O'Keeffe||Sky Above Clouds IV||1965":"Clouds seen from an aeroplane, painted on a canvas over seven metres wide; it is the largest painting of O'Keeffe's career.","Georgia O'Keeffe||Music, Pink and Blue No. 2||1918":"An early abstraction that seeks to express music through colour and form, with softly curving pink and blue planes creating rhythm.","a.Piero della Francesca":"A painter and mathematician who studied perspective and geometry, creating calm, rigorously ordered compositions.","a.Fra Angelico":"A Dominican friar and painter who expressed faith through clear colour and a devout serenity.","a.Paolo Veronese":"A Venetian master of sumptuous colour who staged vast banquet scenes within grand architecture.","a.Tintoretto":"A dramatic Venetian painter who used bold perspective and light to give scenes speed and tension.","a.Lucas Cranach the Elder":"Saxon court painter and friend of Luther, known for slender, elegant nudes and portraits of the Reformation.","a.Thomas Gainsborough":"An English portraitist and landscape painter whose lively brushwork united sitters with nature.","a.Canaletto":"The master of the Venetian view painting (veduta), recording canals and squares with precision and light.","a.William Blake":"A poet and printmaker who pictured his own visionary mythology in highly original images.","a.James McNeill Whistler":"An American painter active in London who treated painting, like music, as a harmony of colour.","a.John Singer Sargent":"The leading portraitist of his age, capturing his sitters' presence with swift, assured brushwork.","a.Odilon Redon":"A Symbolist painter of dreams and the unconscious, moving from black charcoal drawings to radiant colour.","a.Pierre Bonnard":"A colourist from the Nabis who painted everyday interiors and gardens in glowing colour.","a.Georgia O'Keeffe":"The mother of American modernism, known for magnified flowers and the bones and deserts of New Mexico.","city.네덜란드 하를럼":"Haarlem, Netherlands","city.독일 다름슈타트":"Darmstadt, Germany","city.프랑스 퐁텐블로":"Fontainebleau, France","city.미국 코디":"Cody, USA","city.미국 신시내티":"Cincinnati, USA","city.미국 포트워스":"Fort Worth, USA","city.이탈리아 우르비노":"Urbino, Italy","city.미국 샌마리노":"San Marino, USA","André Derain||The Houses of Parliament at Night||1905–1906":"One of his London series, showing the Thames and the Houses of Parliament at night in intense, vivid colour.","Fernand Léger||The Smokers||1911–1912":"An early Cubist work that breaks smokers, rising smoke and the landscape beyond into rounded, solid volumes.","Piet Mondrian||Lozenge Composition with Yellow, Black, Blue, Red, and Gray||1921":"Black lines and planes of colour on a square canvas turned 45 degrees into a diamond. Lines cut off at the edges seem to continue beyond the picture.","Amedeo Modigliani||Juan Gris||1915":"A portrait of his friend, the Cubist painter Juan Gris. The elongated face and simplified forms show Modigliani's signature style.","Gustave Courbet||Jo, La Belle Irlandaise||1865–1866":"Joanna Hiffernan, Whistler's companion, holds a mirror as she runs her fingers through her red hair. Courbet painted several versions; this one is at the Met.","Gustave Courbet||Spring Rutting, Battle of Stags||1861":"A monumental canvas of stags clashing antlers in a forest. Courbet, a keen hunter, often painted animals and woodland.","Egon Schiele||Self-Seers II (Death and Man)||1911":"A double self-portrait: the painter stands with a pale figure close behind him, usually read as Death. It shows Schiele's preoccupation with life and mortality.","Egon Schiele||Mother with Two Children III||1915–1917":"A pale-faced mother holds two children in brightly patterned clothes. The contrast between the lively children and the weary mother is striking.","Jackson Pollock||Echo: Number 25, 1951||1951":"A key work from his 'black pourings' period, made with black enamel paint alone instead of colour. Figure-like images reappear among the poured lines.","Amedeo Modigliani||Anna Zborowska||1917":"A portrait of Anna, wife of Modigliani's dealer Léopold Zborowski. The long neck, tilted head and simple planes of colour create an elegant mood.","Henri Matisse||Portrait of André Derain||1905":"Painted in the summer of 1905 at Collioure, where Matisse worked alongside Derain as Fauvism was born. Bold greens and reds are used on the face.","a.Hendrick Avercamp":"Painter of frozen Dutch winter landscapes. Unable to speak, he was known as 'the Mute of Kampen'.","Hendrick Avercamp||Winter Landscape with Ice Skaters||1608경":"Crowds skating and pulling sleds on a frozen river, seen from a high viewpoint. Avercamp's best-known work, full of tiny figures to discover one by one.","Hendrick Avercamp||Ice-skating in a Village||1610경":"Villagers enjoying skating and winter games on a frozen waterway. Wealthy townspeople and peasants mingle in a single scene.","Hendrick Avercamp||A Scene on the Ice near a Town||1615경":"People skating and sledging on the frozen water near a town wall. A pale winter sky and cold air pervade the whole picture.","Hendrick Avercamp||A Winter Scene with Skaters near a Castle||1608–1609경":"Painted on a round panel: people enjoy winter pastimes on the ice beside a castle and trees. The circular format feels like looking through a lens.","Johannes Vermeer||A Young Woman standing at a Virginal||1670–1672경":"A young woman standing at a virginal (a small keyboard instrument) looks out at the viewer. The Cupid painting on the wall hints at love; the same gallery also holds his 'Young Woman Seated at a Virginal'.","Jean-Baptiste-Camille Corot||Interrupted Reading||1870경":"A late figure painting of a woman lost in thought, her book resting on her lap. Famous for his landscapes, Corot rarely exhibited figure paintings like this in his lifetime.","Raoul Dufy||Thirty Years, or La Vie en Rose||1931":"His studio walls and easels crowded with earlier paintings, set in a rosy pink: a look back at thirty years as a painter.","Henri Matisse||Nadia aux cheveux lisses||1948":"A late aquatint portrait that captures the young model Nadia's face in just a few bold, brush-like lines. As a print, impressions are held by several museums.","Pablo Picasso||Portrait of Marie-Thérèse||1937":"A portrait of his lover Marie-Thérèse Walter in bright colours and soft curves. Together with 'Portrait of Dora Maar', painted the same year, it is a highlight of the Musée Picasso in Paris.","Pablo Picasso||Portrait of Françoise||1946":"A portrait drawing of the painter Françoise Gilot in pencil and charcoal. As a work on paper, it is not always on display.","city.미국 털리도":"Toledo, USA","a.Raimundo de Madrazo y Garreta":"Rome-born Spanish painter who won great popularity in Paris with portraits of society women and elegant genre scenes.","Jean-Honoré Fragonard||Blind-Man's Buff||1750–1752경":"A blindfolded young woman, 'it' in the game, reaches out in a sunny garden. It is the pendant to his early 'The Swing' in the National Gallery of Art, Washington.","Raimundo de Madrazo y Garreta||After the Bath||1895경":"A woman after her bath, with her soft skin and the textures of the fabrics rendered with great delicacy.","Raimundo de Madrazo y Garreta||Girls at a Window||1875경":"A genre scene of girls leaning at a window and looking out, with bright light and vividly rendered fabrics.","Raimundo de Madrazo y Garreta||Masqueraders||1875–1878":"Figures dressed for a masked ball, painted down to the texture of silk and lace. Part of the Robert Lehman Collection, it is not always on view.","Raimundo de Madrazo y Garreta||Portrait of María Hahn||1901":"A portrait of the painter's wife, María Hahn, notable for her elegant dress and calm expression."};

/* ---------- images (Wikipedia / Wikimedia Commons, loaded live) ---------- */
const IMG={},waiting={};let queue=new Set(),timer=0;
function want(title,cb){
  if(title in IMG){cb(IMG[title]);return}
  (waiting[title]??=[]).push(cb);
  queue.add(title);clearTimeout(timer);timer=setTimeout(flush,40);
}
function resolve(t,v){IMG[t]=v;(waiting[t]||[]).forEach(cb=>cb(v));delete waiting[t]}
function flush(){
  const all=[...queue];queue=new Set();
  const wt=all.filter(t=>!t.startsWith("File:")),ft=all.filter(t=>t.startsWith("File:"));
  for(let i=0;i<wt.length;i+=50)batch(wt.slice(i,i+50),false);
  for(let i=0;i<ft.length;i+=50)batch(ft.slice(i,i+50),true);
}
async function batch(titles,isFile){
  const base=isFile?"https://commons.wikimedia.org/w/api.php?":"https://en.wikipedia.org/w/api.php?";
  const p=isFile
    ?{action:"query",format:"json",formatversion:"2",origin:"*",prop:"imageinfo",iiprop:"url",iiurlwidth:"500",titles:titles.join("|")}
    :{action:"query",format:"json",formatversion:"2",origin:"*",redirects:"1",prop:"pageimages",piprop:"thumbnail|name",pithumbsize:"500",pilimit:"50",titles:titles.join("|")};
  try{
    const j=await (await fetch(base+new URLSearchParams(p))).json();
    const alias={};(j.query.normalized||[]).forEach(n=>alias[n.from]=n.to);(j.query.redirects||[]).forEach(n=>alias[n.from]=n.to);
    const pages={};(j.query.pages||[]).forEach(pg=>pages[pg.title]=pg);
    titles.forEach(t=>{let k=t;for(let i=0;i<3&&alias[k];i++)k=alias[k];const pg=pages[k];
      let v=null;
      if(isFile){if(pg&&pg.imageinfo)v={s:pg.imageinfo[0].thumburl||pg.imageinfo[0].url,f:pg.title}}
      else if(pg&&pg.thumbnail)v={s:pg.thumbnail.source,f:"File:"+pg.pageimage};
      resolve(t,v)});
    return true;
  }catch(e){titles.forEach(t=>{(waiting[t]||[]).forEach(cb=>cb(undefined));delete waiting[t]});return false}
}
const big=s=>s.replace(/\/\d+px-/,"/1280px-");

    img.onload=()=>img.classList.add("on");img.onerror=()=>{el.innerHTML=phHTML(w,small?"":U("noImg"))};
    img.src=info.s;el.replaceChildren(img);
  });
}
const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);fill(e.target)}}),{rootMargin:"400px 0px"}):null;

/* ---------- views ---------- */
function vMovements(){

function vMovement(id){

  </section>`;

const st={asort:"name",amov:"",aq:"",mq:"",q:""};
const initial=a=>{const s=nameKey(a);const c=s.charCodeAt(0)-0xAC00;if(c<0||c>11171)return s.normalize("NFD")[0].toUpperCase();return "ㄱㄱㄴㄷㄷㄹㅁㅂㅂㅅㅅㅇㅈㅈㅊㅋㅌㅍㅎ"[Math.floor(c/588)]};
