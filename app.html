 as if from above. The composition shows the influence of Degas.","Henri de Toulouse-Lautrec||At the Moulin Rouge: The Dance||1890":"At the Moulin Rouge, the dancer Valentin teaches a new dancer while customers look on. A woman in a pink dress stands in the foreground.","Henri de Toulouse-Lautrec||Jane Avril (Jardin de Paris)||1893":"A poster showing the cabaret dancer Jane Avril in performance. Note the head of a double bass and the player's hand framing the scene in the foreground.","George Frederic Watts||Love and Death||1885–1887경":"A towering Death pushes in through a doorway as young Love (Cupid) tries to block the way. Watts painted several versions of this work.","George Frederic Watts||The Dweller in the Innermost||1885–1886":"A work that personifies the human conscience as a mysterious figure.","George Frederic Watts||Hope||1886":"A blindfolded woman plays a lyre with only one string left, listening to its sound. The Tate's painting is the second version; it is also famous because a sermon on it inspired the title of Barack Obama's book \"The Audacity of Hope\".","George Frederic Watts||Psyche||1880":"Psyche, the mortal loved by Eros in Greek mythology, is shown nude. The calm treatment of the body recalls classical sculpture.","Gustave Moreau||The Apparition||1876":"The severed head of John the Baptist appears in a blaze of light before the dancing Salome. Look closely at the ornamental patterns drawn in fine lines in the background.","Gustave Moreau||Oedipus and the Sphinx||1864":"Oedipus and the Sphinx clinging to him gaze at each other. Acclaimed at the 1864 Salon, the work made Moreau's name.","Gustave Moreau||Jupiter and Semele||1894–1895":"The myth of the mortal Semele, who asked to see the god in his true form and was consumed by his radiance. A major late work by Moreau, its canvas is packed with jewel-like ornament.","Gustave Moreau||Orpheus||1865":"A Thracian girl gazes at the severed head of Orpheus resting on a lyre. Its quiet, dreamlike mood anticipates Symbolism.","Gustav Klimt||The Kiss||1907–1908":"The masterpiece of Klimt's \"Golden Period\", showing lovers kissing, wrapped in robes covered in gold leaf. Compare the rectangular patterns on the man's robe with the circular ones on the woman's.","Gustav Klimt||Portrait of Adele Bloch-Bauer I||1907":"A portrait in which only the sitter's face and hands emerge realistically from gold-leaf ornament. It is famous for having been seized by the Nazis and returned to the heirs after a long legal battle.","Gustav Klimt||Judith I||1901":"Judith, holding the head of the enemy general Holofernes, is portrayed as a sensual femme fatale. Letters naming the subject are engraved on the top of the metal frame.","Gustav Klimt||Beethoven Frieze||1902":"A large mural painted high on the gallery walls for the Secession exhibition honouring Beethoven, visualising his Ninth Symphony. Look for the embracing couple in the final scene.","Gustav Klimt||Stoclet Frieze||1905–1911":"The actual mosaic is in the Palais Stoclet in Brussels and is not open to the public; the preparatory designs can be seen at the MAK.","Gustav Klimt||Death and Life||1910–1915":"Death, in the form of a skeleton on the left, looks towards a tangle of people on the right. The background was originally gold, but Klimt later repainted it.","Gustav Klimt||Portrait of Fritza Riedler||1906":"A portrait of a Viennese society woman seated in an ornately patterned armchair. The semicircular pattern behind her head is said to have been inspired by a headdress in a Velázquez portrait.","Gustav Klimt||Hope II||1907–1908":"A pregnant woman with closed eyes, a skull appearing behind her body and women with bowed heads below. The work brings birth and death together in a single image.","Gustav Klimt||Schloss Kammer am Attersee III||1910":"A view of the Attersee, where Klimt spent his summers. He produced more than 50 landscapes.","Gustav Klimt||Portrait of Sonja Knips||1898":"A delicate portrait from Klimt's early period, before he began using gold leaf.","Gustav Klimt||Portrait of Johanna Staude||1917–1918":"One of his last portraits, left unfinished at Klimt's death.","Henri Matisse||Woman with a Hat||1905":"A portrait of his wife, Amélie; its rough brushwork and intense colour made it the centre of the Fauvist controversy at the 1905 Salon d'Automne.","Henri Matisse||Dance||1910":"The first version, painted in 1909, is at MoMA in New York.","Henri Matisse||The Red Studio||1911":"The entire studio is covered in a single red, with Matisse's own works arranged on it. Note how the furniture dissolves into the red, leaving only its outlines.","Henri Matisse||Luxe, Calme et Volupté||1904":"Painted while Matisse was staying with Signac in Saint-Tropez and experimenting with pointillism. The title comes from a line in Baudelaire's poem \"Invitation to the Voyage\".","Henri Matisse||Open Window, Collioure||1905":"The harbour and boats of Collioure seen through the open window of Matisse's lodgings. With inside and outside divided into pure areas of colour, it is a key early Fauvist work.","Henri Matisse||Le Bonheur de vivre||1905–1906":"Figures resting or dancing are spread across an idyllic landscape. The ring of dancers in the background later developed into the \"Dance\" series.","Henri Matisse||The Dessert: Harmony in Red||1908":"A maid setting a table in a red room. The painting was originally blue, but Matisse repainted it red. The patterns of the tablecloth and the wall merge into one.","Henri Matisse||Music||1910":"Painted as a companion to \"Dance\" for the mansion of the Russian collector Shchukin. Five red figures are simply set against a green hill and blue sky.","Henri Matisse||The Window||1916":"The window of Matisse's studio in Issy-les-Moulineaux, near Paris. Bought by the Detroit Institute of Arts in 1922, it became the first Matisse in an American public museum.","Henri Matisse||Woman at the Window||1920":"A hotel room window overlooking the sea, from Matisse's Nice period. Owned by the Centre Pompidou, it is on long-term loan to the Musée de l'Annonciade in Saint-Tropez.","Henri Matisse||La Blouse roumaine||1940":"A woman wearing a traditional embroidered Romanian blouse, painted in simple lines and areas of colour.","Henri Matisse||The Green Stripe||1905":"A green line dividing the face down the middle demonstrates the bold use of colour in Fauvism. The National Gallery of Denmark in Copenhagen holds a large collection of Matisse's work.","Henri Matisse||Bathers by a River||1909–1917":"A monumental work reworked over eight years, absorbing the influence of Cubism.","Henri Matisse||The Piano Lesson||1916":"Matisse's son Pierre at the piano, simplified into geometric areas of colour. The triangular shadow on his face echoes the shape of the metronome.","Henri Matisse||Goldfish and Palette||1914":"Goldfish in a bowl and a palette arranged around a black band. On the right, the figure of the painter holding a palette is suggested in abstract form.","André Derain||Portrait of Henri Matisse||1905":"Derain painted Matisse, with whom he was working in Collioure, in intense strokes of colour. Matisse's portrait of Derain from the same period is also at the Tate.","André Derain||Mountains at Collioure||1905":"A Fauvist landscape of the hills and trees of Collioure in short, thick strokes of pure colour. Notice how boldly colour leads form.","André Derain||Big Ben||1906":"One of a series of nearly 30 views of London commissioned by the dealer Vollard.","André Derain||Charing Cross Bridge||1906":"One of a series of views of the Thames painted after the dealer Vollard encouraged Derain to go to London. Unlike Monet's foggy London, it uses intense pure colours.","Raoul Dufy||Les Affiches à Trouville||1906":"Advertising posters lining the promenade of the Normandy resort of Trouville. The colourful planes of the posters reveal the influence of Fauvism.","Raoul Dufy||La Rue pavoisée||1906":"A street decked with tricolour flags for Bastille Day. The red, white and blue of the flags filling the street create a lively rhythm.","Raoul Dufy||La Fée Électricité||1937":"A huge mural about 60 metres long painted for the 1937 Paris International Exposition, it wraps around an entire gallery.","Raoul Dufy||Trees at L'Estaque||1908":"Painted at L'Estaque alongside Braque, the work shows the influence of Cézanne and Cubism.","Henri Rousseau||The Sleeping Gypsy||1897":"A woman asleep in a moonlit desert, with a lion approaching her. Its quiet, dreamlike mood later endeared it to the Surrealists.","Henri Rousseau||The Dream||1910":"A major late work by Rousseau, showing a woman reclining on a sofa in the middle of a jungle. In a poem, the artist explained that she had been transported to the jungle in her dream.","Henri Rousseau||Surprised!||1891":"A tiger crouches in a jungle during a storm lit by lightning. Rousseau never left France; he based his jungles on plants he saw in places such as the Jardin des Plantes in Paris.","Henri Rousseau||The Snake Charmer||1907":"A dark-skinned woman plays a flute in a moonlit jungle, with snakes drawn by the sound. The work was commissioned by the mother of the painter Robert Delaunay.","Henri Rousseau||War||1894":"War personified gallops on a black horse across a field strewn with corpses. The figure holding a sword and torch and the crows pecking at the bodies reveal the horrors of war.","Henri Rousseau||A Carnival Evening||1886":"A couple in carnival costume stand in a moonlit winter forest. It was one of the first works Rousseau exhibited at the Salon des Indépendants.","Henri Rousseau||The Football Players||1908":"Men in striped outfits vie for a ball in an autumn park, though the game looks more like rugby. The players' stiff movements make them seem to be dancing.","Edvard Munch||The Scream||1893":"There are several versions. The 1893 tempera and crayon version is in the National Museum, while the 1910 version and others are at the MUNCH museum in Oslo.","Edvard Munch||The Dance of Life||1899–1900":"Men and women dance on a moonlit beach. The women on the left in white, in the centre in red and on the right in black symbolise the stages of love and life.","Edvard Munch||The Sick Child||1885–1886":"Painted in memory of his sister Sophie, who died of tuberculosis. Its rough, scraped and repainted surface is distinctive, and Munch returned to the subject many times throughout his life.","Edvard Munch||Madonna||1894–1895":"There are several versions, including ones at the MUNCH museum and the Hamburger Kunsthalle.","Edvard Munch||Anxiety||1894":"Pale-faced people walk straight towards the viewer before a fjord landscape under a red sky like that of \"The Scream\".","Edvard Munch||The Girls on the Bridge||1901":"Girls lean on the railing of a bridge in the summer village of Åsgårdstrand. Munch painted this subject in several versions.","Edvard Munch||Self-Portrait: Between the Clock and the Bed||1940–1943":"One of his last self-portraits, painted near the end of his life, shortly before he turned 80, showing himself standing between life and death.","Ernst Ludwig Kirchner||Berlin Street Scene||1913":"A Berlin street with elegantly dressed women and gentlemen passing by. The elongated figures and sharp brushstrokes convey the tension of the big city.","Ernst Ludwig Kirchner||Street, Dresden||1908":"People walking along a busy street in Dresden, painted in intense pink and orange. The mask-like faces reveal a sense of isolation in the crowd.","Ernst Ludwig Kirchner||Potsdamer Platz||1914":"Two women loom large on a traffic island in Potsdamer Platz, Berlin. The tilted ground and the station building behind heighten the city's uneasy atmosphere.","Ernst Ludwig Kirchner||Self-Portrait as a Soldier||1915":"The artist stands in uniform raising a severed right hand, with a nude model behind him. He never actually lost his hand; the painting expresses his fear that the war would leave him unable to paint.","Franz Marc||The Large Blue Horses||1911":"Three blue horses merge into a single mass against red hills. For Marc, blue was a masculine and spiritual colour.","Franz Marc||Yellow Cow||1911":"A yellow cow leaps joyfully. For Marc, yellow symbolised the gentle, feminine principle.","Franz Marc||Fate of the Animals||1913":"Animals meet catastrophe amid falling trees and red light. The right-hand section was damaged by fire and, after Marc was killed in the war, restored by his friend Paul Klee.","Franz Marc||Blue Horse I||1911":"The Lenbachhaus holds the world's largest collection of Blue Rider works.","Egon Schiele||Self-Portrait with Physalis||1912":"Red Chinese lantern fruits appear beside the artist, whose head is tilted to one side. The work is a pendant to the portrait of his lover Wally.","Egon Schiele||Portrait of Wally||1912":"A small portrait of his lover, Wally Neuzil. After an exhibition in New York, it was seized over Nazi looting claims and returned to Vienna after more than a decade of litigation.","Egon Schiele||The Embrace||1917":"A man and a woman embrace on a white sheet. The line here is noticeably softer than in his sharp early style.","Egon Schiele||The Family||1918":"A family portrait showing the artist with a woman and a child. That autumn, Schiele and his pregnant wife Edith died of the Spanish flu three days apart.","Egon Schiele||Dead City III||1911":"A view down onto Krumau (now Český Krumlov) in Czechia, his mother's hometown. Schiele called the town the \"Dead City\" and painted it many times.","Egon Schiele||Houses on the River (The Old Town)||1914":"Old houses crowded close along a river. Look at how the windows, walls and roofs are fitted together like flat areas of colour.","Egon Schiele||Krumau – Crescent of Houses (The Small City V)||1915":"The houses of Krumau are densely packed in a crescent along the winding river. The windows and roofs arranged like a flat pattern are striking.","Egon Schiele||House Wall on the River||1915":"The wall of a house in Krumau rising directly from the Vltava, painted flat and head-on.","Egon Schiele||Death and the Maiden||1915":"Interpreted as expressing his feelings at the time he parted from his lover Wally and married Edith.","Egon Schiele||Four Trees||1917":"A landscape of four trees standing side by side under a sunset sky. Horizontal bands of sky and hills create a calm rhythm.","Egon Schiele||Portrait of Edith Schiele||1918":"That autumn, Edith and Schiele died of the Spanish flu three days apart.","Oskar Kokoschka||The Bride of the Wind||1913–1914":"Kokoschka and his lover Alma Mahler lie in a space like a small boat in a storm. Alma sleeps peacefully while the artist lies awake and anxious.","Oskar Kokoschka||Self-Portrait of a 'Degenerate Artist'||1937":"A self-portrait painted in defiance after the Nazis branded his work \"degenerate art\" and confiscated it.","Oskar Kokoschka||Hans Tietze and Erica Tietze-Conrat||1909":"A double portrait of the art historian couple, in which their almost-touching hands speak of their relationship. Traces of scratched-away paint remain in the background.","Oskar Kokoschka||Knight Errant||1915":"A knight in armour floats above a desolate landscape, with the artist's own face. It was painted around the time he enlisted, after his break-up with Alma Mahler.","Pablo Picasso||Les Demoiselles d'Avignon||1907":"Five women in a brothel on Carrer d'Avinyó in Barcelona. The mask-like faces of the two figures on the right became a starting point for Cubism.","Pablo Picasso||Guernica||1937":"Photography is not permitted in the Guernica gallery.","Pablo Picasso||The Weeping Woman||1937":"A weeping woman with a handkerchief in her mouth, modelled on his lover Dora Maar. The work carries on the grief of \"Guernica\", painted the same year.","Pablo Picasso||The Old Guitarist||1903–1904":"A key work of the Blue Period, showing a blind old man hunched over his guitar. Traces of another figure painted earlier show faintly through the surface.","Pablo Picasso||La Vie||1903":"A major Blue Period work; the man on the left has the face of Picasso's friend Casagemas, who took his own life. X-rays revealed that it was originally Picasso's own face.","Pablo Picasso||Portrait of Gertrude Stein||1905–1906":"After many sittings, Picasso painted out the face and later repainted it as a mask under the influence of Iberian sculpture. When told it did not look like her, he reportedly replied that it would.","Pablo Picasso||Three Musicians||1921":"Another version painted the same year is in the Philadelphia Art Museum.","Pablo Picasso||Science and Charity||1897":"A large academic-style painting made when Picasso was 15. The Museu Picasso in Barcelona has a particularly rich collection of his early works.","Pablo Picasso||Woman Ironing||1904":"A gaunt woman irons with all her strength, painted in greyish tones. From the end of the Blue Period, it reveals Picasso's concern for the working poor.","Pablo Picasso||The Three Dancers||1925":"Three figures in a frenzied dance. Picasso's friend Ramon Pichot died while he was working on it, and Picasso said the painting was connected with his death.","Pablo Picasso||Girl before a Mirror||1932":"A woman standing before a mirror, modelled on his lover Marie-Thérèse Walter. Unlike her bright real self, her reflection is dark and distorted.","Georges Braque||Houses at L'Estaque||1908":"Houses piled up among trees, painted as simple box-like shapes. A critic's remark about \"little cubes\" in such paintings gave Cubism its name.","Georges Braque||Violin and Candlestick||1910":"An Analytical Cubist work in which a violin and candlestick are reconstructed from finely fractured planes. Look for the instrument and candlestick among the brown and grey tones.","Georges Braque||The Portuguese||1911":"A Portuguese musician with a guitar, rendered in finely fractured planes. It is known as the first painting to include stencilled letters and numbers.","Georges Braque||Bottle and Fishes||1910–1912경":"A still life of a bottle and fish on a table, divided into angular planes. From the Analytical Cubist period, it builds up forms layer by layer using only browns and greys.","Georges Braque||Fruit Dish and Glass||1912":"Considered the first papier collé, made with cut and pasted newspaper and wallpaper.","Georges Braque||Landscape at La Ciotat||1907":"A Mediterranean port town in the south of France painted in bright pinks, purples and oranges. It shows his Fauvist style before Cubism.","Georges Braque||Woman with a Guitar||1913":"A woman with a guitar composed of overlapping flat planes of colour. From the Synthetic Cubist period, it includes painted letters and patterns that make it resemble a paper collage.","Juan Gris||Portrait of Pablo Picasso||1912":"Gris's homage to Picasso, whom he admired, shown holding a palette. Exhibited at the 1912 Salon des Indépendants, it established Gris's reputation as a painter.","Juan Gris||Breakfast||1914":"A breakfast table with a coffee cup, newspaper and other objects. Gris used collage, pasting on pieces of wallpaper and printed matter and painting over them.","Juan Gris||The Sunblind||1914":"A still life on a table by the window and the window's sunblind, divided into angular planes. Collage, with pasted newspaper and paper, is used.","Juan Gris||Still Life with Checked Tablecloth||1915":"A still life on a checked tablecloth assembled from planes seen from multiple viewpoints. The vivid colour and orderly composition show the hallmarks of Synthetic Cubism.","Fernand Léger||The City||1919":"A monumental work combining signs, steel girders and machine-like figures on stairs in vivid areas of colour to express the rhythm of the modern city.","Fernand Léger||Three Women||1921":"Three nude women drinking coffee indoors, painted with smooth, cylindrical bodies. The work reinterprets the classical nude with a machine-age sensibility.","Fernand Léger||Contrast of Forms||1913":"An abstract painting contrasting shapes like cylinders and cones in red, blue and white. White highlights with visible thick brushstrokes give the forms volume.","Fernand Léger||Nudes in the Forest||1909–1911":"Woodcutters in a forest, painted as cylinders and blocky forms. Léger's style at this time earned the nickname \"Tubism\".","Robert Delaunay||Eiffel Tower||1911":"The Eiffel Tower, broken into fragments seen from multiple viewpoints, appears to sway and collapse. Delaunay made a series of works on the Eiffel Tower.","Robert Delaunay||Simultaneous Windows on the City||1912":"The cityscape beyond a window is broken down into transparent, overlapping planes of colour. It belongs to the \"Windows\" series, which sought to express light and movement through colour contrasts alone rather than form.","Robert Delaunay||The City of Paris||1910–1912":"A monumental work with the Three Graces at the centre, a view of the Seine embankment on the left and the Eiffel Tower on the right. It unites classical tradition and modern Paris in a single picture.","Robert Delaunay||Homage to Blériot||1914":"A tribute to Blériot, who in 1909 made the first flight across the English Channel. Propellers and disc-like rings of colour convey the rotation and light of flight.","Umberto Boccioni||The City Rises||1910":"A huge red horse and workers struggle together, expressing the energy of a city under construction. It is regarded as the first major Futurist painting.","Umberto Boccioni||Unique Forms of Continuity in Space||1913":"A bronze sculpture in which a striding figure seems to flow as it cuts through the air. It also appears on the Italian 20-cent euro coin.","Umberto Boccioni||States of Mind I: The Farewells||1911":"The emotions of people parting at a railway station, expressed through swirling lines and a locomotive. It is the first of the \"States of Mind\" trilogy.","Umberto Boccioni||The Street Enters the House||1911":"A woman seen from behind, looking down at the street from a balcony. The space bends in every direction, as if the buildings and noise were rushing into the house.","Giacomo Balla||Dynamism of a Dog on a Leash||1912":"The feet of a dachshund and its owner are painted in multiple overlapping images to convey the movement of walking. Influenced by sequential photography, it is a key Futurist work.","Giacomo Balla||Girl Running on a Balcony||1912":"The movement of a girl running along a balcony is repeated in small fragments of colour. A technique close to pointillism captures continuous motion in a single image.","Giacomo Balla||Street Light||1909":"The light of an electric street lamp radiates in V-shaped fragments of colour. A small crescent moon in the upper corner is overpowered by the artificial light.","Giacomo Balla||Abstract Speed + Sound||1913–1914":"An abstract painting expressing the speed and noise of a racing car through colour and line alone. Sweeping curves and sharp diagonals create a sense of speed.","Hilma af Klint||Primordial Chaos, No. 16||1906–1907":"From the first group of \"The Paintings for the Temple\" series, it is regarded as one of the earliest abstract paintings in Western art history.","Hilma af Klint||The Large Figure Paintings, No. 5, The Key to All Works to Date||1907":"One of the Large Figure Paintings, Group III of \"The Paintings for the Temple\"; as its title suggests, it holds a diagram that serves as a key to her work up to that point.","Hilma af Klint||The Ten Largest, No. 3, Youth||1907":"\"The Ten Largest\" (Group IV) comprises two paintings each of childhood, youth and old age, and four of adulthood. This is the first of the two youth paintings (Nos. 3–4).","Hilma af Klint||The Ten Largest, No. 7, Adulthood||1907":"A series of ten canvases, each over 3 metres tall, depicting the stages of life from childhood to old age (Group IV). This is one of the four adulthood paintings.","Hilma af Klint||The Ten Largest, No. 8, Adulthood||1907":"The last of the four adulthood paintings (Nos. 5–8). In English it is titled either \"Adulthood\" or \"Maturity\".","Hilma af Klint||The Swan, No. 17||1915":"A moment in a series that begins with a black swan and a white swan and gradually turns into geometric circles and planes.","Hilma af Klint||Altarpiece No. 1||1915":"The first of three altarpieces that conclude the 193 \"Paintings for the Temple\".","Wassily Kandinsky||Composition VII||1913":"Completed in just a few days after dozens of studies, it is considered Kandinsky's most complex work before the First World War. Themes such as the Last Judgement and the Deluge dissolve into colour and form.","Wassily Kandinsky||Yellow-Red-Blue||1925":"A Bauhaus-period work pairing the three primary colours – yellow, red and blue – each with a different form. A bright left side contrasts with a dark right side.","Wassily Kandinsky||The Blue Rider||1903":"Part of the Bührle Foundation collection, it is shown at the Kunsthaus Zürich.","Wassily Kandinsky||Composition VIII||1923":"A geometric abstraction of precisely placed circles, triangles and straight lines. Painted while Kandinsky was teaching at the Bauhaus, it is orderly, unlike the turbulence of his earlier Compositions.","Wassily Kandinsky||Several Circles||1926":"Large and small circles float in transparent overlapping layers against a dark ground. Kandinsky considered the circle the most cosmic of forms.","Wassily Kandinsky||Composition IV||1911":"Figures such as mounted riders and a castle on a hill dissolve into colour and line, showing the transition into abstraction.","Wassily Kandinsky||Improvisation 28 (second version)||1912":"One of the \"Improvisations\", a series depicting inner feelings that arose unconsciously. The Guggenheim holds one of the world's largest collections of Kandinsky's work.","Wassily Kandinsky||Blue Mountain||1908–1909":"Riders gallop before a blue mountain rising between red and yellow trees. The work shows his style just before abstraction, as forms dissolve into colour.","Wassily Kandinsky||Black Lines||1913":"Thin black lines move freely over patches of bright colour. In this early abstraction, where objects are barely recognisable, colour and line seem to move independently.","Wassily Kandinsky||Railway at Murnau||1909":"A black train and its smoke pass in front of the village of Murnau, rendered in bold planes of colour. Kandinsky was living in Murnau with Gabriele Münter at the time.","Wassily Kandinsky||Improvisation 19||1911":"The Lenbachhaus holds the world's largest collection of works by Kandinsky and the Blue Rider group.","Kazimir Malevich||Black Square||1915":"At the \"0,10\" exhibition it hung high in a corner of the room – the place of the icon in a Russian home. Other colours painted earlier show through its cracked surface.","Kazimir Malevich||Suprematist Composition: White on White||1918":"A slightly tilted white square on a white ground. The two whites differ subtly in tone and brushwork, so they can be told apart up close.","Kazimir Malevich||Red Square||1915":"A single red square with one side slightly tilted. Its original title is \"Painterly Realism of a Peasant Woman in Two Dimensions\".","Kazimir Malevich||Morning in the Village after Snowstorm||1912":"A snow-covered village and its people are painted as gleaming, metallic cylindrical forms. The work belongs to his Cubo-Futurist period, which combined Cubism and Futurism.","Kazimir Malevich||The Knife Grinder||1912–1913":"The knife grinder's hands and feet and the stairs are repeated in multiple layers to convey movement. A key Cubo-Futurist work influenced by Futurism.","Kazimir Malevich||Woman with Pails: Dynamic Arrangement||1912–1913":"A peasant woman carrying pails is broken down into cylinders and cones. In this Cubo-Futurist work the human figure looks almost like a machine.","Kazimir Malevich||Suprematist Composition: Airplane Flying||1915":"Rectangles of various colours float diagonally across a white ground. Despite the title, no actual aeroplane is depicted.","Kazimir Malevich||Black Cross||1915":"A Suprematist work showing a black cross on a white ground. As with \"Black Square\", Malevich sought to express pure feeling through the most basic shapes alone.","Kazimir Malevich||An Englishman in Moscow||1914":"The Stedelijk Museum holds the largest Malevich collection outside Russia.","Kazimir Malevich||Painterly Realism. Boy with Knapsack||1915":"Only two shapes appear: a large black square and a smaller red square. Though the title refers to a boy, the subject is entirely erased into pure form.","Kazimir Malevich||Suprematist Painting with Black Trapezium and Red Square||1915":"A tilted black trapezium, a red square and smaller shapes float on a white ground. The shapes seem to drift in a space with no up or down.","Piet Mondrian||Composition with Red, Blue and Yellow||1930":"A large red square at upper right and small areas of blue and yellow below are balanced by black lines. A key work of Neo-Plasticism, using only horizontals, verticals and the three primary colours.","Piet Mondrian||Broadway Boogie Woogie||1942–1943":"The grid of New York's streets and the rhythm of boogie-woogie jazz are expressed through small squares of yellow, red and blue. From his New York period, it uses yellow lines instead of black.","Piet Mondrian||Red Tree||1908–1910":"A red tree spreads its branches against a blue sky. It is the starting point of Mondrian's tree series, which moved progressively towards abstraction.","Piet Mondrian||Gray Tree||1911":"The tree is simplified into a rhythm of grey and black lines. It shows the series that began with \"Red Tree\" moving through Cubism towards abstraction.","Piet Mondrian||Victory Boogie Woogie||1942–1944":"The Kunstmuseum Den Haag holds the world's largest Mondrian collection.","Piet Mondrian||Composition 10 in Black and White (Pier and Ocean)||1915":"A pier stretching into the sea and the waves are reduced to short horizontal and vertical lines. It is an intermediate stage between the tree series and grid abstraction.","Piet Mondrian||Composition with Large Red Plane, Yellow, Black, Grey and Blue||1921":"Painted around the time Mondrian perfected Neo-Plasticism, a style that achieves balance using only black lines, primary colours and neutral tones.","Piet Mondrian||Evolution||1911":"From the period when he was immersed in Theosophy, it depicts three stages of spiritual awakening across three panels.","Paul Klee||Senecio||1922":"A round face is divided into planes of orange and yellow. Simple geometric shapes alone create the expression of a mask-like figure.","Paul Klee||Twittering Machine||1922":"Birds drawn in fine lines perch on a machine with a crank. A work on paper combining oil-transfer drawing and watercolour.","Paul Klee||Angelus Novus||1920":"Once owned by Walter Benjamin, who interpreted this angel as the \"angel of history\" gazing at the wreckage of the past. A work on paper in oil transfer and watercolour.","Paul Klee||Ad Parnassum||1932":"Klee's work can also be seen in depth at the Zentrum Paul Klee in Bern.","Paul Klee||The Goldfish||1925":"A goldfish glows in deep blue water, surrounded by scattered small fish. The goldfish shining red in the darkness draws the eye.","Paul Klee||Red Balloon||1922":"A red balloon floats above planes of colour that evoke houses and buildings. The small picture has a fairy-tale atmosphere.","Paul Klee||Fire in the Evening||1929":"Landscape and light seen on a trip to Egypt are translated into bands of colour.","Suzanne Valadon||Portrait of Erik Satie||1892–1893":"Painted during her brief love affair with the composer Erik Satie.","Suzanne Valadon||Adam and Eve||1909":"One of the first large-scale works in which a woman painted a male nude; the models were her lover André Utter and Valadon herself.","Suzanne Valadon||Joy of Life||1911":"Nude women rest by the water as a man looks on. Valadon reworks the theme of female bathers, a favourite of male painters, from a woman painter's perspective.","Suzanne Valadon||The Blue Room||1923":"A woman reclines in comfortable clothes rather than a corset, with a cigarette in her mouth, overturning the traditional odalisque posed for the male gaze.","Maurice Utrillo||Notre-Dame||1909경":"The façade of Notre-Dame Cathedral is painted in calm whites and greys. A work from his so-called \"White Period\", in which he applied white thickly.","Maurice Utrillo||The Church of Clignancourt||1914경":"The church in the Clignancourt district north of Montmartre and the street before it. The empty street and orderly façades create a quiet atmosphere.","Maurice Utrillo||Le Lapin Agile||1915":"This Montmartre cabaret, frequented by Picasso and Modigliani, is still open today, so you can visit the actual place.","Maurice Utrillo||La Maison Bernot||1924":"The Musée de l'Orangerie holds ten works by Utrillo.","Marie Laurencin||Apollinaire and His Friends||1909":"A group portrait with Apollinaire at the centre, including Picasso and Laurencin herself.","Marie Laurencin||Women with Doves||1919":"Women with doves, painted in soft pink and grey tones. Almond-shaped black eyes and pale faces are hallmarks of Laurencin's style.","Marie Laurencin||Portrait of Mademoiselle Chanel||1923":"Chanel refused to accept this painting, saying it did not look like her.","Marie Laurencin||Les Biches||1923":"Laurencin designed the sets and costumes for the Ballets Russes production \"Les Biches\" (1924). Look for the pale women amid soft pink and grey tones.","Amedeo Modigliani||Jeanne Hébuterne||1919":"Modigliani painted his lover Jeanne Hébuterne with an elongated neck and tilted head. When he died the following year, Jeanne took her own life shortly afterwards.","Amedeo Modigliani||Reclining Nude||1917":"A nude filling the canvas, the woman's reclining body painted in warm flesh tones. At his 1917 solo exhibition, nudes like this were removed by police on grounds of indecency.","Amedeo Modigliani||Paul Guillaume, Novo Pilota||1915":"A portrait of the dealer Paul Guillaume; the words \"Novo Pilota\" on the canvas mean \"new helmsman\", expressing hopes for the young dealer.","Amedeo Modigliani||Jeanne Hébuterne with Yellow Sweater||1918–1919":"Jeanne Hébuterne, seated in a yellow sweater, is painted with a long neck and mask-like face. The sloping line of her shoulders creates an elegant rhythm.","Amedeo Modigliani||Portrait of Léopold Zborowski||1916–1919":"A portrait of Léopold Zborowski, the Polish poet who was the painter's friend and dealer. The elongated face and neck show Modigliani's distinctive style.","Amedeo Modigliani||Jeanne Hébuterne with Large Hat||1918":"One of some twenty portraits Modigliani painted of his wife Jeanne Hébuterne; it is in a private collection and not on public display.","Amedeo Modigliani||Portrait of the Artist's Wife||1918":"His wife Jeanne Hébuterne sits with her arm over the back of a chair. When Modigliani died the following year, Jeanne followed him two days later.","Amedeo Modigliani||The Young Apprentice||1918–1919":"Entered the Musée de l'Orangerie as part of the dealer Paul Guillaume's collection.","Marc Chagall||I and the Village||1911":"Painted in Paris as Chagall recalled his hometown of Vitebsk. A tiny milkmaid appears inside the head of the cow facing the green-faced man.","Marc Chagall||Birthday||1915":"The artist depicts himself twisting and floating up to kiss his beloved Bella, who has come with flowers on his birthday. A happy scene painted just before their marriage.","Marc Chagall||Over the Town||1914–1918":"Chagall and his wife Bella fly together over his hometown of Vitebsk. Look for the houses, fences and church spread out below.","Marc Chagall||White Crucifixion||1938":"It drew attention when Pope Francis named it his favourite painting.","Marc Chagall||Ceiling of the Palais Garnier||1964":"Can be seen on daytime guided tours of the theatre when there is no performance.","Marc Chagall||Le Message Biblique||1954–1967":"A museum Chagall himself helped to found, bringing together 17 large works on biblical themes.","Marc Chagall||Paris Through the Window||1913":"The Eiffel Tower and a parachutist appear through the window; in the foreground are a two-faced figure and a cat with a human face. A painting where Paris and his hometown merge.","Marc Chagall||Green Violinist||1923–1924":"A green-faced musician plays the violin on a rooftop. It reworks the musician from a mural Chagall painted for the Moscow Jewish Theatre.","Marc Chagall||America Windows||1977":"A stained-glass work made to mark the American Bicentennial.","Marc Chagall||Self-Portrait with Seven Fingers||1912–1913":"\"With seven fingers\" is a Yiddish expression meaning to do something skilfully. Paris appears through the window, his hometown in the clouds.","Marc Chagall||The Fiddler||1912–1913":"A green-faced musician plays the violin on the village rooftops. He depicts the fiddler who was indispensable at weddings and festivals in Eastern European Jewish villages.","Chaïm Soutine||Carcass of Beef||1925경":"A series inspired by Rembrandt's \"Slaughtered Ox\" (Louvre).","Chaïm Soutine||The Little Pastry Cook||1922–1923경":"A young pastry cook in white uniform, painted with rough, distorted brushwork. Soutine painted many cooks and pastry cooks around this time.","Chaïm Soutine||Page Boy at Maxim's||1927경":"A bellboy in red uniform at Maxim's restaurant in Paris. Soutine liked to paint people who worked in hotels and restaurants.","Chaïm Soutine||The Village||1923경":"A landscape painted during his stay in the south of France, its houses and roads bending as if swaying. The thick, violent brushwork shows the hallmarks of Soutine's Expressionism.","Marcel Duchamp||Fountain||1917":"The 1917 original is lost; replicas made in the 1960s are held by Tate Modern, the Centre Pompidou and elsewhere.","Marcel Duchamp||Nude Descending a Staircase, No. 2||1912":"The moving body is shown as a series of overlapping moments. The work became famous after causing a great scandal at the 1913 Armory Show in New York.","Marcel Duchamp||The Large Glass||1915–1923":"On two glass panels, using lead wire and paint among other materials, Duchamp depicted the bride above and the bachelors below. He accepted the cracks that formed in transit as part of the work.","Marcel Duchamp||Bicycle Wheel||1913":"The first readymade: a bicycle wheel mounted upside down on a kitchen stool. The 1913 original is lost; this is a version Duchamp remade in 1951.","Francis Picabia||Udnie (Young American Girl, The Dance)||1913":"A large work (290 × 300 cm) translating a dancer's performance, seen on a ship bound for New York in 1913, into near-abstract planes of colour. A key work of his Cubist and Orphist period, before Dada. It was also shown in \"The Cubists: Innovators of Vision\" (until 4 October), the 2026 opening exhibition of Centre Pompidou Hanwha in Seoul's Yeouido district.","Francis Picabia||Seins||1927":"Its current location could not be confirmed from public sources; it is most likely in a private collection.","Francis Picabia||Iris||1929경":"A work from the period of his \"Transparencies\" series, in which images such as faces, hands and flowers are layered translucently. A privately owned work that appeared at Christie's London in 2019.","Francis Picabia||Catch as Catch Can||1913":"The grappling movements of wrestlers are broken into fragments of colour planes and curves. An early work so close to abstraction that the figures are hard to make out.","Giorgio de Chirico||The Song of Love||1914":"A strange combination of a plaster head of Apollo, a rubber glove and a green ball. Famously, Magritte is said to have wept on seeing this painting.","Giorgio de Chirico||Mystery and Melancholy of a Street||1914":"A girl rolling a hoop runs down an empty street, the long shadow of an unseen figure cast before her. A key work of Metaphysical painting, steeped in uneasy stillness.","Giorgio de Chirico||Gare Montparnasse (The Melancholy of Departure)||1914":"Arcades, a clock tower and a distant train puffing smoke are set in a skewed perspective. Don't miss the bunch of bananas in the foreground.","Giorgio de Chirico||Ariadne||1913":"The ancient sculpture \"Sleeping Ariadne\" lies in an empty square, with a tower and a train behind. Long shadows deepen the afternoon stillness.","Max Ernst||Celebes||1921":"The huge elephant-like form was inspired by a photograph of an African grain bin in an anthropology journal. Note also the headless woman at lower right.","Max Ernst||The Robing of the Bride||1940":"Bird-like figures and women stand beside a bride wrapped in a red feather cloak. A similar bride reappears in the painting hanging on the wall.","Max Ernst||Two Children Are Threatened by a Nightingale||1924":"A wooden gate, a house and a knob actually project beyond the picture frame. An early Surrealist work combining painting and object.","Max Ernst||Europe after the Rain II||1940–1942":"A ruined, melting European landscape rendered with decalcomania, a technique of pressing paint and peeling it away. He completed it during the Second World War after fleeing to the United States.","Joan Miró||Harlequin's Carnival||1924–1925":"Small creatures, musical instruments and a ladder tumble together as if at a carnival. Miró said the painting came from hallucinations he had while starving in poverty.","Joan Miró||The Tilled Field||1923–1924":"Miró's family farm at Mont-roig, where a tree has an ear and an eye is set into the ground. The work marked his turning point towards Surrealism.","Joan Miró||The Hunter (Catalan Landscape)||1923–1924":"A pipe-smoking Catalan hunter, a sardine and the letters \"SARD\" are scattered as simple signs. Part of the fun is finding the signs one by one.","Joan Miró||Dog Barking at the Moon||1926":"A dog barks at the moon beneath a dark night sky, and a ladder reaches into the heavens. Simple forms convey both humour and loneliness.","Joan Miró||Blue II||1961":"The second of a large three-part series in which only black dots and a single red line sit on a broad blue field. Minimal elements create a vast sense of space.","Joan Miró||The Farm||1921–1922":"Bought and cherished by the novelist Ernest Hemingway.","Joan Miró||Self-Portrait I||1937–1938":"A self-portrait painted in Paris during the Spanish Civil War, the face drawn mainly in pencil line. The eyes, blazing like stars and flames, are striking.","Joan Miró||The Beautiful Bird Revealing the Unknown to a Pair of Lovers||1941":"One of the 23 works in the \"Constellations\" series.","René Magritte||The Treachery of Images||1929":"A realistically painted pipe sits above the words \"This is not a pipe\". A famous work questioning the difference between an image and a real object.","René Magritte||The Empire of Light||1950":"Part of a series of some twenty works; others are at the Magritte Museum in Brussels and the Peggy Guggenheim Collection in Venice.","René Magritte||The Son of Man||1964":"A green apple hides the face of a man in a bowler hat. Painted by Magritte as a self-portrait, it is in a private collection and rarely seen in person.","René Magritte||The Lovers||1928":"Two lovers kiss, their faces wrapped in cloth. Another version painted the same year is in the National Gallery of Australia.","René Magritte||Golconda||1953":"Men in bowler hats and overcoats float in the sky like raindrops. Look closely and each figure differs slightly in pose and size.","René Magritte||The False Mirror||1929":"A cloudy blue sky is reflected where the iris of a huge eye should be. Look at this strange scene in which the black pupil seems to float in the middle of the sky.","René Magritte||The Human Condition||1933":"A canvas on an easel in front of a window merges seamlessly with the view outside. A signature Magritte theme that questions the boundary between painting and reality.","René Magritte||Time Transfixed||1938":"A locomotive bursts out of a fireplace in one of Magritte's best-known works of dépaysement.","Salvador Dalí||The Persistence of Memory||1931":"A small painting, just over 33 cm wide, it surprises many people when they see it in person.","Salvador Dalí||The Burning Giraffe||1937":"A burning giraffe stands behind a woman with drawers protruding from her body. Dalí called the painting a premonition of the coming war.","Salvador Dalí||Metamorphosis of Narcissus||1937":"A double image in which Narcissus crouching by the water and a hand holding an egg share the same form. Dalí brought this painting with him when he met Freud in London.","Salvador Dalí||Soft Construction with Boiled Beans||1936":"A grotesque body that seems to tear itself apart expresses the horror of the Spanish Civil War. Painted a few months before the war broke out, it is also known as \"Premonition of Civil War\".","Salvador Dalí||Christ of Saint John of the Cross||1951":"An unusual viewpoint looking down from above on Christ on the cross. Inspired by a drawing by St John of the Cross, it shows the sea of Dalí's home, Portlligat, below.","Salvador Dalí||Lobster Telephone||1936":"An object made by placing a plaster lobster on a real telephone receiver. Several were made for the patron Edward James.","Salvador Dalí||Dream Caused by the Flight of a Bee around a Pomegranate a Second Before Awakening||1944":"A fish emerging from a pomegranate and a tiger leaping from the fish lunge at his sleeping wife, Gala. Look also for the spider-legged elephant in the background.","Salvador Dalí||The Sacrament of the Last Supper||1955":"A translucent Christ and his disciples gather beneath a huge dodecahedron. The sea in the background is Portlligat, where Dalí lived.","Frida Kahlo||The Two Fridas||1939":"A double self-portrait painted around the time of her divorce from Diego Rivera. The exposed hearts of the two Fridas are joined by a single blood vessel.","Frida Kahlo||Self-Portrait with Thorn Necklace and Hummingbird||1940":"A dead hummingbird hangs from a necklace of thorns, with a monkey and a black cat over her shoulders. Painted just after her divorce from Rivera.","Frida Kahlo||The Broken Column||1944":"Kahlo depicts the pain of having to wear a metal corset after spinal surgery. A broken column stands inside her split body, which is pierced all over with nails.","Frida Kahlo||Self-Portrait with Cropped Hair||1940":"She sits in a man's suit among her cut-off hair. Song lyrics above say, in effect, that without your hair I won't love you any more.","Edward Hopper||House by the Railroad||1925":"The Bates house in Alfred Hitchcock's film \"Psycho\" is said to have been inspired by this painting.","Edward Hopper||Automat||1927":"A woman sits alone at night in an automat, holding a coffee cup. A lonely scene in which only rows of ceiling lights are reflected in the black window.","Edward Hopper||Chop Suey||1929":"It sold at auction in 2018 for about $91.9 million, a record for Hopper.","Edward Hopper||Early Sunday Morning||1930":"Thanks to the bequest of Hopper's wife, Josephine, the Whitney Museum holds the largest collection of his work.","Edward Hopper||New York Movie||1939":"A female usherette stands lost in thought at the side of a cinema. Hopper's wife, Jo, posed as the model.","Edward Hopper||Nighthawks||1942":"Hopper's most famous work, bought by the Art Institute of Chicago soon after it was completed.","Edward Hopper||Gas||1940":"At dusk, a man checks a pump at a petrol station on a country road. The red pumps contrast with the darkening woods.","Grant Wood||American Gothic||1930":"A farmer and his daughter (often mistaken for a married couple) stand before a farmhouse with a Gothic window. The models were the artist's sister and his dentist; it is one of the most parodied paintings in America.","Grant Wood||Stone City, Iowa||1930":"The hills and village of his native Iowa are painted round and smooth like toys. An early landscape in which Wood established his Regionalist style.","Grant Wood||The Midnight Ride of Paul Revere||1931":"A legendary scene from the American Revolutionary War, seen from above like a toy village.","Grant Wood||Dinner for Threshers||1934":"Harvest workers gather at a farmhouse table for dinner, shown in a cutaway view of the house. Wood drew on childhood memories of Iowa farm life.","Andrew Wyeth||Wind from the Sea||1947":"A field is visible beyond a worn lace curtain billowing in the wind. Painted in tempera, it shows the view from a window of the Olson family house in Maine.","Andrew Wyeth||Christina's World||1948":"Wyeth's neighbour Christina Olson, unable to walk because of a muscular disorder, drags herself towards the house on the hill. One of MoMA's signature works.","Andrew Wyeth||Groundhog Day||1959":"A cup and plate sit on an empty kitchen table as winter sunlight shines outside. A tempera painting that conveys the owner's life without showing a person.","Andrew Wyeth||That Gentleman||1960":"An elderly Black man, Wyeth's neighbour, sits in a chair, painted in tempera. The wrinkled face and the texture of his clothes are finely rendered.","Jackson Pollock||Autumn Rhythm (Number 30)||1950":"A large-scale work using the drip technique, pouring and flinging paint onto a canvas laid on the floor. Black, white and brown lines form rhythms across the unprimed canvas.","Jackson Pollock||Lavender Mist||1950":"Despite the title, almost no lavender paint was used; layers of colour create a purplish haze. Pollock's handprints remain along the top edge.","Jackson Pollock||Blue Poles||1952":"Several blue poles stand at angles among tangled lines of paint. Its purchase by the Australian government at a then-record price sparked fierce debate.","Jackson Pollock||Number 1A, 1948||1948":"From the period when his drip technique matured, it bears several of Pollock's handprints at upper right.","Jackson Pollock||Convergence||1952":"Red, yellow and blue paint erupts and tangles over black and white lines. A large work from the end of his drip period.","Jackson Pollock||The She-Wolf||1943":"From before his drip period, the form of the wolf is hidden in thick paint and scribbled lines. It was the first Pollock acquired by the museum.","Jackson Pollock||One: Number 31, 1950||1950":"A large drip painting more than 5 metres wide.","Willem de Kooning||Woman I||1950–1952":"A woman baring her teeth, painted with rough brushwork. De Kooning completed it after nearly two years of repeatedly painting and scraping away.","Willem de Kooning||Excavation||1950":"Fragments of bodies and forms are densely tangled on a white ground. Step closer to see how the lines and patches of colour interlock.","Willem de Kooning||Attic||1949":"Fragments of form interlock, painted mainly in black and white. Look for traces of yellow and red left in between.","Willem de Kooning||Door to the River||1960":"An abstraction painted in broad, bold brushstrokes, from the period when de Kooning was moving towards landscape-like abstraction in the 1960s.","Mark Rothko||Rothko Chapel||1964–1967":"A meditative space whose design Rothko helped to shape, hung with 14 large paintings.","Mark Rothko||Seagram Murals||1958–1959":"Originally painted for the Four Seasons restaurant in New York, but Rothko withdrew from the commission. They hang in the Rothko Room at Tate Modern.","Mark Rothko||No. 61 (Rust and Blue)||1953":"Fields of colour with blurred edges are stacked one above the other. Rothko encouraged viewers to stand close, as if enveloped by the colour.","Mark Rothko||No. 14, 1960||1960":"A late work with large fields of colour placed one above another. The softly blurred fields grow deeper the longer you look at them up close.","Mark Rothko||Untitled (Black on Gray)||1969–1970":"One of the last series he painted shortly before his death.","Mark Rothko||No. 5/No. 22||1950":"A large work from Rothko's classic period, with layered fields of bright colour. Stand close to the painting and experience the colour enveloping you.","Mark Rothko||Light Red Over Black||1957":"A colour-field painting with bright red floating on a black ground. The blurred-edged fields look different depending on lighting and distance.","Barnett Newman||Vir Heroicus Sublimis||1950–1951":"A few thin vertical stripes divide a red canvas more than 5 metres wide. Newman wanted viewers to stand close to the painting.","Barnett Newman||Onement I||1948":"The first work to feature a single vertical line dividing the red ground – the so-called \"zip\". It was made by painting over masking tape.","Barnett Newman||The Stations of the Cross||1958–1966":"A series of 14 paintings in black and white only, hung together in one gallery.","Barnett Newman||Who's Afraid of Red, Yellow and Blue III||1966–1967":"Bands of blue and yellow sit at either end of a vast red field. In 1986 a visitor slashed it with a knife, and its restoration sparked controversy.","Andy Warhol||Campbell's Soup Cans||1962":"A set of 32 canvases depicting 32 flavours.","Andy Warhol||Gold Marilyn Monroe||1962":"After Monroe's death, Warhol silkscreened a single image of her face in the centre of a gold ground – a composition reminiscent of a religious icon.","Andy Warhol||Marilyn Diptych||1962":"Fifty images of Monroe's face, in colour on the left and black and white on the right. The images fade towards the right, alluding to death.","Andy Warhol||Orange Disaster #5||1963":"An electric chair from a newspaper photograph is repeated on an orange ground. Part of the Death and Disaster series, the empty execution chamber is chilling.","Andy Warhol||Double Elvis||1963":"Elvis Presley, aiming a gun, is printed twice, overlapping, on a silver ground. Warhol used a publicity still from a western.","Andy Warhol||Mao||1972":"Bright colours are applied like make-up over an official portrait photograph of Mao Zedong. A series begun around the time of Nixon's visit to China.","Andy Warhol||Brillo Soap Pads Box||1964":"Warhol silkscreened a supermarket detergent box exactly onto a wooden box, questioning the difference between art and merchandise.","Roy Lichtenstein||Look Mickey||1961":"His first work based on a comic.","Roy Lichtenstein||Drowning Girl||1963":"A scene from a romance comic, enlarged; the speech bubble shows a girl crying in the waves yet refusing to call for help. Look closely at the dots imitating printed Ben-Day dots.","Roy Lichtenstein||Whaam!||1963":"Across two panels, a fighter jet fires a missile and an enemy plane explodes. A scene from a war comic, enlarged.","Roy Lichtenstein||Hopeless||1963":"A weeping woman with a speech bubble, taken from a scene in a romance comic. Look closely at the dots and bold outlines.","Roy Lichtenstein||In the Car||1963":"A man and woman face each other tensely in a car. Diagonal lines streaming backwards convey the speed of the drive.","Roy Lichtenstein||Girl with Ball||1961":"A girl in a swimsuit holds a beach ball above her head. An early Pop Art work based on a newspaper advertisement for a resort.","Roy Lichtenstein||Blam||1962":"A fighter plane explodes and breaks apart under attack, painted in comic-book style. A large onomatopoeic word fills the picture.","David Hockney||A Bigger Splash||1967":"Part of Tate's collection, it is shown in rotation at Tate Modern and Tate Britain.","David Hockney||Mr and Mrs Clark and Percy||1970–1971":"The fashion designer Ossie Clark and his wife, the textile designer Celia Birtwell, with their cat Percy. Hockney was best man at their wedding.","David Hockney||Portrait of an Artist (Pool with Two Figures)||1972":"In 2018 it set the auction record for a work by a living artist.","David Hockney||Peter Getting Out of Nick's Pool||1966":"His lover Peter climbs out of a swimming pool in Los Angeles. Based on a photograph, it has a white border that makes it look like an instant photo.","Jean-Michel Basquiat||Untitled (Skull)||1981":"Tangled lines and colours are exposed inside a skull-like head. A key early work from when Basquiat was beginning his career as an artist in earnest.","Jean-Michel Basquiat||Horn Players||1983":"A tribute to jazz musicians such as Charlie Parker and Dizzy Gillespie.","Jean-Michel Basquiat||Hollywood Africans||1983":"Basquiat depicts his time in Hollywood with fellow artist friends. Words written across it critique the stereotyped roles given to Black actors.","Jean-Michel Basquiat||Untitled||1982":"In 2017 it was bought at auction by the Japanese businessman Yusaku Maezawa for about $110.5 million.","Jean-Michel Basquiat||Six Crimee||1982":"Rough figures, words and symbols are layered across the canvas. Basquiat said that crossing words out makes them stand out even more.","Jean-Michel Basquiat||Obnoxious Liberals||1982":"Rough figures and words overlap to take aim at issues of race, money and power. Read the words written throughout the canvas.","Jean-Michel Basquiat||Charles the First||1982":"A tribute to the jazz saxophonist Charlie Parker.","Keith Haring||Tuttomondo||1989":"One of his last public murals, painted a year before his death; it is on the outside wall of a church, so anyone can see it.","Keith Haring||Crack Is Wack||1986":"An anti-drug mural that remains on the wall of a handball court beside the highway.","Keith Haring||Tower (Necker Children's Hospital)||1987":"A mural on the stair tower on the outside of the Necker Children's Hospital in Paris, intended to give children hope.","Keith Haring||We the Youth||1987":"A street mural painted together with young people from Philadelphia.","Anselm Kiefer||Germany's Spiritual Heroes||1973":"Flames burn in a vast, wooden attic-like space, with the names of figures from German culture written on the floor. An early work dealing with the weight of German history.","Anselm Kiefer||Osiris and Isis||1985–1987":"A circuit board sits atop a huge pyramid, with copper wires linking scattered fragments. It addresses the Egyptian myth of the resurrection of Osiris.","Anselm Kiefer||Bohemia Lies by the Sea||1996":"An endless road and a field of poppies are painted with thick paint and other materials. The title comes from a poem by Ingeborg Bachmann.","Anselm Kiefer||Let a Thousand Flowers Bloom||2000":"A large work showing Mao Zedong standing among flowers. The title twists Mao's slogan \"Let a hundred flowers bloom\", recalling the repression behind its apparent optimism.","Giotto di Bondone||Crucifix of Santa Maria Novella||1290–1295경":"A monumental painted cross showing Christ as a heavy, sagging human body, an early break from Byzantine convention. It hangs above the nave of the church.","Giotto di Bondone||Badia Polyptych||1300경":"A five-part altarpiece of the Virgin and Child with four saints, made for the Badia Fiorentina. Note the solid, sculptural figures against the gold ground.","Giotto di Bondone||Adoration of the Magi||1305경":"The Magi kneel before the Christ Child, while the Star of Bethlehem is painted as a blazing comet, often linked to Halley's Comet of 1301.","Giotto di Bondone||Meeting at the Golden Gate||1305경":"Joachim and Anne, parents of the Virgin, meet and kiss at the gate of Jerusalem; their merging profiles convey deep tenderness.","Masaccio||Saint Peter Healing the Sick with His Shadow||1425경":"Saint Peter walks down a street and the sick are healed as his shadow falls on them; the buildings recall a real Florentine street.","Masaccio||Crucifixion||1426":"Once the top panel of the Pisa Altarpiece; Mary Magdalene, seen from behind with arms flung wide, expresses raw grief. Christ's head, sunk into his shoulders, is thought to allow for viewing from below.","Masaccio||Virgin and Child with Saint Anne||1424경":"Saint Anne sits behind the Virgin and Child in this altarpiece painted with Masolino; the weighty Virgin and Child are attributed to Masaccio.","Sandro Botticelli||Calumny of Apelles||1495경":"A recreation, from ancient texts, of a lost painting by Apelles: an innocent man is dragged before a king whose ears are filled by Ignorance and Suspicion.","Sandro Botticelli||Pallas and the Centaur||1482경":"Pallas grasps a centaur by the hair, often read as reason taming instinct. Her gown is patterned with the Medici diamond-ring emblem.","Sandro Botticelli||Madonna of the Magnificat||1483경":"In this tondo the Virgin, surrounded by angels, writes the Magnificat hymn in a book; the figures curve to follow the round format.","Sandro Botticelli||Portrait of a Man with a Medal of Cosimo the Elder||1475경":"A young man holds a medal bearing the profile of Cosimo de' Medici; the medal is a real gilded gesso cast set into the panel.","Leonardo da Vinci||Adoration of the Magi||1481–1482":"Left unfinished when Leonardo moved to Milan, this altarpiece reveals his underdrawing; a swirling crowd surrounds the Virgin and Child before ruined architecture.","Leonardo da Vinci||La Belle Ferronnière||1490–1497경":"A woman with a fine band across her forehead glances past the viewer. Painted in Leonardo's Milan years, the sitter's identity remains uncertain.","Leonardo da Vinci||Saint John the Baptist||1513–1516경":"Saint John emerges from darkness, smiling and pointing upward. A late work, it shows Leonardo's soft sfumato modelling at its most pronounced.","Michelangelo Buonarroti||Bacchus||1496–1497":"A marble of the wine god swaying in drunkenness, Michelangelo's first large work in Rome. Look behind him for the small satyr eating grapes.","Michelangelo Buonarroti||Pitti Tondo||1503–1505경":"A circular marble relief of the Virgin, Child and infant John the Baptist; its rough, unfinished surfaces heighten the sense of depth.","Michelangelo Buonarroti||Rebellious Slave||1513–1516":"Carved for the tomb of Pope Julius II, a bound captive twists against his bonds. It is displayed with its companion, the \"Dying Slave\".","Michelangelo Buonarroti||The Fall and Expulsion from Garden of Eden||1509–1510경":"A scene from the Sistine Chapel ceiling: at left Eve takes the forbidden fruit from the serpent coiled round the tree while Adam reaches for it himself; at right an angel drives them out of Eden.","Raffaello Sanzio||The Deposition||1507":"Christ's body is carried to the tomb in an altarpiece commissioned by Atalanta Baglioni of Perugia in memory of her murdered son; it was secretly removed to Rome in 1608.","Raffaello Sanzio||La Belle Jardinière||1507":"The Virgin sits in a flowering meadow with the Christ Child and the young John the Baptist, arranged in the pyramidal composition of Raphael's Florentine period.","Raffaello Sanzio||Madonna of the Meadow||1505–1506경":"The Virgin watches over the Christ Child and young John the Baptist in a green landscape, in a triangular composition influenced by Leonardo.","Raffaello Sanzio||Portrait of Pope Leo X with Two Cardinals||1518":"Pope Leo X, a Medici, is shown with two cardinal cousins. Note the illuminated manuscript, the magnifying glass and the window reflected in the chair finial.","Giorgione||Portrait of a Young Man (Giustiniani Portrait)||1505경":"A young man behind a parapet, his head turned slightly, in one of the few securely attributed portraits by Giorgione. Soft modelling of light and shade brings out his delicate expression.","Giorgione||The Old Woman||1506경":"An aged woman gestures to herself and meets our gaze, holding a scroll inscribed \"COL TEMPO\" (with time), a reminder of time's passing.","Giorgione||Adoration of the Shepherds||1505–1510경":"Two shepherds kneel before the Christ Child at the mouth of a cave, with a broad landscape at left. It is also called the Allendale Nativity after a former owner.","Titian||Pesaro Madonna||1519–1526":"Jacopo Pesaro and his family kneel before the Virgin and Child. Placing the Virgin off-center, high at right, was a bold innovation.","Titian||Flora||1515경":"A young woman holds out flowers while clutching a slipping white chemise; her golden hair and soft skin show Venetian colour at its finest.","Titian||Pietà||1575–1576":"Titian's last painting, intended for his own tomb, was completed after his death by Palma il Giovane. Its rough, finger-worked brushwork conveys profound grief.","Jan van Eyck||Léal Souvenir||1432":"A man is shown behind a stone parapet painted to look carved with the words \"LEAL SOUVENIR\" (loyal remembrance); the sitter is named only as \"Tymotheos\".","Jan van Eyck||Annunciation||1434–1436경":"Gabriel greets Mary inside a lofty church. Their words appear in gold letters, and Mary's reply is written upside down so that God above can read it.","Jan van Eyck||Crucifixion and Last Judgement diptych||1430–1440경":"The left wing shows the Crucifixion at Golgotha, the right the Last Judgement divided between heaven and hell, with countless minutely painted figures.","Hieronymus Bosch||The Adoration of the Magi||1494경":"The central panel of this triptych shows the Magi presenting gifts to the Christ Child; a mysterious half-naked figure in the stable doorway adds Bosch's characteristic strangeness.","Hieronymus Bosch||Death and the Miser||1485–1490경":"A dying miser hesitates between an angel and a bag of gold even as Death enters the door. The tall, narrow panel was probably once part of a triptych wing.","Hieronymus Bosch||The Extraction of the Stone of Madness||1500경":"A quack wearing a funnel hat 'removes' a stone of folly from a man's head, a satire on gullibility, framed by ornate lettering above and below.","Albrecht Dürer||Great Piece of Turf||1503":"A clump of wild grasses, dandelions and plantain observed at ground level in watercolour, one of the earliest pure nature studies in Western art.","Albrecht Dürer||Paumgartner Altarpiece||1500–1503경":"The central panel shows the Nativity among ruins; the wings show Saints George and Eustace, traditionally identified as portraits of the Paumgartner brothers.","Albrecht Dürer||Knight, Death and the Devil||1513":"An armoured knight rides steadfastly past Death holding an hourglass and a grotesque devil. With \"Saint Jerome in His Study\" and \"Melencolia I\" it is one of Dürer's three master engravings.","Hans Holbein the Younger||Portrait of Jane Seymour||1536–1537":"A portrait of Jane Seymour, third wife of Henry VIII, with her pearl-trimmed hood, gold-embroidered fabrics and jewels rendered in exquisite detail.","Hans Holbein the Younger||Portrait of Anne of Cleves||1539":"Painted to show Henry VIII his prospective bride, this frontal portrait is famous because the king was disappointed in person and the marriage was soon annulled.","Hans Holbein the Younger||Portrait of Georg Gisze||1532":"A German merchant in London is shown in his office crowded with letters, scales and a vase of flowers; note the finely painted Oriental carpet on the table.","Hans Holbein the Younger||A Lady with a Squirrel and a Starling||1526–1528경":"A woman in a fur hat holds a pet red squirrel on a chain, with a starling behind her shoulder. It dates from Holbein's first stay in England.","Pieter Bruegel the Elder||The Triumph of Death||1562경":"An army of skeletons sweeps across a barren land, driving people of every rank to death. Look for the different fates of king, cardinal and peasant.","Pieter Bruegel the Elder||Children's Games||1560":"Children fill a town square playing more than eighty games, from hoops to hobby horses, making the picture an encyclopedia of sixteenth-century play.","Pieter Bruegel the Elder||The Parable of the Blind||1568":"Illustrating the biblical parable, six blind men walk in a line; the leader has fallen into a ditch and those behind are about to follow one after another.","Pieter Bruegel the Elder||The Census at Bethlehem||1566":"The biblical census is set in a snowy Flemish village; Mary on a donkey and Joseph are almost lost among the busy villagers.","Jacopo Pontormo||Supper at Emmaus||1525":"Painted for the Certosa near Florence, the risen Christ breaks bread with two disciples beneath a single all-seeing eye, symbol of the Trinity.","Jacopo Pontormo||Portrait of Cosimo the Elder||1519–1520경":"A posthumous portrait of the founder of Medici power; the laurel branch and its inscribed scroll allude to the family's continuing flourishing.","Jacopo Pontormo||Portrait of Alessandro de' Medici||1534–1535":"Alessandro, first Duke of Florence, dressed in black, draws a woman's profile; it was painted a few years before his assassination by a cousin in 1537.","Parmigianino||Cupid Making His Bow||1533–1535":"Cupid, seen from behind, carves his bow while standing on books, with two putti between his legs; it is read as love triumphing over learning.","Parmigianino||Madonna of the Rose||1529–1530":"The Christ Child leans across the Virgin's lap, resting on a globe and holding a rose; the elongated limbs show Parmigianino's characteristic elegance.","Parmigianino||Portrait of Galeazzo Sanvitale||1524":"Galeazzo Sanvitale, lord of Fontanellato, looks out holding a medal; Parmigianino painted it in his early twenties.","Agnolo Bronzino||Portrait of Bia de' Medici||1542경":"Bia, young daughter of Cosimo I, died in 1542 at about the age of five. The medal on her necklace bears her father's profile.","Agnolo Bronzino||Portrait of Bartolomeo Panciatichi||1540경":"A portrait of the Florentine humanist and politician Bartolomeo Panciatichi, pendant to that of his wife Lucrezia; the family arms appear on the corner of the building behind.","Agnolo Bronzino||Portrait of Ugolino Martelli||1536–1537경":"The young humanist Ugolino Martelli rests his hand on a volume of Homer; a courtyard with a statue of David appears behind him.","El Greco||The Holy Trinity||1577–1579":"God the Father, surrounded by angels, holds the dead Christ beneath the dove of the Holy Spirit; it was among El Greco's first major Spanish commissions.","El Greco||Saint Martin and the Beggar||1597–1599":"The Roman soldier Martin cuts his cloak with his sword to share it with a naked beggar; it was painted for a chapel in Toledo.","El Greco||Fray Hortensio Félix Paravicino||1609":"A portrait of the poet and preacher Paravicino, a friend of the artist; his black-and-white habit frames an alert, intelligent face painted with rapid strokes.","Caravaggio||Conversion on the Way to Damascus||1601":"Saul lies thrown from his horse, arms open to a blinding light. It faces the \"Crucifixion of Saint Peter\" across the Cerasi Chapel.","Caravaggio||Rest on the Flight into Egypt||1597경":"An angel plays the violin for the sleeping Virgin and Child while Joseph holds the score; it is one of Caravaggio's few early works with a landscape.","Caravaggio||David with the Head of Goliath||1610경":"Young David holds up Goliath's severed head, widely seen as Caravaggio's self-portrait. It dates from his final years while he sought a pardon for murder.","Caravaggio||The Inspiration of Saint Matthew||1602":"Above the Contarelli Chapel altar, Matthew turns to an angel dictating his Gospel. This is the second version, painted after the first was rejected.","Artemisia Gentileschi||Judith and Her Maidservant||1613–1614경":"Moments after killing Holofernes, Judith and her maid turn warily toward a sound; the severed head lies in the basket the maid carries.","Artemisia Gentileschi||Self-Portrait as Saint Catherine of Alexandria||1615–1617경":"Artemisia portrays herself as the martyr Saint Catherine, her hand on the broken wheel. The National Gallery acquired it in 2018.","Artemisia Gentileschi||Esther before Ahasuerus||1628–1630경":"Esther, risking her life to save her people, faints before the king, who starts up from his throne in his splendid costume.","Peter Paul Rubens||Samson and Delilah||1609–1610경":"As Samson sleeps in Delilah's lap a servant cuts his hair, with Philistine soldiers waiting at the door. It was painted for the Antwerp house of Nicolaas Rockox.","Peter Paul Rubens||The Honeysuckle Bower||1609경":"Rubens painted himself with his first wife, Isabella Brant, around their marriage, seated beneath honeysuckle; their joined hands signify marital union.","Peter Paul Rubens||The Consequences of War||1637–1638":"Mars breaks from Venus's embrace and tramples the arts and family life, an allegory Rubens painted with Europe's suffering in the Thirty Years' War in mind.","Anthony van Dyck||Lord John Stuart and His Brother, Lord Bernard Stuart||1638경":"Painted before the young brothers left on a European tour, their silks and haughty poses epitomize Cavalier elegance; both later died fighting in the Civil War.","Anthony van Dyck||The Five Eldest Children of Charles I||1637":"The king's five eldest children, centred on the future Charles II with his hand on a great dog; it was commissioned by Charles I himself.","Anthony van Dyck||Self-Portrait||1620–1621경":"Van Dyck portrays himself at about twenty with self-assured poise, around the time he worked as Rubens's assistant.","Frans Hals||The Banquet of the Officers of the St George Militia Company in 1616||1616":"Hals's first large group portrait shows Haarlem militia officers around a banquet table, each turning and gesturing to create a lively scene.","Frans Hals||Regentesses of the Old Men's Almshouse||1664":"Hals painted the four women governors of Haarlem's almshouse, with their maid, in his eighties; their black dresses and white collars are rendered with bold, free strokes.","Frans Hals||Willem van Heythuysen Posing with a Sword||1625경":"A wealthy Haarlem textile merchant poses proudly with a sword; it is Hals's only known life-size, full-length portrait.","Frans Hals||Catharina Hooft and Her Nurse||1619–1620경":"A richly dressed infant sits in her nurse's arms as the nurse offers an apple, a tender moment captured with lively brushwork.","Rembrandt van Rijn||Aristotle with a Bust of Homer||1653":"Aristotle rests his hand on a bust of Homer, lost in thought. Commissioned by the Sicilian nobleman Antonio Ruffo, it was bought by the Met in 1961 for a record price.","Rembrandt van Rijn||Bathsheba at Her Bath||1654":"A life-size Bathsheba sits holding King David's letter, absorbed in thought; Rembrandt's companion Hendrickje Stoffels is often thought to have modelled.","Rembrandt van Rijn||Belshazzar's Feast||1635–1638경":"King Belshazzar turns in shock as a hand writes Hebrew letters on the wall during his feast; dramatic light and spilling vessels capture the moment.","Diego Velázquez||The Triumph of Bacchus||1628–1629":"Bacchus, wearing a vine wreath, crowns a kneeling young man with ivy amid a group of Spanish drinkers, treating myth as an everyday scene; it is popularly known as \"Los Borrachos\".","Diego Velázquez||Apollo in the Forge of Vulcan||1630":"Apollo appears in Vulcan's forge to reveal Venus's infidelity, startling the muscular smiths. Velázquez painted it in Rome during his first Italian journey.","Diego Velázquez||Christ Crucified||1632경":"Christ hangs alone on the cross against a dark ground, calm and restrained; hair falls across half of his face.","Diego Velázquez||Infanta Margarita Teresa in a Blue Dress||1659":"Painted for the Vienna court of her future husband, Leopold I, the infanta appears aged about eight; up close her dress dissolves into loose brushwork.","Johannes Vermeer||Woman Holding a Balance||1664경":"A woman tests an empty balance before a painting of the Last Judgement, contrasting the pearls and gold on the table with eternal values.","Johannes Vermeer||Young Woman with a Water Pitcher||1662경":"A woman in a white headdress opens a window with one hand and holds a pitcher with the other; soft light falls across her linen and the silver basin.","Johannes Vermeer||The Procuress||1656":"An early, signed and dated genre scene of a brothel transaction; the grinning man at left is sometimes thought to be the artist himself.","Johannes Vermeer||Woman with a Pearl Necklace||1662–1665경":"A woman in a yellow fur-trimmed jacket ties the ribbons of her pearl necklace before a mirror; the bare white wall creates a hushed stillness.","Nicolas Poussin||A Dance to the Music of Time||1634–1636경":"Four figures dance in a ring to Father Time's lyre, symbolizing the cycle of life and fortune. Anthony Powell's novel sequence takes its title from this painting.","Nicolas Poussin||Self-Portrait||1650":"Poussin faces us before stacked canvases in a self-portrait made for his Paris patron Paul Fréart de Chantelou; the woman in the background picture is read as an allegory of Painting.","Nicolas Poussin||Landscape with the Ashes of Phocion||1648":"Phocion's widow secretly gathers the ashes of the unjustly executed Athenian general within a serene classical landscape; its companion, \"The Funeral of Phocion\", is in Cardiff.","Jean-Antoine Watteau||Fêtes Vénitiennes||1718–1719경":"A fête galante of couples dancing to music in a garden. The man playing the musette on the right is traditionally identified as Watteau himself.","Jean-Antoine Watteau||The Scale of Love||1717–1718경":"A guitarist and a woman holding sheet music sit among couples in a park, a classic Watteau use of music as a metaphor for love.","Jean-Antoine Watteau||The Surprise||1718경":"A couple locked in an embrace while Mezzetin, holding a guitar, looks on. Long known only through prints, the original resurfaced in the 2000s.","François Boucher||The Toilet of Venus||1751":"Venus at her toilette surrounded by cupids, painted for Madame de Pompadour's bathroom at the Château de Bellevue.","François Boucher||Venus Consoling Love||1751":"Venus, reclining with doves, caresses the young Cupid; the painting is believed to have been made for Madame de Pompadour.","François Boucher||The Rising of the Sun||1753":"Apollo rises from among the sea nymphs at dawn. Designed as a tapestry cartoon, it hangs with its pendant, \"The Setting of the Sun.\"","Jean-Honoré Fragonard||Coresus Sacrificing Himself to Save Callirhoe||1765":"The priest Coresus turns the knife on himself to spare the woman he loves. Acclaimed at the Salon of 1765, it secured Fragonard's admission to the Academy.","Jean-Honoré Fragonard||Portrait of Denis Diderot||1769경":"One of the \"fantasy figures,\" dashed off with rapid brushwork: a man turning from the pages of a book, traditionally but not certainly identified as Denis Diderot.","Jean-Honoré Fragonard||The Love Letter||1770년대":"A young woman glances up, holding a letter tucked into a bouquet. The writing on the letter has prompted various theories about her identity.","Jean-Honoré Fragonard||The See-Saw||1750–1752경":"An early work showing young people at play on a see-saw in a wooded park, still strongly marked by his teacher Boucher.","Jean-Baptiste-Siméon Chardin||Boy with a Spinning-Top||1738":"A boy gazes intently at a top spinning on his desk. The sitter is Auguste-Gabriel Godefroy, son of a Paris jeweller.","Jean-Baptiste-Siméon Chardin||The Brioche||1763":"A brioche crowned with a sprig of orange blossom, set with fruit and a sweet dish; a late still life of soft light and texture.","Jean-Baptiste-Siméon Chardin||The Buffet||1728":"An opulent still life of silver and fruit enlivened by a parrot and a dog; with \"The Ray,\" it was his reception piece for the Royal Academy.","Élisabeth Vigée Le Brun||Self-Portrait||1790":"Painted in exile in Italy for the Uffizi's collection of artists' self-portraits; she shows herself at work on a portrait of Marie Antoinette.","Élisabeth Vigée Le Brun||Madame Grand||1783":"The future wife of Talleyrand gazes upward in this portrait, shown at the Salon of 1783.","Élisabeth Vigée Le Brun||Peace Bringing Back Abundance||1780":"An allegory personifying Peace and Abundance as two women; it served as her reception piece at the Royal Academy in 1783.","Jacques-Louis David||The Intervention of the Sabine Women||1799":"Hersilia throws herself between the warring Romans and Sabines, a scene read as a plea for reconciliation after the Revolution.","Jacques-Louis David||The Lictors Bring to Brutus the Bodies of His Sons||1789":"The Roman consul Brutus, who condemned his own sons for treason, as their bodies are carried home; shown at the Salon in the revolutionary year 1789.","Jacques-Louis David||The Emperor Napoleon in His Study at the Tuileries||1812":"The clock reads 4:13 a.m. and the candles have burned low, presenting Napoleon as a ruler who has worked through the night on his legal code.","Jacques-Louis David||Leonidas at Thermop
