ed in fur against a background of laurel branches. An inscription on the back confirms its date, which is rare among Giorgione's works.","Titian||Venus of Urbino||1538":"Venus lies on a bed gazing at the viewer, a dog asleep at her feet and maids searching a chest in the background. The painting later inspired Manet's \"Olympia\".","Titian||Assumption of the Virgin||1516–1518":"A huge altarpiece still hanging on the church's high altar, arranged in three tiers: the apostles, the Virgin ascending, and God the Father. From the church entrance, the painting comes into view through the arch of the choir screen.","Titian||Bacchus and Ariadne||1520–1523":"Bacchus leaps from his chariot drawn by cheetahs as Ariadne turns in surprise. In the sky at upper left is the constellation that became Ariadne's crown.","Titian||Sacred and Profane Love||1514경":"A clothed woman and a nude woman sit on the edge of a fountain, with Cupid stirring the water between them. The present title was given later, and its exact meaning is disputed.","Titian||Equestrian Portrait of Charles V||1548":"The emperor, victorious over the Protestant League at the Battle of Mühlberg, is portrayed on horseback in armor. The painting became a model for later Spanish court portraiture.","Titian||Man with a Glove||1520경":"A portrait of a young man in black holding a glove in one hand; the sitter has not been identified. His face, white shirt and hands emerge softly from the dark background.","Titian||Danaë||1560–1565경":"Titian painted this subject several times. The first \"Danaë\" of the \"poesie\", the series of mythological paintings sent to Philip II, is at Apsley House in London; the Prado version was painted later.","Titian||Diana and Actaeon||1556–1559":"Jointly owned by the National Gallery, London and the National Galleries of Scotland, it is displayed alternately at the two venues.","Jan van Eyck||Arnolfini Portrait||1434":"The convex mirror on the back wall reflects the figures in the room, and above it is the Latin signature \"Jan van Eyck was here\". Be sure to look at the mirror up close.","Jan van Eyck||Ghent Altarpiece||1432":"A huge altarpiece made up of many panels, with the Adoration of the Lamb in the lower center. The \"Just Judges\" panel at lower left was stolen in 1934 and a copy now hangs in its place.","Jan van Eyck||Madonna of Chancellor Rolin||1435경":"The kneeling Chancellor Rolin faces the Virgin and Child in the same space. The river and city view beyond the arches are astonishingly detailed, so look closely.","Jan van Eyck||Portrait of a Man in a Red Turban||1433":"Thought to be the artist's self-portrait.","Hieronymus Bosch||The Garden of Earthly Delights||1490–1510경":"A triptych running from the Garden of Eden on the left, through humanity lost in pleasure in the center, to Hell on the right. When the wings are closed, a scene of the Creation painted in grisaille appears.","Hieronymus Bosch||The Haywain Triptych||1516경":"A triptych satirizing worldly greed through people fighting to claim a share of a haystack. The wagon is heading towards Hell on the right.","Hieronymus Bosch||Triptych of the Temptation of St. Anthony||1501경":"A triptych in which grotesque demons and monsters swarm around the praying Saint Anthony. Searching for the strange creatures hidden in every corner is part of the fun.","Hieronymus Bosch||The Ship of Fools||1500경":"Monks and nuns eating, drinking and carousing on a boat satirize the corruption of the clergy. It is thought to have originally been part of a larger altarpiece.","Albrecht Dürer||Self-Portrait||1500":"A self-portrait whose strict frontal composition recalls images of Christ. Note the hand stroking the fur collar and the hair painted strand by strand.","Albrecht Dürer||Young Hare||1502":"A detailed watercolor study showing every hair. Because it is sensitive to light, the original is shown only briefly in special exhibitions every few years.","Albrecht Dürer||The Four Apostles||1526":"Four saints are divided across two panels; the artist donated the work to the Nuremberg city council. Biblical passages are inscribed at the bottom.","Albrecht Dürer||Adam and Eve||1507":"Adam and Eve are each painted life-size on separate panels. Regarded as the first life-size nudes in German painting, they reflect the artist's interest in ideal human proportions.","Albrecht Dürer||Melencolia I||1514":"As an engraving, it exists in multiple impressions held by several collections, including the Metropolitan Museum of Art and the British Museum.","Albrecht Dürer||Self-Portrait with a Thistle||1493":"Painted at the age of 22, it is one of the earliest independent self-portraits in the history of European painting.","Albrecht Dürer||Self-Portrait (1498)||1498":"A self-portrait in which the artist presents himself as a gentleman, in fine clothes and gloves. An Alpine landscape is visible through the window on the right.","Albrecht Dürer||Praying Hands||1508":"A study of an apostle's hands for an altarpiece. As a work on paper, it is rarely displayed.","Hans Holbein the Younger||The Ambassadors||1533":"The skull slanting across the bottom of the painting takes its proper shape when viewed at an angle from the right.","Hans Holbein the Younger||Portrait of Sir Thomas More||1527":"Painted during Holbein's stay in England, the portrait excels in rendering the textures of the red velvet sleeves and gold chain. The same museum also owns a portrait of More's political enemy, Thomas Cromwell.","Hans Holbein the Younger||The Body of the Dead Christ in the Tomb||1520–1522":"A long, narrow painting of the dead Christ lying in the tomb, at life size. Dostoevsky was deeply shaken on seeing it and included it in his novel \"The Idiot\".","Hans Holbein the Younger||Portrait of Erasmus||1523":"A portrait with a similar composition is in the Louvre.","Hans Holbein the Younger||Portrait of Henry VIII||1537경":"A small panel portrait conveying the king's majesty through sumptuous clothing and jewels. It is regarded as virtually the only surviving portrait of Henry VIII painted by Holbein himself.","Hans Holbein the Younger||Portrait of Thomas Cromwell||1532–1533":"At the Frick Collection it hangs facing the portrait of Cromwell's political enemy, Thomas More.","Hans Holbein the Younger||Christina of Denmark, Duchess of Milan||1538":"A full-length portrait painted when Holbein was sent to portray a prospective bride for Henry VIII.","Pieter Bruegel the Elder||The Hunters in the Snow||1565":"Beyond the hunters and their dogs returning from the hunt, people are playing on a frozen pond. It is one of a series depicting the changing seasons.","Pieter Bruegel the Elder||The Tower of Babel||1563":"The Kunsthistorisches Museum in Vienna holds the world's largest collection of Bruegel's works.","Pieter Bruegel the Elder||The Peasant Wedding||1567경":"Look for the bride seated before a green cloth wearing a paper crown, and the men carrying food on a door. The boisterous mood of a country feast is vividly captured.","Pieter Bruegel the Elder||The Harvesters||1565":"Peasants work, rest and eat lunch in a wheat field in high summer. It is one of the series of the seasons; the other works in the series are mostly in the Kunsthistorisches Museum in Vienna.","Pieter Bruegel the Elder||Netherlandish Proverbs||1559":"More than 100 Netherlandish proverbs are illustrated within a single village. Guessing which proverb each figure represents is part of the fun.","Pieter Bruegel the Elder||Landscape with the Fall of Icarus||1560년대":"The prevailing view is that it is a copy of an original by Bruegel.","Pieter Bruegel the Elder||The Fight Between Carnival and Lent||1559":"Fat Carnival, astride a barrel, confronts lean Lent in this depiction of the contrast between feasting and the period of fasting. Look at the games and customs throughout the square.","Jacopo Pontormo||Deposition from the Cross||1525–1528":"An altarpiece still hanging in the Capponi Chapel, with pale, brightly colored figures intertwined as if floating in the air, without a cross. The bearded man at the far right is thought to be the artist's self-portrait.","Jacopo Pontormo||The Visitation||1528–1529":"Mary and Elizabeth approach each other while the two women behind them gaze straight out. The intense, bright colors exemplify Mannerist painting.","Jacopo Pontormo||Portrait of a Halberdier||1528–1530경":"A half-length portrait of a young soldier holding a halberd, marked by a somewhat tense expression and an elegantly elongated body. The sitter's identity is uncertain.","Jacopo Pontormo||Joseph in Egypt||1515–1518경":"Several episodes from the story of Joseph are combined in one picture, painted to decorate the bedchamber of the Borgherini family in Florence. The boy seated on the steps is thought to be the artist's pupil Bronzino.","Parmigianino||Madonna with the Long Neck||1535–1540":"The Virgin's elongated neck and fingers and the infant Jesus on her lap exemplify Mannerism. Left unfinished, the column at the back right stands alone.","Parmigianino||Self-portrait in a Convex Mirror||1524경":"Painted on a round, convex wooden panel, it shows the artist as reflected in a convex mirror. Note the greatly distorted hand in the foreground.","Parmigianino||Antea||1535경":"A portrait of a young woman wrapped in fur and looking straight out; her identity remains unknown. The detailed rendering of her clothing and jewelry stands out.","Parmigianino||The Vision of Saint Jerome||1526–1527":"An altarpiece painted in Rome; Vasari relates that the artist was still absorbed in this work when soldiers burst in during the Sack of Rome in 1527.","Agnolo Bronzino||Venus, Cupid, Folly and Time||1545경":"An enigmatic allegory with personified figures surrounding Venus and Cupid. It is said that Cosimo I de' Medici gave it to King Francis I of France.","Agnolo Bronzino||Portrait of Eleanor of Toledo||1545경":"An official portrait of Cosimo I's wife seated with her young son. The highlight is the rendering of her sumptuous silk dress patterned with pomegranates.","Agnolo Bronzino||Portrait of a Young Man||1530년대":"A portrait of a young man holding a book; his cool, aristocratic expression is typical of Bronzino's portraits. Look also for the grotesque faces carved on the table and chair.","Agnolo Bronzino||Portrait of Lucrezia Panciatichi||1545경":"A portrait of a noblewoman holding an open book; her necklace is inscribed in French with words meaning \"love lasts without end\". The smooth skin and the texture of the fabrics stand out.","El Greco||The Burial of the Count of Orgaz||1586–1588":"The lower part of the painting shows the earthly scene of saints burying the count's body, and the upper part the heavenly scene of his soul rising to heaven. It still hangs in the church for which it was painted.","El Greco||View of Toledo||1599–1600경":"Toledo under a stormy sky, one of El Greco's rare landscapes. Rather than following the actual layout of the buildings, he rearranged them dramatically.","El Greco||El Expolio||1577–1579":"Christ in a red robe, surrounded by a crowd, at the moment he is about to be stripped of his garments. It hangs in the cathedral sacristy, and its intense red dominates the composition.","El Greco||The Opening of the Fifth Seal||1608–1614":"The scene from the Book of Revelation in which the martyrs receive white robes, with elongated figures stretching their arms toward heaven. The work is unfinished and influenced Picasso's \"Les Demoiselles d'Avignon\".","El Greco||The Nobleman with his Hand on his Chest||1580경":"A portrait of a gentleman in black with his hand on his chest; the sitter has not been identified. The gesture is interpreted as signifying an oath or loyalty, and the hilt of a sword is also visible.","El Greco||Cardinal Fernando Niño de Guevara||1600경":"A portrait capturing the piercing gaze of the cardinal, who served as Grand Inquisitor.","El Greco||Laocoön||1610–1614경":"El Greco's only mythological painting, with a view of Toledo in the background.","El Greco||The Adoration of the Shepherds||1612–1614":"A late work El Greco painted for his own funerary chapel.","Caravaggio||The Calling of Saint Matthew||1599–1600":"It is in the Contarelli Chapel inside the church, and admission is free.","Caravaggio||Supper at Emmaus||1601":"The disciples are astonished at the moment they recognize the risen Jesus. Note the young, beardless Christ and the fruit basket perched precariously on the edge of the table.","Caravaggio||The Martyrdom of Saint Matthew||1599–1600":"It hangs in the church's Contarelli Chapel together with two other works depicting the story of Matthew. The man in the background on the left looking back at the scene is thought to be Caravaggio's self-portrait.","Caravaggio||Crucifixion of Saint Peter||1601":"Three executioners strain to raise the cross on which Peter is fixed upside down. \"The Conversion of Saint Paul\" hangs opposite it in the same chapel.","Caravaggio||The Incredulity of Saint Thomas||1601–1602":"Doubting Thomas pushes his finger into the wound in the side of the risen Jesus. The composition, with light falling on the foreheads of the four men gathered close together, is striking.","Caravaggio||Bacchus||1596경":"A young Bacchus wearing a wreath of vine leaves holds out a glass of wine. The fruit basket in the foreground includes rotting fruit.","Caravaggio||Medusa||1597경":"The head of Medusa painted on a convex shield, with the scream and blood of the moment of beheading vividly rendered. The curved surface makes the head appear to project forward.","Caravaggio||Boy Bitten by a Lizard||1594–1596경":"An early work capturing the shock of the moment a boy's finger is bitten by a lizard hidden among flowers. Another version with an almost identical composition is in the Fondazione Roberto Longhi in Florence.","Caravaggio||The Entombment of Christ||1603–1604":"A highlight of the Vatican Pinacoteca, it was taken to Paris by Napoleon and later returned.","Caravaggio||The Fortune Teller||1595경":"A gypsy woman pretends to read a young man's palm while slipping the ring off his finger. Another version with a similar composition is in the Capitoline Museums in Rome.","Caravaggio||Death of the Virgin||1606":"The church that commissioned it rejected it for portraying the Virgin too much like an ordinary woman; on the recommendation of Rubens, it was bought by the Duke of Mantua.","Artemisia Gentileschi||Judith Slaying Holofernes||1620경":"Judith and her maidservant together behead the enemy general, with even the spurting blood realistically depicted. Another version of the same subject is in the Museo di Capodimonte in Naples.","Artemisia Gentileschi||Self-Portrait as the Allegory of Painting||1638–1639":"The artist portrays herself as the personification of Painting, leaning forward with a brush in hand and wearing a gold chain with a mask-shaped pendant.","Artemisia Gentileschi||Susanna and the Elders||1610":"Painted when she was about 17, it is her earliest surviving signed work.","Artemisia Gentileschi||Self-Portrait as a Lute Player||1615–1618경":"A self-portrait in which the artist shows herself playing the lute. Note the turban, the rich clothing and the hands holding the instrument.","Peter Paul Rubens||The Descent from the Cross||1612–1614":"The central panel of a triptych painted for the cathedral, showing people carefully lowering the body of Christ, wrapped in a white shroud. The diagonal composition and the contrast of the white cloth are striking.","Peter Paul Rubens||The Elevation of the Cross||1610–1611":"A triptych showing muscular men straining with all their might to raise the cross. Painted just after Rubens returned from Italy, it stands out for its dynamic diagonal composition.","Peter Paul Rubens||The Rape of the Daughters of Leucippus||1618경":"A mythological scene in which the twins Castor and Pollux carry off the two daughters of Leucippus on horseback. The whirling composition of entangled bodies and horses is characteristic.","Peter Paul Rubens||The Three Graces||1630–1635":"Three goddesses with their arms around one another's shoulders, painted with ample bodies. Rubens kept the work himself until his death.","Peter Paul Rubens||Marie de' Medici Cycle||1622–1625":"Twenty-four large canvases fill a single room, the Galerie Médicis at the Louvre.","Peter Paul Rubens||Le Chapeau de Paille||1622–1625경":"The sitter is thought to be Susanna Lunden, who later became Rubens's sister-in-law. The hat is actually made of felt, not straw.","Peter Paul Rubens||The Garden of Love||1633경":"Couples gathered in a garden for amorous pursuits, with cherubs flying above them. The lavish clothing and architecture offer a glimpse of the aristocratic social life of the time.","Peter Paul Rubens||Het Pelsken (Helena Fourment)||1636–1638경":"Rubens's young second wife, Helena Fourment, wrapped in nothing but a fur. Rubens kept the painting with him until his death.","Anthony van Dyck||Charles I at the Hunt||1635경":"The king, dismounted and resting, is painted from a low viewpoint, making the king, who was in fact short, look imposing. It is a natural, less formal royal portrait.","Anthony van Dyck||Charles I in Three Positions||1635–1636":"A portrait showing the king's face from the front and from either side in one picture; it was sent to Rome so that the sculptor Bernini could carve a bust.","Anthony van Dyck||Equestrian Portrait of Charles I||1637–1638경":"A portrait on a huge canvas of the king in armor on horseback. Seated high against a broad landscape, he appears all the more authoritative.","Anthony van Dyck||Marchesa Elena Grimaldi Cattaneo||1623":"A full-length portrait of a Genoese noblewoman walking on a terrace. The red parasol held by a servant contrasts strongly with her black dress.","Frans Hals||The Laughing Cavalier||1624":"Despite the title, his expression is less a laugh than a self-assured smile. The title was given in the 19th century; look closely at the elaborate embroidery on the sleeve.","Frans Hals||Malle Babbe||1633–1635경":"A portrait of a Haarlem woman nicknamed \"Mad Babbe\"; the owl on her shoulder and the large beer tankard catch the eye.","Frans Hals||The Gypsy Girl||1628–1630경":"A young woman with a broad smile and a sidelong glance. The quick, bold brushstrokes are left plainly visible.","Frans Hals||Laughing Boy||1625경":"A boy's beaming face in a round format. It shows the artist's gift for capturing a fleeting expression with rapid brushwork.","Frans Hals||Marriage Portrait of Isaac Massa and Beatrix van der Laen||1622경":"A marriage portrait, unconventional for its time, showing the couple smiling rather than stiffly formal.","Frans Hals||The Merry Drinker||1628–1630":"It captures the moment a man holding a glass raises his hand as if speaking to the viewer. Up close, the rough, rapid brushwork is plainly visible.","Frans Hals||Young Man and Woman in an Inn||1623":"A genre scene of a young man raising his glass high and a woman with her arm around his shoulder, also known as \"Yonker Ramp and His Sweetheart\".","Rembrandt van Rijn||The Night Watch||1642":"A major restoration is under way, but the painting can still be viewed through a glass enclosure.","Rembrandt van Rijn||The Return of the Prodigal Son||1668경":"At the center of the painting are the father's two hands embracing the back of his kneeling son. The figure standing on the right watching is usually interpreted as the elder son.","Rembrandt van Rijn||The Anatomy Lesson of Dr. Nicolaes Tulp||1632":"A group portrait commissioned by the Amsterdam Guild of Surgeons, in which Dr. Tulp demonstrates the dissected muscles of a corpse's arm.","Rembrandt van Rijn||The Jewish Bride||1665–1669경":"A man and woman tenderly embrace; the man's sleeve is built up with thick layers of paint. Van Gogh said he would give ten years of his life to sit before this painting for just two weeks.","Rembrandt van Rijn||Syndics of the Drapers' Guild||1662":"A group portrait of the guild officials who inspected the quality of cloth, staged as if they are all looking at someone who has just walked in.","Rembrandt van Rijn||Self-Portrait with Two Circles||1665–1669경":"The elderly artist holding a palette and brushes; the meaning of the two large circles on the wall behind him is still debated.","Rembrandt van Rijn||Self Portrait at the Age of 63||1669":"One of his last self-portraits, painted in the year of his death, it soberly depicts his clasped hands and wrinkled face.","Rembrandt van Rijn||Self-Portrait as the Apostle Paul||1661":"A self-portrait in the guise of the apostle Paul, holding an open manuscript. The hilt of a sword, Paul's attribute, peeks out from his clothing at his chest.","Diego Velázquez||Las Meninas||1656":"The young Infanta Margarita appears with her maids of honor and the painter himself, brush in hand. Look for the king and queen reflected in the mirror at the back.","Diego Velázquez||Portrait of Innocent X||1650경":"A portrait striking for the piercing gaze of the pope in red. The 20th-century painter Francis Bacon based his \"Screaming Pope\" series on this painting.","Diego Velázquez||The Surrender of Breda||1634–1635":"The Dutch commander hands the keys of the city to the Spanish general Spinola. The densely packed lances on the right have earned it the nickname \"The Lances\".","Diego Velázquez||Las Hilanderas||1655–1660경":"A work with a double composition: women spinning in the foreground, and the myth of Athena and Arachne unfolding in a bright space at the back.","Diego Velázquez||Rokeby Venus||1647–1651":"Venus, seen from behind, gazes into a mirror held by Cupid. The painting is also famous for being slashed with a knife by a suffragette in 1914.","Diego Velázquez||Portrait of Juan de Pareja||1650":"A portrait of the artist's assistant Juan de Pareja, painted in Rome and exhibited at the Pantheon to great acclaim. Pareja was later freed from slavery and worked as a painter.","Diego Velázquez||Old Woman Frying Eggs||1618":"A kitchen scene (bodegón) painted in Seville when the artist was about 19, already showing remarkable realism.","Johannes Vermeer||Girl with a Pearl Earring||1665경":"Rather than a portrait of a specific person, it is thought to be a \"tronie\", a study of a figure in an exotic turban. The gleam of the pearl is rendered with just a few brushstrokes.","Johannes Vermeer||The Milkmaid||1658경":"A maid quietly pouring milk in a kitchen. Look closely at the tiny dots of light on the bread and the basket.","Johannes Vermeer||View of Delft||1660–1661경":"Delft seen from across the river. The painting is famous for the \"little patch of yellow wall\" mentioned by Proust in \"In Search of Lost Time\".","Johannes Vermeer||Girl Reading a Letter at an Open Window||1657–1659경":"The 2021 restoration revealed a painting of Cupid hidden beneath overpaint.","Johannes Vermeer||The Art of Painting||1666–1668경":"A painter, seen from behind, depicts a model wearing a laurel wreath and holding a trumpet, interpreted as Clio, the muse of history. Note also the map of the Netherlands on the wall.","Johannes Vermeer||The Lacemaker||1669–1670경":"A very small painting of a woman absorbed in making lace. The red thread spilling from the sewing cushion in the foreground is deliberately painted out of focus.","Johannes Vermeer||The Astronomer||1668":"A scholar absorbed in his studies reaches toward a celestial globe. Its companion piece, \"The Geographer\", is in the Städel Museum in Frankfurt.","Johannes Vermeer||The Little Street||1658경":"A view of an ordinary house in Delft, one of only two cityscapes by Vermeer.","Johannes Vermeer||Woman in Blue Reading a Letter||1662–1663경":"A woman reads a letter in light coming from the left. The map on the wall and her blue jacket create a tranquil mood.","Johannes Vermeer||Diana and Her Nymphs||1653–1654경":"A rare mythological painting by the young Vermeer, made before he became famous for his genre scenes.","Johannes Vermeer||The Love Letter||1669–1670경":"The composition seems to peer through a dark doorway at a mistress who has received a letter and her maid. It was stolen while on loan to an exhibition in Brussels in 1971 and damaged before being recovered.","Nicolas Poussin||Et in Arcadia ego||1637–1638경":"Shepherds read the inscription \"Et in Arcadia ego\" (\"Even in Arcadia, I am there\") on a tomb, interpreted as meaning that death exists even in paradise.","Nicolas Poussin||The Abduction of the Sabine Women||1633–1634경":"Another version, of c. 1637–1638, is in the Louvre.","Nicolas Poussin||The Inspiration of the Poet||1629경":"A poet, beside Apollo and a muse, writes under inspiration while a cherub prepares to crown him with a laurel wreath.","Nicolas Poussin||Winter (The Flood)||1660–1664":"The last painting in Poussin's final series, \"The Four Seasons\".","Jean-Antoine Watteau||Pilgrimage to Cythera||1717":"Couples stroll in pairs on Cythera, the island of love. With this work, the Academy recognized a new genre, the \"fête galante\" (elegant party).","Jean-Antoine Watteau||Pierrot||1718–1719경":"A comic actor dressed in white stands motionless, facing the viewer. The almost life-size figure conveys a strange sense of melancholy.","Jean-Antoine Watteau||L'Enseigne de Gersaint||1720":"Painted as a shop sign for the art dealer Gersaint, the scene on the left, in which a portrait of Louis XIV is being packed into a crate, hints at a changing era.","Jean-Antoine Watteau||Mezzetin||1718–1720경":"Mezzetin, a character from the commedia dell'arte, plays the guitar and sings a love song. In the garden behind him stands a statue of a woman with her back turned.","François Boucher||Diana Leaving Her Bath||1742":"Diana, goddess of the moon, rests with a nymph after the hunt. The crescent-moon ornament in her hair and the game beside her identify her as Diana.","François Boucher||Madame de Pompadour||1756":"Madame de Pompadour, the favorite of Louis XV, reclines holding a book; her lavish dress and rose ornaments are delicately painted.","François Boucher||The Breakfast||1739":"A family enjoys morning drinks in a Rococo interior. It is a genre scene of the everyday life of Parisians at the time, unusual for a painter who mostly painted mythological subjects.","François Boucher||Resting Girl||1752":"A girl lying face down on a sofa; the model, Marie-Louise O'Murphy, later became a mistress of Louis XV.","Jean-Honoré Fragonard||The Swing||1767":"The shoe flying from the foot of the woman on the swing and the young man hiding in the bushes looking up at her create a playful mood.","Jean-Honoré Fragonard||Young Girl Reading||1770경":"A girl in a yellow dress reading, seen in profile. The folds of her dress and the cushion are rendered with quick, free brushwork.","Jean-Honoré Fragonard||The Bolt||1777경":"The moment a man reaches out to bolt the door is painted in dramatic light. The apple on the table is interpreted as a symbol of temptation.","Jean-Honoré Fragonard||The Progress of Love: The Meeting||1771–1772":"Part of a series commissioned and then returned by Madame du Barry, it hangs in the Fragonard Room at the Frick Collection.","Jean-Honoré Fragonard||Inspiration||1769경":"One of the \"fantasy figures\" series, each said to have been painted in an hour, it stands out for its rapid brushwork.","Jean-Honoré Fragonard||The Bathers||1765경":"Women bathing in nature, painted with free, swirling brushwork. Figures and landscape seem to melt into one another.","Jean-Honoré Fragonard||Blindman's Buff||1775–1780경":"People play a small game of blindman's buff in a vast garden landscape, where the trees and sky dominate the figures.","Jean-Baptiste-Siméon Chardin||Saying Grace||1740":"A small child says grace before a meal as the mother sets the table, a calm depiction of simple domestic life.","Jean-Baptiste-Siméon Chardin||Soap Bubbles||1733–1734경":"A young man leaning on a windowsill blows soap bubbles. The bubble, about to burst, symbolizes transience; other versions with a similar composition also survive.","Jean-Baptiste-Siméon Chardin||The Ray||1728":"A still life of a gutted ray hanging up and a cat stepping onto oysters; this work won the artist membership of the Académie Royale.","Jean-Baptiste-Siméon Chardin||The Little Schoolmistress||1740 이후":"A little girl teaches a younger child to read, pointing to the letters one by one, capturing a moment of quiet concentration.","Élisabeth Vigée Le Brun||Marie Antoinette and Her Children||1787":"A family portrait commissioned to improve the queen's poor public image. The empty cradle on the right recalls the young princess who died around the time it was painted.","Élisabeth Vigée Le Brun||Self-portrait in a Straw Hat||1782 이후":"Inspired by Rubens's \"Le Chapeau de Paille\", this self-portrait shows the artist holding her palette in outdoor light.","Élisabeth Vigée Le Brun||Self-Portrait with Her Daughter, Julie||1789":"A self-portrait in simple, antique-style dress, holding her daughter in her arms. The tender embrace of mother and child is warmly rendered.","Élisabeth Vigée Le Brun||Marie Antoinette with a Rose||1783":"After a portrait of the queen in a thin chemise dress was condemned as improper, the artist repainted her in a silk gown.","Jacques-Louis David||Oath of the Horatii||1784":"Three brothers swear to fight for their homeland before the swords held out by their father. Note the contrast with the grieving women on the right.","Jacques-Louis David||The Death of Marat||1793":"The revolutionary Marat, murdered in his bath. The letter in his hand bears the name of his assassin, Charlotte Corday.","Jacques-Louis David||The Coronation of Napoleon||1805–1807":"Napoleon crowns the kneeling Joséphine. Napoleon's mother, who did not actually attend the ceremony, is shown in the central gallery.","Jacques-Louis David||The Death of Socrates||1787":"Socrates, even as he takes the cup of hemlock, raises a finger to continue teaching his disciples. The old man seated with his back turned at the foot of the bed is Plato.","Jacques-Louis David||Napoleon Crossing the Alps||1801":"There are five versions; others are at Versailles, Charlottenburg and the Belvedere in Vienna.","Jacques-Louis David||Portrait of Madame Récamier||1800":"Madame Récamier reclines on an antique-style couch. The portrait was left unfinished, so the background remains bare.","Jacques-Louis David||Antoine-Laurent Lavoisier and His Wife||1788":"Lavoisier, the father of modern chemistry, with his wife, who assisted in his experiments. A few years later he was executed during the Revolution.","Jean-Auguste-Dominique Ingres||Grande Odalisque||1814":"The reclining woman's back is elongated beyond nature; when first shown, critics complained that she had several extra vertebrae.","Jean-Auguste-Dominique Ingres||The Valpinçon Bather||1808":"The view of a seated woman from behind is enough to create a mood of stillness. The title comes from the Valpinçon family, who once owned the painting.","Jean-Auguste-Dominique Ingres||Napoleon I on His Imperial Throne||1806":"Napoleon, in full imperial regalia of crown, robe and staff of office, is shown frontally and with great solemnity. When first exhibited it was faulted as excessively archaic.","Jean-Auguste-Dominique Ingres||The Turkish Bath||1862":"Countless nude women are packed into a circular composition, which the artist completed when he was over 80.","Jean-Auguste-Dominique Ingres||Portrait of Monsieur Bertin||1832":"The newspaper publisher Bertin sits with his hands on his knees, a portrait often cited as an image of the self-confidence of the bourgeoisie of the time.","Jean-Auguste-Dominique Ingres||Comtesse d'Haussonville||1845":"The countess, finger to her chin, is reflected from behind in the mirror. Note also the rendering of the texture of her blue silk dress.","Jean-Auguste-Dominique Ingres||Madame Moitessier||1856":"Another portrait of her standing (1851) is in the National Gallery of Art, Washington.","Jean-Auguste-Dominique Ingres||La Source||1856":"An ideal nude conceived over nearly 40 years and completed when the artist was 76.","Francisco Goya||The Third of May 1808||1814":"Before a French firing squad, a man in a white shirt flings his arms wide. A lantern on the ground casts a strong light on him.","Francisco Goya||Saturn Devouring His Son||1819–1823":"One of the \"Black Paintings\" the ageing artist painted directly on the walls of his own house; it was later removed from the wall and transferred to canvas.","Francisco Goya||The Second of May 1808||1814":"The people of Madrid rise up against the French army's Mamluk cavalry. It is best seen together with its companion, \"The Third of May 1808\".","Francisco Goya||Charles IV of Spain and His Family||1800–1801":"An unflattering group portrait of the royal family; the artist himself lurks in the shadows on the left, standing before a canvas.","Francisco Goya||La maja desnuda||1797–1800경":"A real woman, not a mythological goddess, painted nude; it is paired with \"La maja vestida\", in the same pose. Note her direct gaze at the viewer.","Francisco Goya||La maja vestida||1800–1807경":"The two majas hang side by side at the Prado.","Francisco Goya||Manuel Osorio Manrique de Zúñiga||1787–1788":"Cats eye the magpie the boy holds on a string, a scene that combines innocence and danger.","Caspar David Friedrich||Wanderer above the Sea of Fog||1818경":"A man seen from behind looks down over mist-shrouded peaks. The composition leads the viewer to take in the landscape along the figure's gaze.","Caspar David Friedrich||The Monk by the Sea||1808–1810":"A bold composition in which a single small monk stands before a vast sky and sea. It is the companion to \"The Abbey in the Oakwood\".","Caspar David Friedrich||The Sea of Ice||1823–1824":"Jagged slabs of ice fill the picture; on the right, the hull of a ship crushed by the ice is sinking.","Caspar David Friedrich||Chalk Cliffs on Rügen||1818":"Inspired by Rügen, which the artist visited on his honeymoon, it shows three figures looking out between white cliffs at the blue sea.","Théodore Géricault||The Raft of the Medusa||1818–1819":"The survivors of the Medusa, wrecked off West Africa in 1816. The eye travels upwards along the figures waving toward a ship on the horizon.","Théodore Géricault||The Charging Chasseur||1812":"The young artist's Salon debut: a cavalry officer turns back with sabre drawn on a rearing horse, in a dynamic diagonal composition.","Théodore Géricault||The Woman with a Gambling Mania||1819–1822경":"One of a series of portraits of \"monomaniacs\" painted for a psychiatrist, capturing the vacant gaze of an old woman obsessed with gambling.","Théodore Géricault||The Derby at Epsom||1821":"The horses gallop with their legs stretched out fore and aft; later, sequential photography revealed that real horses do not run this way.","Eugène Delacroix||Liberty Leading the People||1830":"A depiction of the July Revolution of 1830, in which Liberty, holding the French flag, leads the people forward over a barricade.","Eugène Delacroix||The Death of Sardanapalus||1827":"Besieged by his enemies, the Assyrian king lies on his bed watching his concubines and horses being slaughtered. The scene was inspired by Byron's play.","Eugène Delacroix||The Massacre at Chios||1824":"The massacre of the inhabitants of Chios by Ottoman forces in 1822, during the Greek War of Independence. It is a vivid indictment of a contemporary tragedy.","Eugène Delacroix||The Barque of Dante||1822":"Dante and Virgil cross a river of Hell, in the artist's Salon debut. Note the drops of water on the bodies of the damned clinging to the boat.","Eugène Delacroix||The Women of Algiers||1834":"Based on interiors the artist saw in Algiers on his North African journey, it shows richly dressed women at rest. Picasso later painted a series of variations on it.","Eugène Delacroix||Frédéric Chopin||1838":"Originally part of a painting of Chopin together with George Sand that was cut in two; the Sand portion is at the Ordrupgaard museum in Copenhagen.","Eugène Delacroix||The Entry of the Crusaders into Constantinople||1840":"The Fourth Crusade enters Constantinople in 1204, as citizens beg for mercy before the mounted commanders.","Eugène Delacroix||Jacob Wrestling with the Angel||1855–1861":"Delacroix's last major work, painted on the wall of the Chapel of the Holy Angels in the church of Saint-Sulpice.","J. M. W. Turner||The Fighting Temeraire||1839":"A warship that served at the Battle of Trafalgar is towed by a steam tug on its final voyage to be broken up. The setting sun hints at the end of an era.","J. M. W. Turner||Rain, Steam and Speed||1844":"A Great Western Railway train races through the rain across a bridge. Look for the small hare running ahead on the tracks.","J. M. W. Turner||Snow Storm: Hannibal and his Army Crossing the Alps||1812":"A vast swirling snowstorm engulfs the picture, leaving Hannibal's army tiny beneath it. The work stresses the overwhelming power of nature.","J. M. W. Turner||Snow Storm – Steam-Boat off a Harbour's Mouth||1842":"Works from the Turner Bequest are gathered in Tate Britain's Clore Gallery.","J. M. W. Turner||The Slave Ship||1840":"Slaves are thrown overboard from a slave ship in a storm; in the water at lower right are shackled legs and swarming fish.","J. M. W. Turner||The Burning of the Houses of Lords and Commons||1834–1835":"Turner painted the fire he witnessed from the banks of the Thames. A second painting of the event from another angle is in the Cleveland Museum of Art.","J. M. W. Turner||Norham Castle, Sunrise||1845경":"A late work in which forms almost dissolve into light, often cited as anticipating Impressionism and abstraction.","John Constable||The Hay Wain||1821":"A rural scene of a hay wain crossing the River Stour, with a farmhouse on the left. It won a gold medal at the 1824 Paris Salon and influenced French painters.","John Constable||Salisbury Cathedral from the Bishop's Grounds||1823":"There are several versions, including those in the Frick Collection and the Metropolitan Museum.","John Constable||Flatford Mill||1816–1817":"A riverside view near the mill once owned by the artist's father, with a barge and men handling horses.","John Constable||Dedham Vale||1828":"The church tower of Dedham is visible in the distance beyond the winding valley of the Stour. The artist painted the area where he was born and raised.","John Everett Millais||Ophelia||1851–1852":"Ophelia floats downstream; the model, Elizabeth Siddal, posed lying in a bath filled with water. Every flower and plant on the riverbank is meticulously depicted.","John Everett Millais||Christ in the House of His Parents||1849–1850":"The Virgin comforts the young Jesus, who has hurt his hand in the carpenter's workshop. It is famous for Charles Dickens's scathing attack on its overly ordinary portrayal of the Holy Family.","John Everett Millais||Mariana||1850–1851":"Mariana, the forsaken woman of Tennyson's poem, stretches her back as she pauses from her embroidery. The stained-glass window and blue dress are vividly hued.","John Everett Millais||The Blind Girl||1854–1856":"A young girl turns to look at the double rainbow behind the blind girl beside her. Look also for the butterfly on the blind girl's shawl.","Dante Gabriel Rossetti||Beata Beatrix||1864–1870경":"Rossetti painted his late wife, Elizabeth Siddal, as Dante's Beatrice. The poppy a red bird drops into her hands alludes to death.","Dante Gabriel Rossetti||Proserpine||1874":"Proserpine, held captive in the underworld, holds a pomegranate; the model is Jane Morris, wife of William Morris. The work draws on the myth that eating the pomegranate prevented her from ever fully returning to the earth.","Dante Gabriel Rossetti||Ecce Ancilla Domini!||1849–1850":"An early Pre-Raphaelite work depicting the Annunciation in a restrained, predominantly white palette. The model for Mary, shrinking back on the bed, is the artist's sister, Christina Rossetti.","Dante Gabriel Rossetti||The Day Dream||1880":"A woman sits in a tree, lost in thought, a book in her lap. The model is Jane Morris, Rossetti's longtime muse.","William Holman Hunt||The Light of the World||1851–1853":"A larger version painted later is in St Paul's Cathedral, London.","William Holman Hunt||The Awakening Conscience||1853":"A young woman suddenly rises from a man's lap, the moment she awakens from life as a kept mistress. Look for the bright garden reflected in the mirror behind and the symbolic objects in the room.","William Holman Hunt||The Scapegoat||1854–1856":"Painted on the spot near the Dead Sea; a smaller version is in Manchester Art Gallery.","William Holman Hunt||The Hireling Shepherd||1851":"While the shepherd neglects his work to show a moth to a country girl, his sheep stray into the cornfield. It is sometimes read as a satire on clergy who neglect their duties.","Frederic Leighton||Captive Andromache||1886–1888경":"This huge canvas, more than 4 m wide, shows Hector's wife, enslaved after the Trojan War, drawing water at a well.","Frederic Leighton||The Bath of Psyche||1890경":"A tall, narrow canvas shows Psyche disrobing by a pool. The smooth, sculpture-like nude and the classical columns on either side reveal Leighton's distinctive classicism.","Frederic Leighton||The Garden of the Hesperides||1892":"Three nymphs guarding the golden apples, painted on a circular canvas.","Frederic Leighton||Flaming June||1895":"Leighton's most famous work. In the mid-20th century, when Victorian art was out of fashion, its value fell so far that it failed to sell at auction; in 1963 it was bought by the Museo de Arte de Ponce in Puerto Rico.","John William Waterhouse||The Lady of Shalott||1888":"Based on Tennyson's poem, it shows the lady, bearing her curse, setting off by boat for Camelot. Look for the guttering candles at the bow and the tapestry draped over the boat.","John William Waterhouse||The Magic Circle||1886":"A sorceress casts a spell, drawing a circle on the ground with her wand. Note the contrast between the smoke rising inside the circle and the barren landscape outside it.","John William Waterhouse||Hylas and the Nymphs||1896":"Hylas, one of the Argonauts, goes to fetch water and is lured by the nymphs of the pool. It is also known for the debate it sparked in 2018, when the gallery briefly took it down.","John William Waterhouse||Echo and Narcissus||1903":"Narcissus, entranced by his own reflection, and Echo, gazing longingly at him. The story comes from Ovid's \"Metamorphoses\"; look for the narcissus flowers at the water's edge.","Gustave Courbet||A Burial at Ornans||1849–1850":"An ordinary funeral in the artist's home town of Ornans, painted on a huge canvas of the kind reserved for history painting. The life-size row of villagers caused great controversy at the time.","Gustave Courbet||The Painter's Studio||1855":"The artist sits painting in the middle, with figures from various walks of society on the left and his friends and patrons on the right. When it was rejected for the 1855 Exposition Universelle, Courbet opened his own pavilion to show it.","Gustave Courbet||Bonjour, Monsieur Courbet||1854":"On a road near Montpellier, his patron Alfred Bruyas and a servant greet the artist. Courbet, with a pack on his back and his head held high, displays the painter's pride.","Gustave Courbet||The Stone Breakers||1849":"Almost an emblem of Realism, the painting now survives only in photographs.","Gustave Courbet||Woman with a Parrot||1866":"A nude woman lying on a bed holds up her hand for a parrot to perch on. With its loosened hair and realistic treatment of the body, it caused a stir at the 1866 Salon.","Gustave Courbet||The Cliffs at Étretat after the Storm||1870":"The cliffs and rock arch of the Normandy coast, under clearing skies after a storm. Look closely at the texture of the rocks and waves, built up in thick paint.","Gustave Courbet||The Stormy Sea (The Wave)||1870":"The key work of \"The Wave\" series, painted at Étretat in Normandy.","Jean-François Millet||The Gleaners||1857":"Three women glean stray ears of grain in a field after the harvest. The stooping women in the foreground contrast with the abundant stacks of grain in the distance.","Jean-François Millet||The Angelus||1857–1859":"At dusk, a couple stop work in the field to pray at the distant sound of the Angelus bell. Look for the church spire on the horizon.","Jean-François Millet||The Sower||1850":"A peasant strides down a dark slope, scattering seed. Van Gogh deeply admired the subject and copied it many times.","Jean-François Millet||Man with a Hoe||1860–1862":"A peasant leans on his hoe to catch his breath on stony, barren ground. A poem it inspired by Edwin Markham caused a sensation in the United States.","Jean-François Millet||Spring||1868–1873":"One of a series of the four seasons, showing the fields of Barbizon with a rainbow after rain.","Jean-François Millet||Woman Baking Bread||1854":"A peasant woman slides loaves into an oven. It shows how Millet lent monumental weight to ordinary daily work.","Jean-François Millet||Haystacks: Autumn||1874경":"A late landscape of great haystacks in an autumn field, with sheep grazing. The low sky and broad fields reveal Millet's late feeling for landscape.","Honoré Daumier||The Third-Class Carriage||1862–1864경":"An old woman, a young mother and a sleeping boy sit in a cramped third-class carriage. Another version of the subject is in the National Gallery of Canada.","Honoré Daumier||The Laundress||1863경":"A laundress carrying a heavy bundle of washing leads a child by the hand up steps from the Seine. The figures, darkened like silhouettes against a bright background, are striking.","Honoré Daumier||Don Quixote and Sancho Panza||1870경":"Don Quixote on horseback and Sancho Panza on his donkey, painted with quick, bold brushwork. In his later years Daumier painted Cervantes's story many times.","Honoré Daumier||Rue Transnonain, April 15, 1834||1834":"A lithograph denouncing the massacre of civilians by government troops; impressions are held by several museums.","Jean-Baptiste-Camille Corot||Souvenir de Mortefontaine||1864":"A woman reaching for a branch by a lake, with children, painted in soft, silvery, mist-like tones. It is the best known of Corot's late \"souvenir\" landscapes, which recreated real scenes from memory.","Jean-Baptiste-Camille Corot||Woman with a Pearl||1868–1870경":"A portrait of a woman seated in a pose recalling the \"Mona Lisa\". The \"pearl\" of the title is in fact a small leaf ornament on her forehead that looks like a pearl.","Jean-Baptiste-Camille Corot||The Bridge at Mantes||1868–1870":"The arched bridge at Mantes is seen between tree trunks. Note the composition formed by the vertical trees and the horizontal span of the bridge.","Jean-Baptiste-Camille Corot||Ville-d'Avray||1865경":"The pond and houses of Ville-d'Avray near Paris. Corot's family had a country house here, and he painted the scene throughout his life.","Rosa Bonheur||The Horse Fair||1852–1855":"A large work showing the horses and handlers of the Paris horse market. To observe the horses, Bonheur obtained police permission to wear men's clothing at the market.","Rosa Bonheur||Ploughing in the Nivernais||1849":"Oxen pull ploughs across a field in the Nivernais. Commissioned by the state, it excels in depicting the oxen's muscles and the texture of the turned earth.","Rosa Bonheur||El Cid||1879":"The head of a lion with a full mane, shown almost frontally. Bonheur kept real lions at her home to study them.","Rosa Bonheur||Weaning the Calves||1879":"A pastoral scene of calves being separated from their mothers. Note Bonheur's skill in the delicate rendering of the animals' coats and expressions.","Édouard Manet||Le Déjeuner sur l'herbe||1863":"A nude woman sits among fully clothed men; the painting caused a great scandal at the 1863 Salon des Refusés. The composition was borrowed from a print after a design by Raphael.","Édouard Manet||Olympia||1863":"Based on the composition of Titian's \"Venus of Urbino\" but depicting a contemporary prostitute, it was fiercely condemned at the 1865 Salon. Note her direct gaze at the viewer and the black cat at her feet.","Édouard Manet||A Bar at the Folies-Bergère||1882":"Manet's last major work, showing the hall reflected in the mirror behind the barmaid. The positions of the woman and her customer in the mirror do not match reality, a point long debated.","Édouard Manet||The Fifer||1866":"A boy military musician stands before a flat, almost empty background. Clearly influenced by Velázquez, it was rejected by the 1866 Salon.","Édouard Manet||The Balcony||1868–1869":"Of the three figures on the balcony, the seated woman in front is Berthe Morisot. It was the first time Morisot posed for Manet, and the work was inspired by a painting by Goya.","Édouard Manet||Berthe Morisot with a Bouquet of Violets||1872":"A portrait of Berthe Morisot in a black dress and hat. The most famous of Manet's portraits of her; note the many shades of black.","Édouard Manet||The Execution of Emperor Maximilian||1868–1869":"There are several versions, including those in the Museum of Fine Arts, Boston and the National Gallery, London (in fragments).","Édouard Manet||Music in the Tuileries||1862":"Jointly owned with the Hugh Lane Gallery in Dublin, it is shown alternately at the two institutions.","Édouard Manet||The Railway||1873":"In front of the railings of the Gare Saint-Lazare, a woman holds a book while a girl looks toward the tracks. The woman's model is Victorine Meurent, who also posed for \"Olympia\".","Édouard Manet||Asparagus||1880":"Generously overpaid for a painting of a bunch of asparagus, Manet painted this and sent it as a bonus, saying that \"one was missing\".","Édouard Manet||Portrait of Émile Zola||1868":"The novelist Zola, a champion of Manet. \"Olympia\" and a Japanese print hang on the wall.","Édouard Manet||Boating||1874":"A man and woman in a sailing boat, closely cropped in a composition that shows the influence of Japanese prints. It was painted during a summer at Argenteuil when Manet was close to Monet.","Édouard Manet||In the Conservatory||1879":"A woman seated on a bench in a conservatory, with a man leaning behind her. The models are Manet's acquaintances Monsieur and Madame Guillemet; note the couple's hands, placed side by side.","Édouard Manet||The Dead Toreador||1864경":"A fragment cut from a larger painting that was savaged at the Salon. Another cut section is in the Frick Collection, New York.","Édouard Manet||Young Lady in 1866||1866":"Worth comparing with Courbet's \"Woman with a Parrot\", painted the same year.","Claude Monet||Impression, Sunrise||1872":"Dawn over the port of Le Havre; when the title was mocked at the first exhibition in 1874, the name \"Impressionism\" was born. Look at the orange sun floating in the mist.","Claude Monet||Water Lilies||1914–1926":"Eight large water-lily panels surround the two oval rooms of the Musée de l'Orangerie.","Claude Monet||Woman with a Parasol||1875":"Monet's wife Camille, holding a parasol, and their son Jean on a hill, seen as if from below. Quick brushstrokes in the windblown veil and grass vividly convey the outdoor light.","Claude Monet||La Gare Saint-Lazare||1877":"Smoke billowing from steam locomotives and light pouring through the glass roof. Monet painted several works of this station and showed them together at the 1877 Impressionist exhibition.","Claude Monet||Rouen Cathedral series||1892–1894":"Of the series of some 30 works, five hang side by side at the Musée d'Orsay.","Claude Monet||Haystacks series||1890–1891":"The Art Institute of Chicago holds several works from the Haystacks series.","Claude Monet||La Grenouillère||1869":"La Grenouillère, a bathing resort on the Seine. Monet painted the same scene sitting beside Renoir, rendering the reflections on the water with short brushstrokes.","Claude Monet||Women in the Garden||1866–1867":"It is said that to paint it outdoors, Monet dug a trench in the ground and lowered the large canvas into it as he worked.","Claude Monet||Poppy Field||1873":"Two pairs of mothers and children walk among red poppies in a field at Argenteuil. The same figures appear at the top and bottom of the slope, suggesting their walk downhill.","Claude Monet||The Water-Lily Pond||1899":"The Japanese bridge across the pond in Monet's garden at Giverny, with water lilies covering the surface. Other versions of the same composition are in several American museums.","Claude Monet||Houses of Parliament, Sunlight in the Fog||1904":"One of the series of the Houses of Parliament painted during Monet's stays in London, capturing sunlight breaking through the fog. Monet viewed the scene from St Thomas' Hospital across the Thames.","Claude Monet||Vase of Flowers||1881–1882경":"A still life of mallows picked in the fields. In the early 1880s Monet painted a number of flower still lifes alongside his landscapes.","Claude Monet||Garden at Sainte-Adresse||1867":"People on a seaside terrace looking out to sea, with flags and flower beds. Note the high viewpoint and the two flapping flags.","Claude Monet||The Beach at Trouville||1870":"Painted on Monet's honeymoon, it has real grains of sand embedded in the paint.","Claude Monet||La Japonaise||1876":"A work reflecting the vogue for Japanese art (Japonisme) then sweeping Paris.","Pierre-Auguste Renoir||Bal du moulin de la Galette||1876":"People dancing and chatting at an open-air dance hall on the hill of Montmartre. Note the sunlight filtering through the leaves and dappling the clothes and ground.","Pierre-Auguste Renoir||Luncheon of the Boating Party||1880–1881":"Friends gathered on the balcony of the Maison Fournaise restaurant on the Seine. The woman on the left holding a little dog is Aline Charigot, later Renoir's wife.","Pierre-Auguste Renoir||The Swing||1876":"Dappled sunlight falls through the leaves onto a woman by a swing and the men around her. It was shown at the 1877 Impressionist exhibition.","Pierre-Auguste Renoir||Young Girls at the Piano||1892":"Renoir painted several versions of the same composition for a French government commission, and the state bought this one. It was the first Renoir to be purchased by the French state.","Pierre-Auguste Renoir||Two Young Girls at the Piano||1892":"Another version painted the same year as the Orsay painting, in the Robert Lehman Collection. Comparing the two reveals slight differences in palette and degree of finish.","Pierre-Auguste Renoir||Dance at Bougival||1883":"A couple dancing at an open-air dance, painted almost life-size. The woman's model is Suzanne Valadon, who later became a painter.","Pierre-Auguste Renoir||Portrait of Irène Cahen d'Anvers||1880":"Part of the Bührle Foundation collection, it is shown at the Kunsthaus Zürich.","Pierre-Auguste Renoir||La Loge||1874":"A woman seated in a private box and a man holding opera glasses. Shown at the first Impressionist exhibition in 1874; the man's model is the artist's brother Edmond.","Pierre-Auguste Renoir||Madame Georges Charpentier and Her Children||1878":"The publisher's wife, Madame Charpentier, with her two children. Well received at the 1879 Salon, it helped make Renoir's name.","Pierre-Auguste Renoir||Dance in the Country||1883":"A couple dancing at a country dance; the woman's model is Aline Charigot, later his wife. It is the companion to \"Dance in the City\", painted at the same time.","Pierre-Auguste Renoir||Dance in the City||1883":"The model is Suzanne Valadon, who later became a painter. It hangs side by side with \"Dance in the Country\".","Pierre-Auguste Renoir||The Umbrellas||1881–1886경":"People holding up umbrellas in a rainy Paris street. Soft brushwork on the right mixes with firm outlines on the left, showing how the artist's style changed over the several years he worked on it.","Pierre-Auguste Renoir||Pont-Neuf, Paris||1872":"The Pont Neuf seen from above, with passers-by in sunlit Paris. According to an anecdote, Renoir's brother Edmond stopped passers-by to hold them in place.","Pierre-Auguste Renoir||La Première Sortie||1876–1877":"The excitement of a girl on her first outing to a performance, seated in a private box. Beyond her profile, the blurred auditorium conveys the lively atmosphere.","Pierre-Auguste Renoir||The Large Bathers||1884–1887":"Moving away from Impressionism's soft brushwork, Renoir tried a classical style with crisp outlines.","Edgar Degas||The Dance Class||1874–1876":"The elderly ballet master Jules Perrot, leaning on a cane, instructs the dancers. Note the dancers' varied poses and the deep perspective of the floor.","Edgar Degas||L'Absinthe||1875–1876":"A woman sits listlessly in a café beside a man with a pipe. The models are the actress Ellen Andrée and the engraver Marcellin Desboutin.","Edgar Degas||L'Étoile||1876–1878경":"A pastel of a prima ballerina dancing on stage with one leg raised, seen from above. Look for the man in black standing behind the scenery at the side of the stage.","Edgar Degas||The Bellelli Family||1858–1869":"A large portrait of the artist's aunt's family, who lived in Florence. The husband and wife avoid each other's gaze, revealing a strained relationship.","Edgar Degas||Women Ironing||1884–1886경":"One woman yawns while another presses down on her iron with all her strength. The rough canvas texture left visible adds to the sense of weary toil.","Edgar Degas||Little Dancer of Fourteen Years||1878–1881":"The wax original is in Washington; posthumous bronze casts are in the Musée d'Orsay and elsewhere.","Edgar Degas||A Cotton Office in New Orleans||1873":"Painted in New Orleans, where his mother's family lived, it was the first of his works bought by a museum.","Edgar Degas||The Tub||1886":"A pastel looking down on a woman crouching in a tub as she washes. The shelf on the right cuts across the picture, creating a voyeuristic viewpoint.","Edgar Degas||Blue Dancers||1893경":"A late work showing dancers in blue costumes adjusting their dress in the wings. Bold outlines and intense hues reveal Degas's late style.","Edgar Degas||A Woman Seated beside a Vase of Flowers||1865":"Notable for its bold composition, with a bouquet occupying the middle and the figure pushed to the edge.","Edgar Degas||The Orchestra at the Opera||1870경":"His friend the bassoonist Désiré Dihau is in the middle, while the dancers on stage are cropped so that only their legs and skirts are visible.","Edgar Degas||At the Races in the Countryside||1869":"A family in a carriage parked beside a country racecourse. The carriage boldly cropped at the edge of the picture is striking.","Edgar Degas||The Rehearsal of the Ballet Onstage||1874경":"Dancers rehearsing on stage, watched by men to one side. It reflects Degas's preference for depicting rehearsal over the spectacle of performance.","Edgar Degas||At the Milliner's||1882":"A pastel of a customer trying on a hat before a mirror, and an assistant handing her hats. The assistant is boldly placed so that she is partly hidden by the mirror.","Edgar Degas||Dancers Practicing at the Barre||1877":"Two dancers rehearsing with their legs raised on the barre. Note the watering can on the floor and the diagonal sweep of the floorboards.","Frédéric Bazille||Family Reunion||1867":"The Bazille family gathered on the terrace of their country house at Méric. The tall man standing at the far left is the artist himself.","Frédéric Bazille||The Pink Dress||1864경":"The artist's cousin, in a pink striped dress, sits with her back to us, looking out at a sunlit village. An early work by Bazille combining figure and landscape in outdoor light.","Frédéric Bazille||Summer Scene||1869":"Young men bathing and resting by a river. A treatment of the male nude in outdoor light, it was shown at the 1870 Salon.","Frédéric Bazille||Bazille's Studio||1870":"Fellow artists including Manet, Renoir and Monet gathered in the studio; the tall figure of Bazille himself was painted in by Manet.","Camille Pissarro||The Boulevard Montmartre at Night||1897":"The Boulevard Montmartre at night, seen from a hotel window, the only night scene in the series. Look at the streetlights and shop lights spreading across the wet street.","Camille Pissarro||The Red Roofs||1877":"The red roofs of the village of Pontoise seen through winter trees. It is notable for its thick, dense brushwork that structures the whole picture.","Camille Pissarro||The Hermitage at Pontoise||1867":"A large landscape of the hillside village at Pontoise and the fields below. It shows the solid composition and calm tones of Pissarro's work in this period.","Camille Pissarro||Hoarfrost||1873":"On a frosty winter morning, a peasant walks with a bundle of wood on his back, casting a long shadow. It was shown at the first Impressionist exhibition in 1874.","Camille Pissarro||Lordship Lane Station, Dulwich||1871":"A railway scene painted while Pissarro was living in London to escape the Franco-Prussian War.","Camille Pissarro||The Boulevard Montmartre on a Winter Morning||1897":"One of a series of 14 views of the same street painted from a hotel window at different times of day and in different weather.","Camille Pissarro||La Place du Théâtre Français||1898":"Carriages and pedestrians in the square, seen from a hotel window. Because of an eye ailment, the elderly Pissarro preferred to paint city views from windows rather than outdoors.","Camille Pissarro||Apple Harvest||1888":"A work from Pissarro's Neo-Impressionist period, when he adopted Seurat's pointillist technique.","Alfred Sisley||The Boat in the Flood, Port-Marly||1876":"The village of Port-Marly, submerged when the Seine burst its banks, with a boat afloat in the street. Sisley painted the same flood in several works.","Alfred Sisley||Snow at Louveciennes||1878":"A lone figure walks down a snow-covered lane in Louveciennes. Note the blue and pink tones mingled in the white snow.","Alfred Sisley||The Bridge at Moret||1893":"The bridge and town of Moret-sur-Loing, where Sisley spent his final years. He painted the bridge and church here again and again.","Alfred Sisley||View of the Canal Saint-Martin||1870":"The sky reflected in the waters of the Canal Saint-Martin in Paris, with moored boats. Devoting much of the picture to sky and water is typical of Sisley.","Alfred Sisley||The Bridge at Villeneuve-la-Garenne||1872":"A suspension bridge spanning the Seine, with people resting on the riverbank. The bridge is placed at an angle to add depth to the picture.","Alfred Sisley||Regatta at Molesey||1874":"A regatta at Molesey on the upper Thames in England. The fluttering flags and ripples are rendered with quick, lively brushstrokes.","Alfred Sisley||The Footbridge at Argenteuil||1872":"A close view of the footbridge at Argenteuil. Note the perspective lines formed by the bridge's structure and the light on the river.","Alfred Sisley||The Road from the Machine, Louveciennes||1873":"The road leading to the Louveciennes pumping works known as \"the Machine\". The rows of trees lining the road converge on the vanishing point in a striking composition.","Berthe Morisot||The Cradle||1872":"The artist's sister Edma watches over a baby asleep in a cradle. Morisot's best-known work, shown at the first Impressionist exhibition in 1874.","Berthe Morisot||Eugène Manet and His Daughter at Bougival||1881":"Her husband, Eugène Manet, and their daughter, Julie, sit together in the garden. Quick, light brushstrokes capture an ordinary moment of family life.","Berthe Morisot||Summer's Day||1879":"Two women in a boat on the lake in the Bois de Boulogne. Rapid zigzag brushstrokes vividly convey the ripples and sunlight.","Berthe Morisot||Young Woman in a Ball Gown||1879":"A young woman in a ball gown, with flowers and foliage behind her, painted with bold brushwork. Note how the dress and the background blend without boundaries.","Berthe Morisot||Psyché||1876":"A young woman adjusts her dress before a tilting full-length mirror. In French, \"psyché\" means just such a full-length mirror.","Berthe Morisot||The Harbor at Lorient||1869":"The port of Lorient in Brittany, with the artist's sister Edma seated on the quay under a parasol. Note the broad expanse of water and the reflections of the boats.","Berthe Morisot||Woman at Her Toilette||1875–1880":"A woman seen from behind arranging her hair before a mirror. The picture, a harmony of whites and silvers, was completed with rapid brushwork.","Gustave Caillebotte||Paris Street; Rainy Day||1877":"A large painting of a Paris intersection where Haussmann-era boulevards meet, with pedestrians under umbrellas. Note the reflections on the wet paving stones and the lamppost that divides the picture.","Gustave Caillebotte||The Floor Scrapers||1875":"Shirtless workmen scrape a wooden floor. Rejected by the Salon for its supposedly vulgar subject, it was then shown at the Impressionist exhibition.","Gustave Caillebotte||Le Pont de l'Europe||1876":"People walking across the iron bridge over the tracks of the Gare Saint-Lazare. The massive iron railings and strong perspective show the modern city of Paris.","Gustave Caillebotte||Young Man at His Window||1876":"The artist's brother René, seen from behind, stands at the window of an apartment looking down at the street. The composition leads the viewer to follow his gaze onto the Paris boulevard.","Gustave Caillebotte||The Orange Trees||1878":"Figures spending a summer's day in the garden of the family's country house at Yerres. The contrast between strong sunlight and the shade of the trees stands out.","Gustave Caillebotte||Man at His Bath||1884":"A man seen from behind drying himself with a towel after his bath. It treats the male nude, rare at the time, as an everyday scene; note the wet footprints on the floor.","Gustave Caillebotte||Rooftops in the Snow||1878":"The snow-covered roofs and chimneys of Paris, seen from a window. The muted tones of the leaden sky and wet roofs convey the air of the winter city.","Mary Cassatt||Little Girl in a Blue Armchair||1878":"A girl lounges languidly in a blue armchair. Cassatt herself revealed in a letter that Degas worked on part of the background.","Mary Cassatt||The Child's Bath||1893":"A mother washes the feet of the child on her lap. The view from above and the flat pattern of the striped dress show the influence of Japanese prints.","Mary Cassatt||In the Loge||1878":"While a woman in black watches the stage through opera glasses, a man behind her is also watching her through his binoculars. The painting wittily captures the relationship between looking and being looked at.","Mary Cassatt||Woman with a Pearl Necklace in a Loge||1879":"Behind a woman seated in a theatre box, a chandelier and the auditorium sparkle in the mirror. Note the warm light falling on her face and shoulders.","Mary Cassatt||The Cup of Tea||1880–1881":"A woman in a pink dress sits in an armchair holding a teacup. The everyday life of bourgeois women taking tea was one of Cassatt's favourite subjects.","Mary Cassatt||The Boating Party||1893–1894":"A close-up view of a boat carrying a man at the oars and a woman holding a child. The boldly cropped composition and vivid areas of colour reveal the influence of Japanese prints.","Mary Cassatt||The Letter||1890–1891":"A series of colour prints inspired by Japanese ukiyo-e, held by several museums.","Georges Seurat||A Sunday Afternoon on the Island of La Grande Jatte||1884–1886":"A masterpiece of pointillism, depicting Parisians at leisure on an island in the Seine in tiny dots of colour. Up close you see the dots; step back and the colours blend.","Georges Seurat||Bathers at Asnières||1884":"A large painting of young workers resting on the banks of the Seine; rejected by the Salon, it was shown at the Salon des Indépendants. Factory chimneys can be seen in the distance.","Georges Seurat||The Circus||1890–1891":"Seurat's last major painting, showing a female equestrian, a clown and the audience, was unfinished when he died. Upward-surging curves create a lively mood.","Georges Seurat||Les Poseuses||1886–1888":"Three models undress and rest in the studio; \"A Sunday Afternoon on the Island of La Grande Jatte\" hangs on the wall at left.","Georges Seurat||The Eiffel Tower||1889경":"A small painting of the Eiffel Tower just before its completion.","Georges Seurat||Le Chahut||1889–1890":"Cancan dancers kick their legs high in a cabaret. The work applies contemporary theories of line and colour holding that upward lines evoke joy.","Georges Seurat||Le Bec du Hoc, Grandcamp||1885":"A pointillist landscape of a cliff rising from the Normandy coast. The contrast between the rock dominating the canvas and the calm sea creates an unusual tension.","Georges Seurat||Young Woman Powdering Herself||1889–1890":"The model is Seurat's lover, Madeleine Knobloch.","Paul Signac||Portrait of Félix Fénéon||1890":"Fénéon, the critic who championed pointillism, is shown in profile against a swirling pattern of colour. The original title carries a musical-style designation such as \"Opus 217\".","Paul Signac||The Red Buoy||1895":"A red buoy and the reflections of buildings on the water of Saint-Tropez harbour, painted in broad dots of colour. It shows the late pointillism, with larger dots and bolder colours.","Paul Signac||Women at the Well||1892":"Women at a well in Saint-Tropez in the south of France. The pointillist technique, using complementary contrasts under intense sunlight, stands out.","Paul Signac||Avignon, Evening (Palace of the Popes)||1909":"The Palace of the Popes in Avignon, seen from across the Rhône in the glow of sunset. Large, mosaic-like dots of colour make the water and sky shimmer.","Paul Signac||Breakfast (The Dining Room)||1886–1887":"Figures at breakfast in a bourgeois dining room, painted in strict pointillist technique. Their stiff poses create a cool, static atmosphere.","Paul Signac||Capo di Noli||1898":"A landscape of a headland and the sea on the Ligurian coast of Italy, painted in intense dots of colour. Look at the dazzling light created by complementary dots placed side by side.","Paul Signac||The Pine Tree at Saint-Tropez||1909":"A large pine at Saint-Tropez, painted in mosaic-like dots of colour. The tree filling the centre and the bright palette convey the sunlight of the south of France.","Henri-Edmond Cross||The Golden Isles||1891–1892":"The islands off Hyères in the south of France, painted like horizontal bands. The simple composition and even dots of colour produce an effect close to abstraction.","Henri-Edmond Cross||The Evening Air||1893–1894":"An idyllic scene of women resting beneath pines by the sea at dusk. Soft violet and pink tones create a dreamlike atmosphere.","Henri-Edmond Cross||Beach at La Vignasse||1891–1892":"A pointillist view of a beach on the Mediterranean coast of southern France, where Cross lived. Calm dots of colour capture the sea and the glitter of sunlight.","Henri-Edmond Cross||Landscape with Stars||1905–1908경":"A late watercolour in which the night sky is rendered in short strokes of colour rather than dots. Part of the Robert Lehman Collection, this light-sensitive work on paper is not always on view.","Paul Cézanne||Mont Sainte-Victoire||1902–1904":"Cézanne painted the same mountain many times, and the series is scattered among museums around the world.","Paul Cézanne||The Card Players||1894–1895":"Two peasants sit facing each other over a game of cards; Cézanne painted several versions of this subject. Notice how the composition balances left and right around the bottle in the centre.","Paul Cézanne||Apples and Oranges||1899경":"A still life of apples and oranges piled on a white cloth and a floral fabric. The table and dishes, seemingly seen from several viewpoints at once, show Cézanne's distinctive way of constructing a picture.","Paul Cézanne||The Large Bathers||1898–1905":"A large work in which female nudes gather beneath trees leaning to form a triangle; it is one of the bathers series that occupied Cézanne until the end of his life.","Paul Cézanne||The Boy in the Red Vest||1888–1890":"Part of the Bührle Foundation collection, shown at the Kunsthaus Zürich.","Paul Cézanne||The House of the Hanged Man||1873":"Shown at the first Impressionist exhibition in 1874.","Paul Cézanne||Madame Cézanne in a Red Armchair||1877경":"A portrait of Cézanne's wife, Hortense, seated in a red armchair. The patterns and colour planes of the chair and skirt are so solidly built that the figure looks like a structure.","Paul Cézanne||The Basket of Apples||1893경":"The table and bottle are painted from different viewpoints, making this work a recognised starting point of Cubism.","Vincent van Gogh||The Starry Night||1889":"A night sky based on the view from his window at the asylum in Saint-Rémy, marked by a swirling sky and a flame-like cypress. The village below was added from imagination.","Vincent van Gogh||Sunflowers||1888":"The Sunflowers series is divided among London, Amsterdam, Munich, Philadelphia, Tokyo and elsewhere.","Vincent van Gogh||Bedroom in Arles||1888":"Van Gogh's bedroom in the \"Yellow House\" in Arles; he painted three versions with the same composition. He wrote in a letter that he wanted the vivid colours to suggest rest.","Vincent van Gogh||Café Terrace at Night||1888":"A café terrace on the Place du Forum in Arles under a starry night sky. Note how night is conveyed with blue and yellow and no black.","Vincent van Gogh||The Potato Eaters||1885":"A key early work from his Nuenen period, showing a peasant family eating potatoes under a lamp. He wrote that he wanted to show they had tilled the earth with the very hands they eat with.","Vincent van Gogh||Starry Night Over the Rhône||1888":"The night sky and reflections of gaslight seen from the banks of the Rhône in Arles. Look for the couple strolling by the river and the Big Dipper in the sky.","Vincent van Gogh||The Night Café||1888":"The interior of an all-night café in Arles, painted in intense reds and greens. In a letter, he said he wanted to express a place where one can ruin oneself and go mad.","Vincent van Gogh||Self-Portrait with Bandaged Ear||1889":"Painted just after he cut his ear. Although the injured ear was his left, he painted from a mirror, so the bandage appears on the right. A Japanese print hangs on the wall behind.","Vincent van Gogh||Irises||1889":"The irises in the garden of the asylum at Saint-Rémy. The irises in a vase that he painted the following year are at the Metropolitan Museum of Art.","Vincent van Gogh||Almond Blossoms||1890":"Painted to celebrate the birth of his brother Theo's son. Almond blossoms, a symbol of new life, bloom against a blue sky.","Vincent van Gogh||The Church at Auvers||1890":"The church at Auvers-sur-Oise, seen as if from below. The wavering outlines of the building, the deep blue sky and the path that forks in two are striking.","Vincent van Gogh||Wheatfield with Crows||1890":"A flock of crows over a wheat field beneath a dark blue, seemingly stormy sky, from his time in Auvers. Note the three paths branching through the wheat.","Vincent van Gogh||Portrait of Père Tanguy||1887":"The background is filled with Japanese ukiyo-e prints. The sculptor Rodin bought the painting, and it is now in the Musée Rodin.","Vincent van Gogh||The Yellow House||1888":"The house in Arles where he lived with Gauguin and dreamed of a \"Studio of the South\".","Vincent van Gogh||Wheat Field with Cypresses||1889":"Another version with the same composition is in the National Gallery, London.","Vincent van Gogh||Irises||1890":"A still life painted shortly before he left the asylum at Saint-Rémy; the originally pink background has faded over time to nearly white.","Vincent van Gogh||Self-Portrait with Grey Felt Hat||1887":"A self-portrait from his Paris period, painted in short strokes after he adopted Neo-Impressionist pointillism.","Vincent van Gogh||The Harvest||1888":"A painting Van Gogh cherished so much that he said it \"absolutely kills everything else\".","Vincent van Gogh||Gauguin's Chair||1888":"Painted in Arles, where he lived with Gauguin, as a pair to his own simple chair (National Gallery, London).","Vincent van Gogh||Road with Cypress and Star||1890":"A night landscape painted shortly before he left Saint-Rémy.","Vincent van Gogh||At Eternity's Gate||1890":"An old man sits with his face buried in his fists. At Saint-Rémy, Van Gogh reworked as an oil painting a drawing and lithograph from his time in The Hague.","Vincent van Gogh||Wheatfield under Thunderclouds||1890":"Painted in Auvers a few weeks before his death.","Vincent van Gogh||Self-Portrait with a Straw Hat||1887":"To save canvas, he painted \"Peasant Woman Peeling Potatoes\" on the back of this picture.","Paul Gauguin||Where Do We Come From? What Are We? Where Are We Going?||1897–1898":"A monumental work from his Tahitian period depicting the journey of life, read from right to left, from the baby on the right to the old woman on the left. The title is inscribed in the upper left corner.","Paul Gauguin||Vision After the Sermon||1888":"Breton women, after hearing a sermon, see a vision of Jacob wrestling with the angel. The tree trunk dividing reality from vision and the intense red ground are distinctive.","Paul Gauguin||The Yellow Christ||1889":"A yellow crucified Christ and praying women set in a Breton field. The figure is modelled on a wooden crucifix in a chapel near Pont-Aven.","Paul Gauguin||Tahitian Women on the Beach||1891":"Two women seated on a Tahitian beach, painted in flat areas of colour with bold outlines. The work dates from Gauguin's first stay in Tahiti.","Paul Gauguin||Ia Orana Maria||1891":"The Tahitian title means \"Hail Mary\"; the Virgin and Child are reimagined as a Tahitian woman and child. Look for the winged angel among the trees and the haloes above the two heads.","Paul Gauguin||Spirit of the Dead Watching||1892":"A Tahitian girl lies face down on a bed, with a dark figure standing behind her. Gauguin explained that his subject was the spirit of the dead feared by the islanders.","Paul Gauguin||Self-Portrait with Yellow Christ||1890–1891":"A self-portrait with his painting \"The Yellow Christ\" and a ceramic jar he made himself in the background. Because he worked from a mirror, the Christ appears reversed.","Paul Gauguin||Arearea||1892":"Two Tahitian women sit in the foreground while a ritual takes place before an idol behind them. Note the red dog in the foreground.","Paul Gauguin||The White Horse||1898":"A Tahitian landscape with a white horse drinking from a stream and riders. Notice how the white horse takes on a green tint, reflecting the surrounding foliage.","Paul Gauguin||Two Tahitian Women||1899":"Two bare-breasted Tahitian women stand holding a bowl of red flowers. The weighty bodies and simple background give a sculptural impression.","Paul Gauguin||Nevermore||1897":"The title is taken from the refrain of Edgar Allan Poe's poem \"The Raven\".","Henri de Toulouse-Lautrec||At the Moulin Rouge||1892–1895":"Figures gathered around a table at the Moulin Rouge; the small figure in the background walking with his tall cousin is the artist himself. The woman with a green-lit face at lower right is striking.","Henri de Toulouse-Lautrec||Moulin Rouge: La Goulue||1891":"Lautrec's first poster, featuring La Goulue, the Moulin Rouge's star dancer. The shadowy man in the foreground is her dance partner, Valentin.","Henri de Toulouse-Lautrec||At the Salon on the Rue des Moulins||1894":"Women waiting for clients in the salon of a Paris brothel. Lautrec observed the tedium of their daily lives without embellishment.","Henri de Toulouse-Lautrec||In Bed||1892":"Two women lying side by side under the covers, seen with a tender eye. It is one of Lautrec's series on the daily lives of brothel women.","Henri de Toulouse-Lautrec||La Toilette||1889":"A red-haired woman sitting on the floor at her toilette, seen from behind
