1937","tatem","Metamorphosis of Narcissus",{"cr":1,"tip":"물가에 웅크린 나르키소스와 달걀을 쥔 손이 같은 형태로 겹치는 이중 이미지입니다. 달리는 런던에서 프로이트를 만날 때 이 그림을 가져갔습니다."}],["내란의 예감","Soft Construction with Boiled Beans","1936","philly","Soft Construction with Boiled Beans (Premonition of Civil War)",{"cr":1,"tip":"스스로를 찢어발기는 듯한 기괴한 몸으로 스페인 내전의 공포를 표현했습니다. 내전이 일어나기 몇 달 전에 그려 '내란의 예감'으로 불립니다."}],["십자가의 성 요한의 그리스도","Christ of Saint John of the Cross","1951","kelvingrove","Christ of Saint John of the Cross",{"cr":1,"tip":"십자가의 그리스도를 머리 위에서 내려다본 독특한 시점입니다. 성 요한의 드로잉에서 착안했고, 아래에 달리의 고향 포르트리가트 바다가 보입니다."}],["바닷가재 전화기 (오브제)","Lobster Telephone","1936","tatem","x",{"cr":1,"tip":"실제 전화기 수화기 위에 석고 바닷가재를 얹은 오브제입니다. 후원자 에드워드 제임스를 위해 몇 점이 만들어졌습니다."}],["깨어나기 직전 석류 주위를 나는 벌 때문에 꾼 꿈","Dream Caused by the Flight of a Bee around a Pomegranate a Second Before Awakening","1944","thyssen","x",{"cr":1,"tip":"잠든 아내 갈라 위로 석류에서 나온 물고기, 물고기에서 튀어나오는 호랑이가 덮칩니다. 뒤쪽 거미 다리 코끼리도 찾아보세요."}],["최후의 만찬의 성사","The Sacrament of the Last Supper","1955","nga","x",{"cr":1,"tip":"반투명한 그리스도와 제자들이 거대한 정십이면체 아래 모여 있습니다. 배경의 바다는 달리가 살던 포르트리가트입니다."}],["십자가 처형 (초입방체)","Crucifixion (Corpus Hypercubus)","1954","met","x",{"tip":"그리스도가 4차원 초입방체의 전개도로 된 십자가 위에 떠 있고, 작가의 아내 갈라가 아래에서 이를 올려다봅니다.","cr":1}],["위대한 자위행위자","The Great Masturbator","1929","reina","x",{"tip":"카탈루냐 해안 크레우스 곶의 바위에서 따온 일그러진 얼굴이 화면 중앙을 차지합니다. 작가는 세상을 떠날 때까지 이 그림을 곁에 두었습니다.","cr":1}],["성 안토니우스의 유혹","The Temptation of St. Anthony","1946","brussels","x",{"tip":"십자가를 든 성 안토니우스에게 거미처럼 긴 다리를 한 말과 코끼리들이 유혹의 상징을 싣고 다가옵니다. 영화와 연계된 공모전을 위해 그렸습니다.","cr":1}]]},{"n":"프리다 칼로","o":"Frida Kahlo","l":"1907–1954","d":"고통스러운 삶과 멕시코의 정체성을 자화상에 담았습니다.","w":[["두 명의 프리다","The Two Fridas","1939","mammx","The Two Fridas",{"cr":1,"tip":"디에고 리베라와 이혼하던 무렵 그린 이중 자화상입니다. 두 프리다의 드러난 심장이 하나의 혈관으로 이어져 있습니다."}],["가시 목걸이와 벌새가 있는 자화상","Self-Portrait with Thorn Necklace and Hummingbird","1940","ransom","Self-Portrait with Thorn Necklace and Hummingbird",{"cr":1,"tip":"가시 목걸이에 죽은 벌새가 매달려 있고, 어깨 뒤로 원숭이와 검은 고양이가 보입니다. 리베라와 이혼한 직후에 그렸습니다."}],["부서진 기둥","The Broken Column","1944","olmedo","The Broken Column",{"cr":1,"tip":"척추 수술 뒤 금속 코르셋을 차야 했던 고통을 그렸습니다. 갈라진 몸 안에 부서진 기둥이 있고 온몸에 못이 박혀 있습니다."}],["짧은 머리의 자화상","Self-Portrait with Cropped Hair","1940","moma","x",{"cr":1,"tip":"남자 양복을 입고 잘라낸 머리카락 사이에 앉은 모습입니다. 위쪽에 머리카락이 없으면 사랑하지 않겠다는 노래 가사가 적혀 있습니다."}],["프리다와 디에고 리베라","Frieda and Diego Rivera","1931","sfmoma","x",{"tip":"결혼 2년 뒤 샌프란시스코에서 그린 부부 초상으로, 팔레트를 든 거구의 리베라 곁에 작은 칼로가 손을 맞잡고 서 있습니다.","cr":1}],["헨리 포드 병원","Henry Ford Hospital","1932","olmedo","x",{"tip":"디트로이트에서 유산을 겪은 경험을 금속판에 그렸습니다. 병상에 누운 작가와 붉은 끈으로 이어진 여러 상징물이 주위에 떠 있습니다.","cr":1}],["액자","The Frame","1938","pompidou","x",{"tip":"꽃 장식 틀에 둘러싸인 자화상으로, 멕시코 민속 공예풍의 장식이 돋보입니다. 1939년 루브르가 구입해 주요 국제 미술관이 소장한 첫 20세기 멕시코 작가의 작품이 되었습니다.","cr":1}]]}]},{"id":"american-realism","name":"미국 사실주의","en":"American Realism (American Scene)","years":"1910년 – 1960년대","s":1910,"e":1965,"color":"#2f5f63","sum":"유럽에서 입체주의와 추상, 초현실주의가 이어지던 시기에 미국에서는 대도시의 거리, 주유소, 식당, 시골 마을 같은 미국의 일상 풍경을 사실적으로 그린 화가들이 등장했습니다. '아메리칸 신(American Scene) 회화'라고도 부르며, 대공황 시대 미국인의 고독과 정서를 담았습니다. 1930년대에는 그랜트 우드처럼 중서부 농촌의 삶을 그린 지역주의(Regionalism)가, 전후에는 앤드루 와이어스의 고요한 사실주의가 그 흐름을 이었습니다.","traits":["평범한 미국의 도시와 시골 풍경을 사실적으로 묘사","텅 빈 거리, 늦은 밤 식당처럼 고요하고 쓸쓸한 분위기","강한 빛과 그림자, 영화의 한 장면 같은 구도","대도시 속 현대인의 고독과 소외"],"diff":"같은 시기 유럽 아방가르드가 형태를 해체하거나 무의식을 탐구했다면, 미국 사실주의는 눈에 보이는 일상의 풍경으로 시대의 정서를 그렸습니다.","note":"호퍼는 어떤 유파에도 속하지 않으려 했지만, 미술사에서는 보통 미국 사실주의로 분류합니다. 호퍼(1967년 사망)와 와이어스(2009년 사망)는 작품 저작권이 보호되어 이미지를 싣지 않았고, 우드의 1931년 이후 작품도 미국에서 아직 저작권이 남아 있어 이미지를 싣지 않았습니다. 오키프는 사실주의보다는 미국 모더니즘을 대표하는 화가지만, 같은 시대 미국 미술로 이 전시실에서 함께 소개합니다. 1986년에 세상을 떠나 작품 저작권이 보호되므로 이미지를 싣지 않았습니다.","artists":[{"n":"에드워드 호퍼","o":"Edward Hopper","l":"1882–1967","d":"뉴욕을 중심으로 활동하며 도시의 식당, 극장, 주유소, 철길 옆 집을 그렸습니다. 고요한 빛과 쓸쓸한 인물로 '현대인의 고독'을 그린 화가로 불리며, 영화감독들에게도 큰 영향을 주었습니다.","w":[["철길 옆 집","House by the Railroad","1925","moma","x",{"cr":1,"tip":"앨프리드 히치콕 영화 〈사이코〉의 베이츠 저택이 이 그림에서 영감을 받은 것으로 알려져 있습니다."}],["자동판매 식당","Automat","1927","desmoines","x",{"cr":1,"tip":"밤의 자동판매 식당에 홀로 앉아 커피잔을 든 여인을 그렸습니다. 검은 유리창에 천장 조명만 줄지어 비치는 쓸쓸한 장면입니다."}],["찹 수이","Chop Suey","1929","private","x",{"cr":1,"tip":"2018년 경매에서 약 9,190만 달러에 낙찰되어 호퍼 작품 최고가를 기록했습니다."}],["이른 일요일 아침","Early Sunday Morning","1930","whitney","x",{"cr":1,"tip":"휘트니 미술관은 호퍼의 아내 조세핀의 유증으로 호퍼 작품을 가장 많이 소장하고 있습니다."}],["뉴욕의 영화관","New York Movie","1939","moma","x",{"cr":1,"tip":"영화관 한쪽에서 생각에 잠긴 여성 안내원을 그렸습니다. 호퍼의 아내 조가 모델을 섰습니다."}],["밤을 지새우는 사람들 (나이트호크스)","Nighthawks","1942","aic","x",{"cr":1,"tip":"호퍼의 가장 유명한 작품으로, 시카고 미술관이 완성 직후 사들였습니다."}],["주유소","Gas","1940","moma","x",{"cr":1,"tip":"해 질 녘 시골길의 주유소에서 한 남자가 주유기를 점검합니다. 붉은 주유기와 어두워지는 숲이 대비를 이룹니다."}],["호텔 방","Hotel Room","1931","thyssen","x",{"tip":"호텔 방 침대 끝에 앉은 여인이 손에 든 종이를 읽고 있습니다. 풀지 않은 짐과 텅 빈 벽이 낯선 곳에서의 고독을 전합니다.","cr":1}],["밤의 사무실","Office at Night","1940","walker","x",{"tip":"늦은 밤 서류를 읽는 남자와 서류함 앞에 선 여비서를 그렸습니다. 작가는 고가 열차에서 스쳐 본 사무실 풍경에서 착상을 얻었다고 말했습니다.","cr":1}],["바닷가의 방","Rooms by the Sea","1951","yale","x",{"tip":"열린 문 바로 밖이 바다로 이어지는 비현실적인 구도로, 빈 방에 쏟아지는 햇빛이 주인공입니다. 케이프코드에 있던 작가의 작업실에서 출발한 그림입니다.","cr":1}],["케이프코드의 저녁","Cape Cod Evening","1939","nga","x",{"tip":"해 질 녘 집 앞 계단에 앉은 남자와 그 곁에 선 여자, 풀숲 너머를 바라보는 개를 그렸습니다. 서로 시선을 맞추지 않는 인물들이 고요한 긴장감을 줍니다.","cr":1}]]},{"n":"조지아 오키프","o":"Georgia O'Keeffe","l":"1887–1986","d":"미국 모더니즘의 어머니. 크게 확대한 꽃과 뉴멕시코의 뼈와 사막을 그렸습니다.","w":[["검은 붓꽃","Black Iris","1926","met","x",{"tip":"붓꽃 한 송이를 화면 가득 확대해 그렸습니다. 꽃잎의 부드러운 명암 변화가 추상화처럼 보이기도 합니다.","cr":1}],["소의 두개골: 빨강, 하양, 파랑","Cow's Skull: Red, White, and Blue","1931","met","x",{"tip":"뉴멕시코 사막에서 주운 소 두개골을 미국 국기의 세 색 앞에 그렸습니다. 유럽이 아닌 미국다운 그림을 만들겠다는 뜻이 담겼습니다.","cr":1}],["구름 위의 하늘 IV","Sky Above Clouds IV","1965","aic","x",{"tip":"비행기에서 내려다본 구름을 폭 7미터가 넘는 화면에 그렸습니다. 오키프의 작품 가운데 가장 큰 그림입니다.","cr":1}],["음악, 분홍과 파랑 No. 2","Music, Pink and Blue No. 2","1918","whitney","x",{"tip":"음악을 색과 형태로 표현하려 한 초기 추상화입니다. 부드럽게 휘어지는 분홍과 파랑의 면이 리듬을 이룹니다.","cr":1}]]},{"n":"그랜트 우드","o":"Grant Wood","l":"1891–1942","d":"아이오와 출신으로, 미국 중서부 농촌의 사람과 풍경을 단순하고 정교한 형태로 그린 지역주의(Regionalism)의 대표 화가입니다.","w":[["아메리칸 고딕","American Gothic","1930","aic","File:Grant Wood - American Gothic - Google Art Project.jpg",{"tip":"고딕 양식 창문이 있는 시골집 앞에 선 농부와 딸(흔히 부부로 오해받음)을 그렸습니다. 모델은 화가의 여동생과 치과의사였고, 미국에서 가장 많이 패러디된 그림 가운데 하나입니다."}],["스톤시티, 아이오와","Stone City, Iowa","1930","joslyn","File:Stone City Iowa 1930 Grant Wood.jpg",{"tip":"고향 아이오와의 언덕과 마을을 장난감처럼 둥글고 매끈하게 그렸습니다. 우드가 지역주의 양식을 확립한 초기 풍경화입니다."}],["폴 리비어의 한밤의 질주","The Midnight Ride of Paul Revere","1931","met","x",{"cr":1,"tip":"미국 독립전쟁의 전설적인 장면을 장난감 마을처럼 내려다본 시점으로 그렸습니다."}],["타작꾼들의 저녁 식사","Dinner for Threshers","1934","deyoung","x",{"cr":1,"tip":"추수 일꾼들이 농가 식탁에 모여 저녁을 먹는 모습을 집의 단면으로 보여줍니다. 우드가 어린 시절 아이오와 농장의 기억을 그렸습니다."}],["혁명의 딸들","Daughters of Revolution","1932","cincinnati","x",{"tip":"「델라웨어 강을 건너는 워싱턴」 복제화 앞에 선 세 노부인을 그렸습니다. 작가가 자신의 유일한 풍자화라고 부른 작품입니다.","cr":1}],["파슨 윔스의 우화","Parson Weems' Fable","1939","amoncarter","x",{"tip":"어린 조지 워싱턴이 벚나무를 베었다고 고백하는 일화를, 이 이야기를 지어낸 윔스 목사가 커튼을 걷어 보여 주는 장면으로 그렸습니다. 소년의 얼굴은 길버트 스튜어트가 그린 워싱턴 초상에서 따왔습니다.","cr":1}],["허버트 후버의 생가","The Birthplace of Herbert Hoover","1931","desmoines","x",{"tip":"아이오와주 웨스트브랜치에 있는 후버 대통령의 생가와 마을을 높은 곳에서 내려다본 풍경입니다. 둥글게 다듬은 나무와 깔끔한 길이 작가 특유의 장식적인 시골 풍경을 이룹니다. 미니애폴리스 미술관과 공동 소장해 두 곳을 오가며 전시됩니다.","cr":1}]]},{"n":"앤드루 와이어스","o":"Andrew Wyeth","l":"1917–2009","d":"펜실베이니아와 메인주의 시골 풍경과 이웃을 템페라와 수채로 섬세하게 그렸습니다. 쓸쓸하고 고요한 분위기의 사실적인 그림으로 20세기 미국에서 가장 사랑받은 화가 가운데 한 명입니다.","w":[["바다에서 부는 바람","Wind from the Sea","1947","nga","x",{"cr":1,"tip":"바람에 부푼 낡은 레이스 커튼 너머로 들판이 보입니다. 메인주 올슨 가족의 집 창가에서 본 장면을 템페라로 그렸습니다."}],["크리스티나의 세계","Christina's World","1948","moma","x",{"cr":1,"tip":"근육 질환으로 걷지 못하던 이웃 크리스티나 올슨이 언덕 위 집을 향해 몸을 끌고 가는 모습입니다. MoMA의 대표 소장품입니다."}],["성촉절 (그라운드호그 데이)","Groundhog Day","1959","philly","x",{"cr":1,"tip":"빈 부엌 식탁에 컵과 접시가 놓여 있고 창밖엔 겨울 햇살이 비칩니다. 사람 없이도 집주인의 삶이 느껴지는 템페라화입니다."}],["그 신사","That Gentleman","1960","dallas","x",{"cr":1,"tip":"와이어스의 이웃이던 흑인 노인이 의자에 앉은 모습을 템페라로 그렸습니다. 주름진 얼굴과 옷의 질감이 섬세하게 묘사되어 있습니다."}],["앨버트의 아들","Albert's Son","1959","oslo","x",{"tip":"낡은 집 앞에 홀로 선 소년을 절제된 색조의 템페라로 그렸습니다. 와이어스 특유의 쓸쓸한 정서가 담긴 작품으로, 유럽 공공 미술관에서 그의 그림을 볼 수 있는 드문 기회입니다.","cr":1}],["공매","Public Sale","1943","philly","x",{"tip":"펜실베이니아 시골 농가에서 열린 경매 풍경을 높은 곳에서 내려다본 구도로 그렸습니다. 넓은 들판과 작게 모여 있는 사람들이 쓸쓸한 분위기를 자아냅니다.","cr":1}],["북쪽 곶","Northern Point","1950","wadsworth","x",{"tip":"작가가 여름을 보낸 메인주 해안을 극적인 시점으로 담은 템페라화입니다. 정밀한 묘사와 절제된 색이 와이어스 풍경화의 특징을 보여 줍니다.","cr":1}]]}]},{"id":"abstract-expressionism","name":"추상표현주의","en":"Abstract Expressionism","years":"1943년 – 1960년","s":1943,"e":1960,"color":"#2c2c2c","sum":"2차 대전으로 유럽 예술가들이 미국으로 건너오면서 미술의 중심이 파리에서 뉴욕으로 옮겨 갔습니다. 미국 화가들은 초현실주의의 자동기술법을 이어받아, 거대한 캔버스에 형상 없이 행위와 색으로 내면을 표현했습니다. '뉴욕 화파'라고도 부릅니다.","traits":["액션 페인팅: 그리는 행위 자체가 작품 (폴록, 드 쿠닝)","색면 회화: 넓은 색면으로 명상적 경험을 줌 (로스코, 뉴먼)","관객을 감싸는 거대한 화면","드리핑: 바닥에 캔버스를 깔고 물감을 흘리고 뿌림"],"diff":"유럽의 추상이 기하학적 질서나 이론을 추구했다면, 추상표현주의는 즉흥적 몸짓과 실존적 감정을 앞세웁니다.","artists":[{"n":"잭슨 폴록","o":"Jackson Pollock","l":"1912–1956","d":"드리핑 기법으로 액션 페인팅을 대표합니다.","w":[["가을의 리듬 (넘버 30)","Autumn Rhythm (Number 30)","1950","met","Autumn Rhythm (Number 30)",{"cr":1,"tip":"바닥에 펼친 캔버스 위로 물감을 흘리고 뿌리는 드리핑 기법의 대작입니다. 밑칠하지 않은 캔버스 위로 검정, 흰색, 갈색 선이 리듬을 이룹니다."}],["라벤더 안개 (넘버 1)","Lavender Mist","1950","nga","Lavender Mist",{"cr":1,"tip":"이름과 달리 라벤더색 물감은 거의 쓰지 않았고, 여러 색이 겹쳐 보랏빛 안개처럼 보입니다. 위쪽 가장자리에 폴록의 손자국이 남아 있습니다."}],["넘버 1A, 1948","Number 1A, 1948","1948","moma","Number 1A, 1948",{"cr":1,"tip":"드리핑 기법이 무르익은 시기의 작품으로, 오른쪽 위에 폴록의 손바닥 자국이 여러 개 찍혀 있습니다."}],["수렴","Convergence","1952","buffalo","Convergence (Pollock)",{"cr":1,"tip":"검정과 흰색 선 위로 빨강, 노랑, 파랑 물감이 폭발하듯 얽혀 있습니다. 드리핑 시기 말기에 그린 대형 작품입니다."}],["암늑대","The She-Wolf","1943","moma","x",{"cr":1,"tip":"드리핑 이전 시기의 작품으로, 늑대의 형상이 두꺼운 물감과 낙서 같은 선 속에 숨어 있습니다. 미술관이 처음 소장한 폴록 작품입니다."}],["하나: 넘버 31, 1950","One: Number 31, 1950","1950","moma","x",{"cr":1,"tip":"가로 5m가 넘는 드리핑 대작입니다."}],["다섯 길 물속","Full Fathom Five","1947","moma","x",{"tip":"물감을 흘려 붓는 방식을 쓴 초기 대표작으로, 표면에 못, 압정, 단추, 담배꽁초, 열쇠 등이 박혀 있습니다. 제목은 셰익스피어 「템페스트」의 구절에서 왔습니다.","cr":1}],["연금술","Alchemy","1947","pgc","x",{"tip":"에나멜과 알루미늄 물감 등을 흘리고 뿌린 초기 드리핑 작품입니다. 두껍게 쌓인 물감층 사이로 금속성 물감이 은은하게 빛납니다.","cr":1}],["서머타임: 넘버 9A","Summertime: Number 9A","1948","tatem","x",{"tip":"가로 5미터가 넘는 긴 화면에 검은 선과 노랑·파랑 색면이 리듬감 있게 이어집니다. 화면을 따라 걸으며 작가의 몸짓을 따라가 보기 좋습니다.","cr":1}],["심연","The Deep","1953","pompidou","x",{"tip":"흰 물감 사이로 깊고 검은 틈이 갈라지듯 드러나는 말기작입니다. 드리핑 이후 새로운 방향을 모색하던 시기를 보여 줍니다.","cr":1}],["메아리: 넘버 25, 1951","Echo: Number 25, 1951","1951","moma","x",{"cr":1,"tip":"화려한 색을 버리고 검은 에나멜 물감만으로 그린 '블랙 푸어링' 시기의 대표작입니다. 흘린 선 사이로 사람 형상 같은 이미지가 다시 나타납니다."}]]},{"n":"윌렘 드 쿠닝","o":"Willem de Kooning","l":"1904–1997","d":"네덜란드 출신. 격렬한 붓질 속에 인물을 남긴 액션 페인팅의 대가입니다.","w":[["여인 I","Woman I","1950–1952","moma","Woman I",{"cr":1,"tip":"거친 붓질로 이빨을 드러낸 여인을 그렸습니다. 2년 가까이 그렸다 긁어내기를 반복하며 완성한 작품입니다."}],["발굴","Excavation","1950","aic","Excavation (de Kooning)",{"cr":1,"tip":"흰 바탕 위에 신체와 형태의 조각들이 빽빽하게 뒤엉켜 있습니다. 가까이 다가가 선과 색 조각이 맞물리는 방식을 살펴보세요."}],["다락방","Attic","1949","met","x",{"cr":1,"tip":"주로 흑백으로 형태의 조각들이 서로 맞물리게 그렸습니다. 사이사이 남은 노랑과 빨강의 흔적을 찾아보세요."}],["강으로 가는 문","Door to the River","1960","whitney","x",{"cr":1,"tip":"넓고 대담한 붓질로 그린 추상화로, 데 쿠닝이 1960년대 풍경 같은 추상으로 옮겨 가던 시기의 작품입니다."}],["여인과 자전거","Woman and Bicycle","1952–1953","whitney","x",{"tip":"「여인」 연작의 하나로, 이를 드러낸 웃음과 부릅뜬 눈의 여인을 격렬한 붓질로 그렸습니다. 목 부분에 그려진 두 번째 미소도 눈여겨볼 만합니다.","cr":1}],["고담 뉴스","Gotham News","1955","buffalo","x",{"tip":"뉴욕을 가리키는 제목처럼 도시의 소란을 거친 붓질과 강렬한 색으로 표현했습니다. 마르지 않은 물감에 신문지를 눌러 찍은 활자 흔적이 남아 있습니다.","cr":1}],["부활절 월요일","Easter Monday","1955–1956","met","x",{"tip":"도시 풍경을 연상시키는 추상화로, 물감 위에 눌러 붙였던 신문지 활자가 화면 곳곳에 비쳐 보입니다.","cr":1}]]},{"n":"마크 로스코","o":"Mark Rothko","l":"1903–1970","d":"부유하는 색면으로 비극과 숭고를 표현한 색면 회화의 대표 화가입니다.","w":[["로스코 채플 벽화","Rothko Chapel","1964–1967","rothko","Rothko Chapel",{"cr":1,"tip":"로스코가 직접 설계에 참여한 명상 공간으로 대형 그림 14점이 걸려 있습니다."}],["시그램 벽화","Seagram Murals","1958–1959","tatem","Seagram murals",{"cr":1,"tip":"원래 뉴욕 포시즌스 레스토랑을 위해 그렸지만 로스코가 계약을 취소했습니다. 테이트 모던 로스코 전시실에 걸려 있습니다."}],["No. 61 (녹과 파랑)","No. 61 (Rust and Blue)","1953","moca","No. 61 (Rust and Blue)",{"cr":1,"tip":"번진 듯한 경계의 색면이 위아래로 쌓여 있습니다. 로스코는 가까이 서서 색에 감싸이듯 보기를 권했습니다."}],["No. 14","No. 14, 1960","1960","sfmoma","x",{"cr":1,"tip":"커다란 색면들이 위아래로 놓인 후기 작품입니다. 가장자리가 흐릿하게 번진 색면은 가까이에서 오래 볼수록 깊어집니다."}],["무제 (회색 위의 검정)","Untitled (Black on Gray)","1969–1970","guggenheim","x",{"cr":1,"tip":"세상을 떠나기 직전 그린 마지막 연작 가운데 하나입니다."}],["No. 5/No. 22","No. 5/No. 22","1950","moma","x",{"cr":1,"tip":"밝은 색면이 층을 이루는 로스코 고전기의 대형 작품입니다. 그림 앞에 가까이 서서 색이 몸을 감싸는 느낌을 경험해 보세요."}],["검정 위의 밝은 빨강","Light Red Over Black","1957","tatem","x",{"cr":1,"tip":"검은 바탕 위에 밝은 빨강이 떠 있는 색면 회화입니다. 가장자리가 번진 색면은 조명과 거리에 따라 다르게 보입니다."}],["바닷가의 느린 소용돌이","Slow Swirl at the Edge of the Sea","1944","moma","x",{"tip":"색면 추상 이전 초현실주의 시기의 작품으로, 두 개의 유기적인 형상이 바닷가에서 춤추듯 얽혀 있습니다.","cr":1}],["오렌지와 노랑","Orange and Yellow","1956","buffalo","x",{"tip":"커다란 오렌지색과 노란색 사각형이 가장자리가 번지듯 떠 있는 전성기 색면 회화입니다. 가까이 서면 색에 둘러싸이는 경험을 할 수 있습니다.","cr":1}],["빨강 속의 네 가지 어둠","Four Darks in Red","1958","whitney","x",{"tip":"붉은 바탕 위에 검은색과 짙은 갈색의 사각형이 겹쳐 있습니다. 밝은 색에서 어두운 색으로 옮겨 가던 시기를 보여 줍니다.","cr":1}],["빨강 위의 황토색과 빨강","Ochre and Red on Red","1954","phillips","x",{"tip":"로스코의 그림 네 점만 걸린 작은 방 '로스코 룸'에 걸려 있습니다. 작가가 직접 설치에 의견을 낸 공간으로, 벤치에 앉아 조용히 감상할 수 있습니다.","cr":1}]]},{"n":"바넷 뉴먼","o":"Barnett Newman","l":"1905–1970","d":"넓은 색면을 세로 띠('지퍼')로 가르는 색면 회화의 대표 화가입니다.","w":[["인간, 영웅적이며 숭고한","Vir Heroicus Sublimis","1950–1951","moma","Vir Heroicus Sublimis",{"cr":1,"tip":"폭 5m가 넘는 빨간 화면을 가는 세로줄 몇 개가 나눕니다. 뉴먼은 관객이 그림 가까이 서서 보기를 원했습니다."}],["하나됨 I","Onement I","1948","moma","Onement I",{"cr":1,"tip":"붉은 바탕을 가르는 한 줄의 세로선, 이른바 '지프'가 처음 등장한 작품입니다. 마스킹테이프 위에 물감을 칠해 만들었습니다."}],["십자가의 길","The Stations of the Cross","1958–1966","nga","x",{"cr":1,"tip":"흑백으로만 그린 14점 연작이 한 전시실에 걸려 있습니다."}],["누가 빨강, 노랑, 파랑을 두려워하랴 III","Who's Afraid of Red, Yellow and Blue III","1966–1967","stedelijk","x",{"cr":1,"tip":"커다란 빨강 화면 양 끝에 파랑과 노랑 띠를 둔 작품입니다. 1986년 관람객이 칼로 훼손해 복원을 둘러싼 논란이 일었습니다."}],["부러진 오벨리스크","Broken Obelisk","1963–1967","rothko","x",{"tip":"피라미드 위에 거꾸로 세운 오벨리스크가 부러진 끝으로 맞닿아 있는 강철 조각입니다. 로스코 채플 앞 연못에 마틴 루서 킹 목사를 기리는 작품으로 놓여 있습니다.","cr":1}],["아담","Adam","1951–1952","tatem","x",{"tip":"짙은 적갈색 화면을 붉은 세로 띠인 '지프'가 가르는 작품입니다. 성서 속 최초의 인간을 제목으로 삼아 창조의 순간을 암시합니다.","cr":1}],["카테드라","Cathedra","1951","stedelijk","x",{"tip":"가로 5미터가 넘는 짙은 파란 화면에 가는 세로선이 지나가는 대형 작품입니다. 1997년 관람객에게 칼로 훼손된 뒤 오랜 복원을 거쳤습니다.","cr":1}]]}]},{"id":"pop-neo-expressionism","name":"팝아트와 신표현주의","en":"Pop Art & Neo-Expressionism","years":"1955년 – 1990년","s":1955,"e":1990,"color":"#9c2f5a","sum":"1950년대 후반 영국과 미국에서 등장한 팝아트는 추상표현주의의 진지한 내면 표현 대신 광고, 만화, 영화 스타, 슈퍼마켓 상품처럼 누구나 아는 대중 이미지를 미술로 끌어들였습니다. 1980년대에는 이에 대한 반작용으로 거친 붓질과 강렬한 감정, 인물을 되살린 신표현주의가 미국과 독일에서 크게 일어났습니다.","traits":["팝아트: 대중문화와 소비 사회의 이미지를 그대로 차용","실크스크린, 망점(벤데이 점) 같은 인쇄 기법으로 반복과 대량생산을 표현","신표현주의: 거친 붓질, 큰 화면, 강렬한 색으로 회화를 되살림","거리의 낙서(그라피티)가 미술관에 들어옴 (바스키아, 해링)","독일 신표현주의는 전쟁과 역사의 기억을 다룸 (키퍼)"],"diff":"추상표현주의가 화가 내면의 숭고한 감정을 그렸다면, 팝아트는 차갑고 무표정하게 대중 이미지를 복제했습니다. 신표현주의는 다시 손으로 그리는 회화와 감정을 되찾았습니다.","note":"이 전시실의 화가들은 모두 작품 저작권이 살아 있어 이미지를 싣지 않았습니다. 호크니와 키퍼는 지금도 활동 중인 작가입니다.","artists":[{"n":"앤디 워홀","o":"Andy Warhol","l":"1928–1987","d":"상업 일러스트레이터 출신. 수프 캔과 스타의 얼굴을 실크스크린으로 반복 찍어 내며 '예술의 대량생산'을 보여 준 팝아트의 아이콘입니다.","w":[["캠벨 수프 캔","Campbell's Soup Cans","1962","moma","x",{"cr":1,"tip":"32가지 맛을 그린 캔버스 32점이 한 세트입니다."}],["황금빛 마릴린 먼로","Gold Marilyn Monroe","1962","moma","x",{"cr":1,"tip":"먼로가 세상을 떠난 뒤 금빛 바탕 한가운데 그녀의 얼굴 하나만 실크스크린으로 찍었습니다. 성상화를 떠올리게 하는 구성입니다."}],["마릴린 두 폭","Marilyn Diptych","1962","tatem","x",{"cr":1,"tip":"먼로의 얼굴 50개를 왼쪽은 컬러로, 오른쪽은 흑백으로 찍었습니다. 오른쪽으로 갈수록 이미지가 흐려지며 죽음을 암시합니다."}],["오렌지 재앙 #5","Orange Disaster #5","1963","guggenheim","x",{"cr":1,"tip":"신문 사진 속 전기의자를 주황색 바탕 위에 반복해 찍었습니다. 죽음과 재난 연작의 하나로, 텅 빈 처형실이 섬뜩합니다."}],["두 엘비스","Double Elvis","1963","moma","x",{"cr":1,"tip":"은색 바탕 위에 총을 겨눈 엘비스 프레슬리가 두 번 겹쳐 찍혀 있습니다. 서부 영화 홍보 사진을 사용했습니다."}],["마오","Mao","1972","met","x",{"cr":1,"tip":"공식 초상 사진 속 마오쩌둥 위에 화장하듯 화려한 색을 칠했습니다. 닉슨의 중국 방문 무렵 시작한 연작입니다."}],["브릴로 상자","Brillo Soap Pads Box","1964","moma","x",{"cr":1,"tip":"마트의 세제 상자를 나무 상자에 실크스크린으로 똑같이 찍어 '예술과 상품의 차이'를 물은 작품입니다."}],["초록색 코카콜라 병들","Green Coca-Cola Bottles","1962","whitney","x",{"tip":"실크스크린으로 찍은 코카콜라 병 112개가 줄지어 반복됩니다. 똑같아 보이지만 병마다 조금씩 다른 인쇄 흔적을 찾아보는 재미가 있습니다.","cr":1}],["열 개의 리즈","Ten Lizes","1963","pompidou","x",{"tip":"배우 엘리자베스 테일러의 얼굴을 은색 바탕에 열 번 반복해 찍었습니다. 영화 필름처럼 이어지는 이미지가 스타의 대량 소비를 보여 줍니다.","cr":1}],["열여섯 명의 재키","Sixteen Jackies","1964","walker","x",{"tip":"케네디 대통령 암살 전후의 보도 사진 속 재클린 케네디를 열여섯 번 반복했습니다. 미소 띤 모습과 슬픔에 잠긴 모습이 교차합니다.","cr":1}],["에설 스컬 36회","Ethel Scull 36 Times","1963","met","x",{"tip":"수집가 에설 스컬을 즉석 사진 부스에서 찍은 사진으로 만든 초상으로, 작가의 첫 주문 초상화입니다. 메트로폴리탄 미술관과 휘트니 미술관이 공동 소장하고 있어 두 곳에서 번갈아 전시됩니다.","cr":1}]]},{"n":"로이 리히텐슈타인","o":"Roy Lichtenstein","l":"1923–1997","d":"만화 한 칸을 인쇄 망점까지 확대해 그려 대중 이미지와 순수 회화의 경계를 흔들었습니다.","w":[["봐, 미키","Look Mickey","1961","nga","x",{"cr":1,"tip":"만화를 소재로 한 그의 첫 작품입니다."}],["물에 빠진 소녀","Drowning Girl","1963","moma","x",{"cr":1,"tip":"로맨스 만화의 한 장면을 크게 옮긴 작품으로, 파도 속에서 울면서도 도움을 청하지 않겠다는 소녀의 말풍선이 있습니다. 인쇄 망점을 흉내 낸 점무늬를 가까이서 보세요."}],["꽝!","Whaam!","1963","tatem","x",{"cr":1,"tip":"두 폭에 걸쳐 전투기가 미사일을 쏘고 적기가 폭발하는 장면을 그렸습니다. 전쟁 만화의 한 장면을 크게 옮긴 작품입니다."}],["절망","Hopeless","1963","basel","x",{"cr":1,"tip":"눈물을 흘리는 여인과 말풍선을 그린 작품으로, 로맨스 만화의 한 장면을 옮겼습니다. 망점과 굵은 윤곽선을 가까이서 보세요."}],["차 안에서","In the Car","1963","snmga","x",{"cr":1,"tip":"차 안에서 남녀가 긴장된 표정으로 마주한 장면입니다. 뒤로 흐르는 사선으로 달리는 속도감을 표현했습니다."}],["공을 든 소녀","Girl with Ball","1961","moma","x",{"cr":1,"tip":"비치볼을 머리 위로 든 수영복 차림의 소녀를 그렸습니다. 리조트 신문 광고 이미지를 바탕으로 한 초기 팝아트 작품입니다."}],["블램","Blam","1962","yale","x",{"cr":1,"tip":"전투기가 공격을 받아 폭발하며 부서지는 순간을 만화풍으로 그렸습니다. 큰 의성어 글자가 화면을 채웁니다."}],["내가 발사했을 때","As I Opened Fire","1964","stedelijk","x",{"tip":"전투기 조종사의 사격 장면을 담은 만화 세 칸을 크게 확대한 세 폭 그림입니다. 벤데이 점과 굵은 윤곽선이 만화의 인쇄 방식을 흉내 냅니다.","cr":1}],["빅 페인팅 No. 6","Big Painting No. 6","1965","k20","x",{"tip":"추상표현주의의 격렬한 붓 자국을 벤데이 점과 매끈한 윤곽으로 기계적으로 다시 그렸습니다. 1970년 생존 미국 작가 작품의 최고가 기록을 세웠습니다.","cr":1}],["물감 튄 붓 자국","Brushstroke with Spatter","1966","aic","x",{"tip":"만화처럼 단순화한 굵은 붓 자국과 튄 물감을 그린 「붓 자국」 연작의 하나입니다. 즉흥적인 붓질을 정교하게 계산해 그린 아이러니가 핵심입니다.","cr":1}],["하우스 I","House I","1996–1998","nga","x",{"tip":"집 한 채를 단순한 선과 면으로 표현한 알루미늄 조각으로, 조각 정원에 놓여 있습니다. 걸어가는 방향에 따라 집이 튀어나오거나 들어가 보이는 착시를 일으킵니다.","cr":1}]]},{"n":"데이비드 호크니","o":"David Hockney","l":"1937–","d":"영국 출신. 캘리포니아의 햇빛과 수영장을 밝은 색으로 그렸고, 최근에는 아이패드 드로잉까지 작업 영역을 넓혔습니다.","w":[["더 큰 첨벙","A Bigger Splash","1967","tatem","x",{"cr":1,"tip":"테이트 소장품으로 테이트 모던과 테이트 브리튼에서 번갈아 전시됩니다."}],["클라크 부부와 퍼시","Mr and Mrs Clark and Percy","1970–1971","tateb","x",{"cr":1,"tip":"패션 디자이너 오시 클라크와 텍스타일 디자이너 실리아 버트웰 부부, 고양이 퍼시를 그렸습니다. 호크니는 이들 결혼식의 신랑 들러리였습니다."}],["예술가의 초상 (두 인물이 있는 수영장)","Portrait of an Artist (Pool with Two Figures)","1972","private","x",{"cr":1,"tip":"2018년 경매에서 생존 작가 작품 최고가 기록을 세웠습니다."}],["닉의 수영장에서 나오는 피터","Peter Getting Out of Nick's Pool","1966","walkerliv","x",{"cr":1,"tip":"로스앤젤레스의 수영장에서 나오는 연인 피터를 그렸습니다. 사진을 바탕으로 했고, 흰 테두리가 즉석 사진처럼 보입니다."}],["워터 근처의 더 큰 나무들","Bigger Trees Near Warter","2007","tateb","x",{"tip":"요크셔의 겨울 나무들을 50개의 캔버스를 이어 그린 대형 풍경화입니다. 작가가 2008년 테이트에 기증했습니다.","cr":1}],["펄블로섬 고속도로","Pearblossom Hwy., 11–18th April 1986, #2","1986","getty","x",{"tip":"캘리포니아 사막 교차로의 풍경을 수백 장의 사진을 이어 붙여 만든 포토콜라주입니다. 여러 시점에서 찍은 사진들이 모여 하나의 풍경을 이룹니다.","cr":1}],["멀홀랜드 드라이브: 작업실로 가는 길","Mulholland Drive: The Road to the Studio","1980","lacma","x",{"tip":"로스앤젤레스 집에서 작업실로 가는 구불구불한 언덕길을 선명한 색과 지도처럼 펼친 시점으로 그렸습니다. 운전하며 보는 경험을 한 화면에 담았습니다.","cr":1}]]},{"n":"장미셸 바스키아","o":"Jean-Michel Basquiat","l":"1960–1988","d":"뉴욕 거리의 낙서 'SAMO'로 출발해 해골, 왕관, 글자로 흑인 역사와 인종 문제를 그렸습니다. 27세에 세상을 떠났습니다.","w":[["무제 (두개골)","Untitled (Skull)","1981","broad","x",{"cr":1,"tip":"해골 같은 머리 속에 뒤엉킨 선과 색이 드러나 있습니다. 바스키아가 본격적으로 작가 활동을 시작하던 초기의 대표작입니다."}],["혼 플레이어스","Horn Players","1983","broad","x",{"cr":1,"tip":"찰리 파커와 디지 길레스피 같은 재즈 연주자에게 바친 작품입니다."}],["할리우드 아프리칸스","Hollywood Africans","1983","whitney","x",{"cr":1,"tip":"바스키아가 친구 화가들과 할리우드에 머물던 시기를 그렸습니다. 흑인 배우들에게 주어진 고정된 배역을 꼬집는 글자들이 적혀 있습니다."}],["무제","Untitled","1982","private","x",{"cr":1,"tip":"2017년 경매에서 일본 사업가 마에자와 유사쿠가 약 1억 1,050만 달러에 낙찰받았습니다."}],["여섯 범죄","Six Crimee","1982","moca","x",{"cr":1,"tip":"거친 인물과 글자, 기호를 화면 가득 겹쳐 그린 작품입니다. 바스키아는 단어를 줄로 지우면 오히려 더 눈에 띈다고 말했습니다."}],["불쾌한 자유주의자들","Obnoxious Liberals","1982","broad","x",{"cr":1,"tip":"거친 인물과 글자를 겹쳐 인종과 돈, 권력의 문제를 꼬집는 작품입니다. 화면 곳곳에 적힌 단어를 읽어 보세요."}],["찰스 1세","Charles the First","1982","private","x",{"cr":1,"tip":"재즈 색소폰 연주자 찰리 파커에게 바친 작품입니다."}],["골드 그리오","Gold Griot","1984","broad","x",{"tip":"나무판 위에 해골처럼 보이는 커다란 인물을 그렸습니다. 제목의 그리오는 서아프리카에서 역사와 이야기를 전하는 구전 시인을 뜻합니다.","cr":1}],["얼음의 녹는점","Melting Point of Ice","1984","broad","x",{"tip":"글자와 도상이 겹겹이 쌓인 대형 회화입니다. 바스키아 특유의 빽빽하고 즉흥적인 화면을 볼 수 있습니다.","cr":1}],["눈과 달걀","Eyes and Eggs","1983","broad","x",{"tip":"경첩이 달린 면 작업용 천에 그린 대형 작품입니다. 인물과 달걀 모티프, 다양한 기호가 거친 선으로 그려져 있습니다.","cr":1}],["LNAPRK","LNAPRK","1982","whitney","x",{"tip":"캔버스 위에 종이를 붙이고 밧줄을 단 작품입니다. 글자와 기호, 거친 드로잉이 어우러진 작가 특유의 화면을 보여 줍니다.","cr":1}]]},{"n":"키스 해링","o":"Keith Haring","l":"1958–1990","d":"뉴욕 지하철 광고판에 분필로 그린 낙서에서 출발했습니다. 단순한 선의 인물로 에이즈 경각심과 반마약 같은 사회 메시지를 전했습니다.","w":[["투토몬도 (모든 세상)","Tuttomondo","1989","pisa","x",{"cr":1,"tip":"세상을 떠나기 1년 전 그린, 그의 마지막 공공 벽화 가운데 하나로, 성당 외벽이라 누구나 볼 수 있습니다."}],["크랙은 끔찍해","Crack Is Wack","1986","harlem","x",{"cr":1,"tip":"마약 반대 메시지를 담은 벽화로, 고속도로 옆 핸드볼 코트 벽에 그대로 남아 있습니다."}],["네케르 병원 탑 벽화","Tower (Necker Children's Hospital)","1987","necker","x",{"cr":1,"tip":"파리 네케르 아동병원 외벽 계단탑에 그린 벽화로, 아이들에게 희망을 주려는 뜻을 담았습니다."}],["우리, 청년들","We the Youth","1987","phillymural","x",{"cr":1,"tip":"필라델피아 지역 청소년들과 함께 그린 거리 벽화입니다."}],["그리스도의 생애 (제단화)","The Life of Christ (Altarpiece)","1990","sainteustache","x",{"tip":"화이트 골드를 입힌 청동 세 폭 제단화로, 작가가 세상을 떠나기 몇 주 전에 완성한 마지막 작품입니다. 같은 형태로 만든 아홉 점 가운데 하나입니다.","cr":1}],["옛날 옛적에…","Once Upon a Time...","1989","lgbtcenter","x",{"tip":"LGBT 커뮤니티 센터 2층의 옛 남자 화장실 벽 전체를 덮은 벽화입니다. 스톤월 항쟁 20주년 전시를 위해 그렸으며, 에이즈 유행 이전의 성 해방을 찬미합니다.","cr":1}],["무지 = 공포","Ignorance = Fear","1989","various","x",{"tip":"에이즈 운동 단체 액트업을 위해 만든 포스터로, 눈·귀·입을 가린 세 인물이 등장합니다. '침묵은 죽음'이라는 구호와 함께 에이즈에 대한 무관심을 고발합니다.","cr":1}]]},{"n":"안젤름 키퍼","o":"Anselm Kiefer","l":"1945–","d":"독일 신표현주의의 거장. 짚, 납, 재, 흙을 섞은 거대한 화면에 나치 시대와 독일 역사의 기억을 담았습니다.","w":[["독일의 정신적 영웅들","Germany's Spiritual Heroes","1973","broad","x",{"cr":1,"tip":"나무로 된 다락방 같은 넓은 공간에 불꽃이 타오르고, 바닥에 독일 문화 인물들의 이름이 적혀 있습니다. 독일 역사의 무게를 다룬 초기작입니다."}],["오시리스와 이시스","Osiris and Isis","1985–1987","sfmoma","x",{"cr":1,"tip":"거대한 피라미드 위에 회로 기판이 놓이고, 구리선이 흩어진 조각들을 잇습니다. 이집트 신화의 오시리스 부활 이야기를 다뤘습니다."}],["보헤미아는 바닷가에 있다","Bohemia Lies by the Sea","1996","met","x",{"cr":1,"tip":"끝없이 이어지는 길과 양귀비 들판을 두터운 물감과 재료로 그렸습니다. 제목은 잉게보르크 바흐만의 시에서 가져왔습니다."}],["천 송이 꽃이 피게 하라","Let a Thousand Flowers Bloom","2000","tatem","x",{"cr":1,"tip":"꽃밭 속에 선 마오쩌둥을 그린 대형 작품입니다. 제목은 마오의 '백화제방' 구호를 비튼 것으로, 겉보기 낙관 뒤의 탄압을 떠올리게 합니다."}],["아타노르","Athanor","2007","louvre","x",{"tip":"루브르의 계단 벽에 설치된 대형 회화로, 별이 흩어진 하늘 아래 누운 작가 자신을 그렸습니다. 브라크 이후 처음으로 생존 작가에게 의뢰한 영구 설치 작품입니다.","cr":1}],["마르가레테","Margarethe","1981","sfmoma","x",{"tip":"파울 첼란의 시 「죽음의 푸가」에 나오는 금발의 마르가레테를 캔버스에 붙인 짚으로 표현했습니다.","cr":1}],["실내","Interior (Innenraum)","1981","stedelijk","x",{"tip":"나치 독일 신총리관저의 내부 사진을 바탕으로 웅장하지만 폐허처럼 텅 빈 공간을 그렸습니다.","cr":1}]]}]}]};
const EN={"m.early-renaissance.years":"c. 1300 – 1490","m.early-renaissance.sum":"Breaking away from the flat religious painting of the Middle Ages, artists began to depict people and nature realistically, drawing on perspective, anatomy and the ideals of ancient Greece and Rome. Giotto gave his figures weight and emotion, Masaccio brought mathematical perspective to painting, and Botticelli revived ancient myth with graceful line. Florence was the center, and patrons such as the Medici family nurtured artists.","m.early-renaissance.diff":"Instead of the gold backgrounds and flat figures of Gothic art, painters show feeling human beings in three-dimensional space.","m.early-renaissance.t0":"Linear perspective: a vanishing point creates depth on a flat surface","m.early-renaissance.t1":"Light and shade give figures volume","m.early-renaissance.t2":"Revival of Greek and Roman mythological subjects","m.early-renaissance.t3":"Fresco (wall painting) and tempera as the main techniques","m.early-renaissance.t4":"Fresco cycles filling church and chapel walls with stories (Giotto's Scrovegni Chapel, Masaccio's Brancacci Chapel)","a.Giotto di Bondone":"The pioneer who opened the door to the Renaissance, the first to give his figures weight and emotion.","a.Masaccio":"The first to apply mathematical perspective to painting in earnest. He died at just 27.","a.Sandro Botticelli":"Painted myths in graceful line under the patronage of the Medici.","m.high-renaissance.years":"1490 – 1530 (the Venetian school until the late 16th century)","m.high-renaissance.sum":"The brief, brilliant moment when the Renaissance reached its peak. In Florence and Rome, Leonardo, Michelangelo and Raphael perfected the classical ideal of harmony and balance, while in Venice Giorgione and Titian developed a painting built on color.","m.high-renaissance.diff":"Where the Early Renaissance experimented with techniques, this period unites them into a single, perfect harmony.","m.high-renaissance.t0":"Sfumato: outlines softened like smoke","m.high-renaissance.t1":"Stable pyramidal compositions and ideal proportions","m.high-renaissance.t2":"The spread of oil paint allows deeper color and texture","m.high-renaissance.t3":"Florence and Rome favor drawing (disegno), Venice favors color (colore)","m.high-renaissance.t4":"The classical ideal also peaks in sculpture (Michelangelo's \"David\" and \"Pietà\")","a.Leonardo da Vinci":"Painter, scientist and inventor. Fewer than 20 finished paintings survive.","a.Michelangelo Buonarroti":"He called himself a sculptor, yet the Sistine Chapel ceiling made him a giant of painting too.","a.Raffaello Sanzio":"Absorbed Leonardo and Michelangelo to perfect the most harmonious classical style.","a.Giorgione":"An enigmatic Venetian who painted like a poet, through landscape and mood.","a.Titian":"Master of the Venetian school. He built form through color and brushwork, deeply influencing later painters.","m.northern-renaissance.years":"1420 – 1570","m.northern-renaissance.sum":"The Renaissance as it flourished in Flanders (today's Belgium and the Netherlands) and Germany. Refined oil technique allowed jewels, fabrics and even reflections in mirrors to be painted in extreme detail, while the Reformation and printing spurred the growth of prints and everyday scenes.","m.northern-renaissance.diff":"Where Italy pursued ideal beauty and the classical past, the North probed every detail of visible reality.","m.northern-renaissance.t0":"Thin layers of oil paint for glowing color and precise detail","m.northern-renaissance.t1":"Symbolic meaning in every object","m.northern-renaissance.t2":"Rise of woodcuts and engravings (Dürer)","m.northern-renaissance.t3":"Peasant life and landscape emerge as subjects in their own right (Bruegel)","m.northern-renaissance.t4":"Bosch's bizarre, fantastical imagery; Holbein's precise court portraits","a.Jan van Eyck":"The Flemish painter credited with perfecting oil painting.","a.Hieronymus Bosch":"His bizarre, fantastical imagery has earned him the title of forefather of the Surrealists.","a.Albrecht Dürer":"The painter who brought the Italian Renaissance to Germany, and a master printmaker.","a.Hans Holbein the Younger":"Court painter to Henry VIII, famed for his precise portraits.","a.Pieter Bruegel the Elder":"Flemish master of peasant life and the landscapes of the seasons.","m.mannerism.years":"1520 – 1600","m.mannerism.sum":"After the perfect harmony of the High Renaissance, painters tried to go beyond it by deliberately stretching proportions and twisting space. The name means an exaggerated \"manner\" (style). It was led by Pontormo and Bronzino in Florence and Parmigianino in Parma, and El Greco in Toledo, Spain, pushed it into a unique spiritual expression.","m.mannerism.diff":"Instead of Renaissance balance and naturalness, it seeks tension, distortion and refined artifice.","m.mannerism.t0":"Elongated bodies and twisting poses","m.mannerism.t1":"Unstable, ambiguous space","m.mannerism.t2":"Cool, artificial color","m.mannerism.t3":"Intellectual allegories and puzzles","m.mannerism.t4":"Cool, polished portraits of the Medici court (Bronzino)","m.mannerism.t5":"Acid colors and figures that seem to float (Pontormo)","m.mannerism.note":"El Greco began in Mannerism and arrived at a personal style that fits no school. His elongated figures and intense color were rediscovered 300 years later by the Expressionists.","a.Jacopo Pontormo":"Launched Florentine Mannerism with unstable compositions and acid colors.","a.Parmigianino":"The embodiment of Mannerism, with gracefully elongated figures.","a.Agnolo Bronzino":"Painter to the Medici court, known for cool, polished portraits and allegories.","a.El Greco":"Born on Crete in Greece and active in Toledo, Spain. He painted figures that surge upward like flames.","m.baroque.years":"1600 – 1720","m.baroque.sum":"An age when the Catholic Counter-Reformation and absolute monarchs wanted art that displayed faith and power dramatically. Intense light and shade and movement overwhelm the viewer. Meanwhile, in the Protestant Netherlands, portraits, genre scenes and still lifes bought by ordinary citizens flourished.","m.baroque.diff":"Instead of Mannerism's artificial tension, it appeals directly to the emotions with lifelike figures, dramatic light and movement.","m.baroque.t0":"Tenebrism: extreme contrast, with a single shaft of light in the darkness (Caravaggio)","m.baroque.t1":"Capturing the most dramatic moment","m.baroque.t2":"Diagonal compositions and dynamic movement","m.baroque.t3":"Dutch Golden Age: everyday interiors, light, portraits of citizens","m.baroque.t4":"Flemish Baroque: voluptuous bodies and dynamic large canvases (Rubens), elegant aristocratic portraits (van Dyck)","m.baroque.t5":"Portraits with quick, lively brushwork (Frans Hals)","m.baroque.t6":"Classical Baroque: orderly, restrained mythological and history painting (Poussin)","m.baroque.note":"In 1616 Artemisia Gentileschi became the first woman admitted to the Florentine Academy of Fine Arts.","a.Caravaggio":"Used ordinary people from the street as models for saints and launched the Baroque with intense light and shade.","a.Artemisia Gentileschi":"The leading woman painter of the Baroque, who followed Caravaggio's style.","a.Peter Paul Rubens":"Master of the Flemish Baroque, famed for voluptuous figures and dynamic large canvases.","a.Anthony van Dyck":"Rubens's pupil and court painter to Charles I of England, he set the model for the aristocratic portrait.","a.Frans Hals":"Dutch portraitist who caught laughing faces with quick, lively brushwork.","a.Rembrandt van Rijn":"The greatest painter of the Dutch Golden Age, who portrayed the inner life through light and darkness.","a.Diego Velázquez":"Court painter to Philip IV of Spain, whom Manet called \"the painter of painters.\"","a.Johannes Vermeer":"The Delft painter of quiet light falling through a window. Only about 30 of his works survive.","a.Nicolas Poussin":"A French painter who held to classical order in the Baroque era, later a model for Neoclassicism.","m.rococo.years":"1720 – 1780","m.rococo.sum":"After the death of Louis XIV, French aristocrats traded the grandeur of Versailles for light, elegant pleasures in the social salons of Parisian townhouses. Rococo is the decorative, sensuous style that reflects their taste.","m.rococo.diff":"The heavy, grand drama of the Baroque gives way to light, playful elegance.","m.rococo.t0":"Bright, soft pastel tones","m.rococo.t1":"The \"fête galante\" (elegant party), showing aristocratic love and leisure","m.rococo.t2":"Decorative curves, like the shapes of shells","m.rococo.t3":"Intimate pictures for small interiors","m.rococo.t4":"A different strand of the same era: humble still lifes and scenes of ordinary life (Chardin)","m.rococo.t5":"Royal portraits and the rise of women painters (Vigée Le Brun)","m.rococo.note":"In 1783 Vigée Le Brun became one of the few women admitted to the French Royal Academy of Painting and Sculpture. She painted more than 30 portraits of Marie Antoinette. Gainsborough (British portraits and landscapes) and Canaletto (Venetian views) are not Rococo painters as such, but as leading 18th-century artists they are presented in this room.","a.Jean-Antoine Watteau":"The starting point of Rococo, who created the \"fête galante\" genre.","a.François Boucher":"Court painter favored by Madame de Pompadour, known for sensuous mythological scenes.","a.Jean-Honoré Fragonard":"The last generation of Rococo, painting romantic moments with lively brushwork.","a.Jean-Baptiste-Siméon Chardin":"In the Rococo era, he quietly painted humble still lifes and the daily life of ordinary people.","a.Élisabeth Vigée Le Brun":"A woman painter who won fame as Marie Antoinette's portraitist.","m.neoclassicism.years":"1760 – 1830","m.neoclassicism.sum":"Inspired by the excavation of Pompeii and Enlightenment thought, this style sought to revive the restraint and morality of ancient Greece and Rome. In the era of the French Revolution and Napoleon, it became the official art celebrating republican virtue and heroes.","m.neoclassicism.diff":"A reaction against the frivolous, extravagant aristocratic taste of Rococo, championing rigour and reason.","m.neoclassicism.t0":"Crisp outlines and smooth surfaces like ancient sculpture","m.neoclassicism.t1":"Stable, symmetrical compositions","m.neoclassicism.t2":"Moralizing themes such as patriotism, sacrifice and civic virtue","m.neoclassicism.t3":"Line (drawing) valued over color","m.neoclassicism.t4":"Heroic propaganda portraits of the Napoleonic era (David's \"Napoleon Crossing the Alps\", Ingres's \"Napoleon I on His Imperial Throne\")","a.Jacques-Louis David":"Painter of the Revolution and First Painter to Napoleon.","a.Jean-Auguste-Dominique Ingres":"David's pupil and the guardian of Neoclassicism who upheld the purity of line against Delacroix.","m.romanticism.years":"1790 – 1850","m.romanticism.sum":"A movement that answered Neoclassicism's reason and rules with individual feeling, imagination and the sublime in nature. Its subjects included contemporary events such as revolutions, wars and shipwrecks, the exotic East and the vastness of nature.","m.romanticism.diff":"If Neoclassicism is \"line and reason,\" Romanticism is \"color and emotion.\" The rivalry between Ingres and Delacroix symbolizes the divide.","m.romanticism.t0":"Passionate emotion and dramatic scenes","m.romanticism.t1":"Color over line, vigorous brushwork and dynamic compositions","m.romanticism.t2":"The \"sublime\": humanity before nature","m.romanticism.t3":"Innovation in British landscape painting (Turner, Constable)","m.romanticism.t4":"The \"Black Paintings,\" showing the horrors of war and humanity's dark side (Goya)","m.romanticism.t5":"Late landscapes where form dissolves into light and atmosphere (Turner) → forerunners of Impressionism and abstraction","a.Francisco Goya":"Spanish court painter whose images of the horrors of war and the darkness in people opened the door to modern art.","a.Caspar David Friedrich":"The leading landscape painter of German Romanticism, who painted a quiet, meditative sublime.","a.Théodore Géricault":"Launched French Romanticism by depicting a real shipwreck on a huge canvas.","a.Eugène Delacroix":"Leader of French Romanticism, whose intense color also influenced the Impressionists.","a.J. M. W. Turner":"British landscape painter who dissolved light and atmosphere, seen as a forerunner of Impressionism and abstraction.","a.John Constable":"British landscape painter who painted the ordinary countryside of his native Suffolk from direct observation. He influenced the French Barbizon school.","m.pre-raphaelite.years":"1848 – early 1900s","m.pre-raphaelite.sum":"A group founded in 1848 by Millais, Rossetti and Holman Hunt in revolt against the formulaic teaching of the Royal Academy. Its name reflects the aim of returning to the purity of medieval and early Renaissance art before Raphael. A generation later Waterhouse took up the style, extending its influence into the early 20th century.","m.pre-raphaelite.diff":"While French Realism of the same period painted real-life labor, the English Pre-Raphaelites painted literary and medieval ideals with precise realist technique.","m.pre-raphaelite.t0":"Vivid, bright color","m.pre-raphaelite.t1":"Nature observed down to every plant","m.pre-raphaelite.t2":"Subjects from medieval legend, Shakespeare and literature","m.pre-raphaelite.t3":"Symbols carrying religious and moral messages (Holman Hunt)","m.pre-raphaelite.t4":"Women of Arthurian legend and Greek myth (Waterhouse)","a.John Everett Millais":"A founding member of the Pre-Raphaelite Brotherhood.","a.Dante Gabriel Rossetti":"Poet and painter, the central figure of the Pre-Raphaelites.","a.William Holman Hunt":"The one founding Pre-Raphaelite who kept to its principles all his life.","a.Frederic Leighton":"A central figure of the Victorian art world, President of the Royal Academy and the first painter to be made a peer. Not a Pre-Raphaelite, he was an Aesthetic and classicist painter of the same era who depicted Greek and Roman myths with beautiful figures and rich color.","a.John William Waterhouse":"Took up the Pre-Raphaelite style a generation later to paint women from literature.","m.realism.years":"1840 – 1880","m.realism.sum":"After the Industrial Revolution and the revolutions of 1848, this movement rejected Romantic imagination and academic history painting to depict the reality before one's eyes as it is. Peasants, workers and ordinary citizens became the heroes of large paintings for the first time.","m.realism.diff":"Instead of Romantic heroes, exoticism and imagination, it paints the reality of the here and now.","m.realism.t0":"\"Show me an angel and I will paint one\" (Courbet)","m.realism.t1":"Everyday life of workers and peasants, social issues","m.realism.t2":"Ordinary people on canvases the size of history paintings","m.realism.t3":"Barbizon school: landscapes painted from direct observation in the Forest of Fontainebleau","m.realism.t4":"Satirical lithographs exposing society (Daumier's \"Rue Transnonain\")","m.realism.t5":"Large animal paintings based on close observation (Rosa Bonheur)","m.realism.note":"Courbet's \"The Stone Breakers\" was destroyed in the 1945 bombing of Dresden and survives only in photographs. Raimundo de Madrazo was not part of the Realist movement, but as a portrait and genre painter active in Paris in the same period he is presented in this room.","a.Gustave Courbet":"The self-declared standard-bearer who gave Realism its name.","a.Jean-François Millet":"Lived in Barbizon and painted the labor of peasants with reverence.","a.Honoré Daumier":"Satirical printmaker and painter of the lives of ordinary city people.","a.Jean-Baptiste-Camille Corot":"Barbizon landscape painter whose silvery atmosphere built a bridge to Impressionism.","a.Rosa Bonheur":"The most famous woman painter of the 19th century, known for closely observed animals.","m.impressionism.years":"1860s – 1890","m.impressionism.sum":"Rejected by the official Salon, a group of young painters held their own exhibition in 1874 in the former studio of the photographer Nadar. The name \"Impressionism\" came from a review mocking Monet's \"Impression, Sunrise\", and the exhibitions continued eight times until 1886. With quick brushstrokes they captured shifting light and color outdoors and the daily life of modern Paris.","m.impressionism.diff":"If Realism changed \"what\" to paint (reality), Impressionism changed \"how\" to see (light and the moment).","m.impressionism.t0":"Painting outdoors (made possible by the invention of paint tubes)","m.impressionism.t1":"Color that shifts with light and time; colored shadows","m.impressionism.t2":"Short, broken brushstrokes; colors laid side by side unmixed","m.impressionism.t3":"Modern city life: cafés, railway stations, dance halls","m.impressionism.t4":"Influence of photography and Japanese ukiyo-e prints","m.impressionism.t5":"Bold, photo-like cropping and perspective in interiors, theaters and racecourses (Degas, Caillebotte)","m.impressionism.t6":"Women painters at work: the domestic and everyday lives of women (Morisot, Cassatt)","m.impressionism.note":"Manet was the forerunner and spiritual leader of Impressionism, yet he never took part in the Impressionist exhibitions. Bazille was killed in the Franco-Prussian War four years before the first exhibition. Whistler and Sargent never showed at the Impressionist exhibitions, but these American-born painters worked in Paris alongside the Impressionists, so they are presented in this room.","a.Édouard Manet":"The forerunner of Impressionism, whose scandals shook traditional painting and marked the starting point of modern painting.","a.Claude Monet":"The symbol of Impressionism, who chased light all his life. Famed for series painting the same subject at different times of day.","a.Pierre-Auguste Renoir":"The painter of happy people and luminous skin.","a.Edgar Degas":"A leader of the Impressionist exhibitions who nonetheless preferred interiors to the outdoors, painting dancers and city dwellers.","a.Frédéric Bazille":"An early Impressionist who shared studios with Monet and Renoir and helped his struggling friends. Killed in the Franco-Prussian War at 28, he never saw the first Impressionist exhibition.","a.Camille Pissarro":"The only painter to take part in all eight Impressionist exhibitions, a father figure to his colleagues.","a.Alfred Sisley":"The purest Impressionist, who painted nothing but landscapes all his life.","a.Berthe Morisot":"A woman painter in the first Impressionist exhibition, who sensitively painted home life and women's lives.","a.Gustave Caillebotte":"Painter and patron who depicted the newly transformed Paris with bold perspective.","a.Mary Cassatt":"An American painter active in Paris, known for the daily life of mothers and children.","m.post-impressionism.years":"1886 – 1905","m.post-impressionism.sum":"A period when painters who had passed through Impressionism each went their own way. \"Post-Impressionism\" is not a single style but a label coined in 1910 by the British critic Roger Fry to group them. Their paths became the starting points of 20th-century art.","m.post-impressionism.diff":"Where Impressionism recorded the light of a passing moment, these painters added structure (Cézanne), emotion (van Gogh), symbolism (Gauguin) and science (Seurat).","m.post-impressionism.t0":"Neo-Impressionism: pointillism, with dots of color placed scientifically (Seurat, Signac)","m.post-impressionism.t1":"Cézanne: nature as cylinder, sphere and cone → toward Cubism","m.post-impressionism.t2":"Van Gogh: color and brushwork charged with emotion → toward Expressionism","m.post-impressionism.t3":"Gauguin: flat areas of color and a longing for the primitive → toward Fauvism and Primitivism","m.post-impressionism.t4":"Pointillism with larger, square dabs (Cross) → influenced Matisse and Fauvism","m.post-impressionism.t5":"Montmartre nightlife and lithographic posters (Toulouse-Lautrec)","m.post-impressionism.note":"Pissarro, too, briefly adopted pointillism in the late 1880s (\"Apple Harvest at Éragny\" in the Impressionism room).","a.Georges Seurat":"Founder of pointillism, painting with tiny dots according to color theory.","a.Paul Signac":"Led Neo-Impressionism with Seurat and set out its theory.","a.Henri-Edmond Cross":"A Neo-Impressionist who, with Signac, painted Mediterranean light in pointillist style. His large, square dabs influenced Matisse's Fauvism.","a.Paul Cézanne":"\"The father of modern art,\" who explored the solid structure of things.","a.Vincent van Gogh":"In barely more than ten years as a painter, he produced about 900 oil paintings.","a.Paul Gauguin":"He left civilization for Tahiti and painted symbols in flat areas of color.","a.Henri de Toulouse-Lautrec":"Painted Montmartre nightlife and pioneered poster art.","m.symbolism.years":"1880 – 1910","m.symbolism.sum":"A movement that expressed the inner world of dreams, myth, death and sensuality through symbols rather than visible reality. In Vienna, Klimt founded the Vienna Secession, breaking from the Academy, and developed a lavish, decorative style.","m.symbolism.diff":"Where Realism and Impressionism observed the outer world, Symbolism turned inward to the world of the mind. Munch, too, started out in this movement.","m.symbolism.t0":"Dreams, myth and mysticism","m.symbolism.t1":"The femme fatale; love and death","m.symbolism.t2":"Gold leaf and ornamental patterns (Klimt, Art Nouveau)","a.George Frederic Watts":"Victorian British painter and sculptor who represented English Symbolism, depicting universal themes such as hope, love and death through allegorical figures. He gave many major works to the nation, and they can be seen at Tate Britain.","a.Gustave Moreau":"A forerunner of French Symbolism who painted jewel-like mythological scenes. He was also Matisse's teacher.","a.Gustav Klimt":"First president of the Vienna Secession, famed for his gold-leaf \"Golden Phase.\"","m.fauvism.years":"1905 – 1910","m.fauvism.sum":"The name came from a critic who saw the raw, intensely colored paintings at the 1905 Salon d'Automne in Paris and called a sculpture among them \"Donatello among the wild beasts (les fauves).\" Freeing color from describing objects, these painters used it as a tool for emotion and decoration.","m.fauvism.diff":"It pushed the color experiments of van Gogh and Gauguin to the extreme. Unlike Cubism, which broke down form, this was a revolution in color.","m.fauvism.t0":"Pure primary colors, as if squeezed straight from the tube","m.fauvism.t1":"Free color unrelated to nature (green faces, red trees)","m.fauvism.t2":"Flattened, simplified forms","m.fauvism.t3":"Primitivism: inspired by African and Oceanic sculpture, folk art and childlike simplicity","m.fauvism.t4":"A lively decorative style layering line and color separately (Dufy)","m.fauvism.note":"Art history usually classes Matisse as the leader of Fauvism. \"Primitivism\" is less a school than a broad tendency to draw inspiration from non-Western art and simplicity, seen across Gauguin, Henri Rousseau, early Picasso, Matisse and others.","a.Henri Matisse":"Leader of Fauvism, counted with Picasso as one of the two giants of 20th-century art.","a.André Derain":"Gave birth to Fauvism with Matisse at Collioure.","a.Raoul Dufy":"Joined the Fauves in 1905 after seeing Matisse's \"Luxe, Calme et Volupté.\" He went on to develop his own style of lively line layered over clear color, becoming the \"painter of joy\" known for seaside scenes, racecourses and festivities.","a.Henri Rousseau":"A self-taught former customs officer whose naive, fantastical style was loved by Picasso and the Surrealists.","m.expressionism.years":"1905 – 1925","m.expressionism.sum":"Rather than representing the outside world, this movement revealed the artist's inner anxiety, loneliness and anger through distorted forms and intense color. It flourished above all in Germany, with two leading groups: Die Brücke (The Bridge), founded in Dresden in 1905, and Der Blaue Reiter (The Blue Rider), founded in Munich in 1911.","m.expressionism.diff":"Where Fauvism sought joy and harmony in color, Expressionism used the same intense color to speak of anxiety and pain.","m.expressionism.t0":"Expressing inner emotions such as anxiety and pain","m.expressionism.t1":"Exaggerated, distorted forms and rough brushwork","m.expressionism.t2":"Urban alienation and the unease before the war","m.expressionism.t3":"Revival of the woodcut (Die Brücke)","m.expressionism.t4":"Anxiety and death seeping even into landscape (Schiele's \"Dead City\" series of Krumau)","m.expressionism.note":"Munch began in Symbolism and is regarded as a forerunner of Expressionism. Kandinsky co-founded Der Blaue Reiter, but on this site he is covered under Abstract Art.","a.Edvard Munch":"Norwegian painter of love, anxiety and death, and a forerunner of Expressionism.","a.Ernst Ludwig Kirchner":"Founder of Die Brücke, who sharply captured the tension of Berlin's streets.","a.Franz Marc":"Co-founder of Der Blaue Reiter, who painted animals in symbolic colors. He was killed in the First World War.","a.Egon Schiele":"A younger follower of Klimt who laid bare the human body and psyche in contorted line.","a.Oskar Kokoschka":"The leading painter of Viennese Expressionism.","m.cubism.years":"1907 – 1920s","m.cubism.sum":"Born when Picasso and Braque pushed Cézanne's lessons to the extreme. Objects seen from several viewpoints are broken into geometric fragments and reassembled on a single canvas.","m.cubism.diff":"The most fundamental revolution of the 20th century, toppling the \"single-viewpoint perspective\" that had reigned for nearly 500 years since the Renaissance.","m.cubism.t0":"Several viewpoints shown at once on one canvas","m.cubism.t1":"Form broken down into geometric planes","m.cubism.t2":"Analytic Cubism (1909–1912): forms dissected in mostly browns and grays","m.cubism.t3":"Synthetic Cubism (1912–): collage with newspaper and other materials (papier collé)","m.cubism.t4":"Orphism: bright color and rhythm added to Cubism (Delaunay)","m.cubism.t5":"\"Tubism,\" depicting the machine age in cylindrical forms (Léger)","m.cubism.note":"Picabia's \"Udnie\" (1913) is also close to Cubism and Orphism at this time. Picabia later moved to Dada and is covered in the \"Dada and Surrealism\" room.","a.Pablo Picasso":"Co-founder of Cubism and the greatest painter of the 20th century, who kept changing his style throughout his life.","a.Georges Braque":"Created Cubism with Picasso. The name \"Cubism\" came from his paintings.","a.Juan Gris":"Developed Synthetic Cubism with clear color and composition.","a.Fernand Léger":"Depicted the machine age with the cylindrical forms of \"Tubism.\"","a.Robert Delaunay":"Led \"Orphism,\" which added bright color and rhythm to Cubism.","m.futurism.years":"1909 – 1916","m.futurism.sum":"An Italian movement launched in 1909 by the poet Marinetti's \"Manifesto of Futurism.\" Calling for the museums of the past to be burned, it glorified speed, machines, the city and dynamism.","m.futurism.diff":"Where Cubism broke still objects into multiple angles, Futurism broke moving subjects into moments in time.","m.futurism.t0":"Speed and movement shown as successive motions","m.futurism.t1":"Cubist fragmentation plus intense color and motion","m.futurism.t2":"Cars, trains and the industrial city","a.Umberto Boccioni":"Futurism's greatest painter and sculptor. He died during the First World War.","a.Giacomo Balla":"Painted movement as overlapping images, like sequential photographs.","m.abstraction.years":"1906 – 1940s","m.abstraction.sum":"Art that abandoned the age-old premise that a picture must \"resemble\" something, building the canvas from color, line and form alone. Key strands are Kandinsky's musical, lyrical abstraction, Malevich's Suprematism and Mondrian's Neo-Plasticism (De Stijl). Kandinsky was long known as \"the first abstract painter,\" but the belated discovery of Hilma af Klint, who painted abstractions from 1906, is rewriting the history of abstraction.","m.abstraction.diff":"Cubism broke form apart but kept the subject; abstraction erases the subject entirely.","m.abstraction.t0":"Abandons the depiction of concrete objects","m.abstraction.t1":"Kandinsky: color and form that resonate with feeling like music (\"hot\" abstraction)","m.abstraction.t2":"Mondrian: an order of vertical and horizontal lines and primary colors only (\"cool\" abstraction)","m.abstraction.t3":"Malevich: \"Suprematism\" of pure geometric forms","m.abstraction.t4":"Spread through Bauhaus teaching, design and architecture","m.abstraction.t5":"Spiritual abstraction rooted in mysticism (Theosophy) (Hilma af Klint)","m.abstraction.t6":"Poetic abstraction of fairy-tale signs and lines (Klee)","m.abstraction.note":"Af Klint left instructions that her work should not be shown for 20 years after her death, and her abstractions only became widely known through the 1986 Los Angeles exhibition \"The Spiritual in Art.\"","a.Hilma af Klint":"Swedish painter and mystic. She painted abstractions from 1906, years before Kandinsky, but her wish that the work stay hidden for 20 years after her death kept it unknown until the 1980s, forcing a rewrite of the history of abstract art.","a.Wassily Kandinsky":"Russian-born, he founded Der Blaue Reiter and taught at the Bauhaus. One of the first abstract painters.","a.Kazimir Malevich":"Founder of Suprematism, who declared painting's \"zero point\" with a black square on a white ground.","a.Piet Mondrian":"Starting from a series of trees, he simplified step by step until he reached pure grid abstraction.","a.Paul Klee":"Swiss-born, he taught at the Bauhaus and painted poetic, fairy-tale-like abstractions.","m.ecole-de-paris.years":"1910 – 1940","m.ecole-de-paris.sum":"A name for the foreign-born artists who gathered in Montmartre and Montparnasse in early 20th-century Paris. It was not a school with a manifesto or shared style, but a current of outsiders from Russia, Italy, Belarus and elsewhere who turned their own memories and sensibilities into distinctive styles in Paris. Montmartre native Suzanne Valadon, her son Maurice Utrillo, and Marie Laurencin, who moved in Picasso's circle, also represent the Paris art world of this time.","m.ecole-de-paris.diff":"While Cubism and abstraction in Paris at the same time broke up form or erased the subject, the painters of the École de Paris held on to figures and stories, painting emotion and lyricism.","m.ecole-de-paris.t0":"Individual styles at the center, with no school or manifesto","m.ecole-de-paris.t1":"Memories of home, Jewish culture and folk fantasy (Chagall)","m.ecole-de-paris.t2":"Portraits with elongated necks and almond-shaped eyes (Modigliani)","m.ecole-de-paris.t3":"Violently twisting brushwork and deep color (Soutine)","m.ecole-de-paris.t4":"Absorbing Cubism, Fauvism and Expressionism while keeping figures and stories","m.ecole-de-paris.t5":"Lyrical views of Montmartre's lanes and churches (Utrillo)","m.ecole-de-paris.t6":"Women painted through women's eyes (Valadon, Laurencin)","m.ecole-de-paris.note":"Chagall touched on Cubism, Expressionism and Surrealism but belonged to no school, and he turned down an invitation to join the Surrealist group. Marie Laurencin died in 1956, so her work remains under European copyright until the end of 2026 and no images are shown. Images can be added from 2027.","a.Suzanne Valadon":"A model for Renoir and Toulouse-Lautrec who taught herself to paint and won Degas's recognition. She boldly painted the female body through a woman's eyes, and was Utrillo's mother.","a.Maurice Utrillo":"Suzanne Valadon's son, who painted Montmartre's lanes, churches and white-walled houses with a melancholy lyricism. His work of about 1909–1914, mixed with plaster, is called his \"White Period.\"","a.Marie Laurencin":"A painter who frequented the Bateau-Lavoir with Picasso and Braque and was the lover of the poet Apollinaire. She painted dreamy women in soft pinks, grays and sky blues, and is especially loved in Korea and Japan.","a.Amedeo Modigliani":"Italian-born, famed for portraits with elongated necks and pupil-less almond eyes. He died at 35.","a.Marc Chagall":"A Jewish painter from Vitebsk, Belarus, who painted his home village, lovers and people flying through the sky in dreamlike color. Until the age of 98 he produced paintings, stained glass, stage designs and ceiling paintings.","a.Chaïm Soutine":"A Jewish painter from Belarus whose contorted forms and violent brushwork greatly influenced the later Abstract Expressionists.","m.surrealism.years":"1916 – 1950","m.surrealism.sum":"Amid the horrors of the First World War, Dada appeared first, mocking reason and established art. It was followed in 1924 by André Breton's \"Manifesto of Surrealism.\" Influenced by Freud's psychoanalysis, the Surrealists painted the world of dreams and the unconscious.","m.surrealism.diff":"Where abstract art explored the order of form, Surrealism explored dreams and the unconscious beyond reason.","m.surrealism.t0":"Dada: anti-art that presents manufactured objects (readymades) as art","m.surrealism.t1":"Automatism to draw out the unconscious","m.surrealism.t2":"Dépaysement: placing familiar objects in unfamiliar contexts (Magritte)","m.surrealism.t3":"The unreal painted with hyperrealistic technique (Dalí, Magritte) vs abstraction of organic forms (Miró)","m.surrealism.t4":"Dada began in Zurich and spread to New York, Paris and Berlin (Duchamp and Picabia of New York and Paris Dada)","m.surrealism.t5":"\"Mechanomorphic\" paintings that depict machines like people (Picabia)","m.surrealism.note":"Breton called Frida Kahlo a Surrealist, but she rejected the label: \"I never painted dreams. I painted my own reality.\"","a.Marcel Duchamp":"The key figure of Dada, whose \"Fountain,\" a signed urinal put on display, asked \"What is art?\"","a.Francis Picabia":"A painter who kept changing style, from Impressionist landscapes to Cubism and Orphism, Dada, Surrealism and back to figuration. With Duchamp he was a key figure of New York and Paris Dada, famed for \"mechanomorphic\" paintings depicting machines like people.","a.Giorgio de Chirico":"His \"metaphysical painting\" of empty squares and strange objects greatly influenced Surrealism.","a.Max Ernst":"A German painter who moved from Dada to Surrealism and developed the frottage technique.","a.Joan Miró":"From Catalonia, Spain, he painted the unconscious with childlike signs and primary colors.","a.René Magritte":"A Belgian painter who placed ordinary objects in strange settings to question the relationship between image and reality.","a.Salvador Dalí":"Used his \"paranoiac-critical\" method to paint dreams with photographic precision.","a.Frida Kahlo":"Poured her painful life and Mexican identity into self-portraits.","m.american-realism.years":"1910 – 1960s","m.american-realism.sum":"While Cubism, abstraction and Surrealism unfolded in Europe, painters emerged in the United States who realistically depicted everyday American scenes: big-city streets, gas stations, diners and small towns. Also called American Scene painting, it captured the loneliness and mood of Americans in the Depression era. In the 1930s Regionalism, such as Grant Wood's scenes of Midwestern farm life, carried the current forward, and after the war Andrew Wyeth's quiet realism.","m.american-realism.diff":"Where the European avant-garde of the same era dismantled form or explored the unconscious, American Realism captured the mood of the times through visible, everyday scenes.","m.american-realism.t0":"Realistic depictions of ordinary American city and country scenes","m.american-realism.t1":"A quiet, lonely mood, like empty streets or a late-night diner","m.american-realism.t2":"Strong light and shadow; compositions like a film still","m.american-realism.t3":"The loneliness and alienation of modern people in the big city","m.american-realism.note":"Hopper avoided belonging to any school, but art history usually classes him as an American Realist. No images are shown for Hopper (d. 1967) or Wyeth (d. 2009) because their works are under copyright, nor for Wood's works from 1931 onward, which are still under copyright in the US. O'Keeffe is a leading figure of American Modernism rather than Realism, but she is presented here as part of American art of the same era. She died in 1986, so her works are still under copyright and images are not shown.","a.Edward Hopper":"Based mainly in New York, he painted city diners, theaters, gas stations and houses by the railroad. Called the painter of \"modern loneliness\" for his still light and solitary figures, he also greatly influenced filmmakers.","a.Grant Wood":"From Iowa, the leading painter of Regionalism, who depicted the people and landscapes of the rural Midwest in simple, meticulous forms.","a.Andrew Wyeth":"Painted the countryside and neighbors of Pennsylvania and Maine in delicate tempera and watercolor. His quiet, melancholy realism made him one of the most beloved American painters of the 20th century.","m.abstract-expressionism.years":"1943 – 1960","m.abstract-expressionism.sum":"As European artists fled to America during the Second World War, the center of art moved from Paris to New York. American painters took up Surrealist automatism and expressed their inner lives through gesture and color, without figures, on huge canvases. The movement is also called the New York School.","m.abstract-expressionism.diff":"Where European abstraction pursued geometric order or theory, Abstract Expressionism put spontaneous gesture and existential emotion first.","m.abstract-expressionism.t0":"Action painting: the act of painting is itself the work (Pollock, de Kooning)","m.abstract-expressionism.t1":"Color field painting: broad fields of color for a meditative experience (Rothko, Newman)","m.abstract-expressionism.t2":"Huge canvases that envelop the viewer","m.abstract-expressionism.t3":"Dripping: canvas laid on the floor, paint poured and flung","a.Jackson Pollock":"The defining action painter, known for his drip technique.","a.Willem de Kooning":"Dutch-born master of action painting, whose figures persist within violent brushwork.","a.Mark Rothko":"The leading color field painter, expressing tragedy and the sublime with floating fields of color.","a.Barnett Newman":"A leading color field painter who divided broad fields of color with vertical bands (\"zips\").","m.pop-neo-expressionism.years":"1955 – 1990","m.pop-neo-expressionism.sum":"Emerging in Britain and the United States in the late 1950s, Pop Art replaced the earnest inner expression of Abstract Expressionism with familiar mass imagery: advertising, comics, film stars and supermarket products. In the 1980s, as a reaction, Neo-Expressionism, reviving rough brushwork, intense emotion and the figure, rose to prominence in the United States and Germany.","m.pop-neo-expressionism.diff":"Where Abstract Expressionism painted the artist's sublime inner feelings, Pop Art reproduced mass imagery coolly and impassively. Neo-Expressionism brought back hand-painted pictures and emotion.","m.pop-neo-expressionism.t0":"Pop Art: borrowing images straight from popular culture and consumer society","m.pop-neo-expressionism.t1":"Printing techniques such as silkscreen and Ben-Day dots to convey repetition and mass production","m.pop-neo-expressionism.t2":"Neo-Expressionism: reviving painting with rough brushwork, large canvases and intense color","m.pop-neo-expressionism.t3":"Street graffiti enters the museum (Basquiat, Haring)","m.pop-neo-expressionism.t4":"German Neo-Expressionism confronts the memory of war and history (Kiefer)","m.pop-neo-expressionism.note":"All the painters in this room are still under copyright, so no images are shown. Hockney and Kiefer are still working today.","a.Andy Warhol":"A former commercial illustrator and the icon of Pop Art, who silkscreened soup cans and star faces over and over to show \"the mass production of art.\"","a.Roy Lichtenstein":"Enlarged single comic panels down to the printed dots, blurring the line between mass imagery and fine art.","a.David Hockney":"British-born, he painted California sunshine and swimming pools in bright colors, and has recently expanded into iPad drawing.","a.Jean-Michel Basquiat":"Starting out with the \"SAMO\" graffiti on New York's streets, he used skulls, crowns and words to address Black history and race. He died at 27.","a.Keith Haring":"Began with chalk drawings on New York subway ad panels. His simple line figures carried social messages such as AIDS awareness and anti-drug campaigns.","a.Anselm Kiefer":"Master of German Neo-Expressionism, whose huge canvases mixed with straw, lead, ash and earth hold the memory of the Nazi era and German history.","mu.pompidou.note":"Closed for renovation from September 2025 (reopening planned for 2030). Parts of the collection are on view elsewhere in France and abroad, including at Centre Pompidou Hanwha in Yeouido, Seoul","mu.albertina.note":"Works on paper such as drawings and watercolors are sensitive to light, so reproductions usually hang on display and the originals are often shown only briefly in special exhibitions","mu.hermitage.note":"Before visiting Russia, be sure to check your government's travel advisories","mu.tretyakov.note":"Before visiting Russia, be sure to check your government's travel advisories","mu.accademiafi.note":"Queues are always long, so booking ahead is recommended","mu.borghese.note":"Visits are by advance booking for timed entry slots only","mu.geneva.note":"Closed since 1998; the collection can be seen only when works are lent to exhibitions at other museums","mu.royal.note":"Works are displayed in rotation at Buckingham Palace, Windsor Castle and other residences","mu.russian.note":"Before visiting Russia, be sure to check your government's travel advisories","mu.broad.note":"General admission is free, but booking online in advance is recommended","mu.pushkin.note":"Before visiting Russia, be sure to check your government's travel advisories","mu.hakf.note":"The Foundation has no museum of its own; some works are always on view at its partner, Moderna Museet in Stockholm. They are also frequently lent to touring exhibitions worldwide.","city.이탈리아 피렌체":"Florence, Italy","city.이탈리아 파도바":"Padua, Italy","city.이탈리아 밀라노":"Milan, Italy","city.바티칸 시국":"Vatican City","city.이탈리아 베네치아":"Venice, Italy","city.이탈리아 로마":"Rome, Italy","city.프랑스 파리":"Paris, France","city.프랑스 몽펠리에":"Montpellier, France","city.영국 런던":"London, UK","city.영국 에든버러":"Edinburgh, UK","city.스페인 마드리드":"Madrid, Spain","city.스페인 톨레도":"Toledo, Spain","city.벨기에 겐트":"Ghent, Belgium","city.벨기에 안트베르펜":"Antwerp, Belgium","city.벨기에 브뤼셀":"Brussels, Belgium","city.네덜란드 암스테르담":"Amsterdam, Netherlands","city.네덜란드 헤이그":"The Hague, Netherlands","city.네덜란드 오테를로":"Otterlo, Netherlands","city.독일 뮌헨":"Munich, Germany","city.독일 드레스덴":"Dresden, Germany","city.독일 함부르크":"Hamburg, Germany","city.오스트리아 빈":"Vienna, Austria","city.스위스 바젤":"Basel, Switzerland","city.스위스 베른":"Bern, Switzerland","city.스위스 취리히":"Zurich, Switzerland","city.노르웨이 오슬로":"Oslo, Norway","city.폴란드 크라쿠프":"Kraków, Poland","city.러시아 상트페테르부르크":"St. Petersburg, Russia","city.러시아 모스크바":"Moscow, Russia","city.미국 뉴욕":"New York, USA","city.미국 버펄로":"Buffalo, USA","city.미국 시카고":"Chicago, USA","city.미국 보스턴":"Boston, USA","city.미국 필라델피아":"Philadelphia, USA","city.미국 워싱턴 D.C.":"Washington, D.C., USA","city.미국 미니애폴리스":"Minneapolis, USA","city.미국 샌프란시스코":"San Francisco, USA","city.미국 로스앤젤레스":"Los Angeles, USA","city.미국 휴스턴":"Houston, USA","city.멕시코 멕시코시티":"Mexico City, Mexico","city.호주 캔버라":"Canberra, Australia","city.일반 공개되지 않음":"Not on public view","city.포르투갈 리스본":"Lisbon, Portugal","city.독일 베를린":"Berlin, Germany","city.독일 포츠담":"Potsdam, Germany","city.독일 만하임":"Mannheim, Germany","city.독일 하노버":"Hanover, Germany","city.스위스 빈터투어":"Winterthur, Switzerland","city.스위스 제네바":"Geneva, Switzerland","city.프랑스 베르사유":"Versailles, France","city.프랑스 뤼에유말메종":"Rueil-Malmaison, France","city.프랑스 알비":"Albi, France","city.영국 런던·윈저":"London & Windsor, UK","city.영국 옥스퍼드":"Oxford, UK","city.영국 글래스고":"Glasgow, UK","city.이스라엘 예루살렘":"Jerusalem, Israel","city.미국 뉴헤이븐":"New Haven, USA","city.미국 오벌린":"Oberlin, USA","city.미국 클리블랜드":"Cleveland, USA","city.미국 오스틴":"Austin, USA","city.프랑스 니스":"Nice, France","city.독일 쾰른":"Cologne, Germany","city.독일 포머스펠덴":"Pommersfelden, Germany","city.이탈리아 카르미냐노":"Carmignano, Italy","city.이탈리아 나폴리":"Naples, Italy","city.프랑스 트루아":"Troyes, France","city.영국 버밍엄":"Birmingham, UK","city.영국 포트선라이트":"Port Sunlight, UK","city.영국 맨체스터":"Manchester, UK","city.영국 리버풀":"Liverpool, UK","city.미국 하트퍼드":"Hartford, USA","city.브라질 상파울루":"São Paulo, Brazil","city.이탈리아 피사":"Pisa, Italy","city.프랑스 포":"Pau, France","city.프랑스 르아브르":"Le Havre, France","city.미국 댈러스":"Dallas, USA","city.미국 케임브리지":"Cambridge, USA","city.프랑스 생트로페":"Saint-Tropez, France","city.미국 디트로이트":"Detroit, USA","city.미국 패서디나":"Pasadena, USA","city.개인 소장으로 추정":"Probably a private collection","city.독일 뒤셀도르프":"Düsseldorf, Germany","city.스웨덴 스톡홀름":"Stockholm, Sweden","city.미국 디모인":"Des Moines, USA","city.푸에르토리코 폰세":"Ponce, Puerto Rico","city.미국 오마하":"Omaha, USA","city.덴마크 코펜하겐":"Copenhagen, Denmark","city.스페인 바르셀로나":"Barcelona, Spain","city.판화·포스터라 여러 장이 존재":"Print/poster; multiple impressions exist","city.1945년 드레스덴 폭격 때 사라짐":"Lost in the 1945 bombing of Dresden","Giotto di Bondone||Lamentation||1305경":"A fresco of mourners gathered around the dead Christ. Even the angels in the sky cry out, each with a different gesture, while the diagonal ridge of rock leads the eye to Christ's face.","Giotto di Bondone||Kiss of Judas||1305경":"At the center of the scene are Judas, wrapping Jesus in his yellow cloak as he kisses him, and the gaze of Jesus, who looks him straight in the eye. On the left, Peter cuts off a servant's ear with a sword.","Giotto di Bondone||Ognissanti Madonna||1310경":"Painted as an altarpiece for the church of Ognissanti in Florence, it is notable for a Virgin whose body has a sense of volume beneath her robes. Compare it with the Maestàs by Cimabue and Duccio in the same room to see the change.","Giotto di Bondone||Saint Francis Receiving the Stigmata||1295–1300경":"The predella below includes a scene of Saint Francis preaching to the birds.","Giotto di Bondone||Stefaneschi Triptych||1330경":"Painted for the altar of Old Saint Peter's Basilica, the work is painted on both front and back.","Giotto di Bondone||Nativity||1305경":"A fresco of the Virgin, lying beneath the roof of a stable, receiving the infant Jesus. Angels appear above, and on the right shepherds hear the news.","Giotto di Bondone||Last Judgment||1306경":"This mural covers the entire entrance wall of the chapel; at the bottom, the patron Enrico Scrovegni is shown presenting the chapel.","Masaccio||Holy Trinity||1427경":"One of the earliest works to apply linear perspective in earnest, it creates the illusion of a real chapel recessed into the wall. The skeleton painted below bears an inscription reminding the viewer of death.","Masaccio||The Tribute Money||1425경":"This fresco tells, in a single scene, the story of the tax collector's coin being taken from the mouth of a fish. Peter appears three times, in the center, on the left and on the right, so look for him in order.","Masaccio||Expulsion from the Garden of Eden||1425경":"A fresco vividly expressing the despair of Adam, covering his face, and Eve, crying out. The leaves added by a later hand were removed during the restoration in the 1980s.","Masaccio||Madonna and Child||1426":"The central panel of a polyptych made for a church in Pisa, it shows the infant Jesus eating grapes, a symbol of the Eucharist. The altarpiece was later dismantled and its panels dispersed among several museums.","Sandro Botticelli||The Birth of Venus||1485경":"Venus, born from the sea, arrives at the shore on a scallop shell. On the left the wind god blows, while on the right a goddess waits to greet her with a robe.","Sandro Botticelli||Primavera||1480경":"Venus stands at the center of an orange grove, with the Three Graces and Mercury on the left and the West Wind and the goddess of flowers on the right. The countless flowers and plants covering the ground are painted in precise detail.","Sandro Botticelli||Adoration of the Magi||1475경":"The Magi are given the faces of members of the Medici family. The man in yellow on the far right, looking out at the viewer, is thought to be Botticelli's self-portrait.","Sandro Botticelli||Venus and Mars||1485경":"Venus alone is awake beside the deeply sleeping Mars, while young satyrs play with his armor and lance. It is read as an image of love conquering war.","Sandro Botticelli||Madonna of the Pomegranate||1487경":"In this circular painting, the Virgin holds a pomegranate, a symbol of the Passion and Resurrection, and the infant Jesus rests his hand on it. Look closely at the angels' faces around the Virgin and the golden rays.","Sandro Botticelli||Temptations of Christ||1481–1482":"Thirty years before Michelangelo's ceiling, Botticelli, Perugino, Ghirlandaio and others decorated the walls of the Sistine Chapel.","Sandro Botticelli||Mystic Nativity||1500경":"The only work Botticelli signed and dated, this is a late religious painting made under the influence of Savonarola.","Leonardo da Vinci||Mona Lisa||1503–1519경":"Displayed behind bulletproof glass and always crowded; a visit just after opening is recommended.","Leonardo da Vinci||The Last Supper||1495–1498":"A mural in the refectory of a convent. Booking is required, and visits are limited to about 15 minutes.","Leonardo da Vinci||Lady with an Ermine||1489–1491경":"This portrait is thought to depict Cecilia Gallerani, the mistress of Ludovico Sforza, Duke of Milan. The ermine, a symbol of purity, is also read as an emblem referring to Ludovico.","Leonardo da Vinci||Virgin of the Rocks||1483–1486":"The second version (c. 1495–1508) is in the National Gallery, London.","Leonardo da Vinci||Annunciation||1472–1476경":"An early work painted while Leonardo was in Verrocchio's workshop, showing a kneeling angel announcing the conception to the Virgin. Note the decoration of the marble lectern and the misty distant landscape.","Leonardo da Vinci||The Virgin and Child with Saint Anne||1503–1519경":"The Virgin, seated on Saint Anne's lap, reaches out to the infant Jesus, who grasps a lamb. Leonardo worked on it for many years and never finished it.","Leonardo da Vinci||Ginevra de' Benci||1474–1478경":"The only painting by Leonardo on view in the Americas.","Leonardo da Vinci||Saint Jerome in the Wilderness||1480경":"According to an anecdote, it was found in the 19th century cut into two pieces, one used as a box lid and the other as a shoemaker's stool.","Michelangelo Buonarroti||The Creation of Adam||1512경":"Photography is not allowed inside the Sistine Chapel.","Michelangelo Buonarroti||The Last Judgment||1536–1541":"A fresco covering the entire altar wall of the Sistine Chapel, with Christ in the center raising his arm to pass judgement. The face on the flayed skin held by Saint Bartholomew is thought to be Michelangelo's self-portrait.","Michelangelo Buonarroti||Doni Tondo||1507경":"A round panel painted for the Florentine merchant Agnolo Doni, with nude youths seated behind the Holy Family. The sculptural figures and intense colors stand out, and the ornate original frame also survives.","Michelangelo Buonarroti||David||1501–1504":"Carved from a block of marble that other sculptors had worked on and abandoned. It originally stood in the Piazza della Signoria but was moved here in the 19th century; a copy now stands in the square.","Michelangelo Buonarroti||Pietà||1498–1499":"Since it was attacked in 1972, it has been viewed behind bulletproof glass.","Michelangelo Buonarroti||Dying Slave||1513–1516":"Made for the tomb of Pope Julius II, it is in the Louvre together with its companion piece, the \"Rebellious Slave\".","Michelangelo Buonarroti||The Manchester Madonna||1497경":"One of Michelangelo's few panel paintings; because it is unfinished, it offers a glimpse of his painting process.","Michelangelo Buonarroti||Moses||1513–1515":"The central sculpture of the tomb monument of Julius II. Admission to the church is free.","Michelangelo Buonarroti||Delphic Sibyl||1509":"One of the prophets and sibyls on the Sistine ceiling, this young woman holding a scroll and turning her head is striking for her wide-open eyes.","Michelangelo Buonarroti||The Deluge||1508–1509":"A ceiling scene from the story of Noah, showing people crowding to higher ground to escape the water. Painted early in the campaign, it has many small figures; the figures grow larger in the later scenes.","Michelangelo Buonarroti||Libyan Sibyl||1511":"This ceiling painting shows the sibyl twisting her body as she sets down a large book, a difficult yet graceful pose. A preparatory study drawn from a male model survives in the Metropolitan Museum of Art in New York.","Raffaello Sanzio||The School of Athens||1509–1511":"A mural in the Raphael Rooms of the Vatican Museums.","Raffaello Sanzio||Sistine Madonna||1512–1513":"An altarpiece in which Saint Sixtus and Saint Barbara receive the Virgin and Child appearing on clouds. The two cherubs resting their chins on their hands at the bottom are so famous that they are often reproduced on their own.","Raffaello Sanzio||Madonna della Seggiola||1513–1514":"In this round painting the Virgin holds the infant Jesus close and looks out at the viewer, while the young John the Baptist joins his hands beside them. The title comes from the post of the chair on which the Virgin sits.","Raffaello Sanzio||Madonna del Cardellino||1505–1506":"The young John the Baptist hands the infant Jesus a goldfinch, a symbol of the Passion. In 1547 the panel was broken into several pieces when its owner's house collapsed, and was later restored.","Raffaello Sanzio||Transfiguration||1516–1520":"Raphael's last work, it is in the Vatican Pinacoteca.","Raffaello Sanzio||Portrait of Baldassare Castiglione||1514–1515":"A portrait of Raphael's friend, the author of \"The Book of the Courtier\", notable for its restrained palette of grays and blacks. Later painters, including Rembrandt and Rubens, copied it.","Raffaello Sanzio||Disputation of the Holy Sacrament||1509–1510":"A mural in the Stanza della Segnatura facing \"The School of Athens\", so that philosophy and theology face each other.","Raffaello Sanzio||Madonna of Foligno||1511–1512":"In the Vatican Pinacoteca.","Raffaello Sanzio||The Liberation of Saint Peter||1514":"A night scene in the Room of Heliodorus depicting three kinds of light: the angel's radiance, torchlight and moonlight.","Raffaello Sanzio||Portrait of Pope Julius II||1511":"This is the very pope who commissioned Michelangelo to paint the Sistine ceiling. A similar version is in the Uffizi.","Raffaello Sanzio||La Velata||1516경":"A half-length figure of a veiled woman, its highlight being the voluminous sleeve rendered in gold and white. The sitter's identity has not been established with certainty.","Giorgione||The Tempest||1508경":"It shows a young man standing beneath a sky split by lightning and a woman nursing a baby, but its subject remains a mystery. X-rays revealed that another woman was originally painted where the man stands.","Giorgione||Sleeping Venus||1510경":"Titian is thought to have completed the landscape after Giorgione's death.","Giorgione||The Three Philosophers||1508–1509경":"Three men of different ages gathered in front of a cave; their identity has been interpreted in various ways. Sebastiano del Piombo is said to have completed the parts Giorgione left unfinished.","Giorgione||Laura||1506":"A portrait of a woman wrapp
