  <div class="count" id="acount"></div><div class="alist" id="alist"></div></section>`;
}
function drawArtists(){
  const q=st.aq.trim().toLowerCase();
  let list=ARTISTS.filter(a=>(!st.amov||a.m.id===st.amov)&&(!q||(a.n+" "+a.o).toLowerCase().includes(q)));
  list=list.slice().sort(st.asort==="name"?(x,y)=>nameKey(x).localeCompare(nameKey(y),isEN?"en":"ko"):(x,y)=>x.born-y.born);
  let html="",last="";
  list.forEach(a=>{
    if(st.asort==="name"){const L=initial(a);if(L!==last){html+=`<div class="letter">${L}</div>`;last=L}}
    else{const c=Math.floor(a.born/100)+1;if(c!==last){html+=`<div class="letter">${U("century",c)}</div>`;last=c}}
    html+=`<a class="arow" href="#/a/${a.id}">${th(firstImg(a.works))}<div class="mn"><div class="nm">${esc(aN(a))}</div><div class="sub">${sub(aO(a),a.l)}</div><div class="sub"><span class="dot" style="background:${a.m.color}"></span> ${esc(mN(a.m))}</div></div><span class="n">${U("worksN",a.works.length)}</span></a>`});
  $("#alist").innerHTML=html||`<div class="empty">${U("noArtist")}</div>`;
  $("#acount").textContent=U("peopleN",list.length);
  hydrate($("#alist"));
}
function vArtist(id){
  const a=artistById[id];if(!a)return notFound();
  const mus=[...new Set(a.works.map(w=>w.mk))].filter(k=>!OTHER_KEYS.includes(k));
  const wiki=isEN?`https://en.wikipedia.org/w/index.php?search=${encodeURIComponent(a.o)}`:`https://ko.wikipedia.org/w/index.php?search=${encodeURIComponent(a.n)}`;
  return `<section class="band" style="background:${a.m.color}"><div class="wrap"><div class="eyebrow"><a href="#/m/${a.m.id}">${esc(mN(a.m))}</a> · ${esc(a.l)}</div>
  <h1 class="title">${esc(aN(a))}</h1>${isEN?"":`<div class="eyebrow" style="margin-bottom:12px">${esc(a.o)}</div>`}<p class="lead">${esc(aD(a))}</p>
  <div class="mlinks"><a class="btn" href="#/m/${a.m.id}">${esc(U("room2",mN(a.m)))}</a><a class="btn" target="_blank" rel="noopener" href="${wiki}">${U("wiki")}</a></div></div></section>
  <section class="wrap"><h2 class="sec">${U("sWork")[0].toUpperCase()+U("sWork").slice(1)} ${a.works.length}</h2>${grid(a.works,false)}
  ${mus.length?`<h2 class="sec">${U("holding")}</h2><div class="pillrow">${mus.map(k=>`<a class="btn" href="#/mu/${k}">${esc(muN(k))} · ${esc(cityOf(k))}</a>`).join("")}</div>`:""}</section>`;
}
function vMuseums(){
  return `<section class="wrap intro"><div class="eyebrow">${U("musEyebrow")}</div><h1 class="title">${U("musN",museumKeys.length)}</h1>
  <p class="lead">${U("musLead")}</p>
  <div class="toolbar"><label class="field">${SEARCH_ICON}<input id="mq" type="search" placeholder="${esc(U("musPh"))}" autocomplete="off" value="${esc(st.mq)}"></label></div>
  <div id="mlist"></div></section>`;
}
function drawMuseums(){
  const q=st.mq.trim().toLowerCase();
  const byC={};Object.keys(byMuseum).forEach(k=>{const mu=MUSEUMS[k];if(q&&!(mu.n+" "+mu.o+" "+mu.c+" "+(EN["city."+mu.c]||"")).toLowerCase().includes(q))return;(byC[countryOf(k)]??=[]).push(k)});
  const tot=c=>byC[c].reduce((s,k)=>s+byMuseum[k].length,0);
  const OT=U("other");
  const order=Object.keys(byC).sort((a,b)=>a===OT?1:b===OT?-1:tot(b)-tot(a));
  $("#mlist").innerHTML=order.map(c=>`<div class="country"><h3>${esc(c)}<span class="count">${U("placesN",byC[c].length)} · ${U("worksN",tot(c))}</span></h3><div class="alist">${
    byC[c].sort((a,b)=>byMuseum[b].length-byMuseum[a].length).map(k=>`<a class="arow museum-row" href="#/mu/${k}">${th(firstImg(byMuseum[k]))}<div class="mn"><div class="nm">${esc(muN(k))}</div>${muO(k)?`<div class="sub">${esc(muO(k))}</div>`:""}<div class="sub">${esc(cityOf(k))}</div></div><span class="n">${U("worksN",byMuseum[k].length)}</span></a>`).join("")}</div></div>`).join("")||`<div class="empty">${U("noMus")}</div>`;
  hydrate($("#mlist"));
}
function vMuseum(k){
  const mu=MUSEUMS[k],list=byMuseum[k];if(!mu||!list)return notFound();
  const sorted=list.slice().sort((a,b)=>a.m.idx-b.m.idx||yearOf(a.y)-yearOf(b.y));
  const movs=[...new Set(sorted.map(w=>w.m))];const note=muNote(k);
  return `<section class="band" style="background:#3a3833"><div class="wrap"><div class="eyebrow">${esc(muC(k))}</div>
  <h1 class="title">${esc(muN(k))}</h1>${muO(k)?`<div class="eyebrow" style="margin-bottom:12px">${esc(muO(k))}</div>`:""}
  ${note?`<p class="lead">${esc(note)}</p>`:""}${mu.addr?`<p class="lead" style="margin-top:6px;font-size:13.5px">${esc(mu.addr)}</p>`:""}
  <div class="mlinks">${mu.u?`<a class="btn" target="_blank" rel="noopener" href="${esc(mu.u)}">${U("site")}</a>`:""}${mu.q||mu.addr?`<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mu.q||mu.addr)}">${U("map")}</a>`:""}</div></div></section>
  <section class="wrap">${movs.map(m=>`<h2 class="sec"><span class="dot" style="background:${m.color};width:12px;height:12px;margin-right:8px"></span>${esc(mN(m))}</h2>${grid(sorted.filter(w=>w.m===m),true)}`).join("")}</section>`;
}
function vSearch(){
  return `<section class="wrap intro"><div class="eyebrow">${U("srEyebrow")}</div><h1 class="title">${U("srH")}</h1>
  <div class="toolbar"><label class="field">${SEARCH_ICON}<input id="q" type="search" placeholder="${esc(U("srPh"))}" autocomplete="off" value="${esc(st.q)}"></label></div>
  <div class="suggest" id="sugg">${U("sugg").map(s=>`<button class="chip" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
  <div id="hits" class="hits"></div></section>`;
}
function hi(s,q){s=esc(s);if(!q)return s;const e=esc(q),i=s.toLowerCase().indexOf(e);return i<0?s:s.slice(0,i)+"<mark>"+s.slice(i,i+e.length)+"</mark>"+s.slice(i+e.length)}
function drawSearch(){
  const q=st.q.trim().toLowerCase();const out=$("#hits");$("#sugg").hidden=!!q;
  if(!q){out.innerHTML="";return}
  const terms=q.split(/\s+/),has=h=>terms.every(t=>h.includes(t));
  const ms=MOVEMENTS.filter(m=>has((m.name+" "+m.en).toLowerCase()));
  const as=ARTISTS.filter(a=>has((a.n+" "+a.o).toLowerCase()));
  const mus=Object.keys(byMuseum).filter(k=>{const mu=MUSEUMS[k];return has((mu.n+" "+mu.o+" "+mu.c+" "+(EN["city."+mu.c]||"")).toLowerCase())});
  const ws=WORKS.filter(w=>has(w.hay));
  const LIM=120;
  out.innerHTML=(ms.length?`<h2>${U("srMov")} ${ms.length}</h2><div class="pillrow">${ms.map(m=>`<a class="chip" href="#/m/${m.id}"><span class="dot" style="background:${m.color}"></span>${hi(mN(m),q)}</a>`).join("")}</div>`:"")+
   (as.length?`<h2>${U("srArt")} ${as.length}</h2><div class="alist">${as.slice(0,30).map(a=>`<a class="arow" href="#/a/${a.id}">${th(firstImg(a.works))}<div class="mn"><div class="nm">${hi(aN(a),q)}</div><div class="sub">${aO(a)?hi(aO(a),q)+" · ":""}${esc(a.l)}</div></div><span class="n">${U("worksN",a.works.length)}</span></a>`).join("")}</div>`:"")+
   (mus.length?`<h2>${U("srMus")} ${mus.length}</h2><div class="pillrow">${mus.slice(0,40).map(k=>`<a class="chip" href="#/mu/${k}">${hi(muN(k),q)} · ${esc(cityOf(k))}</a>`).join("")}</div>`:"")+
   (ws.length?`<h2>${U("srWork")} ${ws.length}${ws.length>LIM?U("firstN",LIM):""}</h2>${grid(ws.slice(0,LIM),true)}`:"")||`<div class="empty">${U("noHit",esc(st.q))}</div>`;
  hydrate(out);
}
const notFound=()=>`<section class="wrap intro"><h1 class="title">${U("nf")}</h1><p class="lead"><a href="#/movements">${U("nfBack")}</a></p></section>`;

/* ---------- work sheet ---------- */
const sheet=$("#sheet");let cur=null,curList=null;
const imgSearchBtn=w=>`<a class="btn" style="color:#eee;border-color:#666;background:transparent" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(w.o+" "+w.a.o)}">${U("imgSearch")}</a>`;
function openWork(id,list){
  const w=WORKS[id];cur=w;curList=list||[w];
  const i=curList.indexOf(w),prev=curList[i-1],next=curList[i+1];
  const sv=$("#sv");
  if(w.cr){sv.innerHTML=`<div class="ph"><b>${U("crH")}</b><span>${U("crP")}</span>${imgSearchBtn(w)}</div>`}
  else{sv.innerHTML=`<div class="ph"><span>${U("loading")}</span></div>`;
    want(w.wiki,info=>{if(cur!==w)return;
      if(!info){sv.innerHTML=`<div class="ph"><b>${U("notFound")}</b>${imgSearchBtn(w)}</div>`;return}
      const img=new Image();img.alt=`${aN(w.a)}, ${wT(w)}`;img.onerror=()=>{img.onerror=null;img.src=info.s};img.src=big(info.s);sv.replaceChildren(img);
      const l=$("#commons");if(l){l.href="https://commons.wikimedia.org/wiki/"+encodeURIComponent(info.f.replace(/ /g,"_"));l.hidden=false}})}
  const mu=w.mu,isOther=OTHER_KEYS.includes(w.mk),tip=wTip(w);
  $("#si").innerHTML=`<div class="eyebrow"><span class="dot" style="background:${w.m.color}"></span> ${esc(mN(w.m))}</div>
  <h2>${esc(wT(w))}</h2>${wO(w)?`<div class="orig">${esc(wO(w))}</div>`:`<div style="height:12px"></div>`}
  <dl class="meta"><dt>${U("artist")}</dt><dd><a href="#/a/${w.a.id}">${esc(aN(w.a))}</a> <span style="color:var(--muted)">${esc(w.a.l)}</span></dd>
  <dt>${U("date")}</dt><dd>${esc(D(w.y))}</dd>
  <dt>${U("loc")}</dt><dd>${isOther?esc(muN(w.mk)):`<a href="#/mu/${w.mk}">${esc(muN(w.mk))}</a>`}<br><span style="color:var(--muted)">${esc(muC(w.mk))}</span></dd></dl>
  ${tip?`<p class="tip">${esc(tip)}</p>`:""}
  <div class="mlinks">${mu.u?`<a class="btn" target="_blank" rel="noopener" href="${esc(mu.u)}">${U("museumSite")}</a>`:""}<a class="btn" id="commons" hidden target="_blank" rel="noopener" href="#">${U("commons")}</a></div>
  ${curList.length>1?`<div class="nav"><button class="btn" data-step="-1" ${prev?"":"disabled style=\"visibility:hidden\""}>${U("prev")}</button><span class="count" style="align-self:center">${i+1} / ${curList.length}</span><button class="btn" data-step="1" ${next?"":"disabled style=\"visibility:hidden\""}>${U("next")}</button></div>`:""}`;
  if(!sheet.open){sheet.showModal?sheet.showModal():sheet.setAttribute("open","")}
  $("#si").scrollTop=0;$(".sheet-in").scrollTop=0;
}
function closeSheet(){sheet.close?sheet.close():sheet.removeAttribute("open");cur=null}
$("#sheetClose").onclick=closeSheet;
sheet.addEventListener("click",e=>{if(e.target===sheet)closeSheet();const s=e.target.closest("[data-step]");if(s){const i=curList.indexOf(cur)+ +s.dataset.step;if(curList[i])openWork(curList[i].id,curList)}if(e.target.closest("a[href^='#/']"))closeSheet()});
document.addEventListener("keydown",e=>{if(!sheet.open||!cur)return;if(e.key==="ArrowRight"||e.key==="ArrowLeft"){const i=curList.indexOf(cur)+(e.key==="ArrowRight"?1:-1);if(curList[i])openWork(curList[i].id,curList)}});
let tx=null;sheet.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
sheet.addEventListener("touchend",e=>{if(tx==null||!cur)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>70&&e.target.closest("#sv")){const i=curList.indexOf(cur)+(dx<0?1:-1);if(curList[i])openWork(curList[i].id,curList)}},{passive:true});

/* ---------- chrome text ---------- */
function applyLang(){
  document.documentElement.lang=isEN?"en":"ko";
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=U(el.dataset.i));
  $("#lang").textContent=U("langBtn");$("#lang").setAttribute("aria-label",isEN?"한국어로 보기":"View in English");
  $("#back").setAttribute("aria-label",U("back"));$("#sheetClose").setAttribute("aria-label",U("close"));
  $("#foot").innerHTML=U("foot");
}
$("#lang").onclick=()=>{
  isEN=!isEN;
  const u=new URL(location.href);if(isEN)u.searchParams.set("lang","en");else u.searchParams.set("lang","ko");
  history.replaceState(null,"",u);
  applyLang();const y=scrollY;lastKey="";route();scrollTo(0,y);
};

/* ---------- router ---------- */
const view=$("#view");
const scrollMem={};let lastKey="";
function route(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,""));
  if(/^a-/.test(h)){const el=document.getElementById(h);if(el)el.scrollIntoView({behavior:"smooth"});return}
  const [kind,arg]=h.split("/");
  if(lastKey)scrollMem[lastKey]=scrollY;
  const key=kind+"/"+(arg||"");lastKey=key;
  let tab="movements",html;
  switch(kind){
    case "m":html=vMovement(arg);break;
    case "artists":tab="artists";html=vArtists();break;
    case "a":tab="artists";html=vArtist(arg);break;
    case "museums":tab="museums";html=vMuseums();break;
    case "mu":tab="museums";html=vMuseum(arg);break;
    case "search":tab="search";html=vSearch();break;
    default:html=vMovements();
  }
  if(sheet.open)closeSheet();
  view.innerHTML=html;
  document.querySelectorAll("[data-tab]").forEach(a=>{if(a.dataset.tab===tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  $("#back").hidden=!["m","a","mu"].includes(kind);
  if(kind==="artists")drawArtists();
  if(kind==="museums")drawMuseums();
  if(kind==="search"){drawSearch();if(!st.q&&matchMedia("(hover:hover)").matches)$("#q").focus()}
  hydrate(view);
  scrollTo(0,scrollMem[key]||0);
  const t={m:movById[arg]&&mN(movById[arg]),a:artistById[arg]&&aN(artistById[arg]),mu:MUSEUMS[arg]&&muN(arg)}[kind];
  document.title=t?`${t} · ${U("brand")}`:U("brand");
}
window.addEventListener("hashchange",route);
$("#back").onclick=()=>history.length>1?history.back():(location.hash="#/movements");

view.addEventListener("click",e=>{
  const c=e.target.closest("[data-open]");
  if(c){const g=c.closest(".grid");const list=g?[...g.querySelectorAll("[data-open]")].map(x=>WORKS[+x.dataset.open]):null;openWork(+c.dataset.open,list);return}
  const j=e.target.closest("[data-jump]");if(j){e.preventDefault();document.getElementById("a-"+j.dataset.jump)?.scrollIntoView({behavior:"smooth"});return}
  const s=e.target.closest("[data-sort]");if(s){st.asort=s.dataset.sort;view.querySelectorAll("[data-sort]").forEach(b=>b.setAttribute("aria-pressed",b===s));drawArtists();return}
  const mv=e.target.closest("[data-mov]");if(mv){st.amov=mv.dataset.mov;view.querySelectorAll("[data-mov]").forEach(b=>b.setAttribute("aria-pressed",b===mv));drawArtists();return}
  const sg=e.target.closest("[data-s]");if(sg){st.q=sg.dataset.s;$("#q").value=st.q;drawSearch();return}
});
let deb=0;
view.addEventListener("input",e=>{
  const id=e.target.id;clearTimeout(deb);
  deb=setTimeout(()=>{if(id==="aq"){st.aq=e.target.value;drawArtists()}else if(id==="mq"){st.mq=e.target.value;drawMuseums()}else if(id==="q"){st.q=e.target.value;drawSearch()}},120);
});
applyLang();
route();
/* 예전 버전의 오프라인 저장(서비스 워커와 저장된 이미지)을 정리 */
try{navigator.serviceWorker?.getRegistrations?.().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}catch(e){}
try{window.caches?.keys?.().then(ks=>ks.filter(k=>k.startsWith("wa-")).forEach(k=>caches.delete(k))).catch(()=>{})}catch(e){}
})();
</script>
</body>
</html>
